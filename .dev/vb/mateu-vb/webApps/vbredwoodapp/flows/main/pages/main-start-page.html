<!-- Markup del Redwood Starter con los bindings apuntando al contenido de Mateu (host
     context, alimentado por los chains de la shell). Estructura y clases INTACTAS del
     starter: cero HTML/CSS propio. El dispatcher recursivo llega en la Fase 3. -->

<div class="oj-sp-public-primary-content-container oj-sm-padding-2x">
<div class="oj-flex">
  <h1 class="oj-flex-item oj-sm-12 oj-md-12"><oj-bind-text value="[[ $application.variables.mateuHostTitle ]]"></oj-bind-text></h1>
</div>
<div class="oj-flex">
  <div class="oj-flex-item oj-sm-12 oj-md-12">
    <oj-bind-text
      value="[[ $application.variables.mateuHostText ]]"
    ></oj-bind-text>
  </div>
</div>
</div>
