<!-- Contenido alimentado por Mateu. Estructura y clases del Redwood Starter + utilidades
     estándar JET: cero CSS propio. El form es el switch widgetFor de la rama FormLayout:
     oj-form-layout + widgets JET auténticos (oj-input-text / oj-input-number / oj-switch),
     un binding por propiedad (sin expresiones complejas: evaluador CSP de VB). -->

<div class="oj-sp-public-primary-content-container oj-sm-padding-2x">
<div class="oj-flex">
  <h1 class="oj-flex-item oj-sm-12 oj-md-12"><oj-bind-text value="[[ $application.variables.mateuHostTitle ]]"></oj-bind-text></h1>
</div>

<oj-bind-if test="[[ !$application.variables.mateuFormMetadata ]]">
  <div class="oj-flex">
    <div class="oj-flex-item oj-sm-12 oj-md-12">
      <oj-bind-text
        value="[[ $application.variables.mateuHostText ]]"
      ></oj-bind-text>
    </div>
  </div>
</oj-bind-if>

<oj-bind-if test="[[ !!$application.variables.mateuListing ]]">
  <div class="oj-flex oj-sm-align-items-center">
    <div class="oj-flex-item oj-sm-12 oj-md-8">
      <oj-input-search id="mateuSearch" class="oj-sm-margin-4x-bottom"
        placeholder="Search"
        on-oj-value-action="[[ $listeners.mateuSearchAction ]]"></oj-input-search>
    </div>
    <div class="oj-flex-item oj-sm-12 oj-md-4 oj-sm-align-self-flex-end">
      <!-- toolbar del crud (p.ej. New) — botones del wire de Mateu -->
      <oj-bind-for-each data="[[ $application.variables.mateuListing.toolbar ]]">
        <template>
          <oj-button class="oj-sm-margin-2x-start"
            :data-action-id="[[ $current.data.actionId ]]"
            chroming="callToAction"
            on-oj-action="[[ $listeners.mateuActionClicked ]]"><oj-bind-text value="[[ $current.data.label ]]"></oj-bind-text></oj-button>
        </template>
      </oj-bind-for-each>
    </div>
  </div>
  <div class="oj-flex">
    <div class="oj-flex-item oj-sm-12 oj-md-12">
      <oj-table id="mateuTable" class="oj-sm-12"
        data="[[ $variables.listingADP ]]"
        columns="[[ $application.variables.mateuListing.columns ]]"
        selection-mode='{"row": "single", "column": "none"}'
        on-first-selected-row-changed="[[ $listeners.mateuRowSelected ]]">
        <template slot="noData">
          <oj-sp-empty-state
            primary-text="[[ $application.variables.mateuListing.emptyStateMessage ]]"
            secondary-text=""></oj-sp-empty-state>
        </template>
      </oj-table>
    </div>
  </div>
</oj-bind-if>

<!-- Drawer del crud (editInDrawer): panel end auténtico de JET; los campos y botones salen
     del wire (proyección overlayOf); cerrar con ✕/Esc descarta sin guardar -->
<oj-drawer-popup id="mateuDrawerPanel" edge="end" modality="modal"
  opened="[[ $application.variables.mateuDrawerOpen ]]"
  on-oj-before-close="[[ $listeners.mateuDrawerClosed ]]">
  <div class="oj-sm-padding-6x">
    <h2 class="oj-typography-heading-md"><oj-bind-text value="[[ $application.variables.mateuDrawer.title ]]"></oj-bind-text></h2>
    <oj-form-layout id="mateuDrawerForm">
      <oj-bind-for-each data="[[ $application.variables.mateuDrawer.fields ]]">
        <template>
          <oj-bind-if test="[[ $current.data.isText ]]">
            <oj-input-text
              label-hint="[[ $current.data.label ]]"
              value="[[ $current.data.value ]]"
              required="[[ $current.data.required ]]"
              readonly="[[ $current.data.readonly ]]"
              :data-field-id="[[ $current.data.fieldId ]]"
              on-value-changed="[[ $listeners.mateuFieldChanged ]]"></oj-input-text>
          </oj-bind-if>
          <oj-bind-if test="[[ $current.data.isNumber ]]">
            <oj-input-number
              label-hint="[[ $current.data.label ]]"
              value="[[ $current.data.value ]]"
              required="[[ $current.data.required ]]"
              readonly="[[ $current.data.readonly ]]"
              :data-field-id="[[ $current.data.fieldId ]]"
              on-value-changed="[[ $listeners.mateuFieldChanged ]]"></oj-input-number>
          </oj-bind-if>
          <oj-bind-if test="[[ $current.data.isBoolean ]]">
            <oj-switch
              label-hint="[[ $current.data.label ]]"
              value="[[ $current.data.value ]]"
              readonly="[[ $current.data.readonly ]]"
              :data-field-id="[[ $current.data.fieldId ]]"
              on-value-changed="[[ $listeners.mateuFieldChanged ]]"></oj-switch>
          </oj-bind-if>
        </template>
      </oj-bind-for-each>
    </oj-form-layout>
    <div class="oj-flex oj-sm-margin-6x-top">
      <oj-bind-for-each data="[[ $application.variables.mateuDrawer.actions ]]">
        <template>
          <oj-button class="oj-sm-margin-2x-end"
            :data-action-id="[[ $current.data.actionId ]]"
            chroming="[[ $current.data.chroming ]]"
            on-oj-action="[[ $listeners.mateuActionClicked ]]"><oj-bind-text value="[[ $current.data.label ]]"></oj-bind-text></oj-button>
        </template>
      </oj-bind-for-each>
    </div>
  </div>
</oj-drawer-popup>

<oj-bind-if test="[[ !!$application.variables.mateuFormMetadata ]]">
  <div class="oj-flex">
    <div class="oj-flex-item oj-sm-12 oj-md-6">
      <oj-sp-messages-toast primary-text="[[ $variables.mateuToastText ]]" id="mateuToast"></oj-sp-messages-toast>
      <oj-form-layout id="mateuForm">
        <oj-bind-for-each data="[[ $application.variables.mateuFormFieldsList ]]">
          <template>
            <oj-bind-if test="[[ $current.data.isText ]]">
              <oj-input-text
                label-hint="[[ $current.data.label ]]"
                value="[[ $current.data.value ]]"
                required="[[ $current.data.required ]]"
                readonly="[[ $current.data.readonly ]]"
                :data-field-id="[[ $current.data.fieldId ]]"
                on-value-changed="[[ $listeners.mateuFieldChanged ]]"></oj-input-text>
            </oj-bind-if>
            <oj-bind-if test="[[ $current.data.isNumber ]]">
              <oj-input-number
                label-hint="[[ $current.data.label ]]"
                value="[[ $current.data.value ]]"
                required="[[ $current.data.required ]]"
                readonly="[[ $current.data.readonly ]]"
                :data-field-id="[[ $current.data.fieldId ]]"
                on-value-changed="[[ $listeners.mateuFieldChanged ]]"></oj-input-number>
            </oj-bind-if>
            <oj-bind-if test="[[ $current.data.isBoolean ]]">
              <oj-switch
                label-hint="[[ $current.data.label ]]"
                value="[[ $current.data.value ]]"
                readonly="[[ $current.data.readonly ]]"
                :data-field-id="[[ $current.data.fieldId ]]"
                on-value-changed="[[ $listeners.mateuFieldChanged ]]"></oj-switch>
            </oj-bind-if>
          </template>
        </oj-bind-for-each>
      </oj-form-layout>
      <div class="oj-flex oj-sm-margin-6x-top">
        <oj-bind-for-each data="[[ $application.variables.mateuFormActions ]]">
          <template>
            <oj-button class="oj-sm-margin-2x-end"
              :data-action-id="[[ $current.data.actionId ]]"
              chroming="[[ $current.data.chroming ]]"
              on-oj-action="[[ $listeners.mateuActionClicked ]]"><oj-bind-text value="[[ $current.data.label ]]"></oj-bind-text></oj-button>
          </template>
        </oj-bind-for-each>
      </div>
    </div>
  </div>
</oj-bind-if>
</div>
