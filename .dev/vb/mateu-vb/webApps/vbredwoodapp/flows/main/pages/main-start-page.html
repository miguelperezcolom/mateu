<!-- Contenido alimentado por Mateu. Estructura y clases del Redwood Starter + utilidades
     estándar JET: cero CSS propio. El form es el switch widgetFor de la rama FormLayout:
     oj-form-layout + widgets JET auténticos (oj-input-text / oj-input-number / oj-switch),
     un binding por propiedad (sin expresiones complejas: evaluador CSP de VB). -->

<!-- 1.6: anatomía pageWidth (RDS 24C) — fixed 1408px centrado / fullWidth fluido / edgeToEdge 0 -->
<!-- banda RDS del header (fixed/fullWidth): fondo blanco a sangre; dentro, el header con
     su franja CAPADOS a la caja de contenido; la tarjeta de abajo la solapa (-40px) para
     que la banda asome por detrás de su arranque — todo clases de sistema JET -->
<oj-bind-if test="[[ $application.variables.mateuPageHeader.showBand ]]">
  <!-- la banda toma el MISMO color que el fondo interno del header
       (oj-sp-header-general-overview-bg-light = #F1EFED = oj-bg-neutral-30) -->
  <div class="oj-bg-neutral-30 oj-sm-padding-10x-bottom">
    <div :style.max-width="[[ $application.variables.mateuPageMaxWidth ]]"
      :style.margin="[[ $application.variables.mateuBandBoxMargin ]]">
      <oj-sp-header-general-overview id="mateuPageHeaderEl"
        page-title="[[ $application.variables.mateuPageHeader.title ]]"
        display-options.go-to-parent="false"></oj-sp-header-general-overview>
    </div>
  </div>
</oj-bind-if>
<div class="oj-sp-public-primary-content-container"
  :style.max-width="[[ $application.variables.mateuPageMaxWidth ]]"
  :style.margin="[[ $application.variables.mateuPageMargin ]]"
  :style.padding="[[ $application.variables.mateuPagePadding ]]">
<!-- toast único a nivel de página (patrón del starter): cualquier chain lo abre por id,
     esté visible la rama que esté (form, listado, isla…) -->
<oj-sp-messages-toast primary-text="[[ $variables.mateuToastText ]]" id="mateuToast"></oj-sp-messages-toast>

<!-- regla general: TODA página pinta su header con el header de vb
     (oj-sp-header-general-overview sin switcher) salvo los templates que ya lo
     integran: guided process, general overview, welcome banner y el
     smart-filter-search del listado -->
<oj-bind-if test="[[ $application.variables.mateuPageHeader.showInline ]]">
  <oj-sp-header-general-overview id="mateuPageHeaderInline" class="oj-bg-neutral-0"
    page-title="[[ $application.variables.mateuPageHeader.title ]]"
    display-options.go-to-parent="false"></oj-sp-header-general-overview>
</oj-bind-if>

<!-- solo cuando hay texto de verdad: si no, el div (con su padding) pinta una banda
     vacía encima del header de las páginas sin formulario -->
<oj-bind-if test="[[ !!$application.variables.mateuHostText ]]">
  <div class="oj-flex oj-sm-padding-12x-horizontal oj-sm-padding-6x-vertical">
    <div class="oj-flex-item oj-sm-12 oj-md-12">
      <oj-bind-text
        value="[[ $application.variables.mateuHostText ]]"
      ></oj-bind-text>
    </div>
  </div>
</oj-bind-if>


<!-- Foldout (Fase 7): overview + paneles laterales con los oj-sp-foldout-* auténticos.
     SIN wrappers flex: el layout necesita un ancho ACOTADO por su padre para activar su
     lógica responsive (plegado + scroll + dots); dentro de un flex-item con min-width:auto
     se desborda y cree que todo cabe -->
<oj-bind-if test="[[ !!$application.variables.mateuFoldout ]]">
      <!-- el header interno del foldout no se puede colapsar (16px siempre): con
           background=transparent deja de ser una banda blanca y queda como respiración -->
      <oj-sp-foldout-layout id="mateuFoldoutEl"
        display-options.go-to-parent="false"
        display-options.background="transparent">
        <oj-sp-foldout-panel panel-title="[[ $application.variables.mateuHostTitle ]]">
          <oj-bind-for-each data="[[ $application.variables.mateuFoldout.overview.texts ]]">
            <template>
              <div class="oj-typography-body-md oj-sm-margin-2x-bottom"><oj-bind-text value="[[ $current.data ]]"></oj-bind-text></div>
            </template>
          </oj-bind-for-each>
        </oj-sp-foldout-panel>
        <oj-bind-for-each data="[[ $application.variables.mateuFoldout.panels ]]">
          <template>
            <oj-sp-foldout-panel panel-title="[[ $current.data.title ]]">
              <div class="oj-typography-body-sm oj-text-color-secondary oj-sm-margin-2x-bottom"><oj-bind-text value="[[ $current.data.subtitle ]]"></oj-bind-text></div>
              <oj-bind-for-each data="[[ $current.data.texts ]]">
                <template>
                  <div class="oj-typography-body-md oj-sm-margin-2x-bottom"><oj-bind-text value="[[ $current.data ]]"></oj-bind-text></div>
                </template>
              </oj-bind-for-each>
            </oj-sp-foldout-panel>
          </template>
        </oj-bind-for-each>
      </oj-sp-foldout-layout>
</oj-bind-if>


<!-- Arquetipo WELCOME: banner de bienvenida Redwood (CTAs integrados) + tiles -->
<oj-bind-if test="[[ !!$application.variables.mateuWelcome ]]">
  <oj-sp-header-welcome-banner id="mateuWelcomeBanner"
    page-title="[[ $application.variables.mateuWelcome.title ]]"
    description-text="[[ $application.variables.mateuWelcome.subtitle ]]"
    primary-action="[[ $application.variables.mateuWelcome.primaryCta ]]"
    secondary-action="[[ $application.variables.mateuWelcome.secondaryCta ]]"
    on-sp-primary-action="[[ $listeners.welcomePrimary ]]"
    on-sp-secondary-action="[[ $listeners.welcomeSecondary ]]"></oj-sp-header-welcome-banner>
  <div class="oj-flex oj-sm-margin-6x-top oj-sm-padding-12x-horizontal">
    <oj-bind-for-each data="[[ $application.variables.mateuWelcome.tiles ]]">
      <template>
        <div class="oj-flex-item oj-sm-12 oj-md-4">
          <div class="oj-panel oj-sm-margin-2x">
            <div class="oj-typography-subheading-sm oj-sm-margin-2x-bottom"><oj-bind-text value="[[ $current.data.title ]]"></oj-bind-text></div>
            <oj-bind-for-each data="[[ $current.data.texts ]]">
              <template>
                <div class="oj-typography-body-md"><oj-bind-text value="[[ $current.data ]]"></oj-bind-text></div>
              </template>
            </oj-bind-for-each>
          </div>
        </div>
      </template>
    </oj-bind-for-each>
  </div>
</oj-bind-if>

<!-- Arquetipo GENERAL OVERVIEW: header Redwood con switcher de registro + facts + cards -->
<oj-bind-if test="[[ !!$application.variables.mateuOverview ]]">
  <oj-sp-header-general-overview id="mateuOverviewHeader" class="oj-bg-neutral-0"
    page-title="[[ $application.variables.mateuOverview.title ]]"
    page-subtitle="[[ $application.variables.mateuOverview.subtitle ]]"
    contextual-info="[[ $application.variables.mateuOverview.facts ]]"
    select-object="[[ $variables.overviewSelectConfig ]]"
    select-object-value="[[ $application.variables.mateuOverview.switcherValue ]]"
    translations="[[ $application.variables.mateuOverviewTranslations ]]"
    on-select-object-value-changed="[[ $listeners.overviewSwitched ]]"></oj-sp-header-general-overview>
  <div class="oj-flex oj-sm-margin-6x-top oj-sm-padding-12x-horizontal">
    <oj-bind-for-each data="[[ $application.variables.mateuOverview.cards ]]">
      <template>
        <div class="oj-flex-item oj-sm-12 oj-md-6">
          <div class="oj-panel oj-sm-margin-2x">
            <div class="oj-typography-subheading-sm oj-sm-margin-2x-bottom"><oj-bind-text value="[[ $current.data.title ]]"></oj-bind-text></div>
            <oj-bind-for-each data="[[ $current.data.texts ]]">
              <template>
                <div class="oj-typography-body-md oj-sm-margin-1x-bottom"><oj-bind-text value="[[ $current.data ]]"></oj-bind-text></div>
              </template>
            </oj-bind-for-each>
          </div>
        </div>
      </template>
    </oj-bind-for-each>
  </div>
</oj-bind-if>

<!-- Arquetipo ITEM OVERVIEW: datos clave a la izquierda + tabs a la derecha -->
<oj-bind-if test="[[ !!$application.variables.mateuItemOv ]]">
  <div class="oj-flex oj-sm-padding-12x-horizontal oj-sm-padding-6x-vertical">
    <div class="oj-flex-item oj-sm-12 oj-md-4">
      <div class="oj-panel oj-sm-margin-2x">
        <oj-bind-for-each data="[[ $application.variables.mateuItemOv.key.texts ]]">
          <template>
            <div class="oj-typography-body-md oj-sm-margin-1x-bottom"><oj-bind-text value="[[ $current.data ]]"></oj-bind-text></div>
          </template>
        </oj-bind-for-each>
      </div>
    </div>
    <div class="oj-flex-item oj-sm-12 oj-md-8">
      <oj-tab-bar id="mateuItemTabs" on-selection-changed="[[ $listeners.itemTabChanged ]]">
        <ul>
          <oj-bind-for-each data="[[ $application.variables.mateuItemOv.tabs ]]">
            <template>
              <li :id="[[ $current.data.id ]]"><a href="#"><oj-bind-text value="[[ $current.data.label ]]"></oj-bind-text></a></li>
            </template>
          </oj-bind-for-each>
        </ul>
      </oj-tab-bar>
      <div class="oj-sm-padding-4x">
        <oj-bind-for-each data="[[ $application.variables.mateuItemTabTexts ]]">
          <template>
            <div class="oj-typography-body-md oj-sm-margin-1x-bottom"><oj-bind-text value="[[ $current.data ]]"></oj-bind-text></div>
          </template>
        </oj-bind-for-each>
      </div>
    </div>
  </div>
</oj-bind-if>

<oj-bind-if test="[[ !!$application.variables.mateuListing ]]">
  <!-- header de colección Redwood: título + acciones del crud integradas (New = primary,
       resto = secondary); la tabla va en su slot main -->
  <oj-sp-smart-filter-search id="mateuListHeader" class="oj-bg-neutral-0"
    page-title="[[ $application.variables.mateuHostTitle ]]"
    primary-action="[[ $application.variables.mateuListPrimary ]]"
    secondary-actions="[[ $application.variables.mateuListSecondary ]]"
    smart-filters="{{ $page.variables.mateuSmartFilters }}"
    on-smart-filters-changed="[[ $listeners.smartFiltersChanged ]]"
    on-sp-primary-action="[[ $listeners.listPrimary ]]"
    on-sp-secondary-action="[[ $listeners.listSecondary ]]">
  <!-- Smart Search de vb: la búsqueda vive EN LA CABECERA (smartFilters del propio
       oj-sp-smart-filter-search: Enter añade un chip keyword y filtra) -->
  <div slot="main" class="oj-bg-body oj-sm-padding-12x-horizontal oj-sm-padding-6x-vertical">
  <div class="oj-flex">
    <div class="oj-flex-item oj-sm-12 oj-md-12">
      <!-- ojRowAction (clic en fila) en vez de selección: la selección deja estado que la
           tabla RE-EMITE al refrescar tras guardar, reabriendo el drawer -->
      <oj-table id="mateuTable" class="oj-sm-12"
        display="[[ $application.variables.mateuListing.display ]]"
        data="[[ $variables.listingADP ]]"
        columns="[[ $application.variables.mateuListing.columns ]]"
        on-oj-row-action="[[ $listeners.mateuRowAction ]]">
        <template slot="noData">
          <oj-sp-empty-state
            primary-text="[[ $application.variables.mateuListing.emptyStateMessage ]]"
            secondary-text=""></oj-sp-empty-state>
        </template>
        <!-- Edición inline (@InlineEditing): celdas con editor SIEMPRE visible; el commit
             por celda dispara update-row con parameters._editedRow (contrato capturado:
             responde solo un toast success — el valor editado ya está en el cliente) -->
        <template slot="cellEditText">
          <oj-input-text class="oj-form-control-full-width"
            value="[[ $current.data ]]"
            on-value-changed="[[ $listeners.mateuCellEdited ]]"></oj-input-text>
        </template>
        <template slot="cellEditNumber">
          <oj-input-number class="oj-form-control-full-width"
            value="[[ $current.data ]]"
            on-value-changed="[[ $listeners.mateuCellEdited ]]"></oj-input-number>
        </template>
        <template slot="cellEditBoolean">
          <oj-switch
            value="[[ $current.data ]]"
            on-value-changed="[[ $listeners.mateuCellEdited ]]"></oj-switch>
        </template>
      </oj-table>
    </div>
  </div>
  </div>
  </oj-sp-smart-filter-search>
</oj-bind-if>

<!-- Drawer del crud (editInDrawer): panel end auténtico de JET; los campos y botones salen
     del wire (proyección overlayOf); cerrar con ✕/Esc descarta sin guardar -->
<oj-drawer-popup id="mateuDrawerPanel" edge="end" modality="modal"
  opened="[[ $application.variables.mateuDrawerOpen ]]"
  on-oj-before-close="[[ $listeners.mateuDrawerClosed ]]">
  <div class="oj-sm-padding-6x">
    <h2 class="oj-typography-heading-md"><oj-bind-text value="[[ $application.variables.mateuDrawer.title ]]"></oj-bind-text></h2>
    <oj-form-layout id="mateuDrawerForm">
      <oj-bind-for-each data="[[ $application.variables.mateuDrawer.fields ]]">
        <template>
          <oj-bind-if test="[[ $current.data.isText ]]">
            <oj-input-text
              label-hint="[[ $current.data.label ]]"
              value="[[ $current.data.value ]]"
              required="[[ $current.data.required ]]"
              readonly="[[ $current.data.readonly ]]"
              :data-field-id="[[ $current.data.fieldId ]]"
              on-value-changed="[[ $listeners.mateuFieldChanged ]]"></oj-input-text>
          </oj-bind-if>
          <oj-bind-if test="[[ $current.data.isNumber ]]">
            <oj-input-number
              label-hint="[[ $current.data.label ]]"
              value="[[ $current.data.value ]]"
              required="[[ $current.data.required ]]"
              readonly="[[ $current.data.readonly ]]"
              :data-field-id="[[ $current.data.fieldId ]]"
              on-value-changed="[[ $listeners.mateuFieldChanged ]]"></oj-input-number>
          </oj-bind-if>
          <oj-bind-if test="[[ $current.data.isBoolean ]]">
            <oj-switch
              label-hint="[[ $current.data.label ]]"
              value="[[ $current.data.value ]]"
              readonly="[[ $current.data.readonly ]]"
              :data-field-id="[[ $current.data.fieldId ]]"
              on-value-changed="[[ $listeners.mateuFieldChanged ]]"></oj-switch>
          </oj-bind-if>
        </template>
      </oj-bind-for-each>
    </oj-form-layout>
    <div class="oj-flex oj-sm-margin-6x-top">
      <oj-bind-for-each data="[[ $application.variables.mateuDrawer.actions ]]">
        <template>
          <oj-button class="oj-sm-margin-2x-end"
            :data-action-id="[[ $current.data.actionId ]]"
            chroming="[[ $current.data.chroming ]]"
            on-oj-action="[[ $listeners.mateuActionClicked ]]"><oj-bind-text value="[[ $current.data.label ]]"></oj-bind-text></oj-button>
        </template>
      </oj-bind-for-each>
    </div>
  </div>
</oj-drawer-popup>

<!-- Wizard (Fase 8): el tren + panel del oj-sp-guided-process auténtico; el form del paso
     (widgetFor) y los botones Back/Next del wire van DENTRO de su slot de contenido -->
<oj-bind-if test="[[ !!$application.variables.mateuWizard ]]">
  <oj-sp-guided-process id="mateuWizardEl"
    process-title="[[ $application.variables.mateuHostTitle ]]"
    steps="[[ $application.variables.mateuWizard.steps ]]"
    current-step="[[ $application.variables.mateuWizardShownStep ]]"
    primary-action="[[ $application.variables.mateuWizardPrimary ]]"
    on-sp-primary-action="[[ $listeners.mateuWizardPrimaryAction ]]"
    on-sp-before-next="[[ $listeners.mateuWizardContinue ]]"
    on-sp-before-step-navigate="[[ $listeners.mateuWizardStepNavigate ]]"
    on-sp-cancel="[[ $listeners.mateuWizardCancel ]]">
    <div class="oj-sm-padding-4x">
      <!-- contenido display del paso (wizard standalone): EntityHeader, Notice con
           selector de pax, documento (isla fusionada fromNested), grid de habitaciones,
           extras… — sin título/rail/back-next (los aporta el guided process) -->
      <oj-bind-if test="[[ $application.variables.mateuWizardContent.length ]]">
        <oj-bind-for-each data="[[ $application.variables.mateuWizardContent ]]">
          <template>
            <oj-bind-if test="[[ $current.data.isCard ]]">
              <div class="oj-panel oj-sm-margin-3x-bottom">
                <oj-bind-for-each data="[[ $current.data.items ]]">
                  <template>
                    <oj-bind-if test="[[ $current.data.isText ]]">
                      <div class="oj-sm-margin-1x-bottom" :class="[[ $current.data.cls ]]"><oj-bind-text value="[[ $current.data.text ]]"></oj-bind-text></div>
                    </oj-bind-if>
                    <oj-bind-if test="[[ $current.data.isProgress ]]">
                      <oj-train class="oj-sm-margin-4x-bottom" steps="[[ $current.data.steps ]]" selected-step="[[ $current.data.selectedId ]]"></oj-train>
                    </oj-bind-if>
                    <oj-bind-if test="[[ $current.data.isEntityHeader ]]">
                      <div class="oj-sm-margin-3x-bottom">
                        <span class="oj-typography-heading-sm oj-sm-margin-2x-end"><oj-bind-text value="[[ $current.data.title ]]"></oj-bind-text></span>
                        <oj-bind-for-each data="[[ $current.data.badges ]]">
                          <template>
                            <span class="oj-sm-margin-1x-end" :class="[[ $current.data.badgeClass ]]"><oj-bind-text value="[[ $current.data.label ]]"></oj-bind-text></span>
                          </template>
                        </oj-bind-for-each>
                        <div class="oj-typography-body-sm oj-text-color-secondary"><oj-bind-text value="[[ $current.data.subtitle ]]"></oj-bind-text></div>
                        <div class="oj-flex oj-sm-margin-1x-top">
                          <oj-bind-for-each data="[[ $current.data.facts ]]">
                            <template>
                              <div class="oj-flex-item oj-sm-margin-4x-end">
                                <div class="oj-typography-body-xs oj-text-color-secondary"><oj-bind-text value="[[ $current.data.label ]]"></oj-bind-text></div>
                                <div class="oj-typography-body-md"><oj-bind-text value="[[ $current.data.value ]]"></oj-bind-text></div>
                              </div>
                            </template>
                          </oj-bind-for-each>
                        </div>
                      </div>
                    </oj-bind-if>
                    <oj-bind-if test="[[ $current.data.isNotice ]]">
                      <div :class="[[ $current.data.noticeClass ]]">
                        <span class="oj-typography-body-md oj-sm-margin-2x-end"><oj-bind-text value="[[ $current.data.text ]]"></oj-bind-text></span>
                        <oj-bind-for-each data="[[ $current.data.buttons ]]">
                          <template>
                            <oj-button class="oj-sm-margin-1x-end" chroming="[[ $current.data.chroming ]]"
                              :data-action-id="[[ $current.data.actionId ]]"
                              on-oj-action="[[ $listeners.hostBlockAction ]]"><oj-bind-text value="[[ $current.data.label ]]"></oj-bind-text></oj-button>
                          </template>
                        </oj-bind-for-each>
                      </div>
                    </oj-bind-if>
                    <oj-bind-if test="[[ $current.data.isBullets ]]">
                      <ul class="oj-sm-margin-2x-bottom">
                        <oj-bind-for-each data="[[ $current.data.items ]]">
                          <template>
                            <li class="oj-typography-body-md"><oj-bind-text value="[[ $current.data ]]"></oj-bind-text></li>
                          </template>
                        </oj-bind-for-each>
                      </ul>
                    </oj-bind-if>
                    <oj-bind-if test="[[ $current.data.isSeparator ]]">
                      <div class="oj-sm-margin-3x-vertical"></div>
                    </oj-bind-if>
                    <oj-bind-if test="[[ $current.data.isButtons ]]">
                      <div class="oj-flex oj-sm-justify-content-flex-end oj-sm-margin-2x-top">
                        <oj-bind-for-each data="[[ $current.data.buttons ]]">
                          <template>
                            <oj-button class="oj-sm-margin-1x-start" chroming="[[ $current.data.chroming ]]"
                              :data-action-id="[[ $current.data.actionId ]]"
                              on-oj-action="[[ $listeners.hostBlockAction ]]"><oj-bind-text value="[[ $current.data.label ]]"></oj-bind-text></oj-button>
                          </template>
                        </oj-bind-for-each>
                      </div>
                    </oj-bind-if>
                    <oj-bind-if test="[[ $current.data.isBadge ]]">
                      <span class="oj-sm-margin-1x-end" :class="[[ $current.data.badgeClass ]]"><oj-bind-text value="[[ $current.data.label ]]"></oj-bind-text></span>
                    </oj-bind-if>
                    <oj-bind-if test="[[ $current.data.isResourceGrid ]]">
                      <div class="oj-flex">
                        <oj-bind-for-each data="[[ $current.data.items ]]">
                          <template>
                            <div :class="[[ $current.data.colClass ]]">
                              <oj-bind-if test="[[ $current.data.enabled ]]">
                                <oj-action-card class="oj-sm-margin-1x" :class="[[ $current.data.cardClass ]]"
                                  :data-item-id="[[ $current.data.id ]]"
                                  on-oj-action="[[ $listeners.hostBlockAction ]]">
                                  <div class="oj-sm-padding-2x">
                                    <span class="oj-typography-body-md oj-typography-bold oj-sm-margin-1x-end"><oj-bind-text value="[[ $current.data.title ]]"></oj-bind-text></span>
                                    <span :class="[[ $current.data.statusBadgeClass ]]"><oj-bind-text value="[[ $current.data.statusLabel ]]"></oj-bind-text></span>
                                    <div class="oj-typography-body-xs oj-text-color-secondary"><oj-bind-text value="[[ $current.data.subtitle ]]"></oj-bind-text></div>
                                    <div class="oj-typography-body-xs"><oj-bind-text value="[[ $current.data.recommendedLabel ]]"></oj-bind-text></div>
                                    <div class="oj-typography-body-xs oj-text-color-secondary"><oj-bind-text value="[[ $current.data.note ]]"></oj-bind-text></div>
                                  </div>
                                </oj-action-card>
                              </oj-bind-if>
                              <oj-bind-if test="[[ $current.data.disabled ]]">
                                <div class="oj-panel oj-sm-margin-1x">
                                  <span class="oj-typography-body-md oj-text-color-disabled oj-sm-margin-1x-end"><oj-bind-text value="[[ $current.data.title ]]"></oj-bind-text></span>
                                  <span :class="[[ $current.data.statusBadgeClass ]]"><oj-bind-text value="[[ $current.data.statusLabel ]]"></oj-bind-text></span>
                                  <div class="oj-typography-body-xs oj-text-color-disabled"><oj-bind-text value="[[ $current.data.subtitle ]]"></oj-bind-text></div>
                                </div>
                              </oj-bind-if>
                            </div>
                          </template>
                        </oj-bind-for-each>
                      </div>
                    </oj-bind-if>
                    <oj-bind-if test="[[ $current.data.isOffer ]]">
                      <div class="oj-panel oj-sm-margin-2x-bottom">
                        <div class="oj-typography-body-xs oj-text-color-secondary"><oj-bind-text value="[[ $current.data.tag ]]"></oj-bind-text></div>
                        <div class="oj-typography-subheading-sm"><oj-bind-text value="[[ $current.data.title ]]"></oj-bind-text></div>
                        <div class="oj-typography-body-sm oj-text-color-secondary"><oj-bind-text value="[[ $current.data.subtitle ]]"></oj-bind-text></div>
                        <div class="oj-typography-body-sm oj-sm-margin-1x-top"><oj-bind-text value="[[ $current.data.features ]]"></oj-bind-text></div>
                        <div class="oj-typography-body-sm oj-text-color-success oj-sm-margin-1x-top"><oj-bind-text value="[[ $current.data.currentLabel ]]"></oj-bind-text></div>
                        <div class="oj-typography-body-md oj-typography-bold"><oj-bind-text value="[[ $current.data.priceLabel ]]"></oj-bind-text></div>
                        <oj-bind-if test="[[ $current.data.actionLabel ]]">
                          <oj-button class="oj-sm-margin-2x-top" chroming="callToAction"

                            <div class="oj-flex oj-sm-align-items-center oj-sm-margin-2x-bottom">
                              <oj-avatar class="oj-flex-item oj-sm-flex-initial oj-sm-margin-2x-end" size="xs" initials="[[ $current.data.avatar ]]"></oj-avatar>
                              <div class="oj-flex-item">
                                <div class="oj-typography-body-md"><oj-bind-text value="[[ $current.data.title ]]"></oj-bind-text></div>
                                <div class="oj-typography-body-xs oj-text-color-secondary"><oj-bind-text value="[[ $current.data.description ]]"></oj-bind-text></div>
                              </div>
                              <div class="oj-flex-item oj-sm-flex-initial oj-typography-body-sm" :class="[[ $current.data.statusClass ]]"><oj-bind-text value="[[ $current.data.status ]]"></oj-bind-text></div>
                              <oj-bind-if test="[[ $current.data.actionLabel ]]">
                                <oj-button class="oj-flex-item oj-sm-flex-initial oj-sm-margin-2x-start" chroming="outlined"
                                  :data-action-id="[[ $current.data.actionId ]]"
                                  on-oj-action="[[ $listeners.hostBlockAction ]]"><oj-bind-text value="[[ $current.data.actionLabel ]]"></oj-bind-text></oj-button>
                              </oj-bind-if>
                            </div>
                          </oj-bind-if>
                        </template>
                      </oj-bind-for-each>
                    </oj-bind-if>
                    <oj-bind-if test="[[ $current.data.isLedger ]]">
                      <oj-bind-for-each data="[[ $current.data.lines ]]">
                        <template>
                          <div class="oj-flex oj-sm-margin-1x-bottom">
                            <div class="oj-flex-item oj-typography-body-md"><oj-bind-text value="[[ $current.data.concept ]]"></oj-bind-text></div>
                            <div class="oj-flex-item oj-sm-flex-initial oj-typography-body-md" :class="[[ $current.data.amountClass ]]"><oj-bind-text value="[[ $current.data.amountText ]]"></oj-bind-text></div>
                          </div>
                        </template>
                      </oj-bind-for-each>
                      <div class="oj-flex oj-sm-margin-2x-top">
                        <div class="oj-flex-item oj-typography-subheading-xs"><oj-bind-text value="[[ $current.data.totalLabel ]]"></oj-bind-text></div>
                        <div class="oj-flex-item oj-sm-flex-initial oj-typography-subheading-xs"><oj-bind-text value="[[ $current.data.totalText ]]"></oj-bind-text></div>
                      </div>
                    </oj-bind-if>
                    <oj-bind-if test="[[ $current.data.isPayment ]]">
                      <div class="oj-flex oj-sm-align-items-center oj-sm-margin-2x-bottom">
                        <div class="oj-flex-item oj-typography-body-xs oj-text-color-secondary"><oj-bind-text value="[[ $current.data.contextLabel ]]"></oj-bind-text></div>
                        <div class="oj-flex-item oj-sm-flex-initial oj-typography-body-md"><oj-bind-text value="[[ $current.data.contextValue ]]"></oj-bind-text></div>
                      </div>
                      <div class="oj-sm-margin-2x-bottom">
                        <oj-bind-for-each data="[[ $current.data.methods ]]">
                          <template>
                            <oj-button class="oj-sm-margin-1x-end" chroming="[[ $current.data.chroming ]]"
                              :data-action-id="[[ $current.data.actionId ]]"
                              on-oj-action="[[ $listeners.hostBlockAction ]]"><oj-bind-text value="[[ $current.data.label ]]"></oj-bind-text></oj-button>
                          </template>
                        </oj-bind-for-each>
                      </div>
                      <oj-button chroming="callToAction" class="oj-sm-margin-1x-top"
                        :data-action-id="[[ $current.data.confirmActionId ]]"
                        on-oj-action="[[ $listeners.hostPaymentConfirm ]]"><oj-bind-text value="[[ $current.data.confirmLabel ]]"></oj-bind-text></oj-button>
                    </oj-bind-if>
                    <oj-bind-if test="[[ $current.data.isMeter ]]">
                      <div class="oj-typography-body-xs oj-text-color-secondary"><oj-bind-text value="[[ $current.data.label ]]"></oj-bind-text></div>
                      <oj-progress-bar class="oj-sm-margin-1x-vertical" value="[[ $current.data.value ]]" max="[[ $current.data.max ]]"></oj-progress-bar>
                      <div class="oj-typography-body-sm"><oj-bind-text value="[[ $current.data.valueText ]]"></oj-bind-text></div>
                      <div class="oj-typography-body-xs oj-text-color-secondary"><oj-bind-text value="[[ $current.data.caption ]]"></oj-bind-text></div>
                    </oj-bind-if>
                    <oj-bind-if test="[[ $current.data.isStat ]]">
                      <div class="oj-sm-margin-2x-bottom">
                        <div class="oj-typography-body-xs oj-text-color-secondary"><oj-bind-text value="[[ $current.data.label ]]"></oj-bind-text></div>
                        <div class="oj-typography-heading-sm"><oj-bind-text value="[[ $current.data.value ]]"></oj-bind-text></div>
                      </div>
                    </oj-bind-if>
                    <oj-bind-if test="[[ $current.data.isPropertyRow ]]">
                      <div class="oj-flex oj-sm-margin-1x-bottom">
                        <div class="oj-flex-item oj-typography-body-sm oj-text-color-secondary"><oj-bind-text value="[[ $current.data.label ]]"></oj-bind-text></div>
                        <div class="oj-flex-item oj-sm-flex-initial oj-typography-body-md"><oj-bind-text value="[[ $current.data.value ]]"></oj-bind-text></div>
                      </div>
                    </oj-bind-if>
                    <oj-bind-if test="[[ $current.data.isInput ]]">
                      <oj-input-text class="oj-form-control-max-width-md"
                        label-hint="[[ $current.data.label ]]"
                        value="[[ $current.data.value ]]"
                        :data-field-id="[[ $current.data.fieldId ]]"
                        on-value-changed="[[ $listeners.hostInputChanged ]]"></oj-input-text>
                    </oj-bind-if>
                  </template>
                </oj-bind-for-each>
          </div>
        </oj-bind-if>
      </template>
    </oj-bind-for-each>
  </div>
</oj-bind-if>

<!-- solo islas de FORMULARIO (sin contenido display: p.ej. GuestNote) — las display
     se pintan como bloques en el panel derecho de la cola -->
<oj-bind-if test="[[ !!$application.variables.mateuIsland && !$application.variables.mateuIsland.content ]]">
  <div class="oj-flex oj-sm-padding-12x-horizontal oj-sm-padding-6x-vertical">
    <div class="oj-flex-item oj-sm-12 oj-md-6">
      <oj-form-layout id="mateuIslandForm">
        <oj-bind-for-each data="[[ $application.variables.mateuIsland.fields ]]">
          <template>
            <oj-bind-if test="[[ $current.data.isText ]]">
              <oj-input-text
                label-hint="[[ $current.data.label ]]"
                value="[[ $current.data.value ]]"
                required="[[ $current.data.required ]]"
                readonly="[[ $current.data.readonly ]]"
                :data-field-id="[[ $current.data.fieldId ]]"
                on-value-changed="[[ $listeners.mateuIslandFieldChanged ]]"></oj-input-text>
            </oj-bind-if>
            <oj-bind-if test="[[ $current.data.isNumber ]]">
              <oj-input-number
                label-hint="[[ $current.data.label ]]"
                value="[[ $current.data.value ]]"
                required="[[ $current.data.required ]]"
                readonly="[[ $current.data.readonly ]]"
                :data-field-id="[[ $current.data.fieldId ]]"
                on-value-changed="[[ $listeners.mateuIslandFieldChanged ]]"></oj-input-number>
            </oj-bind-if>
            <oj-bind-if test="[[ $current.data.isBoolean ]]">
              <oj-switch
                label-hint="[[ $current.data.label ]]"
                value="[[ $current.data.value ]]"
                readonly="[[ $current.data.readonly ]]"
                :data-field-id="[[ $current.data.fieldId ]]"
                on-value-changed="[[ $listeners.mateuIslandFieldChanged ]]"></oj-switch>
            </oj-bind-if>
          </template>
        </oj-bind-for-each>
      </oj-form-layout>
      <div class="oj-flex oj-sm-margin-4x-top">
        <oj-bind-for-each data="[[ $application.variables.mateuIsland.actions ]]">
          <template>
            <oj-button class="oj-sm-margin-2x-end"
              :data-action-id="[[ $current.data.actionId ]]"
              chroming="[[ $current.data.chroming ]]"
              on-oj-action="[[ $listeners.mateuIslandActionClicked ]]"><oj-bind-text value="[[ $current.data.label ]]"></oj-bind-text></oj-button>
          </template>
        </oj-bind-for-each>
      </div>
    </div>
  </div>
</oj-bind-if>
</div>
