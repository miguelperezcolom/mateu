<!-- Markup del Redwood Starter con los bindings apuntando a las variables alimentadas por
     Mateu (chain loadMateuHello). Estructura y clases INTACTAS del starter: cero HTML/CSS propio. -->

<div class="oj-sp-public-primary-content-container oj-sm-padding-2x">
<div class="oj-flex">
  <h1 class="oj-flex-item oj-sm-12 oj-md-12"><oj-bind-text value="[[ $variables.mateuTitle ]]"></oj-bind-text></h1>
</div>
<div class="oj-flex">
  <div class="oj-flex-item oj-sm-12 oj-md-12">
    <oj-bind-text
      value="[[ $variables.mateuMessage ]]"
    ></oj-bind-text>
  </div>
</div>
</div>
