<!-- CONTENIDO (el navigator + cabecera viven en el shell-page). Bindea $application.functions /
     $application.variables (el bridge está en app-flow.js). Solo markup oj-* de los ejemplos. -->
<div class="oj-sm-padding-4x">
  <!-- Wizard (Fase 8): proceso guiado AUTÉNTICO oj-sp-guided-process. El rail/pasos/botón primario
       los pinta el componente; el form del paso va en el slot por defecto; la acción primaria
       (Siguiente/Completar) la dirige Mateu (next/completar). -->
  <oj-bind-if test="[[ $application.variables.isWizard ]]">
    <oj-sp-guided-process
      style="width: 100%; display: block"
      process-title="Nueva reserva"
      steps="[[ $application.functions.getGuidedSteps() ]]"
      current-step="[[ $application.functions.getGuidedCurrent() ]]"
      primary-action="[[ $application.functions.getGuidedPrimary() ]]"
      on-sp-primary-action="[[ $listeners.guidedPrimary ]]"
      on-sp-before-step-navigate="[[ $listeners.guidedStep ]]"
      on-sp-cancel="[[ $listeners.guidedCancel ]]"
    >
      <div class="oj-form-layout" style="max-width: 32rem">
        <oj-bind-for-each data="[[ $application.functions.getFormFields() ]]">
          <template data-oj-as="field">
            <div class="oj-sm-margin-2x-bottom">
              <oj-bind-if test="[[ field.data.isNumber ]]">
                <oj-c-input-number label-hint="[[ field.data.label ]]" value="[[ field.data.value ]]" :data-field="[[ field.data.fieldId ]]"></oj-c-input-number>
              </oj-bind-if>
              <oj-bind-if test="[[ !field.data.isNumber ]]">
                <oj-c-input-text label-hint="[[ field.data.label ]]" value="[[ field.data.value ]]" :data-field="[[ field.data.fieldId ]]"></oj-c-input-text>
              </oj-bind-if>
            </div>
          </template>
        </oj-bind-for-each>
      </div>
    </oj-sp-guided-process>
  </oj-bind-if>

  <!-- Foldout (Fase 7): overview + paneles plegables oj-sp -->
  <oj-bind-if test="[[ $application.variables.isFoldout ]]">
    <oj-sp-foldout-layout>
      <div slot="overview" class="oj-sm-padding-4x">
        <span class="oj-typography-body-lg">
          <oj-bind-text value="[[ $application.functions.getFoldoutOverview() ]]"></oj-bind-text>
        </span>
      </div>
      <oj-bind-for-each data="[[ $application.functions.getFoldoutPanels() ]]">
        <template data-oj-as="pnl">
          <oj-sp-foldout-panel>
            <div class="oj-sm-padding-4x">
              <h3 class="oj-typography-heading-xs"><oj-bind-text value="[[ pnl.data.title ]]"></oj-bind-text></h3>
              <div class="oj-text-color-secondary oj-typography-body-sm oj-sm-margin-2x-bottom">
                <oj-bind-text value="[[ pnl.data.subtitle ]]"></oj-bind-text>
              </div>
              <oj-bind-text value="[[ pnl.data.text ]]"></oj-bind-text>
            </div>
          </oj-sp-foldout-panel>
        </template>
      </oj-bind-for-each>
    </oj-sp-foldout-layout>
  </oj-bind-if>

  <!-- Listado (tabla) -->
  <oj-bind-if test="[[ $application.variables.isTable ]]">
    <oj-bind-if test="[[ $application.variables.isCrud ]]">
      <div class="oj-flex oj-sm-margin-2x-bottom">
        <oj-c-button class="oj-sm-margin-1x-end" label="Nuevo" chroming="callToAction" on-oj-action="[[ $listeners.crudNew ]]"></oj-c-button>
        <oj-c-button class="oj-sm-margin-1x-end" label="Editar" on-oj-action="[[ $listeners.crudEdit ]]"></oj-c-button>
        <oj-c-button label="Borrar" on-oj-action="[[ $listeners.crudDelete ]]"></oj-c-button>
      </div>
    </oj-bind-if>
    <oj-table
      data="[[ $application.functions.getTableData() ]]"
      columns="[[ $application.functions.getTableColumns() ]]"
      selection-mode.row="single"
      on-selected-changed="[[ $listeners.tableSelect ]]"
      aria-label="Listado"
      class="oj-table"
      style="width: 100%"
    ></oj-table>
  </oj-bind-if>

  <!-- Formulario (Fase 3 + crud create/edit) -->
  <oj-bind-if test="[[ $application.variables.isForm ]]">
    <div class="oj-form-layout oj-sm-margin-4x-bottom" style="max-width: 32rem">
      <oj-bind-for-each data="[[ $application.functions.getFormFields() ]]">
        <template data-oj-as="field">
          <div class="oj-sm-margin-2x-bottom">
            <oj-bind-if test="[[ field.data.isNumber ]]">
              <oj-c-input-number label-hint="[[ field.data.label ]]" value="[[ field.data.value ]]" :data-field="[[ field.data.fieldId ]]"></oj-c-input-number>
            </oj-bind-if>
            <oj-bind-if test="[[ !field.data.isNumber ]]">
              <oj-c-input-text label-hint="[[ field.data.label ]]" value="[[ field.data.value ]]" :data-field="[[ field.data.fieldId ]]"></oj-c-input-text>
            </oj-bind-if>
          </div>
        </template>
      </oj-bind-for-each>
      <div class="oj-flex">
        <oj-c-button class="oj-sm-margin-1x-end" label="Guardar" chroming="callToAction" on-oj-action="[[ $listeners.saveForm ]]"></oj-c-button>
        <oj-bind-if test="[[ $application.variables.isCrud ]]">
          <oj-c-button label="Cancelar" on-oj-action="[[ $listeners.crudCancel ]]"></oj-c-button>
        </oj-bind-if>
      </div>
    </div>
    <div class="oj-text-color-secondary">
      <oj-bind-text value="[[ $application.variables.saveMsg ]]"></oj-bind-text>
    </div>
  </oj-bind-if>

  <!-- Contenido de texto -->
  <oj-bind-if test="[[ !$application.variables.isForm &amp;&amp; !$application.variables.isTable &amp;&amp; !$application.variables.isFoldout &amp;&amp; !$application.variables.isWizard ]]">
    <div class="oj-flex">
      <h1 class="oj-flex-item oj-sm-12 oj-md-12">
        <oj-bind-text value="[[ $application.variables.greeting ]]"></oj-bind-text>
      </h1>
    </div>
  </oj-bind-if>
</div>
