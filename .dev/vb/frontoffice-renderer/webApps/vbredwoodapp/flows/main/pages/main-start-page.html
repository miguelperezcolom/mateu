<!-- Fases 2–6: cabecera (selectores de @AppContext + acciones) + navigator Redwood con
     submenús + área de contenido (tabla CRUD / formulario / texto).
     Solo markup oj-* de los ejemplos, sin CSS propio. -->

<!-- Cabecera (Fase 6): selectores de contexto + acciones de cabecera, a la derecha -->
<div class="oj-flex oj-sm-align-items-center oj-sm-padding-2x-horizontal oj-sm-padding-2x-top">
  <span class="oj-flex-item"></span>
  <oj-bind-for-each data="[[ $functions.getContextSelectors() ]]">
    <template data-oj-as="sel">
      <div class="oj-flex-item-initial oj-sm-margin-2x-start" style="width: 12rem">
        <oj-c-select-single
          label-hint="[[ sel.data.label ]]"
          data="[[ sel.data.dp ]]"
          item-text="label"
          value="[[ sel.data.value ]]"
          on-value-changed="[[ sel.data.onChange ]]"
        ></oj-c-select-single>
      </div>
    </template>
  </oj-bind-for-each>
  <oj-bind-for-each data="[[ $functions.getHeaderActions() ]]">
    <template data-oj-as="act">
      <oj-c-button
        class="oj-sm-margin-1x-start"
        label="[[ act.data.label ]]"
        :data-action-id="[[ act.data.actionId ]]"
        on-oj-action="[[ $listeners.headerAction ]]"
      ></oj-c-button>
    </template>
  </oj-bind-for-each>
</div>
<div class="oj-flex oj-sm-padding-2x-horizontal oj-text-color-secondary" style="min-height: 1.25rem">
  <oj-bind-text value="[[ $variables.headerMsg ]]"></oj-bind-text>
</div>

<div class="oj-web-applayout-content-nopad oj-flex">
  <div class="oj-flex-item" style="min-width: 15rem; max-width: 15rem">
    <oj-navigation-list
      data="[[ $functions.getNavData() ]]"
      drill-mode="collapsible"
      on-selection-changed="[[ $listeners.navSelect ]]"
      class="oj-navigationlist-nofollow-link"
    >
      <template slot="itemTemplate" data-oj-as="item">
        <li :id="[[ item.data.route ]]">
          <a style="cursor: pointer">
            <oj-bind-text value="[[ item.data.label ]]"></oj-bind-text>
          </a>
        </li>
      </template>
    </oj-navigation-list>
  </div>

  <div class="oj-flex-item oj-sm-padding-4x">
    <!-- Listado (tabla) -->
    <oj-bind-if test="[[ $variables.isTable ]]">
      <!-- Toolbar CRUD (Fase 5): Nuevo/Editar/Borrar -->
      <oj-bind-if test="[[ $variables.isCrud ]]">
        <div class="oj-flex oj-sm-margin-2x-bottom">
          <oj-c-button
            class="oj-sm-margin-1x-end"
            label="Nuevo"
            chroming="callToAction"
            on-oj-action="[[ $listeners.crudNew ]]"
          ></oj-c-button>
          <oj-c-button
            class="oj-sm-margin-1x-end"
            label="Editar"
            on-oj-action="[[ $listeners.crudEdit ]]"
          ></oj-c-button>
          <oj-c-button
            label="Borrar"
            on-oj-action="[[ $listeners.crudDelete ]]"
          ></oj-c-button>
        </div>
      </oj-bind-if>
      <oj-table
        data="[[ $functions.getTableData() ]]"
        columns="[[ $functions.getTableColumns() ]]"
        selection-mode.row="single"
        on-selected-changed="[[ $listeners.tableSelect ]]"
        aria-label="Listado"
        class="oj-table"
        style="width: 100%"
      ></oj-table>
    </oj-bind-if>

    <!-- Formulario (Fase 3 + crud create/edit) -->
    <oj-bind-if test="[[ $variables.isForm ]]">
      <div class="oj-form-layout oj-sm-margin-4x-bottom" style="max-width: 32rem">
        <oj-bind-for-each data="[[ $functions.getFormFields() ]]">
          <template data-oj-as="field">
            <div class="oj-sm-margin-2x-bottom">
              <oj-bind-if test="[[ field.data.isNumber ]]">
                <oj-c-input-number
                  label-hint="[[ field.data.label ]]"
                  value="[[ field.data.value ]]"
                  :data-field="[[ field.data.fieldId ]]"
                ></oj-c-input-number>
              </oj-bind-if>
              <oj-bind-if test="[[ !field.data.isNumber ]]">
                <oj-c-input-text
                  label-hint="[[ field.data.label ]]"
                  value="[[ field.data.value ]]"
                  :data-field="[[ field.data.fieldId ]]"
                ></oj-c-input-text>
              </oj-bind-if>
            </div>
          </template>
        </oj-bind-for-each>
        <div class="oj-flex">
          <oj-c-button
            class="oj-sm-margin-1x-end"
            label="Guardar"
            chroming="callToAction"
            on-oj-action="[[ $listeners.saveForm ]]"
          ></oj-c-button>
          <oj-bind-if test="[[ $variables.isCrud ]]">
            <oj-c-button label="Cancelar" on-oj-action="[[ $listeners.crudCancel ]]"></oj-c-button>
          </oj-bind-if>
        </div>
      </div>
      <div class="oj-text-color-secondary">
        <oj-bind-text value="[[ $variables.saveMsg ]]"></oj-bind-text>
      </div>
    </oj-bind-if>

    <!-- Contenido de texto -->
    <oj-bind-if test="[[ !$variables.isForm &amp;&amp; !$variables.isTable ]]">
      <div class="oj-flex">
        <h1 class="oj-flex-item oj-sm-12 oj-md-12">
          <oj-bind-text value="[[ $variables.greeting ]]"></oj-bind-text>
        </h1>
      </div>
    </oj-bind-if>
  </div>
</div>
