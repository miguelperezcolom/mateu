<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- AQUIFAVICON -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AQUIELTITULODELAPAGINA</title>
    <script src="/assets/mateu-theme.js"></script>
      <!-- AQUIKEYCLOAK -->
      <!-- AQUIJS -->
    <link rel="stylesheet" href="./src/index.css" />
    <script type="module" src="./src/lumo.js"></script>
    <script type="module" src="./src/index.ts"></script>
      <!-- HASTAAQUIJS -->

  <body>
  <!-- AQUIUI -->
  <!--
  baseUrl="https://demo.mateu.io/fluent"
  baseUrl="/fluent"
  baseUrl="/declarative"
  baseUrl=""
  -->
  <mateu-ui baseUrl=""
            pathPrefix=""
            config='{"tenantId": "1111","profile": "dev"}'
            style="width: 100%; height: 100vh;"
  >
  </mateu-ui>
  <!-- HASTAAQUIUI -->
  <!-- Pre-boot loader: until the renderer's bundle has run, nothing else on this page paints (on a
       phone on 3G that is seconds of a blank screen). Static markup + CSS only — no script, so the
       page keeps running under script-src 'self' — after the root element so the server's
       <mateu-ui> keeps it, and gone the moment <mateu-ui> is defined (the app's own loading
       indicators take over). It shows after 300 ms, so a fast load never sees it. -->
  <style>
    :root[theme~="dark"] { background-color: hsl(214, 35%, 21%); }
    .mateu-preboot {
      position: fixed; inset: 0; z-index: 2147483000; pointer-events: none;
      display: flex; align-items: center; justify-content: center;
      color: hsl(214, 100%, 48%); opacity: 0;
      animation: mateu-preboot-in 0.2s ease-out 0.3s forwards;
    }
    :root[theme~="dark"] .mateu-preboot { color: hsl(214, 100%, 70%); }
    .mateu-preboot svg { width: 3rem; height: 3rem; animation: mateu-preboot-spin 0.9s linear infinite; }
    .mateu-preboot-label {
      position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0);
      clip-path: inset(50%); white-space: nowrap;
    }
    mateu-ui:defined ~ .mateu-preboot { display: none; }
    @keyframes mateu-preboot-in { to { opacity: 1; } }
    @keyframes mateu-preboot-spin { to { transform: rotate(360deg); } }
    @media (prefers-reduced-motion: reduce) {
      .mateu-preboot { animation-duration: 0s; }
      .mateu-preboot svg { animation: none; }
    }
  </style>
  <div class="mateu-preboot" role="status">
    <svg viewBox="0 0 48 48" aria-hidden="true" focusable="false">
      <circle cx="24" cy="24" r="20" fill="none" stroke="currentColor" stroke-opacity="0.2" stroke-width="4"/>
      <path d="M24 4a20 20 0 0 1 20 20" fill="none" stroke="currentColor" stroke-width="4" stroke-linecap="round"/>
    </svg>
    <span class="mateu-preboot-label">Loading&hellip;</span>
  </div>


  </body>
</html>
