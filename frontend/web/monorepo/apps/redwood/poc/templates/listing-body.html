            <img class="mateu-primary-cell-leading" :src="[[ $current.data.leading ]]" alt="" loading="lazy">
          </oj-bind-if>
          <span class="mateu-primary-cell-text">
            <span><oj-bind-text value="[[ ($current.data && $current.data.title) || '' ]]"></oj-bind-text></span>
            <oj-bind-if test="[[ !!($current.data && $current.data.caption) ]]">
              <span class="oj-typography-body-sm oj-text-color-secondary"><oj-bind-text value="[[ $current.data.caption ]]"></oj-bind-text></span>
            </oj-bind-if>
          </span>
        </span>
      </template>
      <!-- abbreviated UUID: the cell brings {text: "…-<last block>", full: the UUID}, precomputed
           in listingOf; the full UUID stays in the tooltip -->
      <template slot="cellUuid">
        <span :title="[[ ($current.data && $current.data.full) || '' ]]"><oj-bind-text value="[[ ($current.data && $current.data.text) || '' ]]"></oj-bind-text></span>
      </template>
      <!-- fixed WIDTH (@ColumnWidth, flexGrow 0) / tooltipPath: the text is cut with an ellipsis
           at the column width and shown whole in the title; {text, title} precomputed in listingOf -->
      <template slot="cellClip">
        <span :class="[[ ($current.data && $current.data.cls) || '' ]]" :title="[[ ($current.data && $current.data.title) || '' ]]" :data-mateu-hover="[[ ($current.data && $current.data.hover) || '' ]]"><oj-bind-text value="[[ ($current.data && $current.data.text) || '' ]]"></oj-bind-text></span>
      </template>
      <!-- MULTI-LINE ROWS (@Line): the technical column __rowLines (1px) paints the row's extra
           lines — secondary «Label: value» pairs — in an absolute block that
           takes the WHOLE width of the row, in the gap the mateu-lines-N table reserves
           below each cell (app.css); {lines: [{pairs: [{label, text, cls}]}]} precomputed -->
      <template slot="cellLines">
        <div class="mateu-row-lines oj-typography-body-sm">
          <oj-bind-for-each data="[[ ($current.data && $current.data.lines) || [] ]]">
            <template data-oj-as="line">
              <div class="mateu-row-line">
                <oj-bind-for-each data="[[ line.data.pairs ]]">
                  <template data-oj-as="pair">
                    <span class="mateu-row-line-pair" :data-column="[[ pair.data.key ]]"><span class="oj-text-color-secondary"><oj-bind-text value="[[ pair.data.label ]]"></oj-bind-text>:</span> <span :class="[[ pair.data.cls ]]"><oj-bind-text value="[[ pair.data.text ]]"></oj-bind-text></span></span>
                  </template>
                </oj-bind-for-each>
              </div>
            </template>
          </oj-bind-for-each>
        </div>
      </template>
      <!-- per-row ACTIONS (ColumnActionGroup): the cell value brings actions[];
           the "cell" alias keeps the row's context inside the for-each -->
      <template slot="cellRowActions" data-oj-as="cell">
        <oj-bind-for-each data="[[ (cell.data && cell.data.actions) || [] ]]">
          <template>
            <oj-button chroming="outlined" class="oj-button-sm oj-sm-margin-1x-end"
              :data-method="[[ $current.data.methodNameInCrud ]]"
              :data-row-id="[[ cell.row.id ]]"
              :data-row-key="[[ cell.key ]]"
              on-oj-action="[[ $listeners.rowActionClicked ]]"><oj-bind-text value="[[ $current.data.label ]]"></oj-bind-text></oj-button>
          </template>
        </oj-bind-for-each>
      </template>
    </oj-table>
    </oj-bind-if>
    <!-- PAGINATION (the server's Page: pageNumber/pageSize/totalElements, projected in
         listingOf().paging): table footer with the range and first/previous/next/last.
         Only if there is more than one page. Paging keeps text, filters and order. -->
    <oj-bind-if test="[[ $application.variables.mateuListing.paging.visible ]]">
      <div id="mateuListingPaging" class="mateu-listing-paging oj-flex oj-sm-align-items-center oj-sm-justify-content-space-between oj-sm-padding-4x-top">
        <div class="oj-flex-item oj-sm-flex-initial oj-typography-body-sm oj-text-color-secondary">
          <oj-bind-text value="[[ $application.variables.mateuListing.paging.rangeText ]]"></oj-bind-text>
        </div>
        <div class="oj-flex-item oj-sm-flex-initial oj-flex oj-sm-align-items-center">
          <oj-button display="icons" chroming="borderless" data-page="first"
            disabled="[[ $application.variables.mateuListing.paging.prevDisabled ]]"
            on-oj-action="[[ $listeners.mateuListingPage ]]">
            <span slot="startIcon" class="oj-ux-ico-chevron-left-end"></span>
            <oj-bind-text value="[[ $application.variables.mateuListing.paging.labels.first ]]"></oj-bind-text>
          </oj-button>
          <oj-button display="icons" chroming="borderless" data-page="prev"
            disabled="[[ $application.variables.mateuListing.paging.prevDisabled ]]"
            on-oj-action="[[ $listeners.mateuListingPage ]]">
            <span slot="startIcon" class="oj-ux-ico-chevron-left"></span>
            <oj-bind-text value="[[ $application.variables.mateuListing.paging.labels.prev ]]"></oj-bind-text>
          </oj-button>
          <span class="oj-typography-body-sm oj-sm-margin-2x-horizontal mateu-listing-page-text"><oj-bind-text value="[[ $application.variables.mateuListing.paging.pageText ]]"></oj-bind-text></span>
          <oj-button display="icons" chroming="borderless" data-page="next"
            disabled="[[ $application.variables.mateuListing.paging.nextDisabled ]]"
            on-oj-action="[[ $listeners.mateuListingPage ]]">
            <span slot="startIcon" class="oj-ux-ico-chevron-right"></span>
            <oj-bind-text value="[[ $application.variables.mateuListing.paging.labels.next ]]"></oj-bind-text>
          </oj-button>
          <oj-button display="icons" chroming="borderless" data-page="last"
            disabled="[[ $application.variables.mateuListing.paging.lastDisabled ]]"
            on-oj-action="[[ $listeners.mateuListingPage ]]">
            <span slot="startIcon" class="oj-ux-ico-chevron-right-end"></span>
            <oj-bind-text value="[[ $application.variables.mateuListing.paging.labels.last ]]"></oj-bind-text>
          </oj-button>
        </div>
      </div>
    </oj-bind-if>
  </div>
</div>
