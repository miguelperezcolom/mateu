                                      <oj-button class="oj-button-sm oj-sm-margin-1x-end" chroming="outlined"
                                        :data-action-id="[[ $current.data.actionId ]]"
                                        on-oj-action="[[ $listeners.{{blockAction}} ]]"><oj-bind-text value="[[ $current.data.label ]]"></oj-bind-text></oj-button>
                                    </oj-bind-if>
                                  </template>
                                </oj-bind-for-each>
                              </div>
                            </div>
                          </oj-bind-if>
                          <oj-bind-if test="[[ !$current.data.rowClickable && !$current.data.gridCell && !$current.data.hasActions && !$current.data.hasLines ]]">
                            <div :class="[[ $current.data.rowClass ]]">
                              <oj-avatar class="oj-flex-item oj-sm-flex-initial oj-sm-margin-2x-end" size="xs" initials="[[ $current.data.avatar ]]"></oj-avatar>
                              <div class="oj-flex-item">
                                <div class="oj-typography-body-md"><oj-bind-text value="[[ $current.data.title ]]"></oj-bind-text></div>
                                <div class="oj-typography-body-xs oj-text-color-secondary"><oj-bind-text value="[[ $current.data.description ]]"></oj-bind-text></div>
                              </div>
                              <div class="oj-flex-item oj-sm-flex-initial oj-typography-body-sm" :class="[[ $current.data.statusClass ]]"><oj-bind-text value="[[ $current.data.status ]]"></oj-bind-text></div>
                              <oj-bind-if test="[[ $current.data.actionLabel ]]">
                                <oj-button class="oj-button-sm oj-flex-item oj-sm-flex-initial oj-sm-margin-2x-start" chroming="outlined"
                                  :data-action-id="[[ $current.data.actionId ]]"
                                  on-oj-action="[[ $listeners.{{blockAction}} ]]"><oj-bind-text value="[[ $current.data.actionLabel ]]"></oj-bind-text></oj-button>
                              </oj-bind-if>
                            </div>
                          </oj-bind-if>
                        </template>
                      </oj-bind-for-each>
                      </div>
                    </oj-bind-if>
                    <oj-bind-if test="[[ $current.data.isLedger ]]">
                      <oj-bind-for-each data="[[ $current.data.lines ]]">
                        <template>
                          <div class="oj-flex oj-sm-margin-1x-bottom">
                            <div class="oj-flex-item oj-typography-body-md"><oj-bind-text value="[[ $current.data.concept ]]"></oj-bind-text></div>
                            <div class="oj-flex-item oj-sm-flex-initial oj-typography-body-md" :class="[[ $current.data.amountClass ]]"><oj-bind-text value="[[ $current.data.amountText ]]"></oj-bind-text></div>
                          </div>
                        </template>
                      </oj-bind-for-each>
                      <div class="oj-flex oj-sm-margin-2x-top">
                        <div class="oj-flex-item oj-typography-subheading-xs"><oj-bind-text value="[[ $current.data.totalLabel ]]"></oj-bind-text></div>
                        <div class="oj-flex-item oj-sm-flex-initial oj-typography-subheading-xs"><oj-bind-text value="[[ $current.data.totalText ]]"></oj-bind-text></div>
                      </div>
                    </oj-bind-if>
                    <oj-bind-if test="[[ $current.data.isPayment ]]">
                      <div class="oj-flex oj-sm-align-items-center oj-sm-margin-2x-bottom">
                        <div class="oj-flex-item oj-typography-body-xs oj-text-color-secondary"><oj-bind-text value="[[ $current.data.contextLabel ]]"></oj-bind-text></div>
                        <div class="oj-flex-item oj-sm-flex-initial oj-typography-body-md"><oj-bind-text value="[[ $current.data.contextValue ]]"></oj-bind-text></div>
                      </div>
                      <div class="oj-sm-margin-2x-bottom">
                        <oj-bind-for-each data="[[ $current.data.methods ]]">
                          <template>
                            <oj-button class="oj-sm-margin-1x-end" chroming="[[ $current.data.chroming ]]"
                              :data-action-id="[[ $current.data.actionId ]]"
                              on-oj-action="[[ $listeners.{{blockAction}} ]]"><oj-bind-text value="[[ $current.data.label ]]"></oj-bind-text></oj-button>
                          </template>
                        </oj-bind-for-each>
                      </div>
                      <oj-button chroming="callToAction" class="oj-sm-margin-1x-top"
                        :data-action-id="[[ $current.data.confirmActionId ]]"
                        on-oj-action="[[ $listeners.hostPaymentConfirm ]]"><oj-bind-text value="[[ $current.data.confirmLabel ]]"></oj-bind-text></oj-button>
                    </oj-bind-if>
                    <oj-bind-if test="[[ $current.data.isTaskProgress ]]">
                      <div :class="[[ $current.data.panelClass ]]">
                        <div class="oj-flex oj-sm-align-items-center">
                          <div class="oj-flex-item">
                            <span class="oj-typography-body-md"><oj-bind-text value="[[ $current.data.label ]]"></oj-bind-text></span>
                            <span class="oj-typography-body-sm oj-text-color-secondary oj-sm-margin-2x-start"><oj-bind-text value="[[ $current.data.valueText ]]"></oj-bind-text></span>
                          </div>
                          <oj-bind-if test="[[ $current.data.actionLabel ]]">
                            <oj-button class="oj-flex-item oj-sm-flex-initial" chroming="callToAction"
                              :data-action-id="[[ $current.data.actionId ]]"
                              on-oj-action="[[ $listeners.{{blockAction}} ]]"><oj-bind-text value="[[ $current.data.actionLabel ]]"></oj-bind-text></oj-button>
                          </oj-bind-if>
                        </div>
                        <oj-c-progress-bar class="oj-sm-margin-2x-top" style="width: 100%;" value="[[ $current.data.value ]]" max="[[ $current.data.max ]]"></oj-c-progress-bar>
                      </div>
                    </oj-bind-if>
                    <!-- PESTAÑAS de un formulario (no el arquetipo item-overview: un form que
                         lleva un TabLayout dentro, como el detalle de un proceso). El contenido de
                         la pestaña activa viene APLANADO detrás, como átomos normales — así lo
                         pinta el vocabulario que ya existe sin anidar la plantilla en sí misma. -->
                    <oj-bind-if test="[[ $current.data.isTabs ]]">
                      <!-- edge=top EXPLÍCITO: el valor por defecto apila las pestañas en
                           vertical (como el navigator), que aquí no es lo que se quiere -->
                      <oj-tab-bar :id="[[ $current.data.barId ]]" class="oj-sm-margin-4x-bottom" edge="top"
                        selection="[[ $current.data.selectedId ]]"
                        on-selection-changed="[[ $listeners.mateuContentTabChanged ]]">
                        <ul>
                          <oj-bind-for-each data="[[ $current.data.tabs ]]">
                            <template>
                              <li :id="[[ $current.data.id ]]"><a href="#"><oj-bind-text value="[[ $current.data.label ]]"></oj-bind-text></a></li>
                            </template>
                          </oj-bind-for-each>
                        </ul>
                      </oj-tab-bar>
                    </oj-bind-if>
                    <!-- TABLA embebida en el contenido (una lista con columnas dentro de un
                         formulario). El data provider lo trae ya hecho el átomo: son varias por
                         página y una variable por tabla no se puede declarar de antemano. -->
                    <oj-bind-if test="[[ $current.data.isGrid ]]">
                      <div class="oj-sm-margin-4x-bottom">
                        <oj-table class="oj-sm-12" display="list"
                          data="[[ $current.data.adp ]]"
                          columns="[[ $current.data.columns ]]">
                          <template slot="noData">
                            <oj-sp-empty-state primary-text="Sin datos" secondary-text=""></oj-sp-empty-state>
                          </template>
                          <template slot="cellStatusBadge">
                            <span :class="[[ ($current.data && $current.data.badgeClass) || '' ]]"><oj-bind-text value="[[ ($current.data && $current.data.message) || $current.data ]]"></oj-bind-text></span>
                          </template>
                          <!-- acciones de FILA de una lista con editor modal: Editar abre el diálogo con
                               la fila, Quitar la saca de la lista (data-row-key = su _rowNumber) -->
                          <template slot="cellListRowActions">
                            <div class="oj-flex oj-sm-justify-content-flex-end oj-sm-flex-wrap-nowrap">
                              <oj-button display="icons" chroming="borderless"
                                :data-action-id="[[ $current.row.__editActionId ]]" :data-row-key="[[ $current.row.__rowKey ]]"
                                on-oj-action="[[ $listeners.mateuListAction ]]"><span slot="startIcon" class="oj-ux-ico-edit"></span>Edit</oj-button>
                              <oj-button display="icons" chroming="borderless"
                                :data-action-id="[[ $current.row.__removeActionId ]]" :data-row-key="[[ $current.row.__rowKey ]]"
                                on-oj-action="[[ $listeners.mateuListAction ]]"><span slot="startIcon" class="oj-ux-ico-trash"></span>Remove</oj-button>
                            </div>
                          </template>
                        </oj-table>
                        <oj-bind-if test="[[ $current.data.rowEditable ]]">
                          <oj-button class="oj-sm-margin-2x-top" chroming="outlined" :data-action-id="[[ $current.data.addActionId ]]"
                            on-oj-action="[[ $listeners.mateuListAction ]]"><span slot="startIcon" class="oj-ux-ico-plus"></span><oj-bind-text value="[[ $current.data.addLabel ]]"></oj-bind-text></oj-button>
                        </oj-bind-if>
                      </div>
                    </oj-bind-if>
                    <!-- COMPONENTE WEB de terceros (el grafo de un proceso): aquí solo va el
                         hueco; el elemento lo crea e hidrata el bridge (mountElements), porque
                         VB no sabe escribir una etiqueta cuyo nombre llega en los datos -->
                    <oj-bind-if test="[[ $current.data.isElement ]]">
                      <div class="mateu-element oj-sm-margin-2x-vertical" :data-element-id="[[ $current.data.elementId ]]"></div>
                    </oj-bind-if>
                    <oj-bind-if test="[[ $current.data.isMeter ]]">
                      <div class="oj-typography-body-xs oj-text-color-secondary"><oj-bind-text value="[[ $current.data.label ]]"></oj-bind-text></div>
                      <oj-c-progress-bar class="oj-sm-margin-1x-vertical" value="[[ $current.data.value ]]" max="[[ $current.data.max ]]"></oj-c-progress-bar>
                      <div class="oj-typography-body-sm"><oj-bind-text value="[[ $current.data.valueText ]]"></oj-bind-text></div>
                      <div class="oj-typography-body-xs oj-text-color-secondary"><oj-bind-text value="[[ $current.data.caption ]]"></oj-bind-text></div>
                    </oj-bind-if>
                    <oj-bind-if test="[[ $current.data.isStat ]]">
                      <div class="oj-sm-margin-2x-bottom">
                        <div class="oj-typography-body-xs oj-text-color-secondary"><oj-bind-text value="[[ $current.data.label ]]"></oj-bind-text></div>
                        <div class="oj-typography-heading-sm"><oj-bind-text value="[[ $current.data.value ]]"></oj-bind-text></div>
                      </div>
                    </oj-bind-if>
                    <oj-bind-if test="[[ $current.data.isPropertyRow ]]">
                      <div class="oj-flex oj-sm-margin-1x-bottom">
                        <div class="oj-flex-item oj-typography-body-sm oj-text-color-secondary"><oj-bind-text value="[[ $current.data.label ]]"></oj-bind-text></div>
                        <div class="oj-flex-item oj-sm-flex-initial oj-typography-body-md"><oj-bind-text value="[[ $current.data.value ]]"></oj-bind-text></div>
                      </div>
                    </oj-bind-if>
                    <oj-bind-if test="[[ $current.data.isInput ]]">
                      <oj-input-text class="oj-form-control-max-width-md"
                        label-hint="[[ $current.data.label ]]"
                        value="[[ $current.data.value ]]"
                        :data-field-id="[[ $current.data.fieldId ]]"
                        on-value-changed="[[ $listeners.hostInputChanged ]]"
                        on-raw-value-changed="[[ $listeners.hostInputTyped ]]"></oj-input-text>
                    </oj-bind-if>
                    <!-- un FormLayout del wire (maxColumns + FormRows): el oj-form-layout de JET reparte las
                         columnas; readonly (la vista de detalle) pinta valores, no cajas. El colspan de un campo
                         escalar NO se aplica: con labels dentro, oj-form-layout reparte por columnas CSS y un
                         oj-label-value con colspan descuadra a sus hermanos — pide oj-c-form-layout (core pack). -->
                    <oj-bind-if test="[[ $current.data.isFormLayout ]]">
                      <oj-form-layout class="oj-formlayout-full-width" max-columns="[[ $current.data.columns ]]" direction="row"
                        readonly="[[ $current.data.readonly ]]">
                        <oj-bind-for-each data="[[ $current.data.fields ]]">
                          <template>
                            <oj-bind-if test="[[ $current.data.isText ]]">
                              <oj-input-text
                                  on-raw-value-changed="[[ $listeners.hostInputTyped ]]"
                                  label-hint="[[ $current.data.label ]]"
                                  value="[[ $current.data.value ]]"
                                  required="[[ $current.data.required ]]"
                                  readonly="[[ $current.data.readonly ]]"
                                  messages-custom="[[ $current.data.messagesCustom ]]"
                                  :data-field-id="[[ $current.data.fieldId ]]"
                                  on-value-changed="[[ $listeners.hostInputChanged ]]"></oj-input-text>
                            </oj-bind-if>
                            <oj-bind-if test="[[ $current.data.isNumber ]]">
                              <oj-input-number
                                  label-hint="[[ $current.data.label ]]"
                                  value="[[ $current.data.value ]]"
                                  required="[[ $current.data.required ]]"
                                  readonly="[[ $current.data.readonly ]]"
                                  messages-custom="[[ $current.data.messagesCustom ]]"
                                  :data-field-id="[[ $current.data.fieldId ]]"
                                  on-value-changed="[[ $listeners.hostInputChanged ]]"></oj-input-number>
                            </oj-bind-if>
                            <!-- @Searchable: un chip por id (con ✕ si se puede quitar) y el botón que abre su selector
                                 (codesearch-<campo>, por hostBlockAction); bridge.searchableWidgetOf -->
                            <oj-bind-if test="[[ $current.data.isSearchable ]]">
                              <oj-label-value label-edge="top">
                                <oj-label slot="label" show-required="[[ $current.data.required ]]"><oj-bind-text value="[[ $current.data.label ]]"></oj-bind-text></oj-label>
                                <div slot="value" class="mateu-searchable" :data-field-id="[[ $current.data.fieldId ]]">
                                  <oj-bind-for-each data="[[ $current.data.chips ]]">
                                    <template>
                                      <span class="mateu-searchable-chip">
                                        <span class="mateu-searchable-chip-text"><oj-bind-text value="[[ $current.data.label ]]"></oj-bind-text></span>
                                        <oj-bind-if test="[[ $current.data.removable ]]">
                                          <oj-button display="icons" chroming="borderless" class="mateu-searchable-remove"
                                            on-oj-action="[[ $listeners.searchableChipRemoved ]]">
                                            <span slot="startIcon" class="oj-ux-ico-close"></span>
                                            <oj-bind-text value="[[ $current.data.removeLabel ]]"></oj-bind-text>
                                          </oj-button>
                                        </oj-bind-if>
                                      </span>
                                    </template>
                                  </oj-bind-for-each>
                                  <oj-bind-if test="[[ $current.data.editable ]]">
                                    <oj-button chroming="borderless" class="mateu-searchable-add"
                                      :data-action-id="[[ $current.data.actionId ]]"
                                      on-oj-action="[[ $listeners.{{blockAction}} ]]">
                                      <span slot="startIcon" class="oj-ux-ico-search"></span>
                                      <oj-bind-text value="[[ $current.data.addLabel ]]"></oj-bind-text>
                                    </oj-button>
                                  </oj-bind-if>
                                </div>
                              </oj-label-value>
                            </oj-bind-if>
                            <oj-bind-if test="[[ $current.data.isTextArea ]]">
                              <oj-text-area
                                  rows="3"
                                  label-hint="[[ $current.data.label ]]"
                                  value="[[ $current.data.value ]]"
                                  required="[[ $current.data.required ]]"
                                  readonly="[[ $current.data.readonly ]]"
                                  messages-custom="[[ $current.data.messagesCustom ]]"
                                  :data-field-id="[[ $current.data.fieldId ]]"
                                  on-value-changed="[[ $listeners.hostInputChanged ]]"></oj-text-area>
                            </oj-bind-if>
                            <oj-bind-if test="[[ $current.data.isDate ]]">
                              <oj-input-date
                                  label-hint="[[ $current.data.label ]]"
                                  value="[[ $current.data.value ]]"
                                  required="[[ $current.data.required ]]"
                                  readonly="[[ $current.data.readonly ]]"
                                  messages-custom="[[ $current.data.messagesCustom ]]"
                                  :data-field-id="[[ $current.data.fieldId ]]"
                                  on-value-changed="[[ $listeners.hostInputChanged ]]"></oj-input-date>
                            </oj-bind-if>
                            <oj-bind-if test="[[ $current.data.isDateTime ]]">
                              <oj-input-date-time
                                  label-hint="[[ $current.data.label ]]"
                                  value="[[ $current.data.value ]]"
                                  required="[[ $current.data.required ]]"
                                  readonly="[[ $current.data.readonly ]]"
                                  messages-custom="[[ $current.data.messagesCustom ]]"
                                  :data-field-id="[[ $current.data.fieldId ]]"
                                  on-value-changed="[[ $listeners.hostInputChanged ]]"></oj-input-date-time>
                            </oj-bind-if>
                            <oj-bind-if test="[[ $current.data.isSelect ]]">
                              <oj-select-one
                                  options="[[ $current.data.options ]]"
                                  label-hint="[[ $current.data.label ]]"
                                  value="[[ $current.data.value ]]"
                                  required="[[ $current.data.required ]]"
                                  readonly="[[ $current.data.readonly ]]"
                                  messages-custom="[[ $current.data.messagesCustom ]]"
                                  :data-field-id="[[ $current.data.fieldId ]]"
                                  on-value-changed="[[ $listeners.hostInputChanged ]]"></oj-select-one>
                            </oj-bind-if>
                            <!-- @fields-extra hostInputChanged -->
                            <!-- @end-fields-extra -->
                            <oj-bind-if test="[[ $current.data.isBoolean ]]">
                              <oj-switch
                                  label-hint="[[ $current.data.label ]]"
                                  value="[[ $current.data.value ]]"
                                  readonly="[[ $current.data.readonly ]]"
                                  :data-field-id="[[ $current.data.fieldId ]]"
                                  on-value-changed="[[ $listeners.hostInputChanged ]]"></oj-switch>
                            </oj-bind-if>
                          </template>
                        </oj-bind-for-each>
                      </oj-form-layout>
                    </oj-bind-if>
                  </template>
