<!-- AUTHENTIC Redwood shell: oj-sp-simple-ui-shell + oj-sp-global-header (slots declared
     by the component). The starter's content (banner, toast, router) goes in the
     stretchingContents slot. Zero HTML/CSS of our own: only composition of oj-sp components. -->

<oj-sp-simple-ui-shell id="shell" page-layout="[[ $application.variables.mateuShellPageLayout ]]"
  on-oj-sp-chat-action="[[ $listeners.askOracleOpen ]]">

  <oj-sp-global-header slot="globalHeader" id="globalHeader"
    on-oj-sp-home-click="[[ $listeners.homeClicked ]]">
    <!-- HAMBURGUER_MENU: the hamburger OPENS the left navigator-drawer (not a dropdown) -->
    <div slot="start" class="oj-flex oj-sm-flex-wrap-nowrap oj-sm-align-items-center">
      <!-- the HAMBURGER goes at the far left, before the logo (as in Redwood / Opera
           Cloud), and its glyph says what it does: ☰ with the menu closed, ✕ with it open.
           HAMBURGER_SECTIONS: the menu is a FLOATING panel over the subheader and the content
           (mateuSectionsOverlay, below); HAMBURGUER_MENU: the usual persistent navigator. -->
      <oj-bind-if test="[[ $application.variables.mateuMenuDrawerMode || $application.variables.mateuMenuSections ]]">
        <oj-button id="mateuHamburger" chroming="borderless" display="icons"
          :class="[[ $application.variables.mateuNavDrawerOpen ? 'mateu-hamburger mateu-hamburger-open oj-sm-margin-2x-end' : 'mateu-hamburger oj-sm-margin-2x-end' ]]"
          :aria-controls="[[ $application.variables.mateuMenuSections ? 'mateuSectionsOverlay' : 'mateuNavDrawer' ]]"
          on-oj-action="[[ $listeners.hamburgerClicked ]]">
          <span slot="startIcon" :class="[[ $application.variables.mateuNavDrawerOpen ? 'oj-ux-ico-close' : 'oj-ux-ico-menu' ]]"></span>
          <oj-bind-text value="[[ $application.translations.appBundle.menu ]]"></oj-bind-text>
        </oj-button>
      </oj-bind-if>
      <!-- the @App's logo (the customer's brand, e.g. RIU) before the navigation -->
      <oj-bind-if test="[[ !!$application.variables.mateuShellLogo ]]">
        <img :src="[[ $application.variables.mateuShellLogo ]]" alt="logo"
          class="oj-sm-margin-3x-end" style="height: 22px; display: block;">
      </oj-bind-if>
      <!-- TABS with groups: TOP-LEVEL options visible in the header, no hamburger;
           the groups open an oj-menu (MENU_ON_TOP goes in the subheader, further down) -->
      <oj-bind-if test="[[ $application.variables.mateuMenuTopbar ]]">
        <oj-bind-for-each data="[[ $application.variables.mateuMenuTree ]]">
          <template>
            <oj-bind-if test="[[ !$current.data.hasChildren ]]">
              <oj-button chroming="borderless"
                :data-route="[[ $current.data.id ]]"
                :disabled="[[ !!$current.data.disabled ]]"
                :title="[[ $current.data.hint || '' ]]"
                on-oj-action="[[ $listeners.topbarNavClicked ]]"><oj-bind-text value="[[ $current.data.label ]]"></oj-bind-text></oj-button>
            </oj-bind-if>
            <oj-bind-if test="[[ $current.data.hasChildren ]]">
              <oj-menu-button chroming="borderless">
                <oj-bind-text value="[[ $current.data.label ]]"></oj-bind-text>
                <oj-menu slot="menu" on-oj-menu-action="[[ $listeners.menuNavAction ]]">
                  <oj-bind-for-each data="[[ $current.data.children ]]">
                    <template>
                      <!-- leaf -->
                      <oj-bind-if test="[[ !$current.data.hasChildren ]]">
                        <oj-option :value="[[ $current.data.id ]]" :disabled="[[ !!$current.data.disabled ]]" :title="[[ $current.data.hint || '' ]]"><oj-bind-text value="[[ $current.data.label ]]"></oj-bind-text></oj-option>
                      </oj-bind-if>
                      <!-- group: a federated shell brings THREE levels (shell group →
                           pod group → its screens); JET's submenu is an oj-menu
                           nested inside the oj-option itself -->
                      <oj-bind-if test="[[ $current.data.hasChildren ]]">
                        <oj-option :value="[[ $current.data.id ]]"><oj-bind-text value="[[ $current.data.label ]]"></oj-bind-text>
                          <oj-menu>
                            <oj-bind-for-each data="[[ $current.data.children ]]">
                              <template>
                                <oj-option :value="[[ $current.data.id ]]"><oj-bind-text value="[[ $current.data.label ]]"></oj-bind-text></oj-option>
                              </template>
                            </oj-bind-for-each>
                          </oj-menu>
                        </oj-option>
                      </oj-bind-if>
                    </template>
                  </oj-bind-for-each>
                </oj-menu>
              </oj-menu-button>
            </oj-bind-if>
          </template>
        </oj-bind-for-each>
      </oj-bind-if>
    </div>
    <!-- @AppContext: an ICON opens the side drawer with the selectors (direct
         dropdowns did not fit the dark header) + the App's header actions -->
    <div slot="end" class="oj-flex oj-sm-flex-wrap-nowrap oj-sm-align-items-center">
      <oj-bind-if test="[[ $application.variables.mateuContextSelectors.length > 0 ]]">
        <!-- oj-color-invert: light iconography on the dark header (JET utility),
             the same white as the global-header's own home icon -->
        <oj-button chroming="borderless" display="icons" class="oj-color-invert oj-sm-margin-3x-end"
          on-oj-action="[[ $listeners.contextDrawerToggle ]]">
          <span slot="startIcon" class="oj-ux-ico-settings"></span>
          <oj-bind-text value="[[ $application.translations.appBundle.context ]]"></oj-bind-text>
        </oj-button>
      </oj-bind-if>
      <oj-bind-for-each data="[[ $application.variables.mateuHeaderActions ]]">
        <template>
          <oj-bind-if test="[[ !$current.data.hasChildren ]]">
            <oj-button class="oj-sm-margin-1x-start" chroming="borderless"
              :data-action-id="[[ $current.data.actionId ]]"
              on-oj-action="[[ $listeners.headerActionClicked ]]"><oj-bind-text value="[[ $current.data.label ]]"></oj-bind-text></oj-button>
          </oj-bind-if>
          <oj-bind-if test="[[ $current.data.hasChildren ]]">
            <oj-menu-button class="oj-sm-margin-1x-start" chroming="borderless">
              <oj-bind-text value="[[ $current.data.label ]]"></oj-bind-text>
              <oj-menu slot="menu" on-oj-menu-action="[[ $listeners.headerMenuAction ]]">
                <oj-bind-for-each data="[[ $current.data.children ]]">
                  <template>
                    <oj-option :value="[[ $current.data.actionId || $current.data.route ]]"><oj-bind-text value="[[ $current.data.label ]]"></oj-bind-text></oj-option>
                  </template>
                </oj-bind-for-each>
              </oj-menu>
            </oj-menu-button>
          </oj-bind-if>
        </template>
      </oj-bind-for-each>
      <!-- AGENT CHAT: a header button (not a FAB), right before the App's widgets
           (the inbox bell…), that opens and closes the chat's left drawer (below).
           Only if the app declares the chat. display=icons → the label ("Chat", fixed: oj-button does
           not repaint a bound text) is its accessible name and its tooltip; while the panel is
           open it stays marked (mateu-chat-open) and its button carries aria-expanded (toggleMateuChat). -->
      <oj-bind-if test="[[ !!$application.variables.mateuChatSseUrl ]]">
        <oj-button id="mateuChatToggle" chroming="borderless" display="icons"
          :class="[[ 'mateu-chat-toggle oj-color-invert oj-sm-margin-1x-start' + ($application.variables.mateuChatOpen ? ' mateu-chat-open' : '') ]]"
          aria-controls="mateuChatPanel"
          on-oj-action="[[ $listeners.chatToggle ]]">
          <span slot="startIcon" class="oj-ux-ico-chat"></span>
          <oj-bind-text value="[[ $application.translations.appBundle.chatOpen ]]"></oj-bind-text>
        </oj-button>
      </oj-bind-if>
      <!-- LIVE UI PUSH (AppDto.agentPush, poc/agentPush.mjs): "Connect AI" opens the pairing dialog
           (a one-time code the user gives their MCP agent). The bridge handles its ojAction by
           delegation; the dot after it (outside the bind-if, hidden by the bridge) says an agent is
           paired — its aria-label names the agents. display=icons: the label is the button's
           accessible name and tooltip. -->
      <span class="mateu-agent-connect oj-sm-margin-1x-start">
        <oj-bind-if test="[[ $application.variables.mateuAgentPush ]]">
          <oj-button id="mateuAgentConnect" chroming="borderless" display="icons" class="oj-color-invert"
            aria-haspopup="dialog" aria-controls="mateuAgentDialog">
            <span slot="startIcon" class="oj-ux-ico-link"></span>
            <oj-bind-text value="[[ $application.translations.appBundle.agentConnect ]]"></oj-bind-text>
          </oj-button>
        </oj-bind-if>
        <span id="mateuAgentIndicator" class="mateu-agent-dot" role="img" hidden></span>
      </span>
      <!-- OPEN ON MOBILE (@App(mobileQr)): opens the dialog with the QR of the mateu.io/add link
           (poc/qr.mjs) — the Mateu mobile app adds this UI by scanning it. display=icons: the label
           is the button's accessible name and tooltip. -->
      <oj-bind-if test="[[ $application.variables.mateuMobileQr ]]">
        <oj-button id="mateuMobileQrButton" chroming="borderless" display="icons" class="oj-color-invert oj-sm-margin-1x-start"
          aria-haspopup="dialog" aria-controls="mateuMobileQrDialog"
          on-oj-action="[[ $listeners.mobileQrOpen ]]">
          <span slot="startIcon" class="oj-ux-ico-qr-code"></span>
          <oj-bind-text value="[[ $application.translations.appBundle.mobileQrAction ]]"></oj-bind-text>
        </oj-button>
      </oj-bind-if>
      <!-- inbox BELL (the App's NotificationsSupplier): oj-button with the unread
           badge and an oj-popup with an oj-list-view; activating an entry marks it read and navigates -->
      <oj-bind-if test="[[ $application.variables.mateuNotifications.enabled ]]">
        <span class="mateu-bell oj-sm-margin-1x-start">
          <oj-button id="mateuBellButton" chroming="borderless" display="icons" class="oj-color-invert"
            :aria-label="[[ $application.variables.mateuNotifications.label ]]"
            on-oj-action="[[ $listeners.bellClicked ]]">
            <span slot="startIcon" class="oj-ux-ico-notification"></span>
            <oj-bind-text value="[[ $application.translations.appBundle.notifications ]]"></oj-bind-text>
          </oj-button>
          <oj-bind-if test="[[ $application.variables.mateuNotifications.hasUnread ]]">
            <span class="mateu-bell-badge oj-badge oj-badge-danger" aria-hidden="true"><oj-bind-text value="[[ $application.variables.mateuNotifications.badge ]]"></oj-bind-text></span>
          </oj-bind-if>
        </span>
        <oj-popup id="mateuBellPopup" class="mateu-widget-popup" position.my.horizontal="end" position.at.horizontal="end" auto-dismiss="focusLoss" modality="modeless">
          <div class="oj-sm-padding-3x mateu-bell-panel">
            <div class="oj-flex oj-sm-justify-content-space-between oj-sm-align-items-center oj-sm-margin-2x-bottom">
              <span class="oj-typography-subheading-xs"><oj-bind-text value="[[ $application.translations.appBundle.notifications ]]"></oj-bind-text></span>
              <oj-bind-if test="[[ $application.variables.mateuNotifications.hasUnread ]]">
                <oj-button chroming="borderless" on-oj-action="[[ $listeners.bellMarkAllRead ]]"><oj-bind-text value="[[ $application.translations.appBundle.markAllRead ]]"></oj-bind-text></oj-button>
              </oj-bind-if>
            </div>
            <oj-bind-if test="[[ $application.variables.mateuNotifications.empty ]]">
              <div class="oj-text-color-secondary oj-sm-padding-4x-vertical"><oj-bind-text value="[[ $application.translations.appBundle.allCaughtUp ]]"></oj-bind-text></div>
            </oj-bind-if>
            <oj-list-view id="mateuBellList" :aria-label="[[ $application.translations.appBundle.notifications ]]" class="mateu-bell-list"
              data="[[ $application.variables.mateuNotifications.provider ]]"
              selection-mode="single" on-oj-item-action="[[ $listeners.bellItemAction ]]">
              <template slot="itemTemplate" data-oj-as="item">
                <oj-list-item-layout>
                  <div :class="[[ item.data.titleClass ]]"><oj-bind-text value="[[ item.data.title ]]"></oj-bind-text></div>
                  <div slot="secondary" class="oj-typography-body-sm"><oj-bind-text value="[[ item.data.text ]]"></oj-bind-text></div>
                  <div slot="tertiary" class="oj-typography-body-xs oj-text-color-secondary"><oj-bind-text value="[[ item.data.when ]]"></oj-bind-text></div>
                </oj-list-item-layout>
              </template>
            </oj-list-view>
          </div>
        </oj-popup>
      </oj-bind-if>
      <!-- the App's header WIDGETS (WidgetSupplier): the ACTIONS area of the global header.
           A Text's HTML and the live HTML of a MicroFrontend (the inbox badge, which refreshes
           with its triggers) go into a slot the bridge fills — VB does not stamp raw HTML from
           a binding; any other Popover, button + oj-popup. oj-color-invert: light text and icons
           on the dark header, like the global-header's own home icon. -->
      <!-- LIVE HEADER VALUES (HeaderValuesSupplier / headerValues:): «Business date: 12 Oct». The bridge
           paints them (appExtras.mjs) and repaints on UpdateHeaderValue, another tab, or the app
           event stream of @App(liveUpdates) -->
      <span id="mateuHeaderValues" class="mateu-header-values oj-color-invert" hidden></span>
      <div class="mateu-header-widgets oj-color-invert oj-flex oj-sm-flex-wrap-nowrap oj-sm-align-items-center">
        <oj-bind-for-each data="[[ $application.variables.mateuHeaderWidgets ]]">
          <template>
            <oj-bind-if test="[[ !$current.data.isPopover ]]">
              <span class="mateu-header-widget oj-sm-margin-2x-start" :data-widget-id="[[ $current.data.id ]]"></span>
            </oj-bind-if>
            <oj-bind-if test="[[ $current.data.isPopover ]]">
              <oj-button class="oj-sm-margin-1x-start" chroming="borderless"
                :id="[[ $current.data.buttonId ]]"
                :data-popup-id="[[ $current.data.popupId ]]"
                on-oj-action="[[ $listeners.widgetPopoverClicked ]]"><oj-bind-text value="[[ $current.data.label ]]"></oj-bind-text></oj-button>
              <oj-popup class="mateu-widget-popup" :id="[[ $current.data.popupId ]]" position.my.horizontal="end" position.at.horizontal="end" auto-dismiss="focusLoss" modality="modeless">
                <div class="oj-sm-padding-4x oj-flex oj-sm-flex-direction-column" style="gap: .75rem; min-width: 12rem;">
                  <oj-bind-for-each data="[[ $current.data.rows ]]">
                    <template>
                      <oj-bind-if test="[[ $current.data.isText ]]">
                        <span class="oj-typography-body-md"><oj-bind-text value="[[ $current.data.text ]]"></oj-bind-text></span>
                      </oj-bind-if>
                      <oj-bind-if test="[[ $current.data.isLink ]]">
                        <a class="oj-link oj-typography-body-md" :href="[[ $current.data.href ]]" :target="[[ $current.data.target || null ]]"><oj-bind-text value="[[ $current.data.label ]]"></oj-bind-text></a>
                      </oj-bind-if>
                    </template>
                  </oj-bind-for-each>
                </div>
              </oj-popup>
            </oj-bind-if>
          </template>
        </oj-bind-for-each>
      </div>
    </div>
    <!-- PROFILE AREA (the global-header's usermenu slot, where FA puts the user's avatar): the
         App's Popover(Text) widget — the greeting — as an avatar with initials + name; when clicked,
         its content (email, Logout) in an anchored popup. On a narrow screen, only the avatar. -->
    <div slot="usermenu" class="oj-flex oj-sm-flex-wrap-nowrap oj-sm-align-items-center">
      <oj-bind-if test="[[ !!$application.variables.mateuUserWidget ]]">
        <oj-button id="mateuUserButton" class="mateu-user-button oj-color-invert oj-sm-margin-2x-start" chroming="borderless"
          :aria-label="[[ $application.variables.mateuUserWidget.label ]]"
          on-oj-action="[[ $listeners.userWidgetClicked ]]">
          <span class="oj-flex oj-sm-flex-wrap-nowrap oj-sm-align-items-center" style="gap: .5rem;">
            <oj-avatar size="2xs" background="neutral" :initials="[[ $application.variables.mateuUserWidget.initials ]]"></oj-avatar>
            <span class="mateu-user-label oj-sm-only-hide"><oj-bind-text value="[[ $application.variables.mateuUserWidget.label ]]"></oj-bind-text></span>
          </span>
        </oj-button>
        <oj-popup id="mateuUserPopup" class="mateu-widget-popup" position.my.horizontal="end" position.at.horizontal="end" auto-dismiss="focusLoss" modality="modeless">
          <div class="oj-sm-padding-4x oj-flex oj-sm-flex-direction-column" style="gap: .75rem; min-width: 12rem;">
            <oj-bind-for-each data="[[ $application.variables.mateuUserWidget.rows ]]">
              <template>
                <oj-bind-if test="[[ $current.data.isText ]]">
                  <span class="oj-typography-body-md"><oj-bind-text value="[[ $current.data.text ]]"></oj-bind-text></span>
                </oj-bind-if>
                <oj-bind-if test="[[ $current.data.isLink ]]">
                  <a class="oj-link oj-typography-body-md" :href="[[ $current.data.href ]]" :target="[[ $current.data.target || null ]]"><oj-bind-text value="[[ $current.data.label ]]"></oj-bind-text></a>
                </oj-bind-if>
              </template>
            </oj-bind-for-each>
          </div>
        </oj-popup>
      </oj-bind-if>
    </div>
  </oj-sp-global-header>

  <div slot="stretchingContents" id="pageContent" class="oj-web-applayout-page">

    <!-- SUBHEADER (MENU_ON_TOP): band 2 under the dark header, like the web renderer's —
         the header (band 1) keeps the logo, the chat, the inbox and the user; here go the
         console's title and its top-level options, in text color, with the section on
         screen marked by a discreet underline. Groups open an oj-menu (with the third
         level of a federated shell nested). A remote section that did not answer comes out disabled
         and says why (hint). No brand accent: the band uses Redwood's neutral tokens.
         It sits outside the chat drawer: it does not move with it. -->
    <oj-bind-if test="[[ $application.variables.mateuMenuSubheader ]]">
      <!-- with no content (HAMBURGER_SECTIONS on the home: no section on screen) the band
           COLLAPSES —no empty white strip is left—, and appears/disappears with a transition
           (app.css, without it under prefers-reduced-motion) -->
      <nav :class="[[ $functions.subheaderClassOf($application.variables.mateuShellTitle, $application.variables.mateuMenuTree, $application.variables.mateuSelectedNavId, $application.variables.mateuMenuSections) ]]"
        :aria-hidden="[[ $functions.subheaderClassOf($application.variables.mateuShellTitle, $application.variables.mateuMenuTree, $application.variables.mateuSelectedNavId, $application.variables.mateuMenuSections) === 'mateu-subheader' ? null : 'true' ]]"
        :aria-label="[[ $functions.subheaderTitleOf($application.variables.mateuShellTitle, $application.variables.mateuMenuTree, $application.variables.mateuSelectedNavId, $application.variables.mateuMenuSections) || 'Menu' ]]">
        <oj-bind-if test="[[ !!$functions.subheaderTitleOf($application.variables.mateuShellTitle, $application.variables.mateuMenuTree, $application.variables.mateuSelectedNavId, $application.variables.mateuMenuSections) ]]">
          <button type="button" class="mateu-subheader-title"
            on-click="[[ $listeners.subheaderTitleClicked ]]"><oj-bind-text value="[[ $functions.subheaderTitleOf($application.variables.mateuShellTitle, $application.variables.mateuMenuTree, $application.variables.mateuSelectedNavId, $application.variables.mateuMenuSections) ]]"></oj-bind-text></button>
        </oj-bind-if>
        <div class="mateu-subheader-menu">
          <oj-bind-for-each data="[[ $functions.subheaderItemsOf($application.variables.mateuMenuTree, $application.variables.mateuSelectedNavId, $application.variables.mateuMenuSections) ]]">
            <template>
              <oj-bind-if test="[[ !$current.data.hasChildren ]]">
                <oj-button chroming="borderless" data-nav-item
                  :class="[[ $functions.subheaderItemClass($current.data, $functions.subheaderItemsOf($application.variables.mateuMenuTree, $application.variables.mateuSelectedNavId, $application.variables.mateuMenuSections), $application.variables.mateuSelectedNavId) ]]"
                  :data-route="[[ $current.data.id ]]"
                  :disabled="[[ !!$current.data.disabled ]]"
                  :title="[[ $current.data.hint || '' ]]"
                  on-oj-action="[[ $listeners.topbarNavClicked ]]"><oj-bind-text value="[[ $current.data.label ]]"></oj-bind-text></oj-button>
              </oj-bind-if>
              <!-- group as CARDS (@Menu(display = cards)): button + oj-popup with oj-action-card -->
              <oj-bind-if test="[[ $current.data.isCards ]]">
                <oj-button chroming="borderless" data-nav-item
                  :id="[[ $current.data.anchorId ]]"
                  :class="[[ $functions.subheaderItemClass($current.data, $functions.subheaderItemsOf($application.variables.mateuMenuTree, $application.variables.mateuSelectedNavId, $application.variables.mateuMenuSections), $application.variables.mateuSelectedNavId) ]]"
                  :data-popup-id="[[ $current.data.popupId ]]"
                  on-oj-action="[[ $listeners.cardMenuToggle ]]">
                  <oj-bind-text value="[[ $current.data.label ]]"></oj-bind-text>
                  <span slot="endIcon" class="oj-ux-ico-chevron-down"></span>
                </oj-button>
                <oj-popup :id="[[ $current.data.popupId ]]" class="mateu-card-popup" auto-dismiss="focusLoss" modality="modeless"
                  position.my.horizontal="start" position.at.horizontal="start" position.at.vertical="bottom">
                  <div class="mateu-card-grid" role="menu" :aria-label="[[ $current.data.label ]]">
                    <oj-bind-for-each data="[[ $current.data.cards ]]">
                      <template>
                        <oj-bind-if test="[[ $current.data.navigable ]]">
                          <oj-action-card class="mateu-menu-card" :data-route="[[ $current.data.id ]]"
                            on-oj-action="[[ $listeners.topbarNavClicked ]]">
                            <div class="mateu-menu-card-body">
                              <oj-bind-if test="[[ $current.data.hasImage ]]"><img class="mateu-menu-card-image" :src="[[ $current.data.image ]]" alt="" /></oj-bind-if>
                              <oj-bind-if test="[[ $current.data.hasIcon ]]"><span class="mateu-menu-card-icon" :class="[[ $current.data.iconClass ]]"></span></oj-bind-if>
                              <div>
                                <div class="oj-typography-body-md oj-typography-bold"><oj-bind-text value="[[ $current.data.label ]]"></oj-bind-text></div>
                                <div class="oj-typography-body-sm oj-text-color-secondary"><oj-bind-text value="[[ $current.data.description ]]"></oj-bind-text></div>
                              </div>
                            </div>
                          </oj-action-card>
                        </oj-bind-if>
                        <oj-bind-if test="[[ !$current.data.navigable ]]">
                          <div class="oj-panel mateu-menu-card mateu-menu-card-group">
                            <div class="mateu-menu-card-body">
                              <oj-bind-if test="[[ $current.data.hasImage ]]"><img class="mateu-menu-card-image" :src="[[ $current.data.image ]]" alt="" /></oj-bind-if>
                              <oj-bind-if test="[[ $current.data.hasIcon ]]"><span class="mateu-menu-card-icon" :class="[[ $current.data.iconClass ]]"></span></oj-bind-if>
                              <div>
                                <div class="oj-typography-body-md oj-typography-bold"><oj-bind-text value="[[ $current.data.label ]]"></oj-bind-text></div>
                                <div class="oj-typography-body-sm oj-text-color-secondary"><oj-bind-text value="[[ $current.data.description ]]"></oj-bind-text></div>
                                <div class="mateu-menu-card-actions">
                                  <oj-bind-for-each data="[[ $current.data.actions ]]">
                                    <template>
                                      <oj-button chroming="borderless" class="oj-button-sm" :data-route="[[ $current.data.id ]]"
                                        on-oj-action="[[ $listeners.topbarNavClicked ]]"><oj-bind-text value="[[ $current.data.label ]]"></oj-bind-text></oj-button>
                                    </template>
                                  </oj-bind-for-each>
                                </div>
                              </div>
                            </div>
                          </div>
                        </oj-bind-if>
                      </template>
                    </oj-bind-for-each>
                  </div>
                </oj-popup>
              </oj-bind-if>
              <oj-bind-if test="[[ $current.data.hasChildren && !$current.data.isCards ]]">
                <oj-menu-button chroming="borderless" data-nav-item
                  :class="[[ $functions.subheaderItemClass($current.data, $functions.subheaderItemsOf($application.variables.mateuMenuTree, $application.variables.mateuSelectedNavId, $application.variables.mateuMenuSections), $application.variables.mateuSelectedNavId) ]]"
                  :disabled="[[ !!$current.data.disabled ]]"
                  :title="[[ $current.data.hint || '' ]]">
                  <oj-bind-text value="[[ $current.data.label ]]"></oj-bind-text>
                  <oj-menu slot="menu" on-oj-menu-action="[[ $listeners.menuNavAction ]]">
                    <oj-bind-for-each data="[[ $current.data.children ]]">
                      <template>
                        <oj-bind-if test="[[ !$current.data.hasChildren ]]">
                          <oj-option :value="[[ $current.data.id ]]" :disabled="[[ !!$current.data.disabled ]]" :title="[[ $current.data.hint || '' ]]"><oj-bind-text value="[[ $current.data.label ]]"></oj-bind-text></oj-option>
                        </oj-bind-if>
                        <oj-bind-if test="[[ $current.data.hasChildren ]]">
                          <oj-option :value="[[ $current.data.id ]]" :disabled="[[ !!$current.data.disabled ]]" :title="[[ $current.data.hint || '' ]]"><oj-bind-text value="[[ $current.data.label ]]"></oj-bind-text>
                            <oj-menu>
                              <oj-bind-for-each data="[[ $current.data.children ]]">
                                <template>
                                  <oj-option :value="[[ $current.data.id ]]" :disabled="[[ !!$current.data.disabled ]]" :title="[[ $current.data.hint || '' ]]"><oj-bind-text value="[[ $current.data.label ]]"></oj-bind-text></oj-option>
                                </template>
                              </oj-bind-for-each>
                            </oj-menu>
                          </oj-option>
                        </oj-bind-if>
                      </template>
                    </oj-bind-for-each>
                  </oj-menu>
                </oj-menu-button>
              </oj-bind-if>
            </template>
          </oj-bind-for-each>
        </div>
      </nav>
    </oj-bind-if>

    <!-- HAMBURGER_SECTIONS: the sections menu is ANOTHER LEVEL, floating above the
         subheader and the content (it does not push them): a panel on the left under the global
         header —the hamburger, now ✕, stays visible to close it— with a scrim behind. It
         closes with the ✕, with Esc, with a click outside (the scrim) or on choosing a section. The id of
         each section is its home —choosing it navigates there, as in Opera— and the one
         on screen is marked. It slides in (no animation with prefers-reduced-motion). -->
    <oj-bind-if test="[[ $application.variables.mateuMenuSections ]]">
      <div :class="[[ $application.variables.mateuNavDrawerOpen ? 'mateu-sections-scrim mateu-open' : 'mateu-sections-scrim' ]]"
        aria-hidden="true" on-click="[[ $listeners.sectionsScrimClicked ]]"></div>
      <div id="mateuSectionsOverlay" role="dialog" :aria-label="[[ $application.translations.appBundle.sections ]]"
        :aria-hidden="[[ $application.variables.mateuNavDrawerOpen ? 'false' : 'true' ]]"
        :class="[[ $application.variables.mateuNavDrawerOpen ? 'mateu-sections-overlay mateu-open' : 'mateu-sections-overlay' ]]">
        <oj-navigation-list id="mateuSectionList" drill-mode="none" :aria-label="[[ $application.translations.appBundle.sections ]]"
          selection="[[ $functions.sectionListSelection($application.variables.mateuMenuTree, $application.variables.mateuSelectedNavId) ]]"
          on-selection-changed="[[ $listeners.navDrawerSelected ]]">
          <ul>
            <oj-bind-for-each data="[[ $application.variables.mateuSectionList ]]">
              <template>
                <li :id="[[ $current.data.id ]]" :class="[[ $current.data.disabled ? 'oj-disabled' : '' ]]" :title="[[ $current.data.hint || '' ]]"><a href="#"><oj-bind-text value="[[ $current.data.label ]]"></oj-bind-text></a></li>
              </template>
            </oj-bind-for-each>
          </ul>
        </oj-navigation-list>
      </div>
    </oj-bind-if>

    <!-- ASK ORACLE: the shell's own FAB (with the Ask Oracle glyph, oj-ux-ico-oracle-o, or the
         brand of @App(askLabel, askIcon): bridge.brandAskFab) opens this palette —
         a search box that filters the navigation and the listing's quick views; each row navigates and
         closes. The agent chat does NOT live here: it has its button in the header and its drawer (below). -->
    <!-- «Keyboard shortcuts» (the ? key, @AppShortcut): the app's shortcuts (picking one runs it), the
         screen's own and the shell's; the body is filled by the bridge (appExtras.mjs) -->
    <oj-dialog id="mateuShortcutsHelp" cancel-behavior="icon" drag-affordance="none"
      dialog-title="[[ $application.translations.appBundle.keyboardShortcuts ]]">
      <div slot="body" id="mateuShortcutsHelpBody" class="mateu-sc-body"></div>
    </oj-dialog>

    <!-- IDLE-SESSION WARNING (@App(idleTimeoutMinutes)): an alert dialog with the countdown; Stay runs
         the keep-alive action, Sign out (or zero) goes to the sign-out url — appExtras.mjs drives it;
         Escape counts as Stay -->
    <oj-dialog id="mateuIdleWarning" role="alertdialog" cancel-behavior="none" drag-affordance="none"
      aria-describedby="mateuIdleMessage"
      dialog-title="[[ $application.translations.appBundle.idleTitle ]]">
      <div slot="body"><p id="mateuIdleMessage" class="oj-typography-body-md"></p></div>
      <div slot="footer">
        <oj-button id="mateuIdleSignOut" chroming="outlined"><oj-bind-text value="[[ $application.translations.appBundle.idleSignOut ]]"></oj-bind-text></oj-button>
        <oj-button id="mateuIdleStay" chroming="callToAction"><oj-bind-text value="[[ $application.translations.appBundle.idleStay ]]"></oj-bind-text></oj-button>
      </div>
    </oj-dialog>

    <oj-dialog id="mateuAskOracle" cancel-behavior="icon" drag-affordance="none"
      dialog-title="[[ $application.variables.mateuAskLabel ]]">
      <div slot="body" style="width: 560px; max-width: 90vw; min-height: 320px;">

        <!-- SEARCH: Ask Oracle is only the destination finder (the agent chat has its
             own button in the header and its drawer, see below) -->
        <div>
          <oj-input-search id="mateuAskInput" class="oj-form-control-full-width"
            placeholder="[[ $application.translations.appBundle.searchOrGo ]]"
            on-raw-value-changed="[[ $listeners.askOracleTyped ]]"></oj-input-search>
          <div class="oj-sm-margin-4x-top">
            <oj-bind-for-each data="[[ $variables.mateuAskResults ]]">
              <template>
                <oj-action-card class="oj-sm-margin-1x-bottom" style="width: 100%; display: block;"
                  on-oj-action="[[ $listeners.askOracleGo ]]">
                  <div class="oj-flex oj-sm-align-items-center oj-sm-padding-3x">
                    <span class="oj-sm-margin-3x-end oj-ux-icon-size-5x" :class="[[ $current.data.icon ]]"></span>
                    <span class="oj-typography-body-md oj-flex-item"><oj-bind-text value="[[ $current.data.label ]]"></oj-bind-text></span>
                    <span class="oj-typography-body-xs oj-text-color-secondary"><oj-bind-text value="[[ $current.data.kind ]]"></oj-bind-text></span>
                  </div>
                </oj-action-card>
              </template>
            </oj-bind-for-each>
          </div>
        </div>

      </div>
    </oj-dialog>

    <!-- LIVE UI PUSH: the pairing dialog. The bridge (poc/agentPush.mjs) paints #mateuAgentBody —
         the instruction, the code (spelled out for screen readers) and its countdown, or the paired
         agents — and shows/hides the two buttons; oj-dialog moves focus in, keeps it, gives it back
         and closes on Esc. -->
    <oj-dialog id="mateuAgentDialog" cancel-behavior="icon" drag-affordance="none" style="width: 26rem; max-width: 92vw;"
      aria-describedby="mateuAgentBody"
      dialog-title="[[ $application.translations.appBundle.agentDialogTitle ]]">
      <div slot="body" style="width: 100%;"><div id="mateuAgentBody" class="mateu-agent-body"></div></div>
      <div slot="footer">
        <oj-button id="mateuAgentDisconnect" chroming="outlined" hidden><oj-bind-text value="[[ $application.translations.appBundle.agentDisconnect ]]"></oj-bind-text></oj-button>
        <oj-button id="mateuAgentNewCode" chroming="callToAction" hidden><oj-bind-text value="[[ $application.translations.appBundle.agentNewCode ]]"></oj-bind-text></oj-button>
      </div>
    </oj-dialog>

    <!-- OPEN ON MOBILE (@App(mobileQr)): the QR of https://mateu.io/add?u=<this UI>&r=<this screen>,
         the link as copyable text and a hint; on a phone (or a touch-first device) the link itself
         instead of the QR. oj-dialog moves focus in, keeps it there, gives it back and closes on Esc.
         The QR carries NO secret: only where the UI lives (design/mobile-app-hub.md). -->
    <oj-dialog id="mateuMobileQrDialog" cancel-behavior="icon" drag-affordance="none" style="width: 26rem; max-width: 92vw;"
      dialog-title="[[ $application.translations.appBundle.mobileQrTitle ]]">
      <div slot="body" class="mateu-mobile-qr" style="width: 100%;">
        <oj-bind-if test="[[ !$variables.mateuMobileQrModel.phone ]]">
          <div class="oj-flex oj-sm-justify-content-center">
            <img id="mateuMobileQrImage" :src="[[ $variables.mateuMobileQrModel.img ]]" :alt="[[ $variables.mateuMobileQrModel.alt ]]"
              width="240" height="240" style="width: 240px; height: 240px; background: #fff; border-radius: 4px;">
          </div>
          <p class="oj-typography-body-sm oj-sm-margin-4x-top"><oj-bind-text value="[[ $application.translations.appBundle.mobileQrHint ]]"></oj-bind-text></p>
        </oj-bind-if>
        <oj-bind-if test="[[ $variables.mateuMobileQrModel.phone ]]">
          <p class="oj-typography-body-sm"><oj-bind-text value="[[ $application.translations.appBundle.mobileQrPhoneHint ]]"></oj-bind-text></p>
          <a id="mateuMobileQrOpenInApp" class="oj-button-sm" :href="[[ $variables.mateuMobileQrModel.url ]]"
            style="display: inline-block; font-weight: 600;"><oj-bind-text value="[[ $application.translations.appBundle.mobileQrOpenInApp ]]"></oj-bind-text></a>
        </oj-bind-if>
        <div class="oj-flex oj-sm-align-items-center oj-sm-margin-3x-top" style="gap: .5rem;">
          <label for="mateuMobileQrUrl" class="oj-typography-body-xs oj-text-color-secondary"><oj-bind-text value="[[ $application.translations.appBundle.mobileQrLink ]]"></oj-bind-text></label>
          <input id="mateuMobileQrUrl" type="text" readonly class="oj-flex-item" :value="[[ $variables.mateuMobileQrModel.url ]]"
            style="min-width: 0; font: inherit; font-size: .75rem; padding: .25rem .4rem; border: 1px solid var(--oj-core-divider-color, #ccc); border-radius: 4px; background: transparent; color: inherit;">
          <oj-button id="mateuMobileQrCopy" chroming="outlined" on-oj-action="[[ $listeners.mobileQrCopy ]]">
            <oj-bind-text value="[[ $application.translations.appBundle.mobileQrCopy ]]"></oj-bind-text>
          </oj-button>
        </div>
      </div>
    </oj-dialog>

    <!-- CONTEXT drawer (@AppContext): the selectors in a standard side panel -->
    <oj-drawer-popup edge="end" opened="{{ $variables.mateuContextDrawerOpen }}">
      <div class="oj-sm-padding-6x" style="width: 320px;">
        <h2 class="oj-typography-heading-xs oj-sm-margin-4x-bottom"><oj-bind-text value="[[ $application.translations.appBundle.workContext ]]"></oj-bind-text></h2>
        <oj-bind-for-each data="[[ $application.variables.mateuContextSelectors ]]">
          <template>
            <div class="oj-sm-margin-4x-bottom">
              <oj-select-one class="oj-form-control-full-width"
                :data-field="[[ $current.data.fieldName ]]"
                label-hint="[[ $current.data.label ]]"
                value="[[ $current.data.value ]]"
                on-value-changed="[[ $listeners.contextChanged ]]">
                <oj-bind-for-each data="[[ $current.data.options ]]">
                  <template>
                    <oj-option :value="[[ $current.data.value ]]"><oj-bind-text value="[[ $current.data.label ]]"></oj-bind-text></oj-option>
                  </template>
                </oj-bind-for-each>
              </oj-select-one>
            </div>
          </template>
        </oj-bind-for-each>
      </div>
    </oj-drawer-popup>

    <!-- AGENT CHAT: its button in the global header's actions (see above, before
         the widgets) opens a drawer on the LEFT. JET pattern: oj-drawer-layout with a START drawer, which on a
         wide screen is REFLOW (the content narrows and shifts to the right, nothing
         is covered) and on a narrow one OVERLAY (start-display "auto", JET's breakpoint) — there the
         panel takes the full width. It goes INSIDE stretchingContents: the global header stays
         outside the layout and does not move, and the tab bar is a fixed overlay stamped by
         its component (it does not move either; the panel reserves its height). oj-drawer-popup does not
         work: it is always overlay and would cover the content the user is asking about. -->
    <oj-drawer-layout id="mateuChatDrawer" style="flex: 1 1 auto; min-width: 0"
      start-opened="[[ $application.variables.mateuChatOpen ]]"
      on-oj-before-close="[[ $listeners.chatClose ]]">
      <div slot="start" id="mateuChatPanel" role="complementary" :aria-label="[[ $application.translations.appBundle.chatPanel ]]"
        :class="[[ 'mateu-chat-panel' + ($application.variables.mateuMenuTabs ? ' mateu-over-tabs' : '') + ($application.variables.mateuChatExpanded ? ' mateu-chat-wide' : '') ]]">
        <oj-bind-if test="[[ $application.variables.mateuChatOpen ]]">
          <div class="oj-flex oj-sm-align-items-center oj-sm-flex-wrap-nowrap oj-sm-padding-4x-start oj-sm-padding-2x-end oj-sm-padding-2x-vertical mateu-chat-panel-header">
            <span class="oj-ux-ico-chat oj-ux-icon-size-5x oj-sm-margin-2x-end" aria-hidden="true"></span>
            <h2 class="oj-typography-heading-xs oj-flex-item oj-sm-margin-0"><oj-bind-text value="[[ $application.variables.mateuChatTitle || $application.translations.appBundle.chatTitle ]]"></oj-bind-text></h2>
            <!-- wide mode (60vw), like the web chat's: one button per state (the text of an
                 oj-button does not follow a binding) -->
            <oj-bind-if test="[[ !$application.variables.mateuChatExpanded ]]">
              <oj-button id="mateuChatExpand" chroming="borderless" display="icons" on-oj-action="[[ $listeners.chatExpand ]]">
                <span slot="startIcon" class="oj-ux-ico-expand"></span>
                <oj-bind-text value="[[ $application.translations.appBundle.chatExpand ]]"></oj-bind-text>
              </oj-button>
            </oj-bind-if>
            <oj-bind-if test="[[ $application.variables.mateuChatExpanded ]]">
              <oj-button id="mateuChatRestore" chroming="borderless" display="icons" on-oj-action="[[ $listeners.chatExpand ]]">
                <span slot="startIcon" class="oj-ux-ico-collapse"></span>
                <oj-bind-text value="[[ $application.translations.appBundle.chatRestore ]]"></oj-bind-text>
              </oj-button>
            </oj-bind-if>
            <oj-button chroming="borderless" display="icons" on-oj-action="[[ $listeners.chatClose ]]">
              <span slot="startIcon" class="oj-ux-ico-close"></span>
              <oj-bind-text value="[[ $application.translations.appBundle.chatClose ]]"></oj-bind-text>
            </oj-button>
          </div>
          <div class="mateu-chat-messages oj-sm-padding-4x-horizontal oj-sm-padding-3x-vertical"
            aria-live="polite">
            <oj-bind-if test="[[ ($application.variables.mateuChatMessages || []).length === 0 ]]">
              <p class="oj-typography-body-sm oj-text-color-secondary"><oj-bind-text value="[[ $application.translations.appBundle.chatEmpty ]]"></oj-bind-text></p>
            </oj-bind-if>
            <oj-bind-for-each data="[[ $application.variables.mateuChatMessages ]]">
              <template>
                <!-- the assistant's still-empty reply is not painted: what is going on is told by the
                     status row below -->
                <oj-bind-if test="[[ $current.data.role === 'user' || !!$current.data.text ]]">
                  <div class="oj-flex oj-sm-margin-3x-bottom"
                    :class="[[ $current.data.role === 'user' ? 'oj-sm-justify-content-flex-end' : 'oj-sm-justify-content-flex-start' ]]">
                    <div class="oj-sm-padding-3x oj-typography-body-md mateu-chat-bubble"
                      :class="[[ $current.data.role === 'user' ? 'oj-bg-brand-10 mateu-chat-bubble' : 'oj-bg-neutral-20 mateu-chat-bubble' ]]">
                      <!-- what the person writes, as is; what the assistant answers is markdown:
                           it is painted formatted (lists, bold, tables, code), with the HTML escaped -->
                      <oj-bind-if test="[[ $current.data.role === 'user' ]]">
                        <span class="mateu-chat-user-text"><oj-bind-text value="[[ $current.data.text ]]"></oj-bind-text></span>
                      </oj-bind-if>
                      <oj-bind-if test="[[ $current.data.role !== 'user' ]]">
                        <div class="mateu-chat-markdown">
                          <oj-bind-dom config="[[ $functions.chatMessageDom($current.data.text) ]]"></oj-bind-dom>
                        </div>
                      </oj-bind-if>
                    </div>
                  </div>
                </oj-bind-if>
              </template>
            </oj-bind-for-each>
            <!-- the assistant is working: «Thinking… N s» until the first text, «Answering…» after -->
            <oj-bind-if test="[[ !!$application.variables.mateuChatStatus ]]">
              <div id="mateuChatStatus" class="oj-flex oj-sm-align-items-center oj-sm-flex-wrap-nowrap oj-sm-margin-3x-bottom"
                role="status">
                <oj-progress-circle size="sm" value="-1" aria-hidden="true"></oj-progress-circle>
                <span class="oj-typography-body-sm oj-text-color-secondary oj-sm-margin-2x-start">
                  <oj-bind-text value="[[ $application.variables.mateuChatStatus ]]"></oj-bind-text>
                </span>
              </div>
            </oj-bind-if>
            <!-- the tools of the current turn: done (✓ and its time), failed (✕ and the error)
                 or running (…), like the web chat -->
            <oj-bind-if test="[[ ($application.variables.mateuChatSteps || []).length > 0 ]]">
              <ul id="mateuChatSteps" class="mateu-chat-steps" :aria-label="[[ $application.translations.appBundle.chatToolsUsed ]]">
                <oj-bind-for-each data="[[ $application.variables.mateuChatSteps ]]">
                  <template>
                    <li :class="[[ $current.data.cls ]]" :title="[[ $current.data.title ]]">
                      <span class="mateu-chat-step-icon" aria-hidden="true"><oj-bind-text value="[[ $current.data.icon ]]"></oj-bind-text></span>
                      <span class="mateu-chat-step-name"><oj-bind-text value="[[ $current.data.name ]]"></oj-bind-text></span>
                      <span class="mateu-chat-step-time"><oj-bind-text value="[[ $current.data.time ]]"></oj-bind-text></span>
                      <span class="mateu-chat-step-error"><oj-bind-text value="[[ $current.data.error ]]"></oj-bind-text></span>
                    </li>
                  </template>
                </oj-bind-for-each>
              </ul>
            </oj-bind-if>
          </div>
          <!-- the conversation's tokens, summed reply by reply -->
          <oj-bind-if test="[[ !!$application.variables.mateuChatTokens ]]">
            <div id="mateuChatTokens" class="oj-flex oj-sm-align-items-center oj-sm-flex-wrap oj-sm-padding-4x-horizontal oj-sm-padding-2x-top">
              <span class="oj-typography-body-xs oj-text-color-secondary oj-sm-margin-2x-end"><oj-bind-text value="[[ $application.translations.appBundle.chatTokens ]]"></oj-bind-text></span>
              <oj-bind-if test="[[ $application.variables.mateuChatTokens.inputTokens != null ]]">
                <span class="oj-badge oj-badge-subtle oj-sm-margin-1x-end"><oj-bind-text value="[[ $application.translations.appBundle.chatTokensIn ]]"></oj-bind-text> <oj-bind-text value="[[ $application.variables.mateuChatTokens.inputTokens ]]"></oj-bind-text></span>
              </oj-bind-if>
              <oj-bind-if test="[[ $application.variables.mateuChatTokens.outputTokens != null ]]">
                <span class="oj-badge oj-badge-subtle oj-sm-margin-1x-end"><oj-bind-text value="[[ $application.translations.appBundle.chatTokensOut ]]"></oj-bind-text> <oj-bind-text value="[[ $application.variables.mateuChatTokens.outputTokens ]]"></oj-bind-text></span>
              </oj-bind-if>
              <oj-bind-if test="[[ $application.variables.mateuChatTokens.totalTokens != null ]]">
                <span class="oj-badge oj-badge-info oj-badge-subtle"><oj-bind-text value="[[ $application.translations.appBundle.chatTokensTotal ]]"></oj-bind-text> <oj-bind-text value="[[ $application.variables.mateuChatTokens.totalTokens ]]"></oj-bind-text></span>
              </oj-bind-if>
            </div>
          </oj-bind-if>
          <!-- the attachments of the NEXT message (@AI(upload)): one chip per file, with its ✕ -->
          <oj-bind-if test="[[ ($application.variables.mateuChatAttachments || []).length > 0 ]]">
            <div id="mateuChatAttachments" class="oj-flex oj-sm-flex-wrap oj-sm-padding-4x-horizontal oj-sm-padding-2x-top mateu-chat-attachments">
              <oj-bind-for-each data="[[ $application.variables.mateuChatAttachments ]]">
                <template>
                  <span class="oj-badge oj-badge-subtle oj-sm-margin-1x-end oj-sm-margin-1x-bottom mateu-chat-attachment" :title="[[ $current.data.path ]]">
                    📎 <oj-bind-text value="[[ $current.data.name ]]"></oj-bind-text>
                    <oj-button chroming="borderless" display="icons" class="mateu-chat-attachment-remove"
                      on-oj-action="[[ $listeners.chatRemoveAttachment ]]">
                      <span slot="startIcon" class="oj-ux-ico-close"></span>
                      <oj-bind-text value="[[ $current.data.removeLabel ]]"></oj-bind-text>
                    </oj-button>
                  </span>
                </template>
              </oj-bind-for-each>
            </div>
          </oj-bind-if>
          <div class="oj-flex oj-sm-align-items-center oj-sm-flex-wrap-nowrap oj-sm-padding-4x-horizontal oj-sm-padding-3x-vertical mateu-chat-composer">
            <!-- attach: only with @AI(upload) -->
            <oj-bind-if test="[[ !!$application.variables.mateuChatUploadUrl ]]">
              <oj-button id="mateuChatAttach" display="icons" class="oj-sm-margin-2x-end" chroming="borderless"
                :disabled="[[ $application.variables.mateuChatBusy || $application.variables.mateuChatUploading ]]"
                on-oj-action="[[ $listeners.chatAttach ]]">
                <span slot="startIcon" class="oj-ux-ico-attachment"></span>
                <oj-bind-text value="[[ $application.translations.appBundle.chatAttach ]]"></oj-bind-text>
              </oj-button>
            </oj-bind-if>
            <!-- dictate: only where the browser recognises speech; what is dictated is sent.
                 Ctrl+Shift+M presses it with the panel open (shell-page.js). One button per state: the
                 text of an oj-button (its tooltip and its accessible name) does not follow an oj-bind-text -->
            <oj-bind-if test="[[ $application.variables.mateuChatMicAvailable ]]">
              <oj-bind-if test="[[ !$application.variables.mateuChatListening ]]">
                <oj-button id="mateuChatMic" display="icons" class="oj-sm-margin-2x-end" chroming="borderless"
                  aria-keyshortcuts="Control+Shift+M"
                  :disabled="[[ $application.variables.mateuChatBusy ]]"
                  on-oj-action="[[ $listeners.chatMic ]]">
                  <span slot="startIcon" class="oj-ux-ico-mic-on"></span>
                  <oj-bind-text value="[[ $application.translations.appBundle.chatDictate ]]"></oj-bind-text>
                </oj-button>
              </oj-bind-if>
              <oj-bind-if test="[[ $application.variables.mateuChatListening ]]">
                <oj-button id="mateuChatMic" display="icons" class="oj-sm-margin-2x-end" chroming="callToAction"
                  aria-keyshortcuts="Control+Shift+M"
                  :disabled="[[ $application.variables.mateuChatBusy ]]"
                  on-oj-action="[[ $listeners.chatMic ]]">
                  <span slot="startIcon" class="oj-ux-ico-mic-on"></span>
                  <oj-bind-text value="[[ $application.translations.appBundle.chatStopDictation ]]"></oj-bind-text>
                </oj-button>
              </oj-bind-if>
            </oj-bind-if>
            <oj-input-text id="mateuChatInput" class="oj-flex-item oj-sm-margin-2x-end" placeholder="[[ $application.translations.appBundle.chatPlaceholder ]]"
              label-hint="[[ $application.translations.appBundle.chatInputLabel ]]" label-edge="none"
              value="{{ $application.variables.mateuChatInput }}"></oj-input-text>
            <oj-button id="mateuChatSend" chroming="callToAction" on-oj-action="[[ $listeners.chatSend ]]"
              :disabled="[[ $application.variables.mateuChatBusy ]]"><oj-bind-text value="[[ $application.translations.appBundle.chatSend ]]"></oj-bind-text></oj-button>
          </div>
        </oj-bind-if>
      </div>

    <!-- PERSISTENT navigator (HAMBURGUER_MENU): oj-drawer-layout (reflow) BELOW the
         header — open from the start, it is NOT hidden on navigation; the hamburger collapses it
         and the content shifts -->
    <oj-drawer-layout style="flex: 1 1 auto" id="mateuNavDrawer"
      start-opened="[[ $application.variables.mateuNavDrawerOpen && !$application.variables.mateuMenuSections ]]"
      on-oj-before-close="[[ $listeners.navDrawerClosed ]]">

      <!-- 280px = standard width of the navigation drawer (JET/RDS cookbook pattern);
           oj-drawer-layout sizes the panel by its content, it exposes no variable -->
      <div slot="start" class="oj-sm-padding-4x-vertical" style="width:280px">
        <oj-bind-if test="[[ !$application.variables.mateuMenuSections ]]">
                <oj-navigation-list id="mateuNavList" drill-mode="collapsible"
          selection="[[ $application.variables.mateuSelectedNavId ]]"
          on-selection-changed="[[ $listeners.navDrawerSelected ]]">
          <ul>
            <oj-bind-for-each data="[[ $application.variables.mateuMenuTree ]]">
              <template>
                <oj-bind-if test="[[ !$current.data.hasChildren ]]">
                  <li :id="[[ $current.data.id ]]" :class="[[ $current.data.disabled ? 'oj-disabled' : '' ]]" :title="[[ $current.data.hint || '' ]]"><a href="#"><oj-bind-text value="[[ $current.data.label ]]"></oj-bind-text></a></li>
                </oj-bind-if>
                <oj-bind-if test="[[ $current.data.hasChildren ]]">
                  <li :id="[[ $current.data.id ]]"><a href="#"><oj-bind-text value="[[ $current.data.label ]]"></oj-bind-text></a>
                    <ul>
                      <oj-bind-for-each data="[[ $current.data.children ]]">
                        <template>
                          <oj-bind-if test="[[ !$current.data.hasChildren ]]">
                            <li :id="[[ $current.data.id ]]" :class="[[ $current.data.disabled ? 'oj-disabled' : '' ]]" :title="[[ $current.data.hint || '' ]]"><a href="#"><oj-bind-text value="[[ $current.data.label ]]"></oj-bind-text></a></li>
                          </oj-bind-if>
                          <!-- third level (federated shell): the pod's group with its screens -->
                          <oj-bind-if test="[[ $current.data.hasChildren ]]">
                            <li :id="[[ $current.data.id ]]"><a href="#"><oj-bind-text value="[[ $current.data.label ]]"></oj-bind-text></a>
                              <ul>
                                <oj-bind-for-each data="[[ $current.data.children ]]">
                                  <template>
                                    <li :id="[[ $current.data.id ]]"><a href="#"><oj-bind-text value="[[ $current.data.label ]]"></oj-bind-text></a></li>
                                  </template>
                                </oj-bind-for-each>
                              </ul>
                            </li>
                          </oj-bind-if>
                        </template>
                      </oj-bind-for-each>
                    </ul>
                  </li>
                </oj-bind-if>
              </template>
            </oj-bind-for-each>
          </ul>
        </oj-navigation-list>
        </oj-bind-if>
      </div>

      <!-- no oj-web-applayout-max-width: it capped the area at 1440 and misaligned the fixed width
           (anchored to the viewport, like the shell's box) from the shell's floating chrome -->
      <div class="oj-web-applayout-content-nopad">

        <!-- @embedded-frame: down to @end-embedded-frame, the frame the <mateu-ui> component reuses around the content page (poc/make-embedded.mjs) -->
        <!-- Transport resilience (poc/resilience.mjs). Losing the connection is a STATE,
             not an event: a band is held while it lasts, instead of a per-click notice that
             the user sees go by for five seconds every time. The busy bar only appears
             after half a second (animation with delay): below that the request usually
             wins and a flash would be worse than showing nothing. -->
        <oj-bind-if test="[[ $application.variables.mateuOffline ]]">
          <div class="mateu-offline-band" role="status">
            <oj-bind-text value="[[ $application.translations.appBundle.offlineBand ]]"></oj-bind-text>
          </div>
        </oj-bind-if>
        <oj-bind-if test="[[ $application.variables.mateuBusy ]]">
          <div class="mateu-busy-bar" role="status" :aria-label="[[ $application.translations.appBundle.loading ]]"></div>
        </oj-bind-if>
        <oj-bind-if test="[[ !!$application.variables.mateuLastError ]]">
          <div class="mateu-error-band" role="alert">
            <span><oj-bind-text value="[[ $application.variables.mateuLastError ]]"></oj-bind-text></span>
            <!-- What the client could retry on its own, it has already done silently. The one
                 offered here is the case where repeating was OUR decision and we decided not
                 to make it: the user makes it, who knows whether they can afford a duplicate. -->
            <oj-button chroming="callToAction" display="all"
              on-oj-action="[[ $listeners.retryMateuAction ]]"><oj-bind-text value="[[ $application.translations.appBundle.retry ]]"></oj-bind-text></oj-button>
            <oj-button chroming="borderless" display="all"
              on-oj-action="[[ $listeners.dismissMateuError ]]"><oj-bind-text value="[[ $application.translations.appBundle.close ]]"></oj-bind-text></oj-button>
          </div>
        </oj-bind-if>

        <div class="oj-flex">
          <oj-sp-messages-banner data="[[ $variables.messagesBannerADP ]]" class="oj-flex-item oj-sm-12 oj-md-12"
            on-sp-close="[[$listeners.messagesBannerSpClose]]"
            ></oj-sp-messages-banner>
        </div>

        <oj-sp-messages-toast primary-text="[[ $variables.messageToast ]]" id="messageToast"></oj-sp-messages-toast>

        <!-- Changing screen: after the same delay as the busy bar, the old
             screen is hidden and the skeleton takes ITS place, on top — it does not stack over it.
             An action within the same screen does not navigate: only the bar, and the content
             stays, which is the context of what is being waited for. -->
        <div class="oj-flex mateu-content" :class="[[ $application.variables.mateuNavigating ? 'mateu-navigating' : '' ]]">
          <oj-bind-if test="[[ $application.variables.mateuNavigating ]]">
            <div class="mateu-skeleton" aria-hidden="true">
              <div class="mateu-skeleton-bone mateu-skeleton-title"></div>
              <div class="mateu-skeleton-pair"><div class="mateu-skeleton-bone mateu-skeleton-label"></div><div class="mateu-skeleton-bone mateu-skeleton-field"></div></div>
              <div class="mateu-skeleton-pair"><div class="mateu-skeleton-bone mateu-skeleton-label"></div><div class="mateu-skeleton-bone mateu-skeleton-field"></div></div>
              <div class="mateu-skeleton-pair"><div class="mateu-skeleton-bone mateu-skeleton-label"></div><div class="mateu-skeleton-bone mateu-skeleton-field"></div></div>
              <div class="mateu-skeleton-pair"><div class="mateu-skeleton-bone mateu-skeleton-label"></div><div class="mateu-skeleton-bone mateu-skeleton-field"></div></div>
            </div>
          </oj-bind-if>
          <!-- Renders flow content. min-width:0 = standard flexbox fix (min-width:auto):
               without it, wide content (foldout, tables) OVERFLOWS the area instead of staying
               bounded — and the responsive logic of the oj-sp-* never kicks in -->
          <oj-vb-content id="vbRouterContent" role="main" class="oj-flex-item" style="min-width:0" config="[[vbRouterFlow]]">

          </oj-vb-content>

        </div>
        <!-- @end-embedded-frame -->
      </div>
    </oj-drawer-layout>
    </oj-drawer-layout>

    <!-- FLAT menu (TABS variant): Redwood in-app navigation (its REAL bar is a fixed
         overlay at the bottom stamped by the component itself; the host element goes at the END of the
         content so that its in-flow box reserves those 64px when scrolling to the bottom).
         It shows on ALL pages, the home included: the app's navigation does not disappear
         depending on where you are. On the home no tab is selected (its route is not
         a menu option) and you get back to it via the global-header's home icon.
         `|| null`: "nothing selected" ('' — e.g. while a screen an agent generated is on show) must
         reach the component as null: on '' it throws inside JET ("reading 'key'"), and the
         variable is a string, so null cannot be stored in it (it would become "null"). -->

    <oj-bind-if test="[[ $application.variables.mateuMenuTabs ]]">
      <oj-sp-in-app-navigation id="mateuNav"
        navigation-items="[[ $application.variables.mateuNavItems ]]"
        selection="[[ $application.variables.mateuSelectedNavId || null ]]"
        on-sp-selection-changed="[[ $listeners.navSelectionChanged ]]"></oj-sp-in-app-navigation>
    </oj-bind-if>
  </div>

</oj-sp-simple-ui-shell>
