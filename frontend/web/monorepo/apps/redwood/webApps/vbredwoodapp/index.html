<!--
  The development page of the Visual Builder app (npm run serve / npm run build). The two VB tool
  directives below are where grunt-vb-build injects the theme stylesheets and the runtime boot.
  The page the renderer jar ships is NOT this file after the build: scripts/copy.mjs writes its own
  (scripts/index-page.mjs) and only reads facts from the build output (CDN urls, module bundles).
-->
<!DOCTYPE html>
<html class="oj-html" lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Mateu</title>
    <link rel="preconnect" href="https://static.oracle.com">
    <!-- keep the query the page was opened with (e.g. a listing's filters): the VB router drops
         it from the URL while starting -->
    <script>window.__mateuInitialSearch = window.location.search || '';</script>
    <!-- the interface language follows the browser, as in the Vaadin renderer: VB, JET and the
         bridge's chrome texts (poc/i18n.mjs) all read <html lang> -->
    <script>document.documentElement.lang = (navigator.languages && navigator.languages[0]) || navigator.language || 'en';</script>
    <!-- vb:inject id="headContent" theme="resources/css/dt.theme.redwood" -->
    <link rel="stylesheet" href="resources/css/app.css">
  </head>
  <body class="oj-body">
    <oj-vb-content config="[[vbApplication]]"></oj-vb-content>
    <!-- visualBuilderScripts -->
  </body>
</html>
