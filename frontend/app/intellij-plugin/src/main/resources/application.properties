mateu.baseUrl=http://localhost:8592
mateu.route=/
mateu.config={}
# Focused mode: hide the IDE's own chrome (Project/Structure/Services/VCS tool windows, VCS toolbar
# widget) so the IDE is a clean shell for the app. It aggressively unregisters the platform's own
# tool-window / project-view extension points, which logs startup errors and — installed as a normal
# Marketplace plugin — would strip the developer's own IDE. So it is OFF here (the plugin behaves like
# a normal plugin) and turned ON only by the desktop-app installers (which pass -Dmateu.focused=true
# in idea.vmoptions), the standalone-shell distribution where it belongs. Enable in dev with
# `./gradlew runIde -Dmateu.focused=true`.
mateu.focused=false
# App registry (production): the installable carries only these two coordinates; the registry
# entry supplies baseUrl + parameters and may require minimum plugin/IDE versions (see AppRegistry).
# Overridable with -Dmateu.registryUrl=… -Dmateu.appId=… (system properties win over this file).
#mateu.registryUrl=https://registry.example.com
#mateu.appId=demo-admin-panel
