# yaml-language-server: $schema=https://raw.githubusercontent.com/miguelperezcolom/mateu/refs/heads/master/backend/shared/uidl/specs-schema.json
# The field type catalogue: a FormField names one by `fieldType:` and takes its attributes as
# defaults, its own winning.
type: Types
types:
  - id: WalkEmail
    label: E-mail
    stereotype: email
    placeholder: name@example.com
    required: true
  - id: WalkthroughCode
    label: Code
    dataType: string
    placeholder: AB-123
