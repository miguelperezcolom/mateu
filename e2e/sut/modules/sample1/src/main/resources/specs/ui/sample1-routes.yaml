# yaml-language-server: $schema=https://raw.githubusercontent.com/miguelperezcolom/mateu/refs/heads/master/backend/shared/uidl/routes-schema.json
# Inner routes of the root mount (@UI("") on SimpleForm). Authored as data, so every adapter's
# route registry (and its SPA deep-link fallback) is exercised the same way.
type: Routes
routes:

  # A streamed action (LongTask over SSE) on a NON-root route: /long-task.
  - route: long-task
    viewModel: io.mateu.sample1.LongTaskForm

  # Actions authored as data (REST direct/proxy, flows, the action catalogue): no view model.
  - route: yaml-actions
    layout: yaml-actions.yaml
  # Forms walkthrough: a YAML form with no view model (fields, a field type, validation).
  - route: walk-yaml
    layout: walk-yaml-form.yaml
  # Every display component on one definition-only page (YAML, no view model).
  - route: display-gallery
    layout: display-gallery.yaml

  # The page header authored as data (YAML, no view model), seeded by the route's state.
  - route: yaml-page
    layout: yaml-page.yaml
    state: {number: "4471", updatedAt: "2026-07-20 12:00", notes: Two chairs}
  # ── The YAML authoring walkthrough (tests/shared/yaml-authoring.spec.ts) ───────────────────────
  # A definition-only page: no view model, the state seeded by the route.
  - route: walkthrough/page
    layout: walkthrough/page.yaml
    state:
      greeting: Hola

  # One definition, two routes, each pinning its own parameter.
  - route: walkthrough/pinned/alpha
    layout: walkthrough/pinned.yaml
    fixedParams:
      flavour: alpha
  - route: walkthrough/pinned/beta
    layout: walkthrough/pinned.yaml
    fixedParams:
      flavour: beta

  # A layout bound to a Java view model by the entry (the "Code + YAML" flavour).
  - route: walkthrough/bound
    layout: walkthrough/bound.yaml
    viewModel: io.mateu.sample1.WalkthroughCounter

  # The same kind of view model, its inferred form adjusted by a layoutDelta (order, hidden, label).
  - route: walkthrough/delta
    layout: walkthrough/delta.yaml
    viewModel: io.mateu.sample1.WalkthroughDeltaForm

  # A route only an admin may open: the SUT has no security, so the caller is anonymous → refused.
  - route: walkthrough/restricted
    layout: walkthrough/pinned.yaml
    access: {roles: [admin]}
