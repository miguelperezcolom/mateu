# The console: one local page and two federated domains, both authored in YAML only —
#  - Orders, SERVED by its own backend (yaml-fed-orders, :18481, mounted at /orders);
#  - Catalog, a STATIC bundle with no backend at all (yaml-fed-catalog, served as files on :18482).
# A RemoteMenu whose baseUrl names a manifest.json is a static remote: the browser reads that
# manifest and answers the domain's loads from it, as the static site itself would.
$schema: https://raw.githubusercontent.com/miguelperezcolom/mateu/master/backend/shared/uidl/uidl-schema.json
type: AppShell
title: Operations console
variant: MENU_ON_TOP
# The app-shell walkthrough (yaml-federation.spec.ts, "YAML shell" tests): the shell's own
# features authored as data, next to the federated sections.
themeToggle: true
actions:
  - id: openAbout
    steps:
      - type: Navigate
        route: help/about
contextSelectors:
  - fieldName: desk
    label: Desk
    options:
      - {value: D1, label: Front desk}
      - {value: D2, label: Back office}
headerActions:
  - {label: About this console, route: help/about}
menu:
  - type: RouteLink
    label: Home
    route: home
  - type: RemoteMenu
    label: Orders
    baseUrl: http://localhost:18481/orders
    path: /orders
    route: ""
    consumedRoute: _empty
  - type: RemoteMenu
    label: Catalog
    baseUrl: http://localhost:18482/manifest.json
    path: /catalog
    route: ""
    consumedRoute: _empty
  - type: Menu
    label: Help
    submenu:
      - {type: RouteLink, label: About, route: help/about}
  - type: Menu
    label: Quick
    presentation: {display: cards}
    submenu:
      - type: RouteLink
        label: About card
        route: help/about
        description: What this console is
  - type: RuleLink
    label: Open about
    rules:
      - action: RunAction
        actionId: openAbout
