server.port=8086
server.host=0.0.0.0
# Serve the bundled Mateu Vaadin frontend (vaadin-lit jar: /static/assets/*) at /assets/*.
# NOTE: mount it under /assets ONLY — a context of "/" would shadow every JAX-RS route
# (the static handler is terminal, so /full-crud etc. would 404 before reaching Jersey).
server.static.classpath.context=/assets
server.static.classpath.location=/static/assets
mp.openapi.scan.disable=true
