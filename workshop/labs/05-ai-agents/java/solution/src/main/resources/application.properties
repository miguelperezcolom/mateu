server.port=8080
spring.application.name=mateu-starter

# Workshop, lab 05: the app is also an MCP server, at POST /mateu/mcp (off by default — it gives any
# caller a programmatic way to drive every screen, so an app has to decide to expose it).
mateu.mcp.enabled=true
# ...and an agent may send UI to a UI that is open (Connect AI in the header pairs a tab).
mateu.mcp.push.enabled=true
