# The case's own route table: one definition-only page whose components carry access keys.
# The route also seeds the eyesOnly field: a hidden field's seed must NOT travel to a caller who
# may not see it (the seed of the readOnlyUnless field does — it is drawn, with its value).
routes:
  - route: staff
    layout: staff.yaml
    state:
      name: Ada
      salary: 1000
      notes: Secret — for staff only
