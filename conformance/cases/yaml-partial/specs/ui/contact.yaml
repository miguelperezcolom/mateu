# A page that reuses two fragments: `type: Partial` stands for the partial's content, inlined
# where it is named; one partial uses another.
layout:
  type: FormLayout
  content:
    - {type: FormField, id: name, label: Name, dataType: string}
    - {type: Partial, ref: address-block}
    - {type: Partial, ref: contact-card}
