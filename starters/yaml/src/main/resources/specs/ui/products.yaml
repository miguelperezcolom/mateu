# A listing: search, a filter, sorting and paging over the rows of the `products` source (see
# sources.yaml). Open it in the Mateu visual editor (IntelliJ or VS Code) to edit it on a canvas.
$schema: https://raw.githubusercontent.com/miguelperezcolom/mateu/master/backend/shared/uidl/uidl-schema.json
type: Listing
title: Products
pageSize: 10
searchable: true
filters:
  - type: FormField
    id: status
    label: Status
    stereotype: select
    options:
      - {value: AVAILABLE, label: Available}
      - {value: OUT_OF_STOCK, label: Out of stock}
      - {value: DISCONTINUED, label: Discontinued}
rowsSource:
  ref: products
columns:
  - {type: GridColumn, id: id, label: Id, identifier: true}
  - {type: GridColumn, id: name, label: Name}
  - {type: GridColumn, id: price, label: Price}
  - {type: GridColumn, id: status, label: Status, dataType: status}
