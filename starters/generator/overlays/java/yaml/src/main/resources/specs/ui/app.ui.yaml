# The mount: this app, served at "/", declared as data (the YAML twin of @UI). Mateu discovers it
# by scanning specs/ui/** for `type: UI`; its screens are the routes of the files listed below.
$schema: https://raw.githubusercontent.com/miguelperezcolom/mateu/master/backend/shared/uidl/mount-schema.json
type: UI
basePath: /
routes:
  - routes.yaml
