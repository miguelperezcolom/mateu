# A listing over the `people` source (sources.yaml): the search box, the filter and the pager are
# answered by the API. `rowRoute` makes a row the way in to its record, at its own URL.
$schema: https://raw.githubusercontent.com/miguelperezcolom/mateu/v3.0-beta.68/backend/shared/uidl/uidl-schema.json
pageType: collection
type: Listing
title: People
pageSize: 10
rowRoute: people/${row.id}
searchable: true
filters:
  - type: FormField
    id: gender
    label: Gender
    stereotype: select
    options:
      - {value: male, label: Male}
      - {value: female, label: Female}
      - {value: n/a, label: Droid (n/a)}
rowsSource:
  ref: people
columns:
  - {type: GridColumn, id: name, label: Name, identifier: true, stereotype: primary, leadingPath: image}
  - {type: GridColumn, id: homeworldName, label: Homeworld}
  - {type: GridColumn, id: gender, label: Gender}
  - {type: GridColumn, id: birthYear, label: Birth year}
  - {type: GridColumn, id: height, label: Height (cm)}
