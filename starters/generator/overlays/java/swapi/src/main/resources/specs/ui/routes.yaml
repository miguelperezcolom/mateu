# The route registry of the mount. Each entry binds a route (relative to the mount; "" is its root)
# to a `layout:` — a definition file next to this one. A record route names in `data:` the source
# that fetches it; the `:id` of the path reaches that source's url as ${state.id}. No view model on
# any route: there is no code behind these screens. See https://mateu.io/concepts/routes-and-mounts/
$schema: https://raw.githubusercontent.com/miguelperezcolom/mateu/v3.0-beta.58/backend/shared/uidl/routes-schema.json
type: Routes
routes:
  - route: ""
    layout: app.yaml
  - route: home
    layout: home.yaml
  - route: people
    layout: people.yaml
  - route: people/:id
    layout: person.yaml
    data: person
  - route: planets
    layout: planets.yaml
  - route: planets/:id
    layout: planet.yaml
    data: planet
  # __ROUTES__
