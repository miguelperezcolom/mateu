# SonarCloud automatic analysis — scope.
#
# Generated artifacts are excluded: they are BUILT from sources that are analysed (and they are
# minified, so every finding in them is noise that hides the real ones and fails the quality gate
# on every bundle refresh). Hand-written code is never excluded here.
#  - the renderer bundles the backend jars serve (vite / grunt output copied by `npm run copy`)
#  - the Redwood bridge, generated from poc/ by make-amd.mjs
#  - the visual editor bundled into the IntelliJ plugin, and the demo static sites
sonar.exclusions=\
  backend/shared/frontend/*/src/main/resources/**,\
  frontend/web/monorepo/apps/redwood/webApps/vbredwoodapp/resources/js/mateu-bridge.js,\
  frontend/web/monorepo/apps/redwood/build/**,\
  frontend/app/intellij-plugin/src/main/resources/visual-editor/**,\
  demo/sites/*/assets/**,\
  **/dist/**

# Duplication: the Redwood page repeats the generated atoms block per surface (make-html.mjs
# expands ONE template into each), and the conformance corpus pins wire JSON per case.
sonar.cpd.exclusions=\
  frontend/web/monorepo/apps/redwood/webApps/vbredwoodapp/flows/main/pages/main-start-page.html,\
  conformance/**
