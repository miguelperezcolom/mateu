# Path to sources
#sonar.sources=.
# Exclude generated/minified frontend bundles (built by `yarn copy`, committed as served assets) and
# vendored static sites — analysing minified output yields only false-positive smells.
sonar.exclusions=docs/**/*,doc/**/*,**/frontend/**/src/main/resources/**,demo/sites/**,**/*.min.js
#sonar.inclusions=

# Path to tests
#sonar.tests=
#sonar.test.exclusions=
#sonar.test.inclusions=

# Source encoding
#sonar.sourceEncoding=UTF-8

# Exclusions for copy-paste detection: the Redwood/VB poc is a DELIBERATE single-source port of
# libs/mateu (it shares no code with the web renderers — see its DESIGN-NOTES), so cross-file
# duplication with libs/mateu is by design, not a smell.
sonar.cpd.exclusions=**/apps/redwood/poc/**
