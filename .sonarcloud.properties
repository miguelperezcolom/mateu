# Path to sources
#sonar.sources=.
# Exclude generated/minified frontend bundles (built by `yarn copy`, committed as served assets) and
# vendored static sites — analysing minified output yields only false-positive smells.
sonar.exclusions=docs/**/*,doc/**/*,**/src/main/resources/**/assets/**,demo/sites/**,**/*.min.js
#sonar.inclusions=

# Path to tests
#sonar.tests=
#sonar.test.exclusions=
#sonar.test.inclusions=

# Source encoding
#sonar.sourceEncoding=UTF-8

# Exclusions for copy-paste detection
#sonar.cpd.exclusions=
