# This workflow will build a package using Maven and then publish it to GitHub packages when a release is created
# For more information see: https://github.com/actions/setup-java#apache-maven-with-a-settings-path

name: Build and publish

on:
  release:
    types: [published]

# Publishing goes to Maven Central with its own secrets; nothing here writes to GitHub. Read-only
# also caps the called run_tests.yml (a called workflow cannot exceed its caller's permissions).
permissions:
  contents: read

# The release event can't be filtered by tag in `on:`, so guard the jobs: only framework releases
# (tag `vX.Y…`, e.g. v3.0-alpha.N) publish to Maven Central. Other releases — e.g. the desktop
# installers (`mateu-desktop-*`) — publish nothing.
jobs:
  e2e:
    if: startsWith(github.event.release.tag_name, 'v')
    uses: ./.github/workflows/run_tests.yml

  all:
    needs: e2e
    if: startsWith(github.event.release.tag_name, 'v')
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The tag reaches the shell through env, never by `${{ }}` substitution into the script.
      - name: Set env
        env:
          VERSION: ${{ github.event.release.tag_name }}
        run: echo "RELEASE_VERSION=${VERSION:1}" >> "$GITHUB_ENV"
      - name: Set up JDK 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          java-version: 21
          distribution: zulu
          server-id: central # Value of the distributionManagement/repository/id field of the pom.xml
          server-username: MAVEN_USERNAME
          server-password: MAVEN_PASSWORD
      # Maven pinned, not the runner's. ubuntu-24.04 20261004 moved it from 3.9.16 to 3.10.0, and with
      # 3.10.0 central-publishing-maven-plugin 0.11.0 no longer deletes the maven-metadata files from its
      # staging: they went into the bundle, and Central refused v3.0-alpha.402 ("Bundle has content that
      # does NOT have a .pom file") — every module's folder and io/mateu itself.
      - name: Set up Maven 3.9.16
        run: |
          set -euo pipefail
          V=3.9.16
          URL=https://archive.apache.org/dist/maven/maven-3/$V/binaries/apache-maven-$V-bin.tar.gz
          curl -fsSL "$URL" -o /tmp/maven.tgz
          echo "$(curl -fsSL "$URL.sha512" | cut -d' ' -f1)  /tmp/maven.tgz" | sha512sum -c -
          tar xzf /tmp/maven.tgz -C "$HOME"
          echo "$HOME/apache-maven-$V/bin" >> "$GITHUB_PATH"
      - name: Maven version
        run: mvn -v
      - name: Import GPG Key
        uses: crazy-max/ghaction-import-gpg@2dc316deee8e90f13e1a351ab510b4d5bc0c82cd # v7.0.0
        with:
          gpg_private_key: ${{ secrets.GPG_PRIVATE_KEY }}
          passphrase: ${{ secrets.GPG_PASSPHRASE }}

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      # npm ci contra el lockfile commiteado, NO `rm package-lock.json && npm install`.
      # Re-resolver desde cero en cada release hacía dos cosas malas: la build dejaba de ser
      # reproducible (el artefacto publicado dependía del estado del registro en ese minuto) y
      # cualquier publicación de una dependencia transitiva podía romper la release sin que
      # nadie hubiera tocado el repo — que es exactamente lo que pasó con la v3.0-alpha.274
      # (ERESOLVE determinista en CI, imposible de reproducir en local).
      # El e2e no lo detecta: solo instala e2e/, no el monorepo.
      # Only the workspaces the Vaadin bundle is built from (not apps/redwood's Oracle tooling, which
      # comes from static.oracle.com), and --ignore-scripts: the build needs no install hook — esbuild's
      # platform binary is an optional dependency, not a postinstall download (frontend-lib in
      # run_tests.yml builds the same bundle from the same install on every PR).
      - name: Install monorepo dependencies
        run: cd frontend/web/monorepo && npm ci --workspace mateu --workspace mateu-vaadin --include-workspace-root --ignore-scripts
      - name: Build Vaadin front
        run: cd frontend/web/monorepo/apps/vaadin && npm run copy

      - name: fix version
        run: grep -rl '<version>0.0.1-MATEU</version>' --exclude-dir=.git backend | grep pom.xml | xargs sed -i "s/0\.0\.1\-MATEU/$RELEASE_VERSION/g"

      - name: Build backend shared
        run: mvn -Dmaven.test.skip -B install --file backend/pom.xml

      - name: Publish to Maven Central
        run: mvn -Dmaven.test.skip deploy -f backend/pom.xml
        env:
          MAVEN_USERNAME: ${{ secrets.CENTRAL_TOKEN_USERNAME }}
          MAVEN_PASSWORD: ${{ secrets.CENTRAL_TOKEN_PASSWORD }}

  # The Python port ships to PyPI as `mateu-ui` (the name `mateu` is taken by an unrelated project),
  # in lockstep with Maven: the same framework release, the version derived from the same tag
  # (`v3.0-alpha.406` → PEP 440 `3.0.0a406`, see backend/python/scripts/set_version.py).
  #
  # Two ways to authenticate, and NONE configured is a clean no-op rather than a red release:
  #   - a `PYPI_API_TOKEN` secret, or
  #   - PyPI trusted publishing (OIDC) — set the repository variable PYPI_TRUSTED_PUBLISHING=true
  #     once the `mateu-ui` project on PyPI trusts this workflow.
  pypi:
    needs: e2e
    if: startsWith(github.event.release.tag_name, 'v3.0-')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write # trusted publishing (OIDC); unused on the token path
    env:
      PYPI_API_TOKEN: ${{ secrets.PYPI_API_TOKEN }}
      TRUSTED: ${{ vars.PYPI_TRUSTED_PUBLISHING }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'

      - name: Stamp the version from the release tag
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: python backend/python/scripts/set_version.py "$TAG"

      - name: Build sdist + wheel
        run: |
          python -m pip install --only-binary :all: build==1.6.1
          python -m build backend/python --outdir dist

      - name: The wheel installs and imports
        run: |
          python -m venv /tmp/wheelcheck
          /tmp/wheelcheck/bin/pip install dist/*.whl
          /tmp/wheelcheck/bin/python -c "import mateu_uidl, mateu_dtos, mateu_core, mateu_fastapi; print(mateu_core.__version__)"

      - name: Publish (API token)
        if: env.PYPI_API_TOKEN != ''
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          packages-dir: dist
          password: ${{ secrets.PYPI_API_TOKEN }}

      - name: Publish (trusted publishing)
        if: env.PYPI_API_TOKEN == '' && env.TRUSTED == 'true'
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          packages-dir: dist

      - name: No PyPI credentials — skipped
        if: env.PYPI_API_TOKEN == '' && env.TRUSTED != 'true'
        run: echo "::notice::PyPI publish skipped — no PYPI_API_TOKEN secret and PYPI_TRUSTED_PUBLISHING is not 'true'."

  # The .NET port ships to NuGet in LOCKSTEP with the Maven artifacts: same release, same number,
  # spelled as SemVer (tag v3.0-alpha.N → 3.0.0-alpha.N; v3.0.1 → 3.0.1). Gated on the same tests as
  # the Maven job (the called test workflow includes the .NET suites + the conformance gate). Without
  # the NUGET_API_KEY secret the job builds the packages and stops — a fork, or a repo not yet
  # registered on nuget.org, gets a green run instead of a failed release.
  nuget:
    needs: e2e
    if: startsWith(github.event.release.tag_name, 'v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up .NET
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: |
            8.0.x
            10.0.x
      - name: Package version from the release tag
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          V="${TAG#v}"
          # major.minor[-pre] → major.minor.0[-pre]; a full major.minor.patch is left as is.
          V=$(echo "$V" | sed -E 's/^([0-9]+)\.([0-9]+)(-|$)/\1.\2.0\3/')
          echo "NUGET_VERSION=$V" >> "$GITHUB_ENV"
          echo "NuGet version: $V"
      - name: Pack
        run: |
          cd backend/dotnet
          for p in src/*/*.csproj; do
            dotnet pack "$p" -c Release -o "$RUNNER_TEMP/nupkgs" -p:MateuVersion="$NUGET_VERSION"
          done
          ls -l "$RUNNER_TEMP/nupkgs"
      - name: Push to NuGet
        env:
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
        run: |
          if [ -z "$NUGET_API_KEY" ]; then
            echo "::notice::NUGET_API_KEY is not set — packages built, nothing pushed."
            exit 0
          fi
          dotnet nuget push "$RUNNER_TEMP/nupkgs/*.nupkg" --api-key "$NUGET_API_KEY" \
            --source https://api.nuget.org/v3/index.json --skip-duplicate
