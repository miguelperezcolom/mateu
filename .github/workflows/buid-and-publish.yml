# This workflow will build a package using Maven and then publish it to GitHub packages when a release is created
# For more information see: https://github.com/actions/setup-java#apache-maven-with-a-settings-path

name: Build and publish

on:
  release:
    types: [published]

# Publishing goes to Maven Central with its own secrets; the only writes to GitHub are the
# redwood-embedded-attach and sbom-attach jobs attaching files to the release (each its own
# job-level contents: write, and nothing but the upload in it) and bump-examples opening its PR.
# Every registry credential (GPG, Central, PyPI, NuGet) is scoped to the one step that uses it, and
# the OIDC permission (id-token: write) to the small pypi / nuget jobs that only publish. Read-only
# also caps the called run_tests.yml (a called workflow cannot exceed its caller's permissions).
permissions:
  contents: read

# The release event can't be filtered by tag in `on:`, so guard the jobs: only framework releases
# (tag `vX.Y…`, e.g. v3.0-alpha.N) publish to Maven Central. Other releases — e.g. the desktop
# installers (`mateu-desktop-*`) — publish nothing.
jobs:
  e2e:
    if: startsWith(github.event.release.tag_name, 'v')
    uses: ./.github/workflows/run_tests.yml

  all:
    needs: e2e
    if: startsWith(github.event.release.tag_name, 'v')
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The tag reaches the shell through env, never by `${{ }}` substitution into the script.
      - name: Set env
        env:
          VERSION: ${{ github.event.release.tag_name }}
        run: echo "RELEASE_VERSION=${VERSION:1}" >> "$GITHUB_ENV"
      - name: Set up JDK 21
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          java-version: 21
          distribution: zulu
          server-id: central # Value of the distributionManagement/repository/id field of the pom.xml
          server-username: MAVEN_USERNAME
          server-password: MAVEN_PASSWORD
      # Maven pinned, not the runner's. ubuntu-24.04 20261004 moved it from 3.9.16 to 3.10.0, and with
      # 3.10.0 central-publishing-maven-plugin 0.11.0 no longer deletes the maven-metadata files from its
      # staging: they went into the bundle, and Central refused v3.0-alpha.402 ("Bundle has content that
      # does NOT have a .pom file") — every module's folder and io/mateu itself.
      - name: Set up Maven 3.9.16
        run: |
          set -euo pipefail
          V=3.9.16
          URL=https://archive.apache.org/dist/maven/maven-3/$V/binaries/apache-maven-$V-bin.tar.gz
          curl -fsSL "$URL" -o /tmp/maven.tgz
          echo "$(curl -fsSL "$URL.sha512" | cut -d' ' -f1)  /tmp/maven.tgz" | sha512sum -c -
          tar xzf /tmp/maven.tgz -C "$HOME"
          echo "$HOME/apache-maven-$V/bin" >> "$GITHUB_PATH"
      - name: Maven version
        run: mvn -v
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      # npm ci contra el lockfile commiteado, NO `rm package-lock.json && npm install`.
      # Re-resolver desde cero en cada release hacía dos cosas malas: la build dejaba de ser
      # reproducible (el artefacto publicado dependía del estado del registro en ese minuto) y
      # cualquier publicación de una dependencia transitiva podía romper la release sin que
      # nadie hubiera tocado el repo — que es exactamente lo que pasó con la v3.0-alpha.274
      # (ERESOLVE determinista en CI, imposible de reproducir en local).
      # El e2e no lo detecta: solo instala e2e/, no el monorepo.
      # Only the workspaces the Vaadin bundle is built from (not apps/redwood's Oracle tooling, which
      # comes from static.oracle.com), and --ignore-scripts: the build needs no install hook — esbuild's
      # platform binary is an optional dependency, not a postinstall download (frontend-lib in
      # run_tests.yml builds the same bundle from the same install on every PR).
      - name: Install monorepo dependencies
        run: cd frontend/web/monorepo && npm ci --workspace mateu --workspace mateu-vaadin --include-workspace-root --ignore-scripts
      - name: Build Vaadin front
        run: cd frontend/web/monorepo/apps/vaadin && npm run copy

      - name: fix version
        run: grep -rl '<version>0.0.1-MATEU</version>' --exclude-dir=.git backend | grep pom.xml | xargs sed -i "s/0\.0\.1\-MATEU/$RELEASE_VERSION/g"

      # Unsigned: the signing key is not in the keyring yet (see below), and `deploy` runs the whole
      # lifecycle again, signing on the way.
      - name: Build backend shared
        run: mvn -Dmaven.test.skip -Dgpg.skip=true -B install --file backend/pom.xml

      # The signing key enters the keyring only now, AFTER npm ci, the Vite build and the first Maven
      # build — third-party code that has no reason to see it.
      - name: Import GPG Key
        uses: crazy-max/ghaction-import-gpg@2dc316deee8e90f13e1a351ab510b4d5bc0c82cd # v7.0.0
        with:
          gpg_private_key: ${{ secrets.GPG_PRIVATE_KEY }}
          passphrase: ${{ secrets.GPG_PASSPHRASE }}

      - name: Publish to Maven Central
        run: mvn -Dmaven.test.skip deploy -f backend/pom.xml
        env:
          MAVEN_USERNAME: ${{ secrets.CENTRAL_TOKEN_USERNAME }}
          MAVEN_PASSWORD: ${{ secrets.CENTRAL_TOKEN_PASSWORD }}

  # Once the release is VISIBLE on Maven Central — not when the tag is pushed: a starter pinned to a
  # version Central does not serve yet fails for everyone who copies it — point the starters, the
  # "start here" demos, the AI reference files, the port guides and the japicmp baseline at it
  # (scripts/bump-example-version.sh) and open a pull request with the change.
  #
  # Fail-soft by design: the release is already published when this runs, so nothing here may turn it
  # red. If Central is still not serving the version after the wait, or the repository does not let
  # the workflow token push a branch / open a PR (Settings › Actions › General › "Allow GitHub
  # Actions to create and approve pull requests"), the job ends green with a warning that prints the
  # command to run by hand. A PR opened with the workflow token does not trigger the PR workflows by
  # itself (GitHub's rule against recursive runs): close and reopen it, or push to its branch, to get
  # the checks. Touches no publishing step and needs no publishing secret.
  bump-examples:
    needs: all
    if: startsWith(github.event.release.tag_name, 'v3.')
    runs-on: ubuntu-latest
    timeout-minutes: 200
    permissions:
      contents: write # push the bump branch
      pull-requests: write # open the PR
    env:
      TAG: ${{ github.event.release.tag_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: master
          persist-credentials: false
      - name: Wait until Maven Central serves the release
        id: central
        run: |
          V="${TAG#v}"
          echo "version=$V" >> "$GITHUB_OUTPUT"
          url="https://repo1.maven.org/maven2/io/mateu/mateu-bom/$V/mateu-bom-$V.pom"
          for _ in $(seq 1 90); do   # up to 3 hours, every 2 minutes
            if curl -fsSIL "$url" > /dev/null; then echo "visible=true" >> "$GITHUB_OUTPUT"; exit 0; fi
            sleep 120
          done
          echo "visible=false" >> "$GITHUB_OUTPUT"
          echo "::warning::$V is not on Maven Central after 3 hours. Once it is, run: scripts/bump-example-version.sh $V"
      - name: Bump the examples and open the pull request
        if: steps.central.outputs.visible == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          V: ${{ steps.central.outputs.version }}
        run: |
          set -uo pipefail
          hint="Run by hand: scripts/bump-example-version.sh $V, then commit and open a PR."
          scripts/bump-example-version.sh "$V" || { echo "::warning::The bump script failed. $hint"; exit 0; }
          if git diff --quiet; then echo "Already pinned to $V — nothing to do."; exit 0; fi
          git diff --stat
          branch="chore/bump-examples-$V"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$branch"
          git commit -qam "Point the examples at $V (scripts/bump-example-version.sh)"
          if ! git push -q "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "HEAD:refs/heads/$branch"; then
            echo "::warning::Could not push $branch with the workflow token. $hint"; exit 0
          fi
          body="The starters, the \"start here\" demos, the AI reference files, the .NET/Python guides and the japicmp baseline now pin \`$V\`, which Maven Central serves. Review \`backend/api-compat/japicmp-exclusions.properties\` against the new baseline. Opened by the release workflow: close and reopen this PR to run the checks."
          if ! gh pr create --base master --head "$branch" --title "Point the examples at $V" --body "$body"; then
            echo "::warning::Pushed $branch but could not open the PR (is 'Allow GitHub Actions to create and approve pull requests' off?). Open it by hand from $branch."
          fi

  # The Redwood EMBEDDED component (<mateu-ui>, a JET Custom Component a Visual Builder developer
  # imports into their own app) is not a Maven/PyPI/NuGet artifact: it ships as a zip attached to the
  # framework's GitHub Release, built from the committed sources (poc/ + the generated bridge +
  # embedded/mateu-ui) with Node alone — nothing from Oracle's CDN goes in (see NOTICE.md). Built in a
  # read-only job; only redwood-embedded-attach holds contents: write.
  redwood-embedded:
    needs: e2e
    if: startsWith(github.event.release.tag_name, 'v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Build the embedded component package
        run: |
          cd frontend/web/monorepo/apps/redwood
          node poc/test-embedded.mjs
          node poc/make-embedded.mjs
          ls build/embedded/mateu-ui-*.zip
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: redwood-embedded
          path: frontend/web/monorepo/apps/redwood/build/embedded/mateu-ui-*.zip
          if-no-files-found: error
          retention-days: 1

  # The write half: no checkout, no build — only the upload, so `contents: write` never shares a job
  # with code that is not ours.
  redwood-embedded-attach:
    needs: redwood-embedded
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: redwood-embedded
          path: embedded
      - name: Attach it to the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$TAG" embedded/mateu-ui-*.zip --clobber --repo "$GITHUB_REPOSITORY"

  # CycloneDX SBOMs (Maven artifacts, web renderer npm deps, Python wheel, .NET packages), attached to
  # the release as assets — scripts/release-sboms.sh says what each one covers. Its own job, so it
  # never delays or fails a publish, and nothing in the normal build pays for it (no plugin is bound
  # to a Maven phase). Generated read-only; sbom-attach alone holds contents: write.
  sbom:
    needs: e2e
    if: startsWith(github.event.release.tag_name, 'v')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          java-version: 21
          distribution: zulu
          cache: maven
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: |
            8.0.x
            10.0.x
      - name: Generate the SBOMs
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: scripts/release-sboms.sh "$TAG" "$RUNNER_TEMP/sbom"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sbom
          path: ${{ runner.temp }}/sbom/*.cdx.json
          if-no-files-found: error
          retention-days: 1

  # The write half of sbom: the generators (cyclonedx for Maven/npm/pip/.NET) run in the read-only
  # job above; this one only uploads their output.
  sbom-attach:
    needs: sbom
    runs-on: ubuntu-latest
    permissions:
      contents: write # gh release upload
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: sbom
          path: sbom
      - name: Attach them to the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$TAG" sbom/*.cdx.json --clobber --repo "$GITHUB_REPOSITORY"


  # The Python port ships to PyPI as `mateu-ui` (the name `mateu` is taken by an unrelated project),
  # in lockstep with Maven: the same framework release, the version derived from the same tag
  # (`v3.0-alpha.406` → PEP 440 `3.0.0a406`, see backend/python/scripts/set_version.py).
  #
  # Two ways to authenticate, and NONE configured is a clean no-op rather than a red release:
  #   - a `PYPI_API_TOKEN` secret, or
  #   - PyPI trusted publishing (OIDC) — set the repository variable PYPI_TRUSTED_PUBLISHING=true
  #     once the `mateu-ui` project on PyPI trusts this workflow. PREFERRED: when it is set, the
  #     token (if any) is never used — delete the secret once trusted publishing works.
  #
  # Built and published in TWO jobs, so the credential never shares a job with third-party code:
  # `pypi-build` runs the build backend (hatchling, fetched by `python -m build`) and installs the
  # wheel's dependencies to check it imports — with no secret and no OIDC permission; `pypi` only
  # downloads the built files and hands them to the publish action. The token reaches nothing but
  # the publish step (`with: password:`), and `id-token: write` exists only in that small job.
  pypi-build:
    needs: e2e
    if: startsWith(github.event.release.tag_name, 'v3.')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Stamp the version from the release tag
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: python backend/python/scripts/set_version.py "$TAG"

      - name: Build sdist + wheel
        run: |
          python -m pip install --only-binary :all: build==1.6.1
          python -m build backend/python --outdir dist

      - name: The wheel installs and imports
        run: |
          python -m venv /tmp/wheelcheck
          /tmp/wheelcheck/bin/pip install dist/*.whl
          /tmp/wheelcheck/bin/python -c "import mateu_ui, mateu_ui.uidl, mateu_ui.dtos, mateu_ui.core, mateu_ui.fastapi; print(mateu_ui.__version__)"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pypi-dist
          path: dist/
          if-no-files-found: error
          retention-days: 1

  pypi:
    needs: pypi-build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      id-token: write # trusted publishing (OIDC); unused on the token path
    steps:
      # Which way to authenticate, decided without putting the token in any environment: the step
      # sees only whether the secret is set (a boolean), never its value.
      - name: Choose the credential
        id: auth
        env:
          HAS_TOKEN: ${{ secrets.PYPI_API_TOKEN != '' }}
          TRUSTED: ${{ vars.PYPI_TRUSTED_PUBLISHING }}
        run: |
          if [ "$TRUSTED" = "true" ]; then echo "mode=trusted" >> "$GITHUB_OUTPUT"
          elif [ "$HAS_TOKEN" = "true" ]; then echo "mode=token" >> "$GITHUB_OUTPUT"
          else
            echo "mode=none" >> "$GITHUB_OUTPUT"
            echo "::notice::PyPI publish skipped — no PYPI_API_TOKEN secret and PYPI_TRUSTED_PUBLISHING is not 'true'."
          fi

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: steps.auth.outputs.mode != 'none'
        with:
          name: pypi-dist
          path: dist

      - name: Publish (API token)
        if: steps.auth.outputs.mode == 'token'
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          packages-dir: dist
          password: ${{ secrets.PYPI_API_TOKEN }}

      - name: Publish (trusted publishing)
        if: steps.auth.outputs.mode == 'trusted'
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          packages-dir: dist

  # The .NET port ships to NuGet in LOCKSTEP with the Maven artifacts: same release, same number,
  # spelled as SemVer (tag v3.0-alpha.N → 3.0.0-alpha.N; v3.0.1 → 3.0.1). Gated on the same tests as
  # the Maven job (the called test workflow includes the .NET suites + the conformance gate). Without
  # the NUGET_API_KEY secret the job builds the packages and stops — a fork, or a repo not yet
  # registered on nuget.org, gets a green run instead of a failed release.
  #
  # Packed and pushed in TWO jobs, like PyPI: `nuget-pack` restores and builds (third-party NuGet
  # packages and MSBuild tasks run there) with no secret and no OIDC permission; `nuget` only logs in
  # and pushes the packed files.
  nuget-pack:
    needs: e2e
    if: startsWith(github.event.release.tag_name, 'v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: |
            8.0.x
            10.0.x
      - name: Package version from the release tag
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          V="${TAG#v}"
          # major.minor[-pre] → major.minor.0[-pre]; a full major.minor.patch is left as is.
          V=$(echo "$V" | sed -E 's/^([0-9]+)\.([0-9]+)(-|$)/\1.\2.0\3/')
          echo "NUGET_VERSION=$V" >> "$GITHUB_ENV"
          echo "NuGet version: $V"
      - name: Pack
        run: |
          cd backend/dotnet
          for p in src/*/*.csproj; do
            dotnet pack "$p" -c Release -o "$RUNNER_TEMP/nupkgs" -p:MateuVersion="$NUGET_VERSION"
          done
          ls -l "$RUNNER_TEMP/nupkgs"
          # Directory.Build.props builds net10.0 only on a .NET 10 SDK (MSBuild 18): a package
          # without it would be a silent downgrade, so fail the release instead.
          for n in "$RUNNER_TEMP"/nupkgs/*.nupkg; do
            unzip -l "$n" | grep -q "lib/net10.0/" || { echo "::error::$n has no net10.0 build"; exit 1; }
          done
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: nupkgs
          path: ${{ runner.temp }}/nupkgs/*.nupkg
          if-no-files-found: error
          retention-days: 1

  nuget:
    needs: nuget-pack
    runs-on: ubuntu-latest
    # NuGet Trusted Publishing: the job exchanges its GitHub OIDC token for a short-lived API key
    # (policy on nuget.org: owner miguelperezcolom, repo mateu, workflow buid-and-publish.yml).
    permissions:
      id-token: write
    steps:
      - name: Set up .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: nupkgs
          path: ${{ runner.temp }}/nupkgs
      - name: NuGet login (Trusted Publishing)
        id: nuget-login
        if: vars.NUGET_USER != ''
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1.2.0
        with:
          user: ${{ vars.NUGET_USER }}
      - name: Push to NuGet
        env:
          # Trusted Publishing when the NUGET_USER variable is set; else a classic NUGET_API_KEY secret.
          NUGET_API_KEY: ${{ steps.nuget-login.outputs.NUGET_API_KEY || secrets.NUGET_API_KEY }}
        run: |
          if [ -z "$NUGET_API_KEY" ]; then
            echo "::notice::Neither the NUGET_USER variable (Trusted Publishing) nor a NUGET_API_KEY secret is set — packages built, nothing pushed."
            exit 0
          fi
          dotnet nuget push "$RUNNER_TEMP/nupkgs/*.nupkg" --api-key "$NUGET_API_KEY" \
            --source https://api.nuget.org/v3/index.json --skip-duplicate --timeout 900
