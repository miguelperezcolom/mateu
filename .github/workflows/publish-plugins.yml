# Publishes the two IDE plugins when a DEDICATED plugin release is cut — a GitHub Release whose tag
# starts with `plugins-v` (e.g. `plugins-v0.2.0`). The version is taken from the tag and injected into
# both plugins, so the tag is the single source of truth and neither file has to be bumped by hand.
#
# It does NOT run on the framework's `v3.0-alpha.N` releases (Maven Central) or the `mateu-desktop-*`
# installer releases — the `if:` guard on each job scopes it to `plugins-v*`.
#
# Required repository secrets (Settings → Secrets and variables → Actions):
#   PUBLISH_TOKEN  — JetBrains Marketplace token   (https://plugins.jetbrains.com/author/me/tokens)
#   VSCE_PAT       — VS Code Marketplace PAT        (Azure DevOps, scope: Marketplace → Manage)
#   OVSX_PAT       — Open VSX token                 (https://open-vsx.org/user-settings/tokens)
# Optional (IntelliJ plugin signing — recommended, but publishing works unsigned without them):
#   CERTIFICATE_CHAIN, PRIVATE_KEY, PRIVATE_KEY_PASSWORD
#
# NOTE: the FIRST publish of each plugin (creating the Marketplace listing / the Open VSX namespace)
# is done manually; this workflow publishes UPDATES to the already-created listings.

name: Publish plugins

on:
  release:
    types: [published]

# Publishing uses the marketplace tokens; the GitHub token only needs to check the repo out.
permissions:
  contents: read

jobs:
  intellij:
    if: startsWith(github.event.release.tag_name, 'plugins-v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Derive version from the tag
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: echo "PLUGIN_VERSION=${TAG#plugins-v}" >> "$GITHUB_ENV"
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          java-version: 21
          distribution: zulu
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      # The plugin build rebuilds + embeds the shared visual-editor web bundle (copyVisualEditor →
      # apps/visual-editor `npm run copy`), which needs the monorepo workspaces installed — only the two
      # it is built from, and without install hooks (none is needed: esbuild's binary is an optional
      # dependency; run_tests.yml's frontend-lib builds the same workspaces from the same install).
      - name: Install monorepo dependencies
        run: cd frontend/web/monorepo && npm ci --workspace mateu --workspace mateu-visual-editor --include-workspace-root --ignore-scripts
      - name: Set the plugin version from the tag
        run: cd frontend/app/intellij-plugin && sed -i 's/^version = ".*"/version = "'"$PLUGIN_VERSION"'"/' build.gradle.kts
      # Never publish what the Plugin Verifier rejects (compatibility with the recommended IDEs of the
      # since/until range, internal or removed API usage, descriptor problems).
      - name: Verify the plugin
        run: cd frontend/app/intellij-plugin && ./gradlew test verifyPlugin --no-daemon --console=plain
      # `publishPlugin` intermittently dies with a transient Gradle `ClosedFileSystemException` during
      # the build phase (before the upload), so retry a few times — with a fresh daemon each attempt —
      # instead of needing a manual re-run. If a prior attempt actually uploaded (so the marketplace
      # already has this version), treat "already contains version" as success rather than failing.
      - name: Publish to the JetBrains Marketplace
        env:
          PUBLISH_TOKEN: ${{ secrets.PUBLISH_TOKEN }}
          CERTIFICATE_CHAIN: ${{ secrets.CERTIFICATE_CHAIN }}
          PRIVATE_KEY: ${{ secrets.PRIVATE_KEY }}
          PRIVATE_KEY_PASSWORD: ${{ secrets.PRIVATE_KEY_PASSWORD }}
        run: |
          cd frontend/app/intellij-plugin
          for attempt in 1 2 3; do
            echo "::group::publishPlugin attempt $attempt"
            set +e
            ./gradlew publishPlugin --no-daemon --console=plain 2>&1 | tee /tmp/publish.log
            rc=${PIPESTATUS[0]}
            set -e
            echo "::endgroup::"
            [ "$rc" = "0" ] && exit 0
            if grep -q "already contains version" /tmp/publish.log; then
              echo "Marketplace already has this version — treating as success."; exit 0
            fi
            echo "attempt $attempt failed (likely transient); stopping the daemon and retrying…"
            ./gradlew --stop || true
            sleep 15
          done
          echo "publishPlugin failed after 3 attempts."; exit 1

  vscode:
    if: startsWith(github.event.release.tag_name, 'plugins-v')
    runs-on: ubuntu-latest
    env:
      # Job-level so the Open VSX step can be skipped (via its `if:`) when the token isn't configured.
      OVSX_PAT: ${{ secrets.OVSX_PAT }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Derive version from the tag
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: echo "PLUGIN_VERSION=${TAG#plugins-v}" >> "$GITHUB_ENV"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      # `vsce package` runs vscode:prepublish (copy:web builds the visual-editor bundle into media/),
      # which needs the monorepo workspaces installed (the two it is built from, no install hooks).
      - name: Install monorepo dependencies
        run: cd frontend/web/monorepo && npm ci --workspace mateu --workspace mateu-visual-editor --include-workspace-root --ignore-scripts
      # --ignore-scripts, then the ONE install hook the publish may need, run explicitly:
      # @vscode/vsce-sign's postinstall copies its platform binary (shipped as an optional dependency)
      # into place; vsce uses it for signing. keytar's (optional, native) is not needed to publish
      # with a --pat. tooling-tests in run_tests.yml packages the extension from this same install.
      - name: Install extension dependencies
        run: |
          cd frontend/app/vscode-extension
          npm ci --ignore-scripts
          npm rebuild @vscode/vsce-sign
      - name: Set the extension version from the tag
        run: cd frontend/app/vscode-extension && npm version "$PLUGIN_VERSION" --no-git-tag-version --allow-same-version
      - name: Test the extension
        run: cd frontend/app/vscode-extension && npm run compile && npm test
      - name: Package the .vsix
        run: cd frontend/app/vscode-extension && npx --no -- vsce package -o mateu-visual-editor.vsix
      - name: Publish to the VS Code Marketplace
        run: cd frontend/app/vscode-extension && npx --no -- vsce publish --packagePath mateu-visual-editor.vsix --pat "$VSCE_PAT"
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
      # Optional: skipped when OVSX_PAT is not set, so IntelliJ + VS Code Marketplace alone are enough.
      - name: Publish to Open VSX
        if: ${{ env.OVSX_PAT != '' }}
        # ovsx is not a dependency of the extension: installed at an exact version, without install
        # hooks, outside the project (not `npx --yes`, which would fetch and run it on demand).
        run: |
          npm install --prefix "$RUNNER_TEMP/ovsx" --no-save --ignore-scripts ovsx@1.2.0
          cd frontend/app/vscode-extension
          "$RUNNER_TEMP/ovsx/node_modules/.bin/ovsx" publish mateu-visual-editor.vsix -p "$OVSX_PAT"
