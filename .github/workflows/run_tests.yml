# Named for what it does rather than for the one job it started as: it now also guards the
# committed bundles, the annotation density and the shared frontend library. Renaming the WORKFLOW
# is safe for branch protection, which names JOBS (`e2e`) and not workflows.
name: Tests

on:
  pull_request:
  workflow_dispatch:
  workflow_call:

# Every job here only reads the repository. The repo's default GITHUB_TOKEN is read-WRITE, and this
# workflow runs on pull requests (and, via workflow_call, inside the release), so without this block
# every step — npm/maven install hooks included — would hold a token that can push to the repo.
permissions:
  contents: read

# Each job below sets timeout-minutes: without a cap a job inherits GitHub's 6-hour default, and
# the Playwright download once hung a PR and a release run for ~50 minutes each. The caps
# are ~2.5x the slowest green run of each job.

jobs:
  # The committed renderer bundles are derived artifacts regenerated by hand, and the e2e job below
  # builds the backend FROM them without recompiling the TypeScript. When a source fix lands and the
  # bundle is not regenerated, e2e silently exercises the pre-fix frontend — which is exactly what
  # happened between 2026-08-11 and 2026-08-12, leaving the required check red for weeks and making
  # "merge past the red check" routine. This guard makes the drift fail fast and say what to run.
  bundle-freshness:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0 # the check compares commit ancestry, so it needs the history

      - name: Bundles are not older than their source
        run: scripts/check-bundle-freshness.sh

      # The framework's own thesis, measured: a screen should need few annotations, and that number
      # should not creep up. Each new annotation is always justifiable alone; the sum is what drifts.
      - name: Annotations per screen have not crept up
        run: python3 scripts/annotation-density.py --check

  # The shared frontend library is where the renderers' logic actually lives, and nothing in CI
  # compiled or ran it: `run_tests.yml` builds the backend from the COMMITTED bundle, and the
  # release workflow's `apps/vaadin && npm run copy` typechecks against the APP's tsconfig, which
  # excludes the library's test files. So a `tsc` error in libs/mateu sat on master while every
  # check stayed green, and its 304 unit tests only ran on whoever remembered to run them.
  #
  # The typecheck comes first in the same job on purpose: the tests run through vitest's own
  # transform, which strips types without checking them, so they pass over exactly the errors
  # this step exists to catch — running them first would report success from a tree that does
  # not compile.
  frontend-lib:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/web/monorepo/package-lock.json

      # Scoped to the one workspace: a plain `npm ci` at the monorepo root also installs
      # apps/redwood's Oracle tooling, part of which comes from static.oracle.com rather than the
      # npm registry — an external host this job has no reason to depend on. `--ignore-scripts`
      # keeps the dependency tree's install hooks from running arbitrary code on the runner; the
      # platform binaries this build needs (esbuild's) arrive as optional dependencies rather than
      # from a postinstall, so the build and the suite were verified to pass without them.
      - name: Install the library's dependencies
        run: cd frontend/web/monorepo && npm ci --workspace mateu --workspace mateu-visual-editor --workspace mateu-vaadin --include-workspace-root --ignore-scripts

      # The vaadin-lit jar is Apache-2.0: nothing bundled into it may be under a commercial licence
      # (it once shipped @vaadin/board, @vaadin/rich-text-editor and a Highcharts chunk).
      - name: Bundled frontend dependencies are under approved licences
        run: node scripts/check-frontend-licenses.mjs

      # Mateu's own components take colour, spacing and type from the design system's tokens; a
      # hard-coded literal ignores dark mode, forced colours and a customer theme. A ratchet: the
      # per-file counts in scripts/design-tokens-baseline.json may only go down (UX review 2026-10).
      - name: Visual consistency — no new hard-coded colours / spacing / font sizes
        run: node --test scripts/check-design-tokens.test.mjs && node scripts/check-design-tokens.mjs

      # no-eval/no-new-func are ERRORS (the client runs under a CSP without 'unsafe-eval');
      # no-console/no-explicit-any warnings are capped by --max-warnings (ratchet it down).
      - name: Lint (ESLint)
        run: cd frontend/web/monorepo && npm run lint

      - name: Typecheck and build the library
        run: cd frontend/web/monorepo/libs/mateu && npm run build

      # Coverage is a ratchet: the thresholds in vitest.config.ts are the measured values, so a PR
      # can only keep or raise them.
      - name: Unit tests (with coverage thresholds)
        run: cd frontend/web/monorepo/libs/mateu && npm run test:coverage

      # The JavaScript every page loads eagerly has a recorded ceiling (scripts/bundle-budget.json):
      # @ui5 once sat in a preloaded chunk (≈640 KB on every page) for one optional field.
      - name: Vaadin renderer — typecheck, tests (with coverage thresholds), build and eager bundle budget
        run: |
          cd frontend/web/monorepo/apps/vaadin
          npx --no -- tsc --noEmit -p .
          npm run test:coverage
          npx --no -- vite build
          node scripts/check-bundle-budget.mjs

      # The visual editor (embedded in both IDE plugins) has its own vitest suite. Same order as
      # above: typecheck before the tests; its coverage is a ratchet too (vitest.config.ts).
      - name: Visual editor — typecheck and tests (with coverage thresholds)
        run: |
          cd frontend/web/monorepo/apps/visual-editor
          npx --no -- tsc --noEmit
          npm run test:coverage

  # Small, dependency-light suites that existed but never ran in CI: the Redwood core's wire-contract
  # tests (node only, no install), the MCP server, prompt-to-app, the React Native renderer's pure
  # helpers and the VS Code extension. Together they take seconds.
  tooling-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      # Every suite of the Redwood core, each run as a test file by node's own runner (so one failing
      # suite fails the step), with a coverage ratchet over the poc sources: the wire-contract suites,
      # the embedded <mateu-ui> JET Custom Component (test-embedded), live reload, the pattern gaps,
      # the REST source catalogue and the DOM wiring (test-dom, over test-harness-dom's fake DOM).
      # test-live-reload/test-patterns/test-sources existed but never ran here.
      - name: Redwood core tests (with coverage thresholds)
        run: >-
          cd frontend/web/monorepo/apps/redwood/poc && node --test --experimental-test-coverage
          --test-coverage-include='*.mjs' --test-coverage-include='core/*.mjs'
          --test-coverage-exclude='test*.mjs' --test-coverage-exclude='make-*.mjs'
          --test-coverage-exclude='capture*.mjs' --test-coverage-exclude='probe*.mjs'
          --test-coverage-exclude='parity-check.mjs' --test-coverage-exclude='coverage.mjs'
          --test-coverage-lines=98 --test-coverage-functions=95 --test-coverage-branches=85
          test.mjs test-pms.mjs test-display.mjs test-chains.mjs test-editor.mjs test-embedded.mjs
          test-live-reload.mjs test-patterns.mjs test-sources.mjs test-dom.mjs test-e2.mjs test-e2-dom.mjs test-mobile.mjs
          test-vb-chains.mjs test-projections.mjs test-conformance.mjs test-security.mjs

      - name: Redwood atom template is expanded in every surface
        run: cd frontend/web/monorepo/apps/redwood/poc && node make-html.mjs --check

      - name: Redwood VB translation bundle matches the chrome catalogue (poc/i18n.mjs)
        run: cd frontend/web/monorepo/apps/redwood/poc && node make-nls.mjs --check

      # The committed AMD bridge (webApps/.../mateu-bridge.js) is what the app loads; poc/ is what the
      # tests above exercise. A poc/ change without `npm run bridge` passed CI and shipped old code.
      - name: Redwood bridge is regenerated from poc/
        run: cd frontend/web/monorepo/apps/redwood/poc && node make-amd.mjs --check

      - name: parity.md tells the truth about Redwood (coverage vs wire catalogue vs renderer code)
        run: cd frontend/web/monorepo/apps/redwood/poc && node parity-check.mjs

      - name: MCP server tests
        run: cd frontend/mcp-server && node --test

      - name: prompt-to-app tests
        run: cd frontend/prompt-to-app && npm ci --ignore-scripts && node --test

      # The controller's suite mocks its two platform edges (a11y, document effects) with mock.module.
      - name: React Native renderer unit tests (with coverage thresholds)
        run: >-
          cd frontend/app/react-native && node --test --experimental-test-module-mocks
          --experimental-test-coverage --test-coverage-include='src/**/*.ts'
          --test-coverage-exclude='src/**/*.test.ts' --test-coverage-lines=98
          --test-coverage-branches=89 --test-coverage-functions=95 'src/**/*.test.ts'

      - name: React Native renderer wire coverage (every wire type rendered, parity.md in sync)
        run: cd frontend/app/react-native && node scripts/parity-check.mjs

      - name: React Native renderer type check
        run: cd frontend/app/react-native && npm ci --ignore-scripts && npx --no -- tsc --noEmit

      # Typecheck, unit tests (manifest contract + New File skeletons) and a real non-interactive
      # `vsce package` — packaging stages LICENSE, the specs schema, the New File templates and the
      # visual-editor bundle (the one committed in the IntelliJ plugin, since the monorepo is not
      # installed here), so a broken staging step fails the PR instead of the release.
      - name: VS Code extension — typecheck, tests and packaging
        run: |
          cd frontend/app/vscode-extension
          npm ci --ignore-scripts
          npm run compile
          npm run test:coverage
          npm run package < /dev/null
          rm -f ./*.vsix

      # The Figma plugin draws the library from design/figma/contract.json: its test fails when a
      # sketch primitive used by the contract has no case in renderItem (the `tile` gap).
      - name: Figma plugin — typecheck and tests
        run: |
          cd design/figma/plugin
          npm ci --ignore-scripts
          npm run typecheck
          npm test

  # The IntelliJ plugin's suite (settings/auth, New | Mateu skeletons validated against the specs
  # schema, wire-type parity, headless rendering of every component type, the YAML binding
  # annotator) only ran on a developer's machine. setup-gradle only WRITES its cache on master, where
  # this workflow does not run, so the IDE (~1 GB) is downloaded on every PR run; only the small layout
  # index is shared (warm-caches.yml).
  intellij-plugin:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          java-version: 21
          distribution: zulu

      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4.4.3
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/master' }}

      # The IDE layout index (~150 KB) is what the flaky "Could not find bundled plugin with ID:
      # 'com.intellij.java'" is computed into: building it from a fresh IDE races inside the IntelliJ
      # Platform Gradle Plugin (scripts/intellij-gradle.sh explains), a warm one never does. It is
      # keyed on the build script, which pins both the IDE version and the plugin version; the
      # master-scoped entry every PR can read is written by warm-caches.yml.
      - name: Restore the IntelliJ layout index
        id: layout-index
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: frontend/app/intellij-plugin/.intellijPlatform/layoutIndex
          key: intellij-layout-index-${{ hashFiles('frontend/app/intellij-plugin/build.gradle.kts') }}

      # copyVisualEditor is skipped (with a warning) because the web monorepo is not installed: the
      # tests run against the committed visual-editor bundle, which bundle-freshness guards.
      # The wrapper discards an incomplete index and retries ONCE on that one failure signature.
      - name: IntelliJ plugin tests
        run: scripts/intellij-gradle.sh test koverVerify --console=plain

      - name: Save the IntelliJ layout index (only a complete one)
        if: success() && steps.layout-index.outputs.cache-hit != 'true' && hashFiles('frontend/app/intellij-plugin/.intellijPlatform/layoutIndex/*.json') != ''
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: frontend/app/intellij-plugin/.intellijPlatform/layoutIndex
          key: intellij-layout-index-${{ hashFiles('frontend/app/intellij-plugin/build.gradle.kts') }}

  # The browser suite, split into legs that run side by side (scripts/ci-e2e-leg.sh says which SUT
  # apps and Playwright projects each one owns). As ONE job on one worker it was the critical path of
  # the whole workflow (22-26 min, ~20 of them the tests: the shared suite takes ~4 min per adapter,
  # five times). Each leg has its own SUT apps, so every test still has its server to itself and the
  # specs did not have to become safe to run concurrently against one SUT.
  e2e-legs:
    name: e2e (${{ matrix.leg }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        leg: [core, webflux-quarkus, micronaut-helidon]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up JDK 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          java-version: 21
          distribution: zulu

      # Before the SUT start: the YAML federation's static host (core leg) is a node script.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - name: Build backend
        run: mvn -B install -DskipTests -Dgpg.skip=true --file backend/pom.xml

      - name: Build the leg's SUT apps
        run: scripts/ci-e2e-leg.sh ${{ matrix.leg }} build

      - name: Start the leg's SUT apps
        run: scripts/ci-e2e-leg.sh ${{ matrix.leg }} start

      # --ignore-scripts: nothing in e2e/ needs an install hook (the lockfile's only one is fsevents,
      # macOS-only); the browsers come from the explicit `playwright install` below.
      - name: Install npm dependencies
        run: cd e2e && npm ci --ignore-scripts

      # The browser download is the one step of this job that reaches outside GitHub and npm, and
      # it has no timeout of its own: on 2026-08-19 it hung a release run and a PR run for ~50
      # minutes each without ever failing, blocking the publish to Maven Central. The binaries
      # only change when @playwright/test does, so key the cache on the lockfile that pins it.
      - name: Cache Playwright browsers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('e2e/package-lock.json') }}
          restore-keys: ${{ runner.os }}-playwright-

      # Kept unconditional on purpose: --with-deps also installs SYSTEM packages, which live
      # outside the cached directory and are needed on every run. On a cache hit this is the apt
      # part only — the ~150 MB download is what the cache saves.
      - name: Install Playwright browsers
        run: cd e2e && npx --no -- playwright install --with-deps chromium

      # Bounded (max 3 min per port) so a SUT app that fails to boot fails the job fast with logs,
      # instead of hanging the runner forever on an unbounded `until curl` loop.
      - name: Wait for the SUT apps to be ready
        run: scripts/ci-e2e-leg.sh ${{ matrix.leg }} wait

      # core: mvc-app1, renderer-vaadin, both federations, the YAML federation and `journeys`
      # (tests/journeys — end-to-end user journeys on mvc-app1 only; yaml-proxy.spec.ts starts its
      # own upstream on :19395). The other legs: the shared suite on their two adapters.
      - name: Run Playwright tests
        run: scripts/ci-e2e-leg.sh ${{ matrix.leg }} test

      # The web renderer under a bad connection (skeleton, busy control, no double submit, offline
      # banner, Retry, 503 handling), against mvc-app1. Timing-based, so ONE retry: a real regression
      # fails both runs.
      - name: Slow-network probe (web renderer)
        if: matrix.leg == 'core'
        run: cd e2e && (BASE=http://localhost:8080 OUT=slow-network-shots node slow-network-probe.mjs || (sleep 5 && BASE=http://localhost:8080 OUT=slow-network-shots node slow-network-probe.mjs))

      # axe-core (WCAG 2.1 A/AA) over representative routes, journeys included; fails on any
      # violation or on a route it could not scan (a11y-audit.mjs).
      - name: Accessibility audit (axe)
        if: matrix.leg == 'core'
        run: cd e2e && BASE=http://localhost:8080 ROUTES=/,/all-types,/validation,/app,/items,/tabs,/sections,/accordion,/capability-books,/j/tasks,/j/stock,/j/sales,/j/charges,/j/fields,/j/roles,/j/proxied node a11y-audit.mjs

      - name: Dump SUT logs on failure
        if: failure()
        run: scripts/ci-e2e-leg.sh ${{ matrix.leg }} logs

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report-${{ matrix.leg }}
          path: |
            e2e/playwright-report/
            e2e/slow-network-shots/
          retention-days: 7
          if-no-files-found: ignore

  # Branch protection on master still requires a check named `e2e` (design/ci-required-checks.md:
  # until it is swapped for `ci-ok`). A matrix reports one check PER LEG ("e2e (core)", …) and none
  # called `e2e`, which would block every PR forever — so this job keeps the name and reports the
  # legs' verdict: green only when every leg succeeded.
  e2e:
    if: always()
    needs: e2e-legs
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Every e2e leg passed
        env:
          RESULT: ${{ needs.e2e-legs.result }}
        run: |
          echo "e2e legs: $RESULT"
          [ "$RESULT" = success ] || { echo "::error::an e2e leg failed or was cancelled ($RESULT)"; exit 1; }

  # The Python port (PyPI `mateu-ui`): the suite — including its wire-conformance runner, a HARD
  # gate (an unexpected corpus diff fails; only allow-listed cases xfail, strictly) — on every
  # supported interpreter, with the package INSTALLED from pyproject (its declared dependencies,
  # not a hand-kept requirements list), plus mypy over the typed packages and a wheel that must install and import cleanly.
  python:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install the package
        run: pip install "./backend/python[dev,all]"
      - name: Tests (with the coverage floor of pyproject's [tool.coverage.report])
        run: |
          cd backend/python
          python -m coverage run -m pytest -q -p no:cacheprovider tests/
          python -m coverage report
      # coverage.py's fail_under is lines+branches COMBINED; gate each one on its own floor too
      - name: Line and branch coverage floors (pyproject's [tool.mateu.coverage])
        run: |
          cd backend/python
          python -m coverage json -q -o /tmp/python-coverage.json
          python - <<'EOF'
          import json, sys, tomllib
          floors = tomllib.load(open("pyproject.toml", "rb"))["tool"]["mateu"]["coverage"]
          totals = json.load(open("/tmp/python-coverage.json"))["totals"]
          measured = {"lines": totals["percent_statements_covered"], "branches": totals["percent_branches_covered"]}
          failed = False
          for kind, floor in floors.items():
              print(f"{kind}: {measured[kind]:.2f}% (floor {floor}%)")
              failed |= measured[kind] < floor
          sys.exit(1 if failed else 0)
          EOF
      - name: Types
        run: cd backend/python && mypy
      - name: The wheel builds, installs and imports
        run: |
          python -m build backend/python --outdir /tmp/dist
          python -m venv /tmp/wheelcheck
          /tmp/wheelcheck/bin/pip install /tmp/dist/*.whl
          /tmp/wheelcheck/bin/python -c "import mateu_uidl, mateu_dtos, mateu_core, mateu_fastapi"

  # The oldest versions the package's lower bounds admit: a bound nobody installs is a bound
  # nobody tests, and `>=` is a promise.
  python-lowest-deps:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
      - name: Install the package at its lowest direct dependencies
        run: |
          uv venv /tmp/lowest --python 3.11
          VIRTUAL_ENV=/tmp/lowest uv pip install --resolution lowest-direct "./backend/python[dev]"
      - name: Tests
        run: cd backend/python && /tmp/lowest/bin/python -m pytest -q -p no:cacheprovider tests/

  # The VB/Redwood renderer in a real browser. Nothing else loads it: the e2e job above serves only
  # vaadin-lit, and the Redwood Node suites (tooling-tests) check its core, not the app VB paints.
  # The jar is built HERE FROM SOURCE (grunt vb-build + scripts/copy.mjs) rather than taken from the
  # committed resources, so a renderer change is exercised in the PR that makes it. It runs headless:
  # the old "VB does not paint headless" finding was the unsecured index never promoting the VB boot
  # scripts (fixed in index.ftl), not Chromium. Needs static.oracle.com: Oracle's grunt tooling at
  # npm install time and JET / oj-sp / the visual-runtime at runtime (never vendored - NOTICE.md).
  renderer-vb:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up JDK 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          java-version: 21
          distribution: zulu

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - name: Build backend
        run: mvn -B install -DskipTests -Dgpg.skip=true --file backend/pom.xml

      # Only the redwood workspace: its devDependencies are Oracle's grunt tooling (tarballs from
      # static.oracle.com, pinned in package.json / package-lock.json). --ignore-scripts: none of that
      # tooling declares an install hook (package-lock.json `hasInstallScript` lists only esbuild,
      # core-js, fsevents and @vaadin/vaadin-usage-statistics, none of which vb-build needs).
      - name: Install the Redwood renderer's build tooling
        run: cd frontend/web/monorepo && npm ci --workspace mateu-redwood --ignore-scripts

      # vb-build's exit code is unreliable (it can fail in a network subtask after writing the
      # output), so the artifact is what is checked; copy.mjs then lays it out as the jar resources.
      - name: Build the Redwood renderer from source into its jar
        run: |
          (cd frontend/web/monorepo/apps/redwood && (npm run build || true))
          test -f frontend/web/monorepo/apps/redwood/build/optimized/webApps/vbredwoodapp/index.html
          (cd frontend/web/monorepo/apps/redwood && npm run copy)
          mvn -B install -DskipTests -Dgpg.skip=true --file backend/pom.xml -pl shared/frontend/redwood

      # demo-vb (the renderer's reference app: a root App with a menu plus standalone UIs at their own
      # mounts) for the probes and the smoke pass; mvc-app1 built a second time with the redwood
      # renderer for the renderer-agnostic Playwright specs.
      - name: Build demo-vb and the renderer-vb SUT
        run: |
          mvn -B package -DskipTests --file demo/demo-vb/pom.xml
          mvn -B install -Dmaven.test.skip=true -Dgpg.skip=true --file e2e/sut/pom.xml -pl modules/sample1
          mvn -B package -Dmaven.test.skip=true -Dgpg.skip=true --file e2e/sut/pom.xml -pl apps/mvc-app1 -Dmateu.renderer=mateu-redwood -Dsut.build.dir=target-vb

      - name: Start demo-vb (:9005) and the renderer-vb SUT (:8090)
        run: |
          java -jar demo/demo-vb/target/demo-vb-0.0.1-SNAPSHOT.jar --server.port=9005 > /tmp/demo-vb.log 2>&1 &
          java -jar e2e/sut/apps/mvc-app1/target-vb/mvc-app1-1.0.0-SNAPSHOT.jar --server.port=8090 > /tmp/mvc-app-vb.log 2>&1 &
          for url in http://localhost:9005/ http://localhost:8090/app; do
            tries=0
            until curl -s -o /dev/null "$url"; do
              tries=$((tries + 1))
              if [ "$tries" -ge 90 ]; then echo "::error::$url was not ready after 3 minutes"; exit 1; fi
              sleep 2
            done
            echo "$url is ready"
          done

      # --ignore-scripts: nothing in e2e/ needs an install hook (the lockfile's only one is fsevents,
      # macOS-only); the browsers come from the explicit `playwright install` below.
      - name: Install npm dependencies
        run: cd e2e && npm ci --ignore-scripts

      - name: Cache Playwright browsers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('e2e/package-lock.json') }}
          restore-keys: ${{ runner.os }}-playwright-

      - name: Install Playwright browsers
        run: cd e2e && npx --no -- playwright install --with-deps chromium

      - name: Smoke pass of demo-vb's key screens (root App and standalone mounts)
        run: cd e2e && VB_URL=http://localhost:9005 node vb-smoke.mjs --shots vb-shots

      - name: Accessibility probe (axe + SPA behaviour)
        run: cd e2e && VB_URL=http://localhost:9005/ node vb-a11y-probe.mjs

      - name: Slow / unreliable network probe
        run: cd e2e && VB_URL=http://localhost:9005/ node vb-slow-network-probe.mjs

      - name: Renderer-agnostic specs against Redwood
        run: cd e2e && RENDERER_VB=1 npx --no -- playwright test --project renderer-vb

      - name: Dump renderer-vb logs on failure
        if: failure()
        run: |
          for f in /tmp/demo-vb.log /tmp/mvc-app-vb.log; do
            echo "===== $f ====="
            tail -n 80 "$f"
          done

      - name: Upload Redwood screenshots and Playwright report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: renderer-vb
          path: |
            e2e/vb-shots/
            e2e/playwright-report/
          retention-days: 7

  # Backend + port test suites — including the shared wire-conformance corpus (conformance/README.md).
  # Until now the rest of run_tests.yml built the whole backend with -DskipTests and never invoked
  # pytest or dotnet test, so ~1000 core tests, the .NET/Python golden suites AND the conformance
  # corpus all ran only on whoever remembered — a port could drift from the wire with every check
  # still green. This job runs the Java and .NET ones (the Python suite has its own `python` job
  # above, on every supported interpreter); each suite includes its wire-conformance runner.
  backend-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up JDK 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          java-version: 21
          distribution: zulu

      # ONE reactor build that installs AND tests (it used to be `install -DskipTests` of everything
      # followed by `verify` of the tested modules, compiling the backend twice). Every module with a
      # suite runs it with the JaCoCo coverage gate. Core is where the ~1200 unit tests + the Java
      # conformance runner live; uidl (schema/annotation tests), the two annotation processors (one
      # carries a 70% per-package coverage floor) and webflux-core's in-JVM *IT suite also have
      # tests. Every adapter runs its own AdapterParityITFoundation suite (security, CORS, MCP,
      # documents, error boundary over real HTTP) and carries a coverage floor, as does the bundle
      # plugin; the e2e legs above exercise them end to end on top.
      #
      # `coverage` (last) merges every module's JaCoCo data and gates mateu-uidl and mateu-dtos over
      # ALL the suites — per module, uidl only counts its own tests and dtos has none, so neither
      # had a meaningful gate. Its full cross-module report is uploaded below.
      #
      # The archetype's integration test (generating and packaging sample projects) stays skipped,
      # as it was under -DskipTests. javadoc is skipped: it is not what this gate is for — the gate is
      # the test suite + JaCoCo coverage check.
      #
      # The build also runs the public-API compatibility check (japicmp) of uidl, dtos and core's
      # archetypes against the last release (backend/pom.xml <mateu.japicmp.baseline>). It is
      # REPORT-ONLY while the version is an alpha (<mateu.japicmp.enforce>false</...>); from the
      # beta tag on it fails the build on an incompatible change that is neither @Experimental nor in
      # backend/api-compat/japicmp-exclusions.properties.
      - name: Java module tests + coverage gate + API compatibility
        run: >-
          mvn -B install -Dgpg.skip=true -Dmaven.javadoc.skip=true -Darchetype.test.skip=true
          --file backend/pom.xml

      - name: Upload the cross-module coverage report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: java-coverage
          path: backend/coverage/target/site/
          if-no-files-found: ignore

      - name: API compatibility report
        if: always()
        run: |
          {
            echo "## Public API compatibility (japicmp, vs the last release)"
            for m in uidl dtos core; do
              f="backend/shared/$m/target/japicmp/api-compatibility.md"
              if [ -f "$f" ]; then echo; echo "### $m"; head -c 60000 "$f"; fi
            done
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload API compatibility reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: japicmp-reports
          path: backend/shared/*/target/japicmp/
          if-no-files-found: ignore

      # The .NET port multi-targets both supported LTS runtimes (net8.0 until its 2026-11-10 end of
      # support, and net10.0): the 10 SDK builds both, the 8 runtime runs the net8.0 leg. `dotnet test`
      # runs the suite once per target framework, so both legs (and the conformance gate) are tested.
      - name: Set up .NET
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      # coverlet (coverage.cobertura.xml per target framework) and a LINE and a BRANCH floor per
      # package — a ratchet at the measured values (2026-10-17, net8.0: lines Uidl 98.9 / Core 96.2 /
      # Dtos 99.9 / AspNetCore 98.3; branches Uidl 90.7 / Core 84.8 / Dtos 100 / AspNetCore 84.9),
      # rounded down. Raise them as suites grow; never lower one to make a PR pass.
      - name: .NET tests (net8.0 + net10.0) with coverage
        run: cd backend/dotnet && dotnet test --collect:"XPlat Code Coverage" --results-directory /tmp/dotnet-coverage

      - name: .NET coverage floor
        run: |
          python3 - <<'EOF'
          import glob, sys, xml.etree.ElementTree as ET
          floors = {"Mateu.Uidl": 0.98, "Mateu.Core": 0.96, "Mateu.Dtos": 0.99, "Mateu.AspNetCore": 0.98}
          branch_floors = {"Mateu.Uidl": 0.90, "Mateu.Core": 0.84, "Mateu.Dtos": 0.95, "Mateu.AspNetCore": 0.84}
          reports = glob.glob("/tmp/dotnet-coverage/*/coverage.cobertura.xml")
          if not reports:
              sys.exit("no coverage report produced")
          failed = False
          for report in reports:
              for package in ET.parse(report).getroot().iter("package"):
                  name, rate = package.get("name"), float(package.get("line-rate"))
                  branches = float(package.get("branch-rate"))
                  floor, branch_floor = floors.get(name), branch_floors.get(name)
                  print(f"{report.split('/')[-2][:8]} {name}: lines {rate:.1%} (floor {floor}), "
                        f"branches {branches:.1%} (floor {branch_floor})")
                  if floor is not None and rate < floor:
                      failed = True
                  if branch_floor is not None and branches < branch_floor:
                      failed = True
          sys.exit(1 if failed else 0)
          EOF

      - name: .NET packages build
        run: cd backend/dotnet && for p in src/*/*.csproj; do dotnet pack "$p" -c Release -o /tmp/nupkgs; done

  # The ONE check branch protection should require (design/ci-required-checks.md). Requiring each
  # job by name breaks whenever a job is added, renamed or split (every matrix leg is its own check:
  # "python (3.11)"), and a required check that never reports blocks the PR forever. This job always
  # runs and always reports: green only when every job it needs succeeded or was legitimately
  # skipped, red when one failed or was cancelled. ADD EVERY NEW JOB OF THIS WORKFLOW TO `needs`.
  ci-ok:
    if: always()
    needs:
      - bundle-freshness
      - frontend-lib
      - tooling-tests
      - intellij-plugin
      - e2e-legs
      - e2e
      - python
      - python-lowest-deps
      - renderer-vb
      - backend-tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Every job passed or was legitimately skipped
        env:
          NEEDS: ${{ toJSON(needs) }}
        # No checkout: the verdict is computed from the `needs` context alone.
        run: |
          echo "$NEEDS" | jq -r 'to_entries[] | "\(.value.result)\t\(.key)"'
          bad=$(echo "$NEEDS" | jq '[to_entries[] | select(.value.result != "success" and .value.result != "skipped")] | length')
          if [ "$bad" != 0 ]; then
            echo "::error::$bad job(s) failed or were cancelled — see the list above."
            exit 1
          fi
