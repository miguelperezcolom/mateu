# Named for what it does rather than for the one job it started as: it now also guards the
# committed bundles, the annotation density and the shared frontend library. Renaming the WORKFLOW
# is safe for branch protection, which names JOBS (`e2e`) and not workflows.
name: Tests

on:
  pull_request:
  workflow_dispatch:
  workflow_call:

# Every job here only reads the repository. The repo's default GITHUB_TOKEN is read-WRITE, and this
# workflow runs on pull requests (and, via workflow_call, inside the release), so without this block
# every step — npm/maven install hooks included — would hold a token that can push to the repo.
permissions:
  contents: read

# Each job below sets timeout-minutes: without a cap a job inherits GitHub's 6-hour default, and
# the Playwright download once hung a PR and a release run for ~50 minutes each. The caps
# are ~2.5x the slowest green run of each job.

jobs:
  # The committed renderer bundles are derived artifacts regenerated by hand, and the e2e job below
  # builds the backend FROM them without recompiling the TypeScript. When a source fix lands and the
  # bundle is not regenerated, e2e silently exercises the pre-fix frontend — which is exactly what
  # happened between 2026-08-11 and 2026-08-12, leaving the required check red for weeks and making
  # "merge past the red check" routine. This guard makes the drift fail fast and say what to run.
  bundle-freshness:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # the check compares commit ancestry, so it needs the history

      - name: Bundles are not older than their source
        run: scripts/check-bundle-freshness.sh

      # The framework's own thesis, measured: a screen should need few annotations, and that number
      # should not creep up. Each new annotation is always justifiable alone; the sum is what drifts.
      - name: Annotations per screen have not crept up
        run: python3 scripts/annotation-density.py --check

  # The shared frontend library is where the renderers' logic actually lives, and nothing in CI
  # compiled or ran it: `run_tests.yml` builds the backend from the COMMITTED bundle, and the
  # release workflow's `apps/vaadin && npm run copy` typechecks against the APP's tsconfig, which
  # excludes the library's test files. So a `tsc` error in libs/mateu sat on master while every
  # check stayed green, and its 304 unit tests only ran on whoever remembered to run them.
  #
  # The typecheck comes first in the same job on purpose: the tests run through vitest's own
  # transform, which strips types without checking them, so they pass over exactly the errors
  # this step exists to catch — running them first would report success from a tree that does
  # not compile.
  frontend-lib:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/web/monorepo/package-lock.json

      # Scoped to the one workspace: a plain `npm ci` at the monorepo root also installs
      # apps/redwood's Oracle tooling, part of which comes from static.oracle.com rather than the
      # npm registry — an external host this job has no reason to depend on. `--ignore-scripts`
      # keeps the dependency tree's install hooks from running arbitrary code on the runner; the
      # platform binaries this build needs (esbuild's) arrive as optional dependencies rather than
      # from a postinstall, so the build and the suite were verified to pass without them.
      - name: Install the library's dependencies
        run: cd frontend/web/monorepo && npm ci --workspace mateu --workspace mateu-visual-editor --workspace mateu-vaadin --include-workspace-root --ignore-scripts

      # The vaadin-lit jar is Apache-2.0: nothing bundled into it may be under a commercial licence
      # (it once shipped @vaadin/board, @vaadin/rich-text-editor and a Highcharts chunk).
      - name: Bundled frontend dependencies are under approved licences
        run: node scripts/check-frontend-licenses.mjs

      # no-eval/no-new-func are ERRORS (the client runs under a CSP without 'unsafe-eval');
      # no-console/no-explicit-any warnings are capped by --max-warnings (ratchet it down).
      - name: Lint (ESLint)
        run: cd frontend/web/monorepo && npm run lint

      - name: Typecheck and build the library
        run: cd frontend/web/monorepo/libs/mateu && npm run build

      # Coverage is a ratchet: the thresholds in vitest.config.ts are the measured values, so a PR
      # can only keep or raise them.
      - name: Unit tests (with coverage thresholds)
        run: cd frontend/web/monorepo/libs/mateu && npm run test:coverage

      # The JavaScript every page loads eagerly has a recorded ceiling (scripts/bundle-budget.json):
      # @ui5 once sat in a preloaded chunk (≈640 KB on every page) for one optional field.
      - name: Vaadin renderer — typecheck, tests (with coverage thresholds), build and eager bundle budget
        run: |
          cd frontend/web/monorepo/apps/vaadin
          npx tsc --noEmit -p .
          npm run test:coverage
          npx vite build
          node scripts/check-bundle-budget.mjs

      # The visual editor (embedded in both IDE plugins) has its own vitest suite (~120 tests, <1s)
      # that only ran by hand. Same order as above: typecheck before the tests.
      - name: Visual editor — typecheck and tests
        run: |
          cd frontend/web/monorepo/apps/visual-editor
          npx tsc --noEmit
          npm test

  # Small, dependency-light suites that existed but never ran in CI: the Redwood core's wire-contract
  # tests (node only, no install), the MCP server, prompt-to-app, the React Native renderer's pure
  # helpers and the VS Code extension. Together they take seconds.
  tooling-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Redwood core contract tests
        run: cd frontend/web/monorepo/apps/redwood/poc && node test.mjs && node test-pms.mjs && node test-display.mjs && node test-chains.mjs && node test-editor.mjs

      # The embedded mode: the <mateu-ui> JET Custom Component a VB developer imports into their
      # own app (poc/embedded.mjs + embedded/mateu-ui) — its runtime, its package and that it installs
      # what the standalone shell installs. Node only, like the contract tests above.
      - name: Redwood embedded component (<mateu-ui>) tests
        run: cd frontend/web/monorepo/apps/redwood/poc && node test-embedded.mjs

      - name: Redwood atom template is expanded in every surface
        run: cd frontend/web/monorepo/apps/redwood/poc && node make-html.mjs --check

      - name: Redwood VB translation bundle matches the chrome catalogue (poc/i18n.mjs)
        run: cd frontend/web/monorepo/apps/redwood/poc && node make-nls.mjs --check

      # The committed AMD bridge (webApps/.../mateu-bridge.js) is what the app loads; poc/ is what the
      # tests above exercise. A poc/ change without `npm run bridge` passed CI and shipped old code.
      - name: Redwood bridge is regenerated from poc/
        run: cd frontend/web/monorepo/apps/redwood/poc && node make-amd.mjs --check

      - name: parity.md tells the truth about Redwood (coverage vs wire catalogue vs renderer code)
        run: cd frontend/web/monorepo/apps/redwood/poc && node parity-check.mjs

      - name: MCP server tests
        run: cd frontend/mcp-server && node --test

      - name: prompt-to-app tests
        run: cd frontend/prompt-to-app && npm ci --ignore-scripts && node --test

      - name: React Native renderer unit tests
        run: cd frontend/app/react-native && node --test 'src/**/*.test.ts'

      - name: React Native renderer wire coverage (every wire type rendered, parity.md in sync)
        run: cd frontend/app/react-native && node scripts/parity-check.mjs

      - name: React Native renderer type check
        run: cd frontend/app/react-native && npm ci --ignore-scripts && npx tsc --noEmit

      # Typecheck, unit tests (manifest contract + New File skeletons) and a real non-interactive
      # `vsce package` — packaging stages LICENSE, the specs schema, the New File templates and the
      # visual-editor bundle (the one committed in the IntelliJ plugin, since the monorepo is not
      # installed here), so a broken staging step fails the PR instead of the release.
      - name: VS Code extension — typecheck, tests and packaging
        run: |
          cd frontend/app/vscode-extension
          npm ci --ignore-scripts
          npm run compile
          npm test
          npm run package < /dev/null
          rm -f *.vsix

      # The Figma plugin draws the library from design/figma/contract.json: its test fails when a
      # sketch primitive used by the contract has no case in renderItem (the `tile` gap).
      - name: Figma plugin — typecheck and tests
        run: |
          cd design/figma/plugin
          npm ci --ignore-scripts
          npm run typecheck
          npm test

  # The IntelliJ plugin's suite (settings/auth, New | Mateu skeletons validated against the specs
  # schema, wire-type parity, headless rendering of every component type, the YAML binding
  # annotator) only ran on a developer's machine. The platform download is cached by setup-gradle.
  intellij-plugin:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v5
        with:
          java-version: 21
          distribution: zulu

      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/master' }}

      # copyVisualEditor is skipped (with a warning) because the web monorepo is not installed: the
      # tests run against the committed visual-editor bundle, which bundle-freshness guards.
      - name: IntelliJ plugin tests
        run: cd frontend/app/intellij-plugin && ./gradlew test --console=plain

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: 21
          distribution: zulu

      - name: Build backend
        run: mvn -B install -DskipTests -Dgpg.skip=true --file backend/pom.xml

      - name: Build SUT apps
        run: mvn -B install -Dmaven.test.skip=true -Dgpg.skip=true --file e2e/sut/pom.xml

      - name: Start SUT apps
        run: |
          java -jar e2e/sut/apps/mvc-app1/target/mvc-app1-1.0.0-SNAPSHOT.jar      > /tmp/mvc-app1.log      2>&1 &
          java -jar e2e/sut/apps/webflux-app1/target/webflux-app1-1.0.0-SNAPSHOT.jar > /tmp/webflux-app1.log  2>&1 &
          java -jar e2e/sut/apps/quarkus-app1/target/quarkus-app1-1.0.0-SNAPSHOT-runner.jar > /tmp/quarkus-app1.log 2>&1 &
          java -jar e2e/sut/apps/micronaut-app1/target/micronaut-app1-1.0.0-SNAPSHOT.jar > /tmp/micronaut-app1.log 2>&1 &
          java -jar e2e/sut/apps/helidon-app1/target/helidon-app1.jar > /tmp/helidon-app1.log 2>&1 &
          java -jar e2e/sut/apps/fed-remote-app/target/fed-remote-app-1.0.0-SNAPSHOT.jar > /tmp/fed-remote-app.log 2>&1 &
          java -jar e2e/sut/apps/fed-shell-app/target/fed-shell-app-1.0.0-SNAPSHOT.jar > /tmp/fed-shell-app.log 2>&1 &
          java -jar e2e/sut/apps/fed-sections-app/target/fed-sections-app-1.0.0-SNAPSHOT.jar > /tmp/fed-sections-app.log 2>&1 &

      - name: Wait for SUT apps to be ready
        run: |
          # mode "ok" requires a 2xx from / (curl -f); "any" accepts any HTTP response.
          # Bounded (max 3 min) so a SUT app that fails to boot fails the job fast with logs,
          # instead of hanging the runner forever on an unbounded `until curl` loop.
          wait_port() {
            port=$1; mode=$2; tries=0
            echo "Waiting for port $port ($mode)..."
            while true; do
              if [ "$mode" = ok ]; then
                curl -sf "http://localhost:$port/" > /dev/null && break
              else
                curl -s -o /dev/null "http://localhost:$port/" && break
              fi
              tries=$((tries + 1))
              if [ "$tries" -ge 90 ]; then
                echo "::error::port $port was not ready after 3 minutes"
                exit 1
              fi
              sleep 2
            done
            echo "Port $port is ready"
          }
          for port in 8080 8081 8082 8083 8086; do wait_port "$port" ok; done
          # the federation apps answer 404 on / — any HTTP response means they are up
          for port in 8084 8085 8087; do wait_port "$port" any; done

      - name: Dump SUT logs on failure
        if: failure()
        run: |
          for f in /tmp/*-app1.log /tmp/fed-*.log; do
            [ -f "$f" ] || continue
            echo "===== $f ====="
            tail -n 60 "$f"
          done

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Install npm dependencies
        run: cd e2e && npm ci

      # The browser download is the one step of this job that reaches outside GitHub and npm, and
      # it has no timeout of its own: on 2026-08-19 it hung a release run and a PR run for ~50
      # minutes each without ever failing, blocking the publish to Maven Central. The binaries
      # only change when @playwright/test does, so key the cache on the lockfile that pins it.
      - name: Cache Playwright browsers
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('e2e/package-lock.json') }}
          restore-keys: ${{ runner.os }}-playwright-

      # Kept unconditional on purpose: --with-deps also installs SYSTEM packages, which live
      # outside the cached directory and are needed on every run. On a cache hit this is the apt
      # part only — the ~150 MB download is what the cache saves.
      - name: Install Playwright browsers
        run: cd e2e && npx playwright install --with-deps chromium

      - name: Run Playwright tests
        run: cd e2e && npx playwright test

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: e2e/playwright-report/
          retention-days: 7

  # The Python port (PyPI `mateu-ui`): the suite — including its wire-conformance runner, a HARD
  # gate (an unexpected corpus diff fails; only allow-listed cases xfail, strictly) — on every
  # supported interpreter, with the package INSTALLED from pyproject (its declared dependencies,
  # not a hand-kept requirements list), plus mypy over the typed packages and a wheel that must install and import cleanly.
  python:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install the package
        run: pip install "./backend/python[dev,all]"
      - name: Tests
        run: cd backend/python && python -m pytest -q -p no:cacheprovider tests/
      - name: Types
        run: cd backend/python && mypy
      - name: The wheel builds, installs and imports
        run: |
          python -m build backend/python --outdir /tmp/dist
          python -m venv /tmp/wheelcheck
          /tmp/wheelcheck/bin/pip install /tmp/dist/*.whl
          /tmp/wheelcheck/bin/python -c "import mateu_uidl, mateu_dtos, mateu_core, mateu_fastapi"

  # The oldest versions the package's lower bounds admit: a bound nobody installs is a bound
  # nobody tests, and `>=` is a promise.
  python-lowest-deps:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: astral-sh/setup-uv@v6
      - name: Install the package at its lowest direct dependencies
        run: |
          uv venv /tmp/lowest --python 3.11
          VIRTUAL_ENV=/tmp/lowest uv pip install --resolution lowest-direct "./backend/python[dev]"
      - name: Tests
        run: cd backend/python && /tmp/lowest/bin/python -m pytest -q -p no:cacheprovider tests/

  # The VB/Redwood renderer in a real browser. Nothing else loads it: the e2e job above serves only
  # vaadin-lit, and the Redwood Node suites (tooling-tests) check its core, not the app VB paints.
  # The jar is built HERE FROM SOURCE (grunt vb-build + scripts/copy.mjs) rather than taken from the
  # committed resources, so a renderer change is exercised in the PR that makes it. It runs headless:
  # the old "VB does not paint headless" finding was the unsecured index never promoting the VB boot
  # scripts (fixed in index.ftl), not Chromium. Needs static.oracle.com: Oracle's grunt tooling at
  # npm install time and JET / oj-sp / the visual-runtime at runtime (never vendored - NOTICE.md).
  renderer-vb:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: 21
          distribution: zulu

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Build backend
        run: mvn -B install -DskipTests -Dgpg.skip=true --file backend/pom.xml

      # Only the redwood workspace: its devDependencies are Oracle's grunt tooling (tarballs from
      # static.oracle.com, pinned in package.json / package-lock.json).
      - name: Install the Redwood renderer's build tooling
        run: cd frontend/web/monorepo && npm ci --workspace mateu-redwood

      # vb-build's exit code is unreliable (it can fail in a network subtask after writing the
      # output), so the artifact is what is checked; copy.mjs then lays it out as the jar resources.
      - name: Build the Redwood renderer from source into its jar
        run: |
          (cd frontend/web/monorepo/apps/redwood && (npm run build || true))
          test -f frontend/web/monorepo/apps/redwood/build/optimized/webApps/vbredwoodapp/index.html
          (cd frontend/web/monorepo/apps/redwood && npm run copy)
          mvn -B install -DskipTests -Dgpg.skip=true --file backend/pom.xml -pl shared/frontend/redwood

      # demo-vb (the renderer's reference app: a root App with a menu plus standalone UIs at their own
      # mounts) for the probes and the smoke pass; mvc-app1 built a second time with the redwood
      # renderer for the renderer-agnostic Playwright specs.
      - name: Build demo-vb and the renderer-vb SUT
        run: |
          mvn -B package -DskipTests --file demo/demo-vb/pom.xml
          mvn -B install -Dmaven.test.skip=true -Dgpg.skip=true --file e2e/sut/pom.xml -pl modules/sample1
          mvn -B package -Dmaven.test.skip=true -Dgpg.skip=true --file e2e/sut/pom.xml -pl apps/mvc-app1 -Dmateu.renderer=mateu-redwood -Dsut.build.dir=target-vb

      - name: Start demo-vb (:9005) and the renderer-vb SUT (:8090)
        run: |
          java -jar demo/demo-vb/target/demo-vb-0.0.1-SNAPSHOT.jar --server.port=9005 > /tmp/demo-vb.log 2>&1 &
          java -jar e2e/sut/apps/mvc-app1/target-vb/mvc-app1-1.0.0-SNAPSHOT.jar --server.port=8090 > /tmp/mvc-app-vb.log 2>&1 &
          for url in http://localhost:9005/ http://localhost:8090/app; do
            tries=0
            until curl -s -o /dev/null "$url"; do
              tries=$((tries + 1))
              if [ "$tries" -ge 90 ]; then echo "::error::$url was not ready after 3 minutes"; exit 1; fi
              sleep 2
            done
            echo "$url is ready"
          done

      - name: Install npm dependencies
        run: cd e2e && npm ci

      - name: Cache Playwright browsers
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('e2e/package-lock.json') }}
          restore-keys: ${{ runner.os }}-playwright-

      - name: Install Playwright browsers
        run: cd e2e && npx playwright install --with-deps chromium

      - name: Smoke pass of demo-vb's key screens (root App and standalone mounts)
        run: cd e2e && VB_URL=http://localhost:9005 node vb-smoke.mjs --shots vb-shots

      - name: Accessibility probe (axe + SPA behaviour)
        run: cd e2e && VB_URL=http://localhost:9005/ node vb-a11y-probe.mjs

      - name: Slow / unreliable network probe
        run: cd e2e && VB_URL=http://localhost:9005/ node vb-slow-network-probe.mjs

      - name: Renderer-agnostic specs against Redwood
        run: cd e2e && RENDERER_VB=1 npx playwright test --project renderer-vb

      - name: Dump renderer-vb logs on failure
        if: failure()
        run: |
          for f in /tmp/demo-vb.log /tmp/mvc-app-vb.log; do
            echo "===== $f ====="
            tail -n 80 "$f"
          done

      - name: Upload Redwood screenshots and Playwright report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: renderer-vb
          path: |
            e2e/vb-shots/
            e2e/playwright-report/
          retention-days: 7

  # Backend + port test suites — including the shared wire-conformance corpus (conformance/README.md).
  # Until now the rest of run_tests.yml built the whole backend with -DskipTests and never invoked
  # pytest or dotnet test, so ~1000 core tests, the .NET/Python golden suites AND the conformance
  # corpus all ran only on whoever remembered — a port could drift from the wire with every check
  # still green. This job runs the Java and .NET ones (the Python suite has its own `python` job
  # above, on every supported interpreter); each suite includes its wire-conformance runner.
  backend-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: 21
          distribution: zulu

      # Install the reactor artifacts to the local repo first, then run the module suites with the
      # JaCoCo coverage gate (`verify`). Core is where the ~1200 unit tests + the Java conformance
      # runner live; uidl (schema/annotation tests), the two annotation processors (one carries a
      # 70% per-package coverage floor), agent-cli and webflux-core's in-JVM *IT suite also have
      # tests, which used to run nowhere because `-pl shared/core` left them out. The adapters are
      # otherwise exercised end to end by the e2e job above.
      - name: Build backend
        run: mvn -B install -DskipTests -Dgpg.skip=true --file backend/pom.xml

      # javadoc is skipped: `verify` otherwise triggers the parent pom's javadoc jar, which fails to
      # generate on core (a pre-existing doclint issue) and is not what this gate is for — the gate is
      # the test suite + JaCoCo coverage check.
      #
      # `verify` also runs the public-API compatibility check (japicmp) of uidl, dtos and core's
      # archetypes against the last release (backend/pom.xml <mateu.japicmp.baseline>). It is
      # REPORT-ONLY while the version is an alpha (<mateu.japicmp.enforce>false</...>); from the
      # beta tag on it fails the build on an incompatible change that is neither @Experimental nor in
      # backend/api-compat/japicmp-exclusions.properties.
      - name: Java module tests + coverage gate + API compatibility
        run: >-
          mvn -B verify -Dgpg.skip=true -Dmaven.javadoc.skip=true --file backend/pom.xml
          -pl shared/core,shared/uidl,shared/dtos,shared/annotation-processor-core,shared/annotation-processor-indexer,shared/agent-cli,webflux/webflux-core

      - name: API compatibility report
        if: always()
        run: |
          {
            echo "## Public API compatibility (japicmp, vs the last release)"
            for m in uidl dtos core; do
              f="backend/shared/$m/target/japicmp/api-compatibility.md"
              if [ -f "$f" ]; then echo; echo "### $m"; head -c 60000 "$f"; fi
            done
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload API compatibility reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: japicmp-reports
          path: backend/shared/*/target/japicmp/
          if-no-files-found: ignore

      # The .NET port multi-targets both supported LTS runtimes (net8.0 until its 2026-11-10 end of
      # support, and net10.0): the 10 SDK builds both, the 8 runtime runs the net8.0 leg. `dotnet test`
      # runs the suite once per target framework, so both legs (and the conformance gate) are tested.
      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: .NET tests (net8.0 + net10.0)
        run: cd backend/dotnet && dotnet test

      - name: .NET packages build
        run: cd backend/dotnet && for p in src/*/*.csproj; do dotnet pack "$p" -c Release -o /tmp/nupkgs; done

