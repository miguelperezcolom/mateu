# Named for what it does rather than for the one job it started as: it now also guards the
# committed bundles, the annotation density and the shared frontend library. Renaming the WORKFLOW
# is safe for branch protection, which names JOBS (`e2e`) and not workflows.
name: Tests

on:
  pull_request:
  workflow_dispatch:
  workflow_call:

# Every job here only reads the repository. The repo's default GITHUB_TOKEN is read-WRITE, and this
# workflow runs on pull requests (and, via workflow_call, inside the release), so without this block
# every step — npm/maven install hooks included — would hold a token that can push to the repo.
permissions:
  contents: read

# Each job below sets timeout-minutes: without a cap a job inherits GitHub's 6-hour default, and
# the Playwright download once hung a PR and a release run for ~50 minutes each. The caps
# are ~2.5x the slowest green run of each job.

jobs:
  # The committed renderer bundles are derived artifacts regenerated by hand, and the e2e job below
  # builds the backend FROM them without recompiling the TypeScript. When a source fix lands and the
  # bundle is not regenerated, e2e silently exercises the pre-fix frontend — which is exactly what
  # happened between 2026-08-11 and 2026-08-12, leaving the required check red for weeks and making
  # "merge past the red check" routine. This guard makes the drift fail fast and say what to run.
  bundle-freshness:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # the check compares commit ancestry, so it needs the history

      - name: Bundles are not older than their source
        run: scripts/check-bundle-freshness.sh

      # The framework's own thesis, measured: a screen should need few annotations, and that number
      # should not creep up. Each new annotation is always justifiable alone; the sum is what drifts.
      - name: Annotations per screen have not crept up
        run: python3 scripts/annotation-density.py --check

  # The shared frontend library is where the renderers' logic actually lives, and nothing in CI
  # compiled or ran it: `run_tests.yml` builds the backend from the COMMITTED bundle, and the
  # release workflow's `apps/vaadin && npm run copy` typechecks against the APP's tsconfig, which
  # excludes the library's test files. So a `tsc` error in libs/mateu sat on master while every
  # check stayed green, and its 304 unit tests only ran on whoever remembered to run them.
  #
  # The typecheck comes first in the same job on purpose: the tests run through vitest's own
  # transform, which strips types without checking them, so they pass over exactly the errors
  # this step exists to catch — running them first would report success from a tree that does
  # not compile.
  frontend-lib:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/web/monorepo/package-lock.json

      # Scoped to the one workspace: a plain `npm ci` at the monorepo root also installs
      # apps/redwood's Oracle tooling, part of which comes from static.oracle.com rather than the
      # npm registry — an external host this job has no reason to depend on. `--ignore-scripts`
      # keeps the dependency tree's install hooks from running arbitrary code on the runner; the
      # platform binaries this build needs (esbuild's) arrive as optional dependencies rather than
      # from a postinstall, so the build and the suite were verified to pass without them.
      - name: Install the library's dependencies
        run: cd frontend/web/monorepo && npm ci --workspace mateu --workspace mateu-visual-editor --workspace mateu-vaadin --include-workspace-root --ignore-scripts

      # The vaadin-lit jar is Apache-2.0: nothing bundled into it may be under a commercial licence
      # (it once shipped @vaadin/board, @vaadin/rich-text-editor and a Highcharts chunk).
      - name: Bundled frontend dependencies are under approved licences
        run: node scripts/check-frontend-licenses.mjs

      - name: Typecheck and build the library
        run: cd frontend/web/monorepo/libs/mateu && npm run build

      - name: Unit tests
        run: cd frontend/web/monorepo/libs/mateu && npm test

      # The visual editor (embedded in both IDE plugins) has its own vitest suite (~120 tests, <1s)
      # that only ran by hand. Same order as above: typecheck before the tests.
      - name: Visual editor — typecheck and tests
        run: |
          cd frontend/web/monorepo/apps/visual-editor
          npx tsc --noEmit
          npm test

  # Small, dependency-light suites that existed but never ran in CI: the Redwood core's wire-contract
  # tests (node only, no install), the MCP server, prompt-to-app, the React Native renderer's pure
  # helpers and the VS Code extension. Together they take seconds.
  tooling-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Redwood core contract tests
        run: cd frontend/web/monorepo/apps/redwood/poc && node test.mjs && node test-pms.mjs

      - name: Redwood atom template is expanded in every surface
        run: cd frontend/web/monorepo/apps/redwood/poc && node make-html.mjs --check

      - name: parity.md tells the truth about Redwood (coverage vs wire catalogue vs renderer code)
        run: cd frontend/web/monorepo/apps/redwood/poc && node parity-check.mjs

      - name: MCP server tests
        run: cd frontend/mcp-server && node --test

      - name: prompt-to-app tests
        run: cd frontend/prompt-to-app && npm ci --ignore-scripts && node --test

      - name: React Native renderer unit tests
        run: cd frontend/app/react-native && node --test 'src/**/*.test.ts'

      - name: React Native renderer wire coverage (every wire type rendered, parity.md in sync)
        run: cd frontend/app/react-native && node scripts/parity-check.mjs

      - name: React Native renderer type check
        run: cd frontend/app/react-native && npm ci --ignore-scripts && npx tsc --noEmit

      - name: VS Code extension tests
        run: cd frontend/app/vscode-extension && npm ci --ignore-scripts && npx vitest run

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: 21
          distribution: zulu

      - name: Build backend
        run: mvn -B install -DskipTests -Dgpg.skip=true --file backend/pom.xml

      - name: Build SUT apps
        run: mvn -B install -Dmaven.test.skip=true -Dgpg.skip=true --file e2e/sut/pom.xml

      - name: Start SUT apps
        run: |
          java -jar e2e/sut/apps/mvc-app1/target/mvc-app1-1.0.0-SNAPSHOT.jar      > /tmp/mvc-app1.log      2>&1 &
          java -jar e2e/sut/apps/webflux-app1/target/webflux-app1-1.0.0-SNAPSHOT.jar > /tmp/webflux-app1.log  2>&1 &
          java -jar e2e/sut/apps/quarkus-app1/target/quarkus-app1-1.0.0-SNAPSHOT-runner.jar > /tmp/quarkus-app1.log 2>&1 &
          java -jar e2e/sut/apps/micronaut-app1/target/micronaut-app1-1.0.0-SNAPSHOT.jar > /tmp/micronaut-app1.log 2>&1 &
          java -jar e2e/sut/apps/helidon-app1/target/helidon-app1.jar > /tmp/helidon-app1.log 2>&1 &
          java -jar e2e/sut/apps/fed-remote-app/target/fed-remote-app-1.0.0-SNAPSHOT.jar > /tmp/fed-remote-app.log 2>&1 &
          java -jar e2e/sut/apps/fed-shell-app/target/fed-shell-app-1.0.0-SNAPSHOT.jar > /tmp/fed-shell-app.log 2>&1 &
          java -jar e2e/sut/apps/fed-sections-app/target/fed-sections-app-1.0.0-SNAPSHOT.jar > /tmp/fed-sections-app.log 2>&1 &

      - name: Wait for SUT apps to be ready
        run: |
          # mode "ok" requires a 2xx from / (curl -f); "any" accepts any HTTP response.
          # Bounded (max 3 min) so a SUT app that fails to boot fails the job fast with logs,
          # instead of hanging the runner forever on an unbounded `until curl` loop.
          wait_port() {
            port=$1; mode=$2; tries=0
            echo "Waiting for port $port ($mode)..."
            while true; do
              if [ "$mode" = ok ]; then
                curl -sf "http://localhost:$port/" > /dev/null && break
              else
                curl -s -o /dev/null "http://localhost:$port/" && break
              fi
              tries=$((tries + 1))
              if [ "$tries" -ge 90 ]; then
                echo "::error::port $port was not ready after 3 minutes"
                exit 1
              fi
              sleep 2
            done
            echo "Port $port is ready"
          }
          for port in 8080 8081 8082 8083 8086; do wait_port "$port" ok; done
          # the federation apps answer 404 on / — any HTTP response means they are up
          for port in 8084 8085 8087; do wait_port "$port" any; done

      - name: Dump SUT logs on failure
        if: failure()
        run: |
          for f in /tmp/*-app1.log /tmp/fed-*.log; do
            [ -f "$f" ] || continue
            echo "===== $f ====="
            tail -n 60 "$f"
          done

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Install npm dependencies
        run: cd e2e && npm ci

      # The browser download is the one step of this job that reaches outside GitHub and npm, and
      # it has no timeout of its own: on 2026-08-19 it hung a release run and a PR run for ~50
      # minutes each without ever failing, blocking the publish to Maven Central. The binaries
      # only change when @playwright/test does, so key the cache on the lockfile that pins it.
      - name: Cache Playwright browsers
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('e2e/package-lock.json') }}
          restore-keys: ${{ runner.os }}-playwright-

      # Kept unconditional on purpose: --with-deps also installs SYSTEM packages, which live
      # outside the cached directory and are needed on every run. On a cache hit this is the apt
      # part only — the ~150 MB download is what the cache saves.
      - name: Install Playwright browsers
        run: cd e2e && npx playwright install --with-deps chromium

      - name: Run Playwright tests
        run: cd e2e && npx playwright test

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: e2e/playwright-report/
          retention-days: 7

  # Backend + port test suites — including the shared wire-conformance corpus (conformance/README.md).
  # Until now the rest of run_tests.yml built the whole backend with -DskipTests and never invoked
  # pytest or dotnet test, so ~1000 core tests, the .NET/Python golden suites AND the conformance
  # corpus all ran only on whoever remembered — a port could drift from the wire with every check
  # still green. This job runs them. All three are green as of this change (Java core 1030, Python
  # 298 + 2 xfailed, .NET 299); each suite includes its wire-conformance runner.
  backend-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: 21
          distribution: zulu

      # Install the reactor artifacts to the local repo first, then run the module suites with the
      # JaCoCo coverage gate (`verify`). Core is where the ~1200 unit tests + the Java conformance
      # runner live; uidl (schema/annotation tests), the two annotation processors (one carries a
      # 70% per-package coverage floor), agent-cli and webflux-core's in-JVM *IT suite also have
      # tests, which used to run nowhere because `-pl shared/core` left them out. The adapters are
      # otherwise exercised end to end by the e2e job above.
      - name: Build backend
        run: mvn -B install -DskipTests -Dgpg.skip=true --file backend/pom.xml

      # javadoc is skipped: `verify` otherwise triggers the parent pom's javadoc jar, which fails to
      # generate on core (a pre-existing doclint issue) and is not what this gate is for — the gate is
      # the test suite + JaCoCo coverage check.
      - name: Java module tests + coverage gate
        run: >-
          mvn -B verify -Dgpg.skip=true -Dmaven.javadoc.skip=true --file backend/pom.xml
          -pl shared/core,shared/uidl,shared/annotation-processor-core,shared/annotation-processor-indexer,shared/agent-cli,webflux/webflux-core

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # The tests import the packages from the source tree (sys.path), so install the DEPENDENCIES,
      # not the editable package — `pip install -e .` fails on the flat multi-package layout. pyyaml
      # is a runtime dep (pyproject) missing from requirements.txt, so add it explicitly.
      - name: Python tests
        run: |
          cd backend/python
          pip install -r requirements.txt pyyaml
          python -m pytest tests/ -q

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: .NET tests
        run: cd backend/dotnet && dotnet test

