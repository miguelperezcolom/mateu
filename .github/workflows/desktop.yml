# Builds the Mateu DESKTOP APP (IntelliJ IDEA Open Source + the Mateu plugin, see `buildInstaller` in
# frontend/app/intellij-plugin/build.gradle.kts) with the framework's release and attaches it to the
# GitHub Release `v3.0-beta.N`, at the plugin's version (scripts/plugin-versions.sh):
#
#   mateu-desktop-<v>-macos-aarch64.dmg / .zip    mateu-desktop-<v>-macos-intel.dmg / .zip
#   mateu-desktop-<v>-linux.tar.gz                mateu-desktop-<v>-windows-setup.exe / -windows.zip
#   mateu-intellij-plugin-<v>.zip                 mateu-desktop-update.json  ← uploaded LAST
#
# Installed apps poll `releases/latest/download/mateu-desktop-update.json` (io.mateu.ijp.update): the
# feed goes up only after every installer is there, so it never points at a missing file.
# Both macOS architectures are built on an Apple-silicon runner (only the downloaded IDE differs).
#
# The base is IntelliJ IDEA Open Source `desktopIdeVersion` (build.gradle.kts), which buildInstaller
# downloads from the `idea/<version>` GitHub Release of JetBrains/intellij-community and checks against
# its pinned sha256. Before anything reaches users, a smoke test launches the packaged app (macOS
# aarch64 natively, Linux under Xvfb, Windows on windows-latest) and requires idea.log to say the Mateu
# plugin loaded; on Windows it also requires JetBrains' Authenticode on idea64.exe to be intact. The
# feed (what installed apps read) goes up only after every smoke test passed.
#
# Released versions: called by buid-and-publish.yml AFTER its e2e job (workflow_call), so a release
# whose tests fail ships no desktop app. The build jobs hold a READ-ONLY token (npm, Gradle and the
# IDE build run third-party code) and hand the files over as artifacts; only `attach`, which checks
# nothing out and runs nothing but `gh release upload`, holds contents: write.
#
# `dry_run` (manual runs only): build every installer and run every smoke test, publish NOTHING (no
# release upload; the feed is only printed). The tag only names the versions.
# Installers are built on CI ONLY: never run buildInstaller on a developer machine (CLAUDE.md, #1000).
# Building the base from source (.github/workflows/desktop-base.yml) stays as a manual fallback.
#
# Optional secrets — without them the macOS app is signed ad-hoc (first launch: right-click ▸ Open):
#   MACOS_CERTIFICATE_P12 (base64 of a Developer ID Application .p12), MACOS_CERTIFICATE_PASSWORD,
#   MACOS_SIGN_IDENTITY ("Developer ID Application: Name (TEAMID)")
#   MACOS_NOTARY_APPLE_ID, MACOS_NOTARY_TEAM_ID, MACOS_NOTARY_PASSWORD (app-specific) — to notarize too

name: Desktop app

on:
  workflow_call:
    secrets:
      MACOS_CERTIFICATE_P12:
        required: false
      MACOS_CERTIFICATE_PASSWORD:
        required: false
      MACOS_SIGN_IDENTITY:
        required: false
      MACOS_NOTARY_APPLE_ID:
        required: false
      MACOS_NOTARY_TEAM_ID:
        required: false
      MACOS_NOTARY_PASSWORD:
        required: false
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to (re)build the desktop app for (e.g. v3.0-beta.27)
        required: true
      dry_run:
        description: Build and smoke-test every installer, but publish nothing
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: desktop-${{ github.event.release.tag_name || inputs.tag }}${{ inputs.dry_run && '-dry-run' || '' }}
  cancel-in-progress: false

env:
  TAG: ${{ github.event.release.tag_name || inputs.tag }}
  GH_TOKEN: ${{ github.token }}
  DRY_RUN: ${{ inputs.dry_run && 'true' || 'false' }}

jobs:
  macos:
    if: startsWith(github.event.release.tag_name || inputs.tag, 'v') && (!contains((github.event.release.tag_name || inputs.tag), '-') || startsWith((github.event.release.tag_name || inputs.tag), 'v3.0-'))
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        arch: [aarch64, intel]
    env:
      HAS_SIGNING: ${{ secrets.MACOS_CERTIFICATE_P12 != '' && secrets.MACOS_SIGN_IDENTITY != '' }}
      HAS_NOTARY: ${{ secrets.MACOS_NOTARY_APPLE_ID != '' && secrets.MACOS_NOTARY_PASSWORD != '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Derive the versions from the tag
        run: scripts/plugin-versions.sh "$TAG" >> "$GITHUB_ENV"
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          java-version: 21
          distribution: zulu
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Install monorepo dependencies
        run: cd frontend/web/monorepo && npm ci --workspace mateu --workspace mateu-visual-editor --include-workspace-root --ignore-scripts
      - name: Set the plugin version from the tag
        run: cd frontend/app/intellij-plugin && perl -pi -e 's/^version = ".*"/version = "$ENV{INTELLIJ_VERSION}"/' build.gradle.kts
      - name: Import the Developer ID certificate
        if: env.HAS_SIGNING == 'true'
        env:
          P12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          P12_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
        run: |
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PASSWORD="$(uuidgen)"
          echo "$P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" -P "$P12_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" > /dev/null
          # keep the user's keychains on the search list, plus the new one first
          existing=()
          while IFS= read -r k; do existing+=("$(echo "$k" | sed -e 's/^[[:space:]]*"//' -e 's/"$//')"); done < <(security list-keychains -d user)
          security list-keychains -d user -s "$KEYCHAIN" "${existing[@]}"
          rm "$RUNNER_TEMP/cert.p12"
      - name: Store the notarization credentials
        if: env.HAS_SIGNING == 'true' && env.HAS_NOTARY == 'true'
        env:
          APPLE_ID: ${{ secrets.MACOS_NOTARY_APPLE_ID }}
          TEAM_ID: ${{ secrets.MACOS_NOTARY_TEAM_ID }}
          APP_PASSWORD: ${{ secrets.MACOS_NOTARY_PASSWORD }}
        run: xcrun notarytool store-credentials mateu-notary --apple-id "$APPLE_ID" --team-id "$TEAM_ID" --password "$APP_PASSWORD"
      - name: Build the app
        env:
          ARCH: ${{ matrix.arch }}
          SIGN_IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY }}
        run: |
          cd frontend/app/intellij-plugin
          args=(-Pinstaller.platform=macos "-Pinstaller.arch=$ARCH")
          if [ "$HAS_SIGNING" = "true" ]; then args+=("-Pmacos.sign.identity=$SIGN_IDENTITY"); fi
          if [ "$HAS_SIGNING" = "true" ] && [ "$HAS_NOTARY" = "true" ]; then args+=(-Pmacos.notarize.profile=mateu-notary); fi
          # through the helper: a cold IDE layout index loses com.intellij.java now and then (#2192)
          cd ../../.. && scripts/intellij-gradle.sh buildInstaller "${args[@]}" --console=plain
      - name: How the app is signed
        run: |
          app=frontend/app/intellij-plugin/build/installer/Mateu.app
          codesign -dv --verbose=2 "$app" 2>&1 | grep -E 'Identifier|Authority|TeamIdentifier|Signature|flags' || true
          codesign --verify --deep --strict "$app" && echo "codesign: valid"
      # The runner is Apple silicon: only the aarch64 app can run here.
      - name: Smoke test — launch the app, the Mateu plugin must load
        if: matrix.arch == 'aarch64'
        run: scripts/desktop-smoke.sh macos frontend/app/intellij-plugin/build/installer/Mateu.app
      - uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: mateu-desktop-macos-${{ matrix.arch }}
          path: |
            frontend/app/intellij-plugin/build/installer/mateu-desktop-*-macos-${{ matrix.arch }}.dmg
            frontend/app/intellij-plugin/build/installer/mateu-desktop-*-macos-${{ matrix.arch }}.zip
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

  linux-windows:
    if: startsWith(github.event.release.tag_name || inputs.tag, 'v') && (!contains((github.event.release.tag_name || inputs.tag), '-') || startsWith((github.event.release.tag_name || inputs.tag), 'v3.0-'))
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        platform: [linux, windows]
    steps:
      # the IDE is downloaded, unpacked and repacked (~6 GB on disk): make room first
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL \
            /usr/share/swift /usr/local/share/boost /usr/local/.ghcup /opt/microsoft /opt/google /usr/local/share/chromium
          df -h /
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Derive the versions from the tag
        run: scripts/plugin-versions.sh "$TAG" >> "$GITHUB_ENV"
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          java-version: 21
          distribution: zulu
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Install monorepo dependencies
        run: cd frontend/web/monorepo && npm ci --workspace mateu --workspace mateu-visual-editor --include-workspace-root --ignore-scripts
      - name: Install NSIS (the Windows setup)
        if: matrix.platform == 'windows'
        run: sudo apt-get update -q && sudo apt-get install -y -q nsis
      - name: Set the plugin version from the tag
        run: cd frontend/app/intellij-plugin && perl -pi -e 's/^version = ".*"/version = "$ENV{INTELLIJ_VERSION}"/' build.gradle.kts
      - name: Build the app
        env:
          PLATFORM: ${{ matrix.platform }}
        run: scripts/intellij-gradle.sh buildInstaller "-Pinstaller.platform=$PLATFORM" --console=plain
      - name: Disk and memory when it failed
        if: failure()
        run: df -h / /tmp; free -m
      - name: Smoke test — launch the app under Xvfb, the Mateu plugin must load
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get install -y -q xvfb > /dev/null
          mkdir -p "$RUNNER_TEMP/smoke"
          tar -xzf "frontend/app/intellij-plugin/build/installer/mateu-desktop-$INTELLIJ_VERSION-linux.tar.gz" -C "$RUNNER_TEMP/smoke"
          scripts/desktop-smoke.sh linux "$(ls -d "$RUNNER_TEMP"/smoke/*/)"
      # The Windows smoke test runs on windows-latest (job smoke-windows), from this artifact's zip.
      - uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: mateu-desktop-${{ matrix.platform }}
          path: |
            frontend/app/intellij-plugin/build/installer/mateu-desktop-*-linux.tar.gz
            frontend/app/intellij-plugin/build/installer/mateu-desktop-*-windows-setup.exe
            frontend/app/intellij-plugin/build/installer/mateu-desktop-*-windows.zip
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

  smoke-windows:
    needs: [linux-windows]
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: mateu-desktop-windows
          path: ${{ runner.temp }}\pkg
      - name: JetBrains' Authenticode is intact, the app starts and the Mateu plugin loads
        shell: pwsh
        run: |
          $zip = Get-ChildItem "$env:RUNNER_TEMP\pkg\*-windows.zip" | Select-Object -First 1
          Expand-Archive $zip.FullName -DestinationPath "$env:RUNNER_TEMP\app"
          $root = (Get-ChildItem "$env:RUNNER_TEMP\app" -Directory | Select-Object -First 1).FullName
          # We never touch JetBrains' binaries: their signature must survive the repack.
          $sig = Get-AuthenticodeSignature "$root\bin\idea64.exe"
          "idea64.exe: $($sig.Status) - $($sig.SignerCertificate.Subject)"
          if ($sig.Status -ne 'Valid' -or $sig.SignerCertificate.Subject -notlike '*JetBrains*') { throw "idea64.exe is not JetBrains-signed any more" }
          Select-String -Path "$root\product-info.json" -Pattern '"version"|"buildNumber"' | Select-Object -First 2 | ForEach-Object { $_.Line }
          $p = Start-Process -FilePath "$root\mateu.bat" -PassThru -WindowStyle Hidden
          $log = "$root\data\log\idea.log"
          for ($i = 0; $i -lt 36; $i++) { Start-Sleep 5; if ((Test-Path $log) -and (Select-String -Path $log -Pattern 'Loaded custom plugins' -Quiet)) { break } }
          Start-Sleep 20
          Get-Process | Where-Object { $_.Path -like "$root*" } | Stop-Process -Force -ErrorAction SilentlyContinue
          Select-String -Path $log -Pattern 'IDE: |Loaded custom plugins|io\.mateu|ERROR' | Select-Object -First 60 | ForEach-Object { $_.Line }
          if (Select-String -Path $log -Pattern 'Loaded custom plugins.*Mateu' -Quiet) { "✅ windows: Mateu plugin loaded, idea64.exe JetBrains-signed" | Tee-Object -Append $env:GITHUB_STEP_SUMMARY } else { throw "the Mateu plugin did not load" }

  # The plugin the apps download + the feed that points at everything above. Built read-only; it
  # goes up last (job attach): installed apps only hear of the release once every installer passed
  # its smoke test.
  feed:
    needs: [macos, linux-windows, smoke-windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Derive the versions from the tag
        run: scripts/plugin-versions.sh "$TAG" >> "$GITHUB_ENV"
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          java-version: 21
          distribution: zulu
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Install monorepo dependencies
        run: cd frontend/web/monorepo && npm ci --workspace mateu --workspace mateu-visual-editor --include-workspace-root --ignore-scripts
      - name: Set the plugin version from the tag
        run: cd frontend/app/intellij-plugin && perl -pi -e 's/^version = ".*"/version = "$ENV{INTELLIJ_VERSION}"/' build.gradle.kts
      - name: Build the plugin and the update feed
        run: |
          scripts/intellij-gradle.sh desktopUpdateFeed --console=plain \
            "-Pfeed.downloadBase=https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG" \
            "-Pfeed.notes=Mateu $INTELLIJ_VERSION — https://github.com/$GITHUB_REPOSITORY/releases/tag/$TAG"
          cat frontend/app/intellij-plugin/build/installer/mateu-desktop-update.json
      # one flat folder: attach merges every mateu-desktop-* artifact into one directory
      - name: Stage the plugin and the feed
        run: |
          mkdir -p "$RUNNER_TEMP/feed"
          cp "frontend/app/intellij-plugin/build/distributions/mateu-intellij-plugin-$INTELLIJ_VERSION.zip" \
            frontend/app/intellij-plugin/build/installer/mateu-desktop-update.json "$RUNNER_TEMP/feed/"
      - uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: mateu-desktop-feed
          path: ${{ runner.temp }}/feed/
          if-no-files-found: error
          retention-days: 1

  # The write half: no checkout, no build, no third-party code — only the uploads. Installers first,
  # then the plugin, then the feed: the feed must never name a file that is not there yet.
  attach:
    needs: [macos, linux-windows, smoke-windows, feed]
    if: ${{ !inputs.dry_run }}
    permissions:
      contents: write # gh release upload
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: mateu-desktop-*
          path: ${{ runner.temp }}/out
          merge-multiple: true
      - name: Attach the installers, then the plugin, then the feed
        working-directory: ${{ runner.temp }}/out
        run: |
          set -euo pipefail
          ls -l
          installers=(mateu-desktop-*-macos-*.dmg mateu-desktop-*-macos-*.zip mateu-desktop-*-linux.tar.gz \
            mateu-desktop-*-windows-setup.exe mateu-desktop-*-windows.zip)
          gh release upload "$TAG" --repo "$GITHUB_REPOSITORY" --clobber "${installers[@]}"
          gh release upload "$TAG" --repo "$GITHUB_REPOSITORY" --clobber mateu-intellij-plugin-*.zip
          gh release upload "$TAG" --repo "$GITHUB_REPOSITORY" --clobber mateu-desktop-update.json
