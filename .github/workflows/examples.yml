# Keeps the code people copy from compiling: the starters (starters/, the quickstart of the docs) and
# every demo (demo/). Both are built against the REACTOR — the backend of this very commit, installed
# as 0.0.1-MATEU — so an API change that breaks them fails the PR that made it, instead of the first
# user who copies a starter after the next release.
name: Examples

on:
  pull_request:
    paths:
      - 'backend/**'
      - 'starters/**'
      - 'frontend/app/vscode-extension/src/newProject.ts'
      - 'frontend/app/vscode-extension/scripts/new-project.mjs'
      - 'demo/**'
      - '.github/workflows/examples.yml'
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: examples-${{ github.ref }}
  cancel-in-progress: true

jobs:
  java-starters-and-demos:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: 21
          distribution: zulu
          cache: maven

      - name: Install the backend reactor (0.0.1-MATEU)
        run: mvn -B -q install -Dmaven.test.skip -Dgpg.skip=true --file backend/pom.xml

      # The starters and the "start here" demos pin the last release in <mateu.version>. A -D on
      # the command line is NOT enough: Quarkus' bootstrap resolver reads the pom's own property and
      # resolved the PUBLISHED release (silently testing yesterday's Mateu, and failing outright
      # once artifacts are renamed before they are released). Rewrite the pin to the reactor.
      - name: Point the pinned examples at the reactor
        run: |
          grep -rl --include=pom.xml '<mateu.version>3\.0-alpha' starters demo \
            | xargs sed -i 's#<mateu.version>3\.0-alpha[^<]*</mateu.version>#<mateu.version>0.0.1-MATEU</mateu.version>#'

      # Starters: compile, package, then boot each one and load its CRUD through the action endpoint.
      # -Dmateu.bundle.mock=true: the static starter ships its sources' sample data (its own
      # .mvn/maven.config says so when it is built alone; the aggregator does not read it).
      - name: Build the Java starters against the reactor
        run: mvn -B package -Dmateu.version=0.0.1-MATEU -Dmateu.bundle.mock=true --file starters/pom.xml

      - name: Boot every Java starter and load its CRUD (and check the static bundle)
        run: starters/smoke-test.sh

      # The New Project generator (IntelliJ wizard, VS Code command, CLI) turns the starters into
      # projects. The starters themselves are checked above; this packages what only the generator
      # produces — the code + YAML flavour, the Empty sample, page templates, renamed packages — so a
      # starter change that breaks a generated project fails here, not in a user's IDE.
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Generate projects with the New Project generator and package them
        run: |
          set -euo pipefail
          cd frontend/app/vscode-extension
          npm ci --ignore-scripts
          npm run compile
          out=$RUNNER_TEMP/generated
          gen() { node scripts/new-project.mjs --version 0.0.1-MATEU --group com.acme "$@"; }
          gen --authoring both --runtime spring-mvc --pages form,dashboard --artifact both-mvc --out $out/both-mvc
          gen --authoring both --runtime quarkus --artifact both-quarkus --out $out/both-quarkus
          gen --authoring code --runtime micronaut --sample empty --artifact empty-micronaut --out $out/empty-micronaut
          gen --authoring code --runtime helidon-mp --sample empty --artifact empty-helidon --out $out/empty-helidon
          gen --authoring code --runtime spring-webflux --sample empty --renderer redwood --artifact redwood-webflux --out $out/redwood-webflux
          gen --authoring yaml --runtime spring-mvc --pages welcome,calendar --artifact yaml-pages --out $out/yaml-pages
          gen --authoring static --artifact static-site --out $out/static-site
          for d in $out/*; do
            echo "::group::$(basename $d)"
            (cd $d && mvn -B -q package -DskipTests)
            echo "::endgroup::"
          done
          test -f $out/static-site/target/mateu-bundle/manifest.json

      # Demos: compile only (several talk to external services or need a frontend build to RUN).
      # -Dmateu.version overrides the release pinned by the "start here" demos, so they too are
      # checked against this commit.
      - name: Compile every demo against the reactor
        run: mvn -B compile -Dmateu.version=0.0.1-MATEU --file demo/pom.xml

  dotnet-starter:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Build the .NET starter
        run: dotnet build starters/dotnet/MateuStarter.csproj

  python-starter:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install and test the Python starter
        working-directory: starters/python
        run: |
          pip install -r requirements.txt pytest httpx
          PYTHONPATH=../../backend/python:. pytest -q
