# PROTOTYPE — what the Mateu desktop app could be built on after IntelliJ IDEA Community 2025.2.
# See design/desktop-base-strategy.md. It never touches a release: no `release:` trigger, no upload
# to a GitHub Release, artifacts only (a few days' retention). desktop.yml (the real pipeline) is
# unchanged and keeps packaging IntelliJ IDEA Community 2025.2.6.4 from download.jetbrains.com.
#
# Two candidate bases, both IntelliJ IDEA *Open Source* (Apache-2.0, intellij-community):
#   oss-release  the binaries JetBrains' bot attaches to each `idea/<version>` release of
#                JetBrains/intellij-community (.dmg x64/aarch64, .tar.gz, .win.zip, .exe)
#   from-source  the same distribution built here from the tag, with JetBrains' own recipe
#                (.github/actions/build_ide in intellij-community: Docker image + installers.cmd)
# Each base goes through the EXISTING packaging (`buildInstaller`, -Pinstaller.ideArchive), then a
# smoke test launches the packaged app and checks that the Mateu plugin loaded.
#
# Installers are built on CI ONLY: never run buildInstaller on a developer machine (CLAUDE.md, #1000).

name: Desktop base (prototype)

on:
  push:
    branches: [desktop/community-from-source]
    paths: [.github/workflows/desktop-base.yml, frontend/app/intellij-plugin/build.gradle.kts]
  workflow_dispatch:
    inputs:
      ide_tag:
        description: intellij-community tag (e.g. idea/2026.3, idea/2026.2.4)
        default: idea/2026.3
      base:
        description: Which base to package
        type: choice
        options: [both, oss-release, from-source]
        default: both
      reuse_run_id:
        description: Reuse the from-source base of an earlier run of this workflow (its run id) instead of rebuilding
        default: ''

permissions:
  contents: read

concurrency:
  group: desktop-base-${{ github.ref }}
  cancel-in-progress: true

env:
  IDE_TAG: ${{ inputs.ide_tag || 'idea/2026.3' }}
  BASE: ${{ inputs.base || 'both' }}
  REUSE_RUN_ID: ${{ inputs.reuse_run_id || '' }}
  GH_TOKEN: ${{ github.token }}

jobs:
  # ── from-source: JetBrains' recipe, on a standard ubuntu-latest runner (4 vCPU, 16 GB) ──
  from-source:
    if: (inputs.base || 'both') != 'oss-release' && (inputs.reuse_run_id || '') == ''
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - name: Free disk space (the build needs ~60 GB)
        run: |
          df -h / /mnt
          sudo rm -rf /usr/share/dotnet /usr/share/swift /usr/share/miniconda /usr/local/lib/android \
            /usr/local/share/boost /usr/local/share/powershell /usr/local/share/chromium /usr/local/lib/node_modules \
            /opt/ghc /opt/hostedtoolcache/CodeQL /opt/hostedtoolcache/Ruby /opt/hostedtoolcache/PyPy \
            /opt/hostedtoolcache/Python /opt/hostedtoolcache/go /opt/hostedtoolcache/node /opt/microsoft /opt/google \
            /imagegeneration /var/cache/apt/archives
          sudo apt-get -y clean
          docker image prune --all --force || true
          df -h / /mnt
      - name: Swap (JetBrains' recipe, the build OOMs with 16 GB RAM + 4 GB swap)
        run: |
          sudo swapoff -a || true
          sudo rm -f /mnt/swapfile /swapfile
          sudo fallocate -l 30G /mnt/swapfile
          sudo chmod 600 /mnt/swapfile && sudo mkswap /mnt/swapfile && sudo swapon /mnt/swapfile
          free -h
      - name: Check out intellij-community at the tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: JetBrains/intellij-community
          ref: ${{ env.IDE_TAG }}
          path: ic
          persist-credentials: false
      - name: Check out JetBrains/android at the same tag (the README asks for the same tag)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: JetBrains/android
          ref: ${{ env.IDE_TAG }}
          path: ic/android
          persist-credentials: false
      # OpenSourceCommunityInstallersBuildTarget always skips the Windows .zip (to spare a GitHub
      # runner's disk: JetBrains' workflow publishes only the .exe). The desktop app repacks the zip.
      - name: Keep the Windows .zip
        run: |
          f=ic/build/src/OpenSourceCommunityInstallersBuildTarget.kt
          grep -n 'WINDOWS_ZIP_STEP' "$f"
          sed -i '/BUILD_STEPS_DISABLED_FOR_GITHUB_ACTIONS: Set<String> = setOf(/,/)/{/BuildOptions.WINDOWS_ZIP_STEP,/d}' "$f"
          grep -n 'WINDOWS_ZIP_STEP' "$f" || echo "Windows zip step no longer skipped"
      - name: Build environment (Docker image of the tag)
        run: |
          start=$(date +%s)
          cd ic && docker build . --target intellij_idea --tag intellij_idea
          echo "docker image: $(( $(date +%s) - start )) s"
      - name: Build IntelliJ IDEA Open Source (all OSes, all archs)
        run: |
          start=$(date +%s)
          cd ic && docker run --rm --user "$(id -u)" --volume "${PWD}:/community" intellij_idea \
            -Dintellij.build.skip.build.steps=windows_exe_installer
          secs=$(( $(date +%s) - start ))
          echo "installers.cmd: $secs s" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: What it produced
        if: always()
        run: |
          ls -la ic/out/idea-ce/artifacts || true
          df -h / /mnt; free -h
          { echo '### from-source artifacts'; echo '```'; ls -la ic/out/idea-ce/artifacts; echo '```'; } >> "$GITHUB_STEP_SUMMARY" || true
      - name: Pick the bases
        run: |
          a=ic/out/idea-ce/artifacts
          mkdir base
          pick() { # <glob> <exclude regex> <target>
            f=$(ls $a/$1 2>/dev/null | grep -Ev "$2" | head -1)
            [ -n "$f" ] || { echo "::error::no $1 in $a"; return 1; }
            echo "$f → base/$3"; mv "$f" "base/$3"
          }
          pick '*.tar.gz' 'aarch64|no-jbr|jbr|sources' linux.tar.gz
          pick '*.sit' 'aarch64' macos-intel.sit
          pick '*-aarch64.sit' '^$' macos-aarch64.sit
          if ls $a/*.win.zip >/dev/null 2>&1; then
            pick '*.win.zip' 'aarch64' windows.win.zip
          else
            echo "::warning::no .win.zip: repacking the .exe (NSIS) instead"
            exe=$(ls $a/*.exe | grep -v aarch64 | head -1)
            mkdir win && 7z x -y -owin "$exe" > /dev/null && rm -rf 'win/$PLUGINSDIR' 'win/Uninstall.exe.nsis'
            (cd win && zip -qr ../base/windows.win.zip .)
          fi
          echo "${IDE_TAG#idea/}" > base/version.txt
          ls -la base
      - uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with: { name: base-from-source-linux, path: base/linux.tar.gz, retention-days: 7, compression-level: 0 }
      - uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with: { name: base-from-source-windows, path: base/windows.win.zip, retention-days: 7, compression-level: 0 }
      - uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with: { name: base-from-source-macos-intel, path: base/macos-intel.sit, retention-days: 7, compression-level: 0 }
      - uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with: { name: base-from-source-macos-aarch64, path: base/macos-aarch64.sit, retention-days: 7, compression-level: 0 }

  # ── packaging: the existing buildInstaller, handed the chosen base ──
  package-macos:
    needs: [from-source]
    if: always() && (needs.from-source.result == 'success' || needs.from-source.result == 'skipped')
    runs-on: macos-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        arch: [aarch64, intel]
        base: [oss-release, from-source]
    steps:
      - name: Is this base asked for?
        id: want
        run: |
          if [ "$BASE" = both ] || [ "$BASE" = "${{ matrix.base }}" ]; then echo "go=true" >> "$GITHUB_OUTPUT"; else echo "go=false" >> "$GITHUB_OUTPUT"; fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.want.outputs.go == 'true'
        with:
          persist-credentials: false
      - name: Fetch the base (oss-release)
        if: steps.want.outputs.go == 'true' && matrix.base == 'oss-release'
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          v="${IDE_TAG#idea/}"
          suffix=$([ "$ARCH" = aarch64 ] && echo "-aarch64.dmg" || echo ".dmg")
          name=$(gh release view "$IDE_TAG" -R JetBrains/intellij-community --json assets --jq '.assets[].name' | grep -E -- "-$v$suffix\$" | head -1)
          echo "asset: $name"
          mkdir -p "$RUNNER_TEMP/base" && cd "$RUNNER_TEMP/base"
          start=$(date +%s); gh release download "$IDE_TAG" -R JetBrains/intellij-community -p "$name"; echo "download: $(( $(date +%s) - start )) s"
          want=$(gh api "repos/JetBrains/intellij-community/releases/tags/$IDE_TAG" --jq ".assets[] | select(.name == \"$name\") | .digest")
          got="sha256:$(shasum -a 256 "$name" | cut -d' ' -f1)"
          echo "digest $got (release says $want)"; [ "$got" = "$want" ]
          echo "IDE_ARCHIVE=$RUNNER_TEMP/base/$name" >> "$GITHUB_ENV"
          echo "IDE_VERSION=$v" >> "$GITHUB_ENV"
      - name: Fetch the base (from-source)
        if: steps.want.outputs.go == 'true' && matrix.base == 'from-source'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: base-from-source-macos-${{ matrix.arch }}
          path: ${{ runner.temp }}/base
          run-id: ${{ env.REUSE_RUN_ID || github.run_id }}
          github-token: ${{ github.token }}
      - name: Point at it (from-source)
        if: steps.want.outputs.go == 'true' && matrix.base == 'from-source'
        run: |
          echo "IDE_ARCHIVE=$RUNNER_TEMP/base/macos-${{ matrix.arch }}.sit" >> "$GITHUB_ENV"
          echo "IDE_VERSION=${IDE_TAG#idea/}-oss-src" >> "$GITHUB_ENV"
      - name: How JetBrains signed it (read-only)
        if: steps.want.outputs.go == 'true'
        run: |
          mkdir -p "$RUNNER_TEMP/inspect"
          case "$IDE_ARCHIVE" in
            *.dmg) hdiutil attach "$IDE_ARCHIVE" -nobrowse -readonly -mountpoint "$RUNNER_TEMP/inspect/mnt" > /dev/null
                   app=$(ls -d "$RUNNER_TEMP"/inspect/mnt/*.app) ;;
            *)     ditto -x -k "$IDE_ARCHIVE" "$RUNNER_TEMP/inspect/x"; app=$(ls -d "$RUNNER_TEMP"/inspect/x/*.app) ;;
          esac
          echo "app: $app"
          /usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' -c 'Print :CFBundleExecutable' -c 'Print :CFBundleShortVersionString' "$app/Contents/Info.plist"
          cat "$app/Contents/Resources/product-info.json" | head -20 || true
          codesign -dv --verbose=2 "$app" 2>&1 | grep -E 'Authority|TeamIdentifier|Signature|flags' || true
          spctl -a -vv -t exec "$app" 2>&1 || true
          xcrun stapler validate "$app" 2>&1 || true
          [ -d "$RUNNER_TEMP/inspect/mnt" ] && hdiutil detach "$RUNNER_TEMP/inspect/mnt" -quiet || true
          rm -rf "$RUNNER_TEMP/inspect/x"
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        if: steps.want.outputs.go == 'true'
        with:
          java-version: 21
          distribution: zulu
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: steps.want.outputs.go == 'true'
        with:
          node-version: 24
      - name: Install monorepo dependencies
        if: steps.want.outputs.go == 'true'
        run: cd frontend/web/monorepo && npm ci --workspace mateu --workspace mateu-visual-editor --include-workspace-root --ignore-scripts
      - name: Package (buildInstaller on CI)
        if: steps.want.outputs.go == 'true'
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          start=$(date +%s)
          scripts/intellij-gradle.sh buildInstaller -Pinstaller.platform=macos "-Pinstaller.arch=$ARCH" \
            "-Pinstaller.ideArchive=$IDE_ARCHIVE" "-Pinstaller.ideVersion=$IDE_VERSION" --console=plain
          echo "package macos-$ARCH (${{ matrix.base }}): $(( $(date +%s) - start )) s" | tee -a "$GITHUB_STEP_SUMMARY"
          ls -la frontend/app/intellij-plugin/build/installer | tee -a "$GITHUB_STEP_SUMMARY"
      # The runner is Apple silicon: only the aarch64 app can run here.
      - name: Smoke test — launch the app, the Mateu plugin must load
        if: steps.want.outputs.go == 'true' && matrix.arch == 'aarch64'
        run: |
          app=frontend/app/intellij-plugin/build/installer/Mateu.app
          exe=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$app/Contents/Info.plist")
          "$app/Contents/MacOS/$exe" > "$RUNNER_TEMP/app.out" 2>&1 &
          pid=$!
          log="$HOME/Library/Logs/Mateu/idea.log"
          for i in $(seq 1 36); do sleep 5; grep -q 'Loaded custom plugins' "$log" 2>/dev/null && break; done
          sleep 20
          kill $pid 2>/dev/null || true; pkill -f 'Mateu.app' || true
          echo "--- idea.log (selected)"; grep -E 'IDE: |Loaded custom plugins|Loaded bundled plugins|io\.mateu|ERROR' "$log" | head -60 || true
          grep 'Loaded custom plugins' "$log" | grep -q 'Mateu' && echo "✅ macOS: Mateu plugin loaded" | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        if: steps.want.outputs.go == 'true'
        with:
          name: mateu-desktop-${{ matrix.base }}-macos-${{ matrix.arch }}
          path: frontend/app/intellij-plugin/build/installer/*.dmg
          retention-days: 3
          compression-level: 0

  package-linux-windows:
    needs: [from-source]
    if: always() && (needs.from-source.result == 'success' || needs.from-source.result == 'skipped')
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        platform: [linux, windows]
        base: [oss-release, from-source]
    steps:
      - name: Is this base asked for?
        id: want
        run: |
          if [ "$BASE" = both ] || [ "$BASE" = "${{ matrix.base }}" ]; then echo "go=true" >> "$GITHUB_OUTPUT"; else echo "go=false" >> "$GITHUB_OUTPUT"; fi
      - name: Free disk space
        if: steps.want.outputs.go == 'true'
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL \
            /usr/share/swift /usr/local/share/boost /usr/local/.ghcup /opt/microsoft /opt/google /usr/local/share/chromium
          df -h /
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.want.outputs.go == 'true'
        with:
          persist-credentials: false
      - name: Fetch the base (oss-release)
        if: steps.want.outputs.go == 'true' && matrix.base == 'oss-release'
        env:
          PLATFORM: ${{ matrix.platform }}
        run: |
          v="${IDE_TAG#idea/}"
          suffix=$([ "$PLATFORM" = linux ] && echo ".tar.gz" || echo ".win.zip")
          name=$(gh release view "$IDE_TAG" -R JetBrains/intellij-community --json assets --jq '.assets[].name' | grep -E -- "-$v$suffix\$" | head -1)
          echo "asset: $name"
          mkdir -p "$RUNNER_TEMP/base" && cd "$RUNNER_TEMP/base"
          start=$(date +%s); gh release download "$IDE_TAG" -R JetBrains/intellij-community -p "$name"; echo "download: $(( $(date +%s) - start )) s"
          want=$(gh api "repos/JetBrains/intellij-community/releases/tags/$IDE_TAG" --jq ".assets[] | select(.name == \"$name\") | .digest")
          got="sha256:$(sha256sum "$name" | cut -d' ' -f1)"
          echo "digest $got (release says $want)"; [ "$got" = "$want" ]
          echo "IDE_ARCHIVE=$RUNNER_TEMP/base/$name" >> "$GITHUB_ENV"
          echo "IDE_VERSION=$v" >> "$GITHUB_ENV"
      - name: Fetch the base (from-source)
        if: steps.want.outputs.go == 'true' && matrix.base == 'from-source'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: base-from-source-${{ matrix.platform }}
          path: ${{ runner.temp }}/base
          run-id: ${{ env.REUSE_RUN_ID || github.run_id }}
          github-token: ${{ github.token }}
      - name: Point at it (from-source)
        if: steps.want.outputs.go == 'true' && matrix.base == 'from-source'
        run: |
          f=$([ "${{ matrix.platform }}" = linux ] && echo linux.tar.gz || echo windows.win.zip)
          echo "IDE_ARCHIVE=$RUNNER_TEMP/base/$f" >> "$GITHUB_ENV"
          echo "IDE_VERSION=${IDE_TAG#idea/}-oss-src" >> "$GITHUB_ENV"
      - name: Windows binaries — Authenticode (read-only)
        if: steps.want.outputs.go == 'true' && matrix.platform == 'windows'
        run: |
          sudo apt-get update -q && sudo apt-get install -y -q osslsigncode nsis
          mkdir -p "$RUNNER_TEMP/inspect" && cd "$RUNNER_TEMP/inspect"
          unzip -q -o "$IDE_ARCHIVE" '*bin/idea64.exe' || true
          exe=$(find . -name idea64.exe | head -1); echo "exe: $exe"
          osslsigncode verify -in "$exe" 2>&1 | grep -E 'Subject:|Signature verification|No signature|Message digest' | head -8 || true
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        if: steps.want.outputs.go == 'true'
        with:
          java-version: 21
          distribution: zulu
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: steps.want.outputs.go == 'true'
        with:
          node-version: 24
      - name: Install monorepo dependencies
        if: steps.want.outputs.go == 'true'
        run: cd frontend/web/monorepo && npm ci --workspace mateu --workspace mateu-visual-editor --include-workspace-root --ignore-scripts
      - name: Package (buildInstaller on CI)
        if: steps.want.outputs.go == 'true'
        env:
          PLATFORM: ${{ matrix.platform }}
        run: |
          start=$(date +%s)
          scripts/intellij-gradle.sh buildInstaller "-Pinstaller.platform=$PLATFORM" \
            "-Pinstaller.ideArchive=$IDE_ARCHIVE" "-Pinstaller.ideVersion=$IDE_VERSION" --console=plain
          echo "package $PLATFORM (${{ matrix.base }}): $(( $(date +%s) - start )) s" | tee -a "$GITHUB_STEP_SUMMARY"
          ls -la frontend/app/intellij-plugin/build/installer | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Smoke test — launch the app under Xvfb, the Mateu plugin must load
        if: steps.want.outputs.go == 'true' && matrix.platform == 'linux'
        run: |
          sudo apt-get install -y -q xvfb > /dev/null
          mkdir -p "$RUNNER_TEMP/smoke" && tar -xzf frontend/app/intellij-plugin/build/installer/*-linux.tar.gz -C "$RUNNER_TEMP/smoke"
          root=$(ls -d "$RUNNER_TEMP"/smoke/*/)
          grep -h '"buildNumber"\|"version"' "$root/product-info.json" | head -3
          xvfb-run -a sh "$root/mateu.sh" > "$RUNNER_TEMP/app.out" 2>&1 &
          log="$root/data/log/idea.log"
          for i in $(seq 1 36); do sleep 5; grep -q 'Loaded custom plugins' "$log" 2>/dev/null && break; done
          sleep 20
          pkill -f "$root" || true
          echo "--- idea.log (selected)"; grep -E 'IDE: |Loaded custom plugins|io\.mateu|ERROR' "$log" | head -60 || true
          grep 'Loaded custom plugins' "$log" | grep -q 'Mateu' && echo "✅ linux: Mateu plugin loaded" | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        if: steps.want.outputs.go == 'true'
        with:
          name: mateu-desktop-${{ matrix.base }}-${{ matrix.platform }}
          path: |
            frontend/app/intellij-plugin/build/installer/*-linux.tar.gz
            frontend/app/intellij-plugin/build/installer/*-windows.zip
          retention-days: 3
          compression-level: 0

  smoke-windows:
    needs: [package-linux-windows]
    if: always()
    runs-on: windows-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        base: [oss-release, from-source]
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        id: dl
        continue-on-error: true
        with:
          name: mateu-desktop-${{ matrix.base }}-windows
          path: ${{ runner.temp }}\pkg
      - name: Launch the app, the Mateu plugin must load
        if: steps.dl.outcome == 'success'
        shell: pwsh
        run: |
          $zip = Get-ChildItem "$env:RUNNER_TEMP\pkg\*-windows.zip" | Select-Object -First 1
          Expand-Archive $zip.FullName -DestinationPath "$env:RUNNER_TEMP\app"
          $root = (Get-ChildItem "$env:RUNNER_TEMP\app" -Directory | Select-Object -First 1).FullName
          $p = Start-Process -FilePath "$root\mateu.bat" -PassThru -WindowStyle Hidden
          $log = "$root\data\log\idea.log"
          for ($i = 0; $i -lt 36; $i++) { Start-Sleep 5; if ((Test-Path $log) -and (Select-String -Path $log -Pattern 'Loaded custom plugins' -Quiet)) { break } }
          Start-Sleep 20
          Get-Process | Where-Object { $_.Path -like "$root*" } | Stop-Process -Force -ErrorAction SilentlyContinue
          Select-String -Path $log -Pattern 'IDE: |Loaded custom plugins|io\.mateu|ERROR' | Select-Object -First 60 | ForEach-Object { $_.Line }
          if (Select-String -Path $log -Pattern 'Loaded custom plugins.*Mateu' -Quiet) { "✅ windows (${{ matrix.base }}): Mateu plugin loaded" | Tee-Object -Append $env:GITHUB_STEP_SUMMARY } else { exit 1 }
