# "First hour" smoke of a RELEASE, against what was PUBLISHED — not against this repository's code:
# once Maven Central / PyPI / NuGet serve the version, generate a fresh project per runtime with the
# New Project generator (the engine of the IntelliJ wizard and the VS Code command; plus the Maven
# archetype once), build it from the public registries only, start it and walk it in headless
# Chromium (home renders, the products listing opens, a create round trip works, no page errors).
# Everything lives in scripts/first-hour-smoke.sh + e2e/first-hour-probe.mjs, runnable locally:
#
#   scripts/first-hour-smoke.sh --version 3.0-beta.1 --runtime spring-mvc
#
# Cost: runs ONLY on a framework release and by hand (workflow_dispatch) — never on a PR or a push.
# One small job waits for the registries (bounded); the matrix starts only when something is
# servable, and only for what is. A version still missing after the wait is a WARNING, never a red
# run: the release itself is already published by then (buid-and-publish.yml) and nothing here can
# undo or retry it. A real failure (the generated project does not build, start or render) is red.
name: Release smoke (first hour)

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: Released Mateu version, Maven spelling (e.g. 3.0-beta.1)
        required: true
      runtimes:
        description: Targets, space-separated, or "all" (spring-mvc spring-webflux quarkus micronaut helidon-mp dotnet python yaml static archetype)
        required: false
        default: all
      wait-minutes:
        description: How long to wait for the registries to serve the version
        required: false
        default: '0'

permissions:
  contents: read

concurrency:
  group: release-smoke-${{ github.event.release.tag_name || inputs.version }}
  cancel-in-progress: true

jobs:
  registries:
    # Framework releases only (tag vX.Y…), like buid-and-publish.yml; any dispatch.
    if: github.event_name == 'workflow_dispatch' || startsWith(github.event.release.tag_name, 'v3.')
    runs-on: ubuntu-latest
    # The release publishes to Central after its own e2e run, then Central takes a while to serve it.
    timeout-minutes: 330
    outputs:
      version: ${{ steps.wait.outputs.version }}
      targets: ${{ steps.wait.outputs.targets }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/app/vscode-extension/package-lock.json
      - name: Compile the New Project generator (it owns the NuGet/PyPI version spelling)
        working-directory: frontend/app/vscode-extension
        run: npm ci --ignore-scripts --no-audit --no-fund && npm run compile
      # Inputs and the tag reach the shell through env, never by `${{ }}` substitution into the script.
      - name: Wait until the registries serve the release
        id: wait
        env:
          TAG: ${{ github.event.release.tag_name }}
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_RUNTIMES: ${{ inputs.runtimes }}
          INPUT_WAIT: ${{ inputs.wait-minutes }}
        run: |
          set -uo pipefail
          V="${INPUT_VERSION:-${TAG#v}}"
          if [ -n "$TAG" ]; then WAIT=300; else WAIT="${INPUT_WAIT:-0}"; fi
          echo "version=$V" >> "$GITHUB_OUTPUT"
          scripts/first-hour-smoke.sh --version "$V" --runtime "${INPUT_RUNTIMES:-all}" --wait "$WAIT" \
            --only-wait --available-out "$RUNNER_TEMP/available" | tee "$RUNNER_TEMP/wait.log"
          rc=${PIPESTATUS[0]}
          grep '^NOT PUBLISHED' "$RUNNER_TEMP/wait.log" | sed 's/^/::warning::/' || true
          [ "$rc" = 2 ] && exit 2
          targets=$(jq -Rc 'split(" ") | map(select(length > 0))' < "$RUNNER_TEMP/available" 2>/dev/null || true)
          [ -n "$targets" ] || targets='[]'
          echo "targets=$targets" >> "$GITHUB_OUTPUT"
          if [ "$targets" = '[]' ]; then
            echo "::warning::Mateu $V is not on the registries after ${WAIT} minutes: nothing to smoke. Run this workflow by hand (workflow_dispatch) once it is."
          fi

  smoke:
    needs: registries
    if: needs.registries.outputs.targets != '' && needs.registries.outputs.targets != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJSON(needs.registries.outputs.targets) }}
    name: smoke (${{ matrix.target }})
    env:
      V: ${{ needs.registries.outputs.version }}
      TARGET: ${{ matrix.target }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # JDK 21 for every target: Maven builds the Java projects, and the static bundle and the
      # archetype run through Maven too (the archetype's Groovy needs a JDK <= 25).
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          java-version: 21
          distribution: temurin
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            frontend/app/vscode-extension/package-lock.json
            e2e/package-lock.json
      - if: matrix.target == 'dotnet'
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 8.0.x
      - if: matrix.target == 'python'
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Generator and Playwright
        run: |
          (cd frontend/app/vscode-extension && npm ci --ignore-scripts --no-audit --no-fund && npm run compile)
          (cd e2e && npm ci --no-audit --no-fund && npx playwright install --with-deps chromium)
      # No Maven/NuGet/pip cache on purpose: resolving from the public registries IS the test.
      - name: Generate, build, start and walk a fresh ${{ matrix.target }} project
        run: |
          set -uo pipefail
          PYTHON=python3 scripts/first-hour-smoke.sh --version "$V" --runtime "$TARGET" \
            --workdir "$RUNNER_TEMP/first-hour" --keep
          rc=$?
          if [ "$rc" = 3 ]; then echo "::warning::$TARGET: Mateu $V is not on its registry; not tested."; exit 0; fi
          exit $rc
      - name: Logs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: first-hour-${{ matrix.target }}
          path: ${{ runner.temp }}/first-hour/logs
          retention-days: 7
