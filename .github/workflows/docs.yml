# Builds the documentation site (doc/, Astro + Starlight) and publishes it to mateu.io.
#
# - On every PR that touches doc/: build it and fail on build errors or on any internal link or
#   image that does not resolve in the built site (scripts/check-links.mjs).
# - On master and on every framework release: build and deploy to Netlify (production).
#
# Why this exists: mateu.io is hosted on Netlify, but production deploys stopped tracking master
# around 2026-08-14 (the PR deploy previews show "Deploy Preview canceled", and master commits get no
# production deploy), so the site fell two months behind. Deploying from here makes the published
# site a function of master again, independent of the Netlify UI build settings.
#
# Required repository secrets for the deploy step (PR builds need none):
#   NETLIFY_AUTH_TOKEN  personal access token of the Netlify account that owns the site
#   NETLIFY_SITE_ID     the site's API id (Site configuration → General → Site details)
# Without them the deploy step is skipped with a notice, never failed.
name: Docs

# Pull requests: EVERY one, with the path filter inside (the `changes` job), so `docs-ok` always
# reports and can be required — a workflow skipped by a trigger-level `paths:` reports nothing.
on:
  pull_request:
  push:
    branches: [master]
    paths:
      - 'doc/**'
      - '.github/workflows/docs.yml'
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read # sparse checkout of scripts/
      pull-requests: read # list the PR's files
    outputs:
      relevant: ${{ steps.diff.outputs.relevant }}
      snippets: ${{ steps.snippets.outputs.relevant }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: scripts
      - id: diff
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          PR: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
          PATTERN: '^doc/|^\.github/workflows/docs\.yml$'
        run: scripts/ci-changes.sh
      # The snippet check also runs when an API the samples are written against changes: a renamed
      # annotation attribute in uidl breaks a doc page without touching doc/.
      - id: snippets
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          PR: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
          PATTERN: '^doc/src/content/docs/|^doc/scripts/(check-snippets\.mjs|snippets/)|^backend/shared/(uidl|core|dtos)/(src/main/|pom\.xml$)|^backend/shared/uidl/specs-schema\.json$|^backend/python/(mateu_|pyproject\.toml$)|^backend/dotnet/(src/|Directory\.)|^\.github/workflows/docs\.yml$'
        run: scripts/ci-changes.sh

  build:
    needs: changes
    # Framework releases only (tag vX.Y…); the desktop installer releases don't touch the docs.
    if: >-
      needs.changes.outputs.relevant == 'true' &&
      (github.event_name != 'release' || startsWith(github.event.release.tag_name, 'v'))
    timeout-minutes: 50
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The version plugin falls back to the newest release tag when Maven Central can't answer.
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: doc/package-lock.json
      # --ignore-scripts: the lockfile's only install hooks are esbuild's (its platform binary is an
      # optional dependency) and fsevents (macOS); the build and the link check pass without them.
      - name: Install
        run: npm ci --ignore-scripts
        working-directory: doc
      # Only once Maven Central SERVES it: a release is published minutes to hours before its
      # artifacts reach Central, and a snippet naming a version Central does not have fails for
      # everyone who copies it. Not served after the wait → no pin: the version plugin then shows
      # Central's latest, and the "Point the examples at …" PR (a push to master touching doc/)
      # redeploys the site once the release is there.
      - name: Pin the version shown in the snippets to the release being published
        if: github.event_name == 'release'
        run: |
          V="${GITHUB_REF_NAME#v}"
          url="https://repo1.maven.org/maven2/io/mateu/mateu-bom/$V/mateu-bom-$V.pom"
          for _ in $(seq 1 20); do   # up to ~20 minutes
            if curl -fsSIL "$url" > /dev/null; then echo "MATEU_VERSION=$V" >> "$GITHUB_ENV"; exit 0; fi
            sleep 60
          done
          echo "::warning::$V is not on Maven Central yet; the snippets show Central's latest release until the next deploy."
      - name: Build
        run: npm run build
        working-directory: doc
      - name: Check internal links and images
        run: npm run check-links
        working-directory: doc
      - name: Deploy to Netlify (production)
        if: github.event_name != 'pull_request'
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
        run: |
          if [ -z "$NETLIFY_AUTH_TOKEN" ] || [ -z "$NETLIFY_SITE_ID" ]; then
            echo "::notice::NETLIFY_AUTH_TOKEN / NETLIFY_SITE_ID not configured — skipping the deploy."
            exit 0
          fi
          # At an exact version, without install hooks (its postinstall only sets up shell
          # completion and prints a welcome), outside the project — not `npx --yes …@latest`.
          npm install --prefix "$RUNNER_TEMP/netlify" --no-save --ignore-scripts netlify-cli@27.12.0
          "$RUNNER_TEMP/netlify/node_modules/.bin/netlify" deploy --dir=doc/dist --prod --no-build \
            --site "$NETLIFY_SITE_ID" --auth "$NETLIFY_AUTH_TOKEN" \
            --message "${GITHUB_SHA::9} ${GITHUB_EVENT_NAME}"

  # Every ```java / ```csharp / ```python / ```yaml block of the docs compiled, type-checked or
  # schema-validated against the CURRENT sources (doc/scripts/check-snippets.mjs; locally
  # `npm run check:snippets` in doc/). Needs no `npm ci`: the script uses Node built-ins only. The
  # Java leg installs uidl + core (no tests, no javadoc) and compiles ~1400 samples in one javac run;
  # the Python leg is one mypy run; the C# leg one `dotnet build` of a generated project referencing
  # backend/dotnet/src. Not on releases: the samples were checked on the PR that changed them.
  snippets:
    needs: changes
    if: needs.changes.outputs.snippets == 'true' && github.event_name != 'release'
    timeout-minutes: 20
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          java-version: 21
          distribution: zulu
          cache: maven
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/python/pyproject.toml
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x
      - name: Install mateu-uidl + mateu-core (the API the Java samples compile against)
        run: >-
          mvn -B -q install -DskipTests -Dgpg.skip=true -Dmaven.javadoc.skip=true -Djacoco.skip=true
          -Djapicmp.skip=true --file backend/pom.xml -pl shared/core -am
      - name: Install mateu-ui (the API the Python samples are type-checked against)
        run: pip install "./backend/python[dev,all]" jsonschema
      - name: Check the documentation snippets
        env:
          MATEU_SNIPPETS_PYTHON: python
        run: node doc/scripts/check-snippets.mjs --require

  # The check to require on master (design/ci-required-checks.md): always reports, green when the
  # build passed or was skipped because the PR does not touch the docs.
  docs-ok:
    if: always()
    needs: [changes, build, snippets]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Every job passed or was legitimately skipped
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          echo "$NEEDS" | jq -r 'to_entries[] | "\(.value.result)\t\(.key)"'
          bad=$(echo "$NEEDS" | jq '[to_entries[] | select(.value.result != "success" and .value.result != "skipped")] | length')
          if [ "$bad" != 0 ]; then
            echo "::error::$bad job(s) failed or were cancelled — see the list above."
            exit 1
          fi
