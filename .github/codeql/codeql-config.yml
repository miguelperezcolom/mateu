name: "Mateu CodeQL config"

# Don't scan generated/minified frontend bundles (built by `yarn copy` and committed as the served
# static assets) or vendored static sites — analysing minified output only yields false positives.
paths-ignore:
  - '**/frontend/**/src/main/resources/**'
  - 'demo/sites/**'
  - '**/*.min.js'
  - 'doc/**'
  - 'docs/**'
