<!doctype html>
<meta charset="utf-8" />
<style>
  body { font: 13px Inter, system-ui, sans-serif; margin: 0; padding: 16px; color: var(--figma-color-text, #222); background: var(--figma-color-bg, #fff); }
  h2 { font-size: 13px; margin: 18px 0 6px; }
  label { display: block; margin: 6px 0 2px; color: var(--figma-color-text-secondary, #666); font-size: 11px; }
  input, select, textarea { width: 100%; box-sizing: border-box; padding: 6px; font: inherit; color: inherit; background: transparent; border: 1px solid var(--figma-color-border, #ccc); border-radius: 4px; }
  textarea { height: 90px; font-family: monospace; font-size: 11px; }
  .row { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; align-items: end; }
  button { margin-top: 14px; padding: 8px 14px; border: 0; border-radius: 4px; background: var(--figma-color-bg-brand, #0d6efd); color: #fff; font: inherit; font-weight: 600; cursor: pointer; }
  button:disabled { opacity: .5; }
  #status { margin-top: 10px; white-space: pre-wrap; }
  .warn { color: var(--figma-color-text-warning, #a15c00); font-size: 11px; margin: 4px 0; }
  .hint { color: var(--figma-color-text-secondary, #666); font-size: 11px; margin: 4px 0; }
  a { color: var(--figma-color-text-brand, #0d6efd); cursor: pointer; }
</style>
<div id="app">Reading the design…</div>
