# Generated from the Figma frame "contact" (node 2:767) by design/figma/to-yaml.
# Regenerate it from the design rather than editing it by hand.
$schema: https://raw.githubusercontent.com/miguelperezcolom/mateu/master/backend/shared/uidl/specs-schema.json
type: Form
title: Contacto
subtitle: Cuéntanos quién eres
toolbar:
  - type: Button
    buttonStyle: primary
    label: Guardar
    actionId: save
  - type: Button
    label: Cancelar
    actionId: cancel
content:
  - type: Card
    cssClasses: mateu-section
    content:
      type: FormLayout
      content:
        - type: FormField
          id: name
          dataType: string
          label: Nombre
          required: true
          placeholder: Tu nombre
        - type: FormField
          id: email
          dataType: string
          label: Email
          required: true
          placeholder: tu@correo.com
        - type: FormField
          id: country
          dataType: string
          stereotype: select
          placeholder: Elige un país
          label: País
        - type: FormField
          id: birthDate
          dataType: date
          label: Fecha de nacimiento
    title:
      type: Text
      container: h3
      text: Datos personales
  - type: Card
    cssClasses: mateu-section
    content:
      type: FormLayout
      content:
        - type: FormField
          id: amount
          dataType: number
          label: Importe
        - type: FormField
          id: newsletter
          dataType: bool
          stereotype: checkbox
          label: Quiero recibir novedades
    title:
      type: Text
      container: h3
      text: Preferencias
