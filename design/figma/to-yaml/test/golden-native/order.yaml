# Generated from the Figma frame "order" (node 9:1) by design/figma/to-yaml.
# Regenerate it from the design rather than editing it by hand.
$schema: https://raw.githubusercontent.com/miguelperezcolom/mateu/master/backend/shared/uidl/specs-schema.json
type: Form
title: "${state.number}"
subtitle: Order
toolbar:
  - type: Button
    buttonStyle: tertiary
    actionId: backToList
    label: Back to orders
    actionable:
      type: RouteLink
      route: orders
  - type: Button
    buttonStyle: primary
    label: Edit
    actionable:
      type: RouteLink
      route: "orders/${state.id}/edit"
template:
  type: ItemOverviewPage
  body:
    - type: FormField
      id: customer
      dataType: string
      required: true
      label: Customer
  avatar:
    initials: "${state.initials}"
content:
  - type: Card
    cssClasses: mateu-section
    content:
      type: FormLayout
      content:
        - type: FormField
          id: product
          dataType: string
          label: Product
        - type: FormField
          id: quantity
          dataType: string
          required: true
          label: Quantity
        - type: FormField
          id: unit
          dataType: string
          stereotype: select
          label: Unit
          options:
            - value: pcs
              label: Pieces
            - value: box
              label: Boxes of 12, sealed
    title:
      type: Text
      container: h3
      text: Lines
  - type: Card
    cssClasses: mateu-section
    content:
      type: FormLayout
      content:
        - type: FormField
          id: address
          dataType: string
          label: Address
          propertyRow: true
          readOnly: true
    title:
      type: Text
      container: h3
      text: Delivery
  - type: Card
    cssClasses: mateu-section
    content:
      type: FormLayout
      content:
        - type: FormField
          id: note
          dataType: string
          label: Internal note
    title:
      type: Text
      container: h3
      text: Notes
