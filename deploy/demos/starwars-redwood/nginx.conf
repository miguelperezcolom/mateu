# The Redwood Star Wars site: static files (target/mateu-bundle of demo/demo-starwars, -Predwood-bundle)
# with an SPA fallback, and /mateu/** proxied to the demo-starwars backend — only the WRITES go there
# (proxy sources: the swapi X-Api-Key must not reach the browser). Reads go from the browser to swapi.
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;

    location = /healthz { access_log off; return 200 "ok\n"; }

    # The UI manifest the Mateu mobile app reads, and the bundle it then runs from, are FILES of the
    # bundle, not backend calls. Public, no credentials: any origin may read them (the app's web build).
    location = /mateu/v3/manifest {
        default_type application/json;
        add_header Access-Control-Allow-Origin "*" always;
        try_files $uri =404;
    }
    location = /manifest.json {
        add_header Access-Control-Allow-Origin "*" always;
        try_files $uri =404;
    }

    location /mateu/ {
        proxy_pass http://demo-starwars.mateu-demos.svc.cluster.local:8600;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_read_timeout 30s;
        client_max_body_size 64k;
    }

    location / { try_files $uri $uri/ /index.html; }
}
