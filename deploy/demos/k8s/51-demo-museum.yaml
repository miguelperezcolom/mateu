# demo-museum — the museums reference app (demo/demo-museum, 100% YAML) on the Vaadin renderer, reading
# museum-service at museum-api.ec1.mateu.io (MATEU_ENVIRONMENT=public re-points its sources). The writes are proxy sources:
# the key comes from the museum-service-write-key secret, never reaches the browser.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: demo-museum
  namespace: mateu-demos
  labels: { app: demo-museum }
spec:
  replicas: 1
  selector:
    matchLabels: { app: demo-museum }
  template:
    metadata:
      labels: { app: demo-museum }
    spec:
      nodeSelector:
        kubernetes.io/arch: amd64
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: app
          image: miguelperezcolom/demo-museum:3.0-beta.31
          env:
            - { name: SERVER_PORT, value: "8601" }
            - { name: JAVA_TOOL_OPTIONS, value: "-Djava.io.tmpdir=/tmp -XX:MaxRAMPercentage=75" }
            - { name: MATEU_ENVIRONMENT, value: public }
            - { name: MATEU_CORS_ALLOWED_ORIGINS, value: "*" }
            - name: MATEU_SECRET_MUSEUM_WRITE_KEY
              valueFrom:
                secretKeyRef: { name: museum-service-write-key, key: WRITE_KEY }
          ports:
            - { name: http, containerPort: 8601 }
          readinessProbe:
            httpGet: { path: /, port: 8601 }
            initialDelaySeconds: 20
            periodSeconds: 10
            failureThreshold: 30
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
          resources:
            requests: { memory: "320Mi", cpu: "50m" }
            limits:   { memory: "448Mi" }
      volumes:
        - { name: tmp, emptyDir: {} }
---
apiVersion: v1
kind: Service
metadata:
  name: demo-museum
  namespace: mateu-demos
spec:
  selector: { app: demo-museum }
  ports:
    - { name: http, port: 8601, targetPort: 8601 }
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: demo-museum
  namespace: mateu-demos
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt
spec:
  ingressClassName: nginx
  tls:
    - hosts: [museums.ec1.mateu.io]
      secretName: demo-museum-tls
  rules:
    - host: museums.ec1.mateu.io
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service: { name: demo-museum, port: { number: 8601 } }
