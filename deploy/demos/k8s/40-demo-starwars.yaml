# demo/demo-starwars: the 100%-YAML Mateu app over swapi.mateu.io, at starwars.ec1.mateu.io. Also the
# UI to try the Mateu mobile app with: add it by typing starwars.ec1.mateu.io (or scanning its QR).
# No DNS to add: the *.ec1 wildcard already points at the ingress; cert-manager issues the certificate.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: demo-starwars
  namespace: mateu-demos
  labels: { app: demo-starwars }
spec:
  replicas: 1
  selector:
    matchLabels: { app: demo-starwars }
  template:
    metadata:
      labels: { app: demo-starwars }
    spec:
      nodeSelector:
        kubernetes.io/arch: amd64
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: app
          image: miguelperezcolom/demo-starwars:3.0-beta.25
          env:
            - { name: SERVER_PORT, value: "8600" }
            - { name: JAVA_TOOL_OPTIONS, value: "-Djava.io.tmpdir=/tmp -XX:MaxRAMPercentage=75" }
            # How the UI presents itself in the Mateu mobile app's list (GET /mateu/v3/manifest).
            - { name: MATEU_MOBILE_NAME, value: "Star Wars" }
            - { name: MATEU_MOBILE_THEME_COLOR, value: "#111111" }
            # Public demo, no credentials: any origin may call it (the mobile app's web build, embeds).
            # Applies only to /mateu/** paths (CorsPolicy).
            - { name: MATEU_CORS_ALLOWED_ORIGINS, value: "*" }
            # The swapi write key, for the proxy sources (create/update/delete): the SERVER adds the
            # X-Api-Key header, the browser never sees it. Same Secret the swapi Deployment reads.
            - name: MATEU_SECRET_SWAPI_WRITE_KEY
              valueFrom:
                secretKeyRef: { name: swapi-write-key, key: WRITE_KEY }
          ports:
            - { name: http, containerPort: 8600 }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          resources:
            requests: { memory: "320Mi", cpu: "50m" }
            limits:   { memory: "448Mi" }
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
          startupProbe:
            httpGet: { path: /mateu/v3/manifest, port: 8600 }
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            httpGet: { path: /mateu/v3/manifest, port: 8600 }
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /mateu/v3/manifest, port: 8600 }
            periodSeconds: 20
      volumes:
        - { name: tmp, emptyDir: {} }
---
apiVersion: v1
kind: Service
metadata:
  name: demo-starwars
  namespace: mateu-demos
spec:
  selector: { app: demo-starwars }
  ports:
    - { name: http, port: 8600, targetPort: 8600 }
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: demo-starwars
  namespace: mateu-demos
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt
spec:
  ingressClassName: nginx
  tls:
    - hosts: [starwars.ec1.mateu.io]
      secretName: demo-starwars-tls
  rules:
    - host: starwars.ec1.mateu.io
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service: { name: demo-starwars, port: { number: 8600 } }
