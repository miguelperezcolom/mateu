# demo/demo-starwars on the REDWOOD renderer, as static files at museums-rw.ec1.mateu.io: the bundle
# (mvn package -Predwood-bundle) behind an unprivileged nginx. The browser reads swapi.mateu.io
# directly; only /mateu/** (the writes, proxy sources holding the swapi key) goes to the demo-starwars
# backend (40-demo-starwars.yaml). JET/Spectra/VB load from Oracle's CDN in the browser.
# No DNS to add: the *.ec1 wildcard already points at the ingress; cert-manager issues the certificate.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: demo-museum-redwood
  namespace: mateu-demos
  labels: { app: demo-museum-redwood }
spec:
  replicas: 1
  selector:
    matchLabels: { app: demo-museum-redwood }
  template:
    metadata:
      labels: { app: demo-museum-redwood }
    spec:
      nodeSelector:
        kubernetes.io/arch: amd64
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: web
          image: miguelperezcolom/demo-museum-redwood:3.0-beta.34
          ports:
            - { name: http, containerPort: 8080 }
          readinessProbe:
            httpGet: { path: /healthz, port: 8080 }
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /healthz, port: 8080 }
            periodSeconds: 30
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
          resources:
            requests: { memory: "16Mi", cpu: "10m" }
            limits:   { memory: "64Mi", cpu: "250m" }
      volumes:
        - { name: tmp, emptyDir: {} }
---
apiVersion: v1
kind: Service
metadata:
  name: demo-museum-redwood
  namespace: mateu-demos
spec:
  selector: { app: demo-museum-redwood }
  ports:
    - { name: http, port: 8080, targetPort: 8080 }
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: demo-museum-redwood
  namespace: mateu-demos
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt
    # a loan document travels as a data URI in a JSON body: 5 MB of file ≈ 7 MB (ingress-nginx defaults to 1m)
    nginx.ingress.kubernetes.io/proxy-body-size: 10m
spec:
  ingressClassName: nginx
  tls:
    - hosts: [museums-rw.ec1.mateu.io]
      secretName: demo-museum-redwood-tls
  rules:
    - host: museums-rw.ec1.mateu.io
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service: { name: demo-museum-redwood, port: { number: 8080 } }
