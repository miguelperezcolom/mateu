# space-service — the space demo's writable data API (github.com/miguelperezcolom/space-service), as swapi.
# space-api.ec1.mateu.io: the demo's sources read it from the browser (CORS *); writes carry the key, held by the
# demo's backend (proxy sources), never the browser. Image: miguelperezcolom/space-service:<tag>, built from
# that repo (mvn package, then docker build).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: space-service
  namespace: mateu-demos
  labels: { app: space-service }
spec:
  replicas: 1
  selector:
    matchLabels: { app: space-service }
  template:
    metadata:
      labels: { app: space-service }
    spec:
      nodeSelector:
        kubernetes.io/arch: amd64
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: app
          image: miguelperezcolom/space-service:661a4f7
          env:
            - { name: SERVER_PORT, value: "8122" }
            # an uploaded portrait is served by this API and linked with an absolute URL (the UI is elsewhere)
            - { name: PUBLIC_BASE_URL, value: "https://space-api.ec1.mateu.io" }
            - name: WRITE_KEY
              valueFrom:
                secretKeyRef: { name: space-service-write-key, key: WRITE_KEY }
          ports:
            - { name: http, containerPort: 8122 }
          readinessProbe:
            httpGet: { path: /actuator/health/readiness, port: 8122 }
            initialDelaySeconds: 20
            periodSeconds: 10
            failureThreshold: 30
          livenessProbe:
            httpGet: { path: /actuator/health/liveness, port: 8122 }
            initialDelaySeconds: 120
            periodSeconds: 30
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
          resources:
            requests: { memory: "320Mi", cpu: "50m" }
            limits:   { memory: "448Mi" }
      volumes:
        - { name: tmp, emptyDir: {} }
---
apiVersion: v1
kind: Service
metadata:
  name: space-service
  namespace: mateu-demos
spec:
  selector: { app: space-service }
  ports:
    - { name: http, port: 8122, targetPort: 8122 }
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: space-service
  namespace: mateu-demos
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt
    # an astronaut's uploaded portrait (≤ 2 MB) travels base64-encoded in the save: ~2.7 MB of JSON
    nginx.ingress.kubernetes.io/proxy-body-size: "4m"
spec:
  ingressClassName: nginx
  tls:
    - hosts: [space-api.ec1.mateu.io]
      secretName: space-service-tls
  rules:
    - host: space-api.ec1.mateu.io
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service: { name: space-service, port: { number: 8122 } }
