# demo-explorer — the Mateu Explorer (demo/demo-explorer): every component, page template, archetype,
# behaviour and distributed-UI pattern, live, with its code. Vaadin renderer. PREPARED, NOT APPLIED:
# the image tag is a placeholder until the first image is pushed (deploy/demos/demo-explorer.Dockerfile).
# The remote apps the "Distributed UIs" area federates get their own Deployment/Service here when they land.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: demo-explorer
  namespace: mateu-demos
  labels: { app: demo-explorer }
spec:
  replicas: 1
  selector:
    matchLabels: { app: demo-explorer }
  template:
    metadata:
      labels: { app: demo-explorer }
    spec:
      nodeSelector:
        kubernetes.io/arch: amd64
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: app
          image: miguelperezcolom/demo-explorer:3.0-beta.51-TBD
          env:
            - { name: SERVER_PORT, value: "8640" }
            - { name: JAVA_TOOL_OPTIONS, value: "-Djava.io.tmpdir=/tmp -XX:MaxRAMPercentage=75" }
          ports:
            - { name: http, containerPort: 8640 }
          readinessProbe:
            httpGet: { path: /, port: 8640 }
            initialDelaySeconds: 20
            periodSeconds: 10
            failureThreshold: 30
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
          resources:
            requests: { memory: "320Mi", cpu: "50m" }
            limits:   { memory: "512Mi" }
      volumes:
        - { name: tmp, emptyDir: {} }
---
apiVersion: v1
kind: Service
metadata:
  name: demo-explorer
  namespace: mateu-demos
spec:
  selector: { app: demo-explorer }
  ports:
    - { name: http, port: 8640, targetPort: 8640 }
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: demo-explorer
  namespace: mateu-demos
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt
spec:
  ingressClassName: nginx
  tls:
    - hosts: [explorer.mateu.io]
      secretName: demo-explorer-tls
  rules:
    - host: explorer.mateu.io
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service: { name: demo-explorer, port: { number: 8640 } }
