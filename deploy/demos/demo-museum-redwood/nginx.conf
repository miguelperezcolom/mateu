# The Redwood museums site: static files (target/mateu-bundle of demo/demo-museum, -Predwood-bundle)
# with an SPA fallback, and /mateu/** proxied to the demo-starwars backend — only the WRITES go there
# (proxy sources: the museum-service X-Api-Key must not reach the browser). Reads go from the browser to museum-api.ec1.mateu.io.
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;

    # the bundle's manifest.json is ~1 MB of JSON: compressed it is a fraction of that, which is
    # what a phone on a mobile network waits for when it opens the UI
    gzip on;
    gzip_types application/json application/javascript text/css image/svg+xml;
    gzip_min_length 1024;
    gzip_vary on;

    location = /healthz { access_log off; return 200 "ok\n"; }

    # The UI manifest the Mateu mobile app reads, and the bundle it then runs from, are FILES of the
    # bundle, not backend calls. Public, no credentials: any origin may read them (the app's web build).
    location = /mateu/v3/manifest {
        default_type application/json;
        add_header Access-Control-Allow-Origin "*" always;
        try_files $uri =404;
    }
    location = /manifest.json {
        add_header Access-Control-Allow-Origin "*" always;
        try_files $uri =404;
    }

    location /mateu/ {
        proxy_pass http://demo-museum.mateu-demos.svc.cluster.local:8601;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_read_timeout 30s;
        client_max_body_size 64k;
    }

    # The page names the build's bundle (?v=); sent with no Cache-Control, browsers kept an old page
    # after a deploy — and with it the old bundle. Revalidated every time (a 304 when unchanged).
    location = /index.html { add_header Cache-Control "no-cache" always; }

    location / { try_files $uri $uri/ /index.html; }
}
