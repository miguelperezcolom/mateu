# A local tool: a free port, chosen by the OS (OpenBrowser reads the real one at startup)...
server.port=0
# ...listening on this machine only: nothing on the network can reach it.
server.address=127.0.0.1

# Open the default browser at startup (false: only print the address).
local-tool.open-browser=true
# Stop after this long without a request; 0 = never (hardening.IdleShutdown).
local-tool.idle-shutdown=30m

spring.main.banner-mode=off
logging.level.root=WARN

# Mateu notes once that no security module is present; a local tool has its own guard.
logging.level.io.mateu.core.infra.security.IdentityResolver=ERROR
