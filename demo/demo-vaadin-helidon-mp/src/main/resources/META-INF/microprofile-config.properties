# Microprofile server properties
server.port=8080
server.host=0.0.0.0

# Change the following to true to enable the optional MicroProfile Metrics REST.request metrics
metrics.rest-request.enabled=false

# Application properties. This is the default greeting
app.greeting=Hello


mp.openapi.scan.packages=io.mateu



# Serve the bundled Mateu Vaadin frontend (vaadin-lit jar: /static/assets/*) at /assets/*
server.static.classpath.context=/
server.static.classpath.location=/static
