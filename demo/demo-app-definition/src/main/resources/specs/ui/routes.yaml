# The route registry: ONLY routing — each URL bound to a definition (and optionally a viewModel).
$schema: https://raw.githubusercontent.com/miguelperezcolom/mateu/master/backend/shared/uidl/routes-schema.json
type: Routes
routes:
  - route: ""          # the mount root → the app shell view
    definition: app.yaml
  - route: orders
    definition: orders.yaml
  - route: users
    definition: users.yaml
  - route: tasks       # a CRUD mediator bound to a route by DATA (no @UI) — wrapped in the shell
    viewModel: io.mateu.demo.appdefinition.TaskCrud
  - route: dashboard   # a Dashboard TEMPLATE bound by data (no @UI)
    viewModel: io.mateu.demo.appdefinition.SalesDashboard
  - route: customer    # a page definition bound to a form view model (data-source binding demo)
    definition: customer-form.yaml
    viewModel: io.mateu.demo.appdefinition.CustomerForm
