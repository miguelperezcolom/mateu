# CREATE form (films/new) — the edit form minus the id, pointing at the POST source. Nothing
# about it is a special "create mode": it is a form whose action happens to be a create.
$schema: https://raw.githubusercontent.com/miguelperezcolom/mateu/master/backend/shared/uidl/specs-schema.json
type: Form
title: New film
toolbar:
- type: Button
  actionId: backToList
  label: Back
  actionable:
    type: RouteLink
    route: films
content:
- type: FormLayout
  content:
  - type: FormField
    autofocus: true
    id: title
    label: Title
    required: true
  - type: FormField
    id: episodeId
    label: Episode
    dataType: integer
  - type: FormField
    id: director
    label: Director
  - type: FormField
    id: producer
    label: Producer
  - type: FormField
    id: releaseDate
    label: Released
    dataType: date
buttons:
- type: Button
  label: Create
  actionId: create
  buttonStyle: primary
actions:
- id: create
  validationRequired: true
  restAction:
    source:
      ref: swapi-film-create
    successMessage: Created
    # The response carries the created record, id included, so merging it lets the client land on
    # the new record's own read-only view.
    resultPath: ""
    successRoute: films/${state.id}
