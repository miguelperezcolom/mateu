# Species fill Redwood's COLLECTION DETAIL PAGE template (Spectra oj-sp-collection-detail-page): the
# collection on one side, the selected species' detail on the other. This page is the collection with
# NOTHING selected — it has no content, so the template shows its noSelection slot; species/:id
# (species-record.yaml) is the same list with a species selected. A row opens it (rowRoute).
$schema: https://raw.githubusercontent.com/miguelperezcolom/mateu/master/backend/shared/uidl/specs-schema.json
type: Form
title: Species
subtitle: The peoples of the galaxy
toolbar:
  - type: Button
    label: New species
    buttonStyle: primary
    actionable:
      type: RouteLink
      route: species/new
template:
  type: CollectionDetailPage
  list:
    - {type: Partial, ref: species-list}
  noSelection:
    - type: EmptyState
      icon: "🧬"
      title: Pick a species
      description: Choose one in the list to see its physiology, its appearance and where it comes from.
