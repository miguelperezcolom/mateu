# EDIT form for one record (route species/:id/edit) — editable + Save/Delete, < back to the view.
$schema: https://raw.githubusercontent.com/miguelperezcolom/mateu/master/backend/shared/uidl/specs-schema.json
type: Form
title: Edit ${state.name}
subtitle: Species
toolbar:
- type: Button
  actionId: backToList
  label: Back
  actionable:
    type: RouteLink
    route: species/${state.id}
content:
- type: FormLayout
  content:
  - type: FormField
    id: name
    label: Name
    required: true
  - type: FormField
    id: classification
    label: Classification
  - type: FormField
    id: designation
    label: Designation
  - type: FormField
    id: language
    label: Language
  - type: FormField
    id: averageHeight
    label: Average height (cm)
    dataType: integer
  - type: FormField
    id: averageLifespan
    label: Average lifespan (y)
    dataType: integer
  - type: FormField
    id: skinColors
    label: Skin colours
  - type: FormField
    id: hairColors
    label: Hair colours
  - type: FormField
    id: eyeColors
    label: Eye colours
  - type: FormField
    id: homeworldName
    label: Homeworld
    readOnly: true
buttons:
- type: Button
  label: Save
  actionId: save
  buttonStyle: primary
actions:
- id: save
  validationRequired: true
  restAction:
    source:
      ref: swapi-species-update
    successMessage: Saved
    successRoute: species/${state.id}
