# EDIT form for one record (route films/:id/edit) — editable + Save/Delete, < back to the view.
$schema: https://raw.githubusercontent.com/miguelperezcolom/mateu/master/backend/shared/uidl/specs-schema.json
type: Form
title: Edit ${state.title}
subtitle: Film
toolbar:
- type: Button
  actionId: backToList
  label: Back
  actionable:
    type: RouteLink
    route: films/${state.id}
content:
- type: FormLayout
  content:
  - type: FormField
    id: title
    label: Title
    required: true
  - type: FormField
    id: episodeId
    label: Episode
    dataType: integer
  - type: FormField
    id: director
    label: Director
  - type: FormField
    id: producer
    label: Producer
  - type: FormField
    id: releaseDate
    label: Released
    dataType: date
  - type: FormField
    id: openingCrawl
    label: Opening crawl
buttons:
- type: Button
  label: Save
  actionId: save
  buttonStyle: primary
- type: Button
  label: Delete
  actionId: delete
  color: error
actions:
- id: save
  validationRequired: true
  restAction:
    source:
      ref: swapi-film-update
    successMessage: Saved
    successRoute: films/${state.id}
- id: delete
  confirmationRequired: true
  confirmationTexts:
    message: This deletes the record. It comes back on the next restart of the API.
  restAction:
    source:
      ref: swapi-film-delete
    successMessage: Deleted
