# Same as vehicles plus what makes a starship one: the hyperdrive rating (lower is faster), filtered
# as a range over a decimal.
$schema: https://raw.githubusercontent.com/miguelperezcolom/mateu/master/backend/shared/uidl/uidl-schema.json
type: Listing
title: Starships
pageSize: 20
# A row is the entrance to the record: its own URL, shareable and surviving a reload.
rowRoute: starships/${row.id}
# Check rows and Delete them in the listing (bulk), instead of one at a time from the edit form.
rowsSelectionEnabled: true
toolbar:
  - type: Button
    label: New starship
    buttonStyle: primary
    actionable:
      type: RouteLink
      route: starships/new
  - type: Button
    label: Delete selected
    color: error
    actionId: delete-selected
searchable: true
filters:
  - type: FormField
    id: name
    label: Name
  - type: FormField
    id: starshipClass
    label: Class
  - type: FormField
    id: hyperdriveRating
    label: Hyperdrive rating
    dataType: number
    stereotype: numberRange
rowsSource:
  ref: swapi-starships
columns:
  - type: GridColumn
    id: name
    label: Name
    identifier: true
  - type: GridColumn
    id: model
    label: Model
  - type: GridColumn
    id: manufacturer
    label: Manufacturer
  - type: GridColumn
    id: starshipClass
    label: Class
  - type: GridColumn
    id: hyperdriveRating
    label: Hyperdrive
  - type: GridColumn
    id: mglt
    label: MGLT
  - type: GridColumn
    id: passengers
    label: Passengers
# Delete acts on the CHECKED rows: forEachSelectedRow runs the per-id delete once per selection
# (server-side, since it carries a secret), then successRoute reloads the listing.
actions:
  - id: delete-selected
    rowsSelectedRequired: true
    confirmationRequired: true
    confirmationTexts:
      message: This deletes the selected records. They come back on the next restart of the API.
    restAction:
      forEachSelectedRow: true
      source:
        ref: swapi-starship-delete
      successMessage: Deleted
      successRoute: starships
