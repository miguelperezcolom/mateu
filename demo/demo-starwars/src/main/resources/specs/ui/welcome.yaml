# The home page: a welcome hero with its calls to action over one tile per collection. A hero over
# its tiles and nothing else is what the Redwood renderer paints with Spectra's welcome template
# (oj-sp-welcome-page); the web renderer draws the same hero and grid. Every link is a RouteLink:
# no server action behind any of it, so it works in the static bundle too.
$schema: https://raw.githubusercontent.com/miguelperezcolom/mateu/master/backend/shared/uidl/uidl-schema.json
type: VerticalLayout
content:
  - type: HeroSection
    id: welcome
    overline: A Mateu demo
    title: Star Wars
    subtitle: >-
      Characters, planets, films, species, vehicles and starships of the saga — searched, filtered,
      paged and edited. Every screen is YAML, rendered by Mateu over a public Star Wars API.
    centered: true
    tone: slate
    style: 'width: 100%; box-sizing: border-box; margin-bottom: 1rem;'
    content:
      - type: Button
        label: Browse the characters
        buttonStyle: primary
        actionable: {type: RouteLink, route: people}
      - type: Button
        label: Explore the planets
        actionable: {type: RouteLink, route: planets}
  - type: DashboardLayout
    columns: 3
    items:
      - type: DashboardPanel
        title: Characters
        subtitle: 82 people of the saga
        content:
          type: VerticalLayout
          content:
            - {type: Text, text: 'Who is who: homeworld, species, the films they appear in.'}
            - {type: Button, label: Open characters, actionable: {type: RouteLink, route: people}}
      - type: DashboardPanel
        title: Planets
        subtitle: 60 worlds
        content:
          type: VerticalLayout
          content:
            - {type: Text, text: 'Climate, terrain, population — and who was born there.'}
            - {type: Button, label: Open planets, actionable: {type: RouteLink, route: planets}}
      - type: DashboardPanel
        title: Films
        subtitle: 6 episodes
        content:
          type: VerticalLayout
          content:
            - {type: Text, text: 'Directors, producers, release dates and the opening crawl.'}
            - {type: Button, label: Open films, actionable: {type: RouteLink, route: films}}
      - type: DashboardPanel
        title: Species
        subtitle: 37 species
        content:
          type: VerticalLayout
          content:
            - {type: Text, text: 'Classification, language, lifespan and homeworld.'}
            - {type: Button, label: Open species, actionable: {type: RouteLink, route: species}}
      - type: DashboardPanel
        title: Vehicles
        subtitle: 39 vehicles
        content:
          type: VerticalLayout
          content:
            - {type: Text, text: 'Speeders, walkers and transports: crew, cargo and cost.'}
            - {type: Button, label: Open vehicles, actionable: {type: RouteLink, route: vehicles}}
      - type: DashboardPanel
        title: Starships
        subtitle: 36 starships
        content:
          type: VerticalLayout
          content:
            - {type: Text, text: 'From the Millennium Falcon to the Death Star: class, hyperdrive, MGLT.'}
            - {type: Button, label: Open starships, actionable: {type: RouteLink, route: starships}}
