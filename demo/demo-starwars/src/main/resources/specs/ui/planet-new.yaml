# CREATE form (planets/new) — the edit form minus the id, pointing at the POST source. Nothing
# about it is a special "create mode": it is a form whose action happens to be a create.
$schema: https://raw.githubusercontent.com/miguelperezcolom/mateu/master/backend/shared/uidl/specs-schema.json
type: Form
title: New planet
toolbar:
- type: Button
  actionId: backToList
  label: Back
  actionable:
    type: RouteLink
    route: planets
content:
- type: FormLayout
  content:
  - type: FormField
    autofocus: true
    id: name
    label: Name
    required: true
  - type: FormField
    id: climate
    label: Climate
  - type: FormField
    id: terrain
    label: Terrain
  - type: FormField
    id: gravity
    label: Gravity
  - type: FormField
    id: diameter
    label: Diameter (km)
    dataType: integer
  - type: FormField
    id: population
    label: Population
    dataType: number
  - type: FormField
    id: rotationPeriod
    label: Rotation period (h)
    dataType: integer
  - type: FormField
    id: orbitalPeriod
    label: Orbital period (d)
    dataType: integer
  - type: FormField
    id: surfaceWater
    label: Surface water (%)
    dataType: number
buttons:
- type: Button
  label: Create
  actionId: create
  buttonStyle: primary
actions:
- id: create
  validationRequired: true
  restAction:
    source:
      ref: swapi-planet-create
    successMessage: Created
    # The response carries the created record, id included, so merging it lets the client land on
    # the new record's own read-only view.
    resultPath: ""
    successRoute: planets/${state.id}
