      method: DELETE
      proxy: true
      headers:
        X-Api-Key: ${secret.SWAPI_WRITE_KEY}

  # NOT `swapi-species`: a species is its own plural and the LISTING owns that name. A duplicate
  # replaces it silently, and the listing starts asking for /api/species/undefined.
  - name: swapi-species-record
    description: One species by id
    source:
      url: https://swapi.ec1.mateu.io/api/species/${state.id}

  - name: swapi-species-create
