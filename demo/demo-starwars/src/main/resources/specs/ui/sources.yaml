      body: '{"name":"${state.name}","classification":"${state.classification}","designation":"${state.designation}","language":"${state.language}","averageHeight":"${state.averageHeight}","averageLifespan":"${state.averageLifespan}","skinColors":"${state.skinColors}","hairColors":"${state.hairColors}","eyeColors":"${state.eyeColors}"}'

  - name: swapi-species-delete
