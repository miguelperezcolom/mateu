      proxy: true
      headers:
        Content-Type: application/json
        X-Api-Key: ${secret.SWAPI_WRITE_KEY}
      body: '{"name":"${state.name}","climate":"${state.climate}","terrain":"${state.terrain}","gravity":"${state.gravity}","diameter":"${state.diameter}","population":"${state.population}","rotationPeriod":"${state.rotationPeriod}","orbitalPeriod":"${state.orbitalPeriod}","surfaceWater":"${state.surfaceWater}"}'

  - name: swapi-planet-update
    description: Replace a planet
    source:
      url: https://swapi.ec1.mateu.io/api/planets/${state.id}
      method: PUT
      proxy: true
