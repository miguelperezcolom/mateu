$schema: https://raw.githubusercontent.com/miguelperezcolom/mateu/master/backend/shared/uidl/uidl-schema.json
type: Listing
title: Films
pageSize: 20
# A row is the entrance to the record: its own URL, shareable and surviving a reload.
rowRoute: films/${row.id}
# Check rows and Delete them in the listing (bulk), instead of one at a time from the edit form.
rowsSelectionEnabled: true
toolbar:
  - type: Button
    label: New film
    buttonStyle: primary
    actionable:
      type: RouteLink
      route: films/new
  - type: Button
    label: Delete selected
    color: error
    actionId: delete-selected
searchable: true
filters:
  - type: FormField
    id: title
    label: Title
  - type: FormField
    id: director
    label: Director
    stereotype: multiSelect
    options:
      - value: George Lucas
        label: George Lucas
      - value: Irvin Kershner
        label: Irvin Kershner
      - value: Richard Marquand
        label: Richard Marquand
  - type: FormField
    id: releaseDate
    label: Released
    stereotype: dateRange
rowsSource:
  ref: swapi-films
columns:
  - type: GridColumn
    id: episodeId
    label: Episode
  - type: GridColumn
    id: title
    label: Title
    identifier: true
  - type: GridColumn
    id: director
    label: Director
  - type: GridColumn
    id: producer
    label: Producer
  - type: GridColumn
    id: releaseDate
    label: Released
# Delete acts on the CHECKED rows: forEachSelectedRow runs the per-id delete once per selection
# (server-side, since it carries a secret), then successRoute reloads the listing.
actions:
  - id: delete-selected
    rowsSelectedRequired: true
    confirmationRequired: true
    confirmationTexts:
      message: This deletes the selected records. They come back on the next restart of the API.
    restAction:
      forEachSelectedRow: true
      source:
        ref: swapi-film-delete
      successMessage: Deleted
      successRoute: films
