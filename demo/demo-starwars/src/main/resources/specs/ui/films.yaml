$schema: https://raw.githubusercontent.com/miguelperezcolom/mateu/master/backend/shared/uidl/uidl-schema.json
type: Listing
title: Films
pageSize: 20
# A row is the entrance to the record: its own URL, shareable and surviving a reload.
rowRoute: films/${row.id}
searchable: true
filters:
  - type: FormField
    id: title
    label: Title
  - type: FormField
    id: director
    label: Director
    stereotype: multiSelect
    options:
      - value: George Lucas
        label: George Lucas
      - value: Irvin Kershner
        label: Irvin Kershner
      - value: Richard Marquand
        label: Richard Marquand
  - type: FormField
    id: releaseDate
    label: Released
    stereotype: dateRange
rowsSource:
  ref: swapi-films
columns:
  - type: GridColumn
    id: episodeId
    label: Episode
  - type: GridColumn
    id: title
    label: Title
    identifier: true
  - type: GridColumn
    id: director
    label: Director
  - type: GridColumn
    id: producer
    label: Producer
  - type: GridColumn
    id: releaseDate
    label: Released
