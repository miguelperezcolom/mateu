# READ-ONLY view of one starship (route starships/:id). It fills Redwood's FOLDOUT LAYOUT template
# (Spectra oj-sp-foldout-layout): the ship's overview always in view, its information in panels that
# fold out beside it — each folded panel shows its summary. No Java — the buttons NAVIGATE.
$schema: https://raw.githubusercontent.com/miguelperezcolom/mateu/master/backend/shared/uidl/specs-schema.json
type: Form
title: ${state.name}
subtitle: Starship
toolbar:
- type: Button
  actionId: backToList
  label: Starships        # the foldout's go-to-parent link names the parent
  actionable:
    type: RouteLink
    route: starships
- type: Button
  label: Edit
  buttonStyle: primary
  actionable:
    type: RouteLink
    route: starships/${state.id}/edit
template:
  type: FoldoutPage
  overview:
    - {type: Avatar, name: "${state.name}", image: "${state.image}"}
    - {type: Text, text: "${state.starshipClass}"}
    - type: FormLayout
      maxColumns: 1
      content:
        - {type: FormField, id: model, label: Model, readOnly: true}
        - {type: FormField, id: manufacturer, label: Manufacturer, readOnly: true}
        - {type: FormField, id: costInCredits, label: Cost (credits), dataType: number, readOnly: true}
# the template's panels, in order: the first starts unfolded, the others show their summary
content:
  - type: FoldoutPanel
    title: Specifications
    open: true
    content:
      type: FormLayout
      maxColumns: 1
      content:
        - {type: FormField, id: length, label: Length (m), dataType: number, readOnly: true}
        - {type: FormField, id: maxAtmospheringSpeed, label: Max speed, dataType: integer, readOnly: true}
        - {type: FormField, id: hyperdriveRating, label: Hyperdrive rating, dataType: number, readOnly: true}
        - {type: FormField, id: mglt, label: MGLT, dataType: integer, readOnly: true}
  - type: FoldoutPanel
    title: Crew & cargo
    summary: {type: Text, text: "Crew ${state.crew} · ${state.passengers} passengers"}
    content:
      type: FormLayout
      maxColumns: 1
      content:
        - {type: FormField, id: crew, label: Crew, readOnly: true}
        - {type: FormField, id: passengers, label: Passengers, dataType: integer, readOnly: true}
        - {type: FormField, id: cargoCapacity, label: Cargo capacity, dataType: number, readOnly: true}
        - {type: FormField, id: consumables, label: Consumables, readOnly: true}
