# `vehicleClass` is a plain text filter, not a select: the data holds "wheeled walker" and "assault
# walker" as well as "walker", so the API matches it by containment and "walker" finds all three.
$schema: https://raw.githubusercontent.com/miguelperezcolom/mateu/master/backend/shared/uidl/uidl-schema.json
type: Listing
title: Vehicles
pageSize: 20
# A row is the entrance to the record: its own URL, shareable and surviving a reload.
rowRoute: vehicles/${row.id}
# Check rows and Delete them in the listing (bulk), instead of one at a time from the edit form.
rowsSelectionEnabled: true
toolbar:
  - type: Button
    label: New vehicle
    buttonStyle: primary
    actionable:
      type: RouteLink
      route: vehicles/new
  - type: Button
    label: Delete selected
    color: error
    actionId: delete-selected
searchable: true
filters:
  - type: FormField
    id: name
    label: Name
  - type: FormField
    id: vehicleClass
    label: Class
  - type: FormField
    id: costInCredits
    label: Cost (credits)
    dataType: integer
    stereotype: numberRange
rowsSource:
  ref: swapi-vehicles
columns:
  - type: GridColumn
    id: name
    label: Name
    identifier: true
  - type: GridColumn
    id: model
    label: Model
  - type: GridColumn
    id: manufacturer
    label: Manufacturer
  - type: GridColumn
    id: vehicleClass
    label: Class
  - type: GridColumn
    id: crew
    label: Crew
  - type: GridColumn
    id: passengers
    label: Passengers
  - type: GridColumn
    id: costInCredits
    label: Cost (credits)
# Delete acts on the CHECKED rows: forEachSelectedRow runs the per-id delete once per selection
# (server-side, since it carries a secret), then successRoute reloads the listing.
actions:
  - id: delete-selected
    rowsSelectedRequired: true
    confirmationRequired: true
    confirmationTexts:
      message: This deletes the selected records. They come back on the next restart of the API.
    restAction:
      forEachSelectedRow: true
      source:
        ref: swapi-vehicle-delete
      successMessage: Deleted
      successRoute: vehicles
