# READ-ONLY view of one film (route films/:id). It fills Redwood's MULTIMEDIA CONTENT PAGE template:
# a welcome-style banner (the film's title, its episode as the overline, director and release as the
# description, Edit as the call to action) over content in SECTIONS with media, and the vertical
# anchor navigator to move between them. No Java — the buttons NAVIGATE via their RouteLink.
$schema: https://raw.githubusercontent.com/miguelperezcolom/mateu/master/backend/shared/uidl/specs-schema.json
type: Form
title: ${state.title}
overline: Episode ${state.episodeId}
subtitle: Directed by ${state.director} · released ${state.releaseDate}
toolbar:
- type: Button
  label: Edit
  buttonStyle: primary
  actionable:
    type: RouteLink
    route: films/${state.id}/edit
- type: Button
  label: All the films
  actionable:
    type: RouteLink
    route: films
template:
  type: MultimediaContentPage
  backgroundColor: dark-ocean
content:
  - type: VerticalLayout
    horizontalAlignment: STRETCH
    content:
      - type: Card
        cssClasses: mateu-section
        title: {type: Text, container: h3, text: Opening crawl}
        content: {type: Text, text: "${state.openingCrawl}", style: "white-space: pre-line"}
      - type: Card
        cssClasses: mateu-section
        title: {type: Text, container: h3, text: Poster}
        content:
          type: VerticalLayout
          content:
            - {type: Image, src: "${state.image}"}
            - {type: Text, text: "A generated picture for ${state.title}", size: s}
      - type: Card
        cssClasses: mateu-section
        title: {type: Text, container: h3, text: Production}
        content:
          type: FormLayout
          maxColumns: 2
          content:
            - {type: FormField, id: director, label: Director, readOnly: true}
            - {type: FormField, id: producer, label: Producer, readOnly: true}
            - {type: FormField, id: releaseDate, label: Release date, dataType: date, readOnly: true}
            - {type: FormField, id: episodeId, label: Episode, dataType: integer, readOnly: true}
