# A Listing whose rows come from a named external source. `gridLayout: masterDetail` turns it into a
# list + detail: clicking a person shows their full record in the right pane — entirely from the
# already-fetched rows, no re-fetch and no id needed (swapi.info rows carry no numeric id). The name
# column is the identifier, so the selected row is tracked by name.
$schema: https://raw.githubusercontent.com/miguelperezcolom/mateu/master/backend/shared/uidl/uidl-schema.json
type: Listing
title: People
gridLayout: masterDetail
# Search criteria, declared as data like everything else. swapi.info is a STATIC mirror: it answers
# the whole collection and ignores `?search=` (verified — 82 people either way), so the conditions
# are evaluated over the fetched rows. That is the renderer's job for any listing reading somebody
# else's endpoint; point `sources.yaml` at an endpoint that does filter server-side and the url can
# carry ${searchText} instead, with no change here.
searchable: true
filters:
  - type: FormField
    id: name
    label: Name
  - type: FormField
    id: gender
    label: Gender
    stereotype: multiSelect
    options:
      - value: male
        label: Male
      - value: female
        label: Female
      - value: n/a
        label: Droid / n/a
  - type: FormField
    id: height
    label: Height (cm)
    dataType: integer
    stereotype: numberRange
rowsSource:
  ref: swapi-people
columns:
  - type: GridColumn
    id: name
    label: Name
    identifier: true
  - type: GridColumn
    id: gender
    label: Gender
  - type: GridColumn
    id: birth_year
    label: Birth year
  - type: GridColumn
    id: height
    label: Height (cm)
  - type: GridColumn
    id: mass
    label: Mass (kg)
  - type: GridColumn
    id: hair_color
    label: Hair
  - type: GridColumn
    id: eye_color
    label: Eyes
