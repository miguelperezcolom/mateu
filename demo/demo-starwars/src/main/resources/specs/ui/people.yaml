# A Listing whose rows come from a named external source — now a real backend, so the search bar,
# every filter, the sort and the pager are answered by the SERVER over all 82 rows, not by the
# browser over what it happened to fetch. `gridLayout: masterDetail` turns it into a list + detail:
# clicking a person shows their full record in the right pane from the row already on screen.
#
# `homeworldName` is the payoff of a backend that knows about references: the row carries the
# planet's name alongside its id, so the table shows where someone is from without a request per row.
$schema: https://raw.githubusercontent.com/miguelperezcolom/mateu/master/backend/shared/uidl/uidl-schema.json
type: Listing
title: People
pageSize: 20
# A row is the entrance to the record, not the whole of it: clicking one goes to its own URL, which
# is shareable and survives a reload — which `masterDetail` never was.
rowRoute: people/${row.id}
# Check rows and Delete them in the listing — the CRUD's own delete, not a per-record one buried in
# the edit form.
rowsSelectionEnabled: true
toolbar:
  - type: Button
    label: New character
    buttonStyle: primary
    actionable:
      type: RouteLink
      route: people/new
  - type: Button
    label: Delete selected
    color: error
    actionId: delete-selected
searchable: true
filters:
  - type: FormField
    id: name
    label: Name
  - type: FormField
    id: gender
    label: Gender
    stereotype: multiSelect
    options:
      - value: male
        label: Male
      - value: female
        label: Female
      - value: n/a
        label: Droid (n/a)
      - value: none
        label: None
      - value: hermaphrodite
        label: Hermaphrodite
  - type: FormField
    id: height
    label: Height (cm)
    dataType: integer
    stereotype: numberRange
rowsSource:
  ref: swapi-people
columns:
  - type: GridColumn
    id: name
    label: Name
    identifier: true
  - type: GridColumn
    id: homeworldName
    label: Homeworld
  - type: GridColumn
    id: gender
    label: Gender
  - type: GridColumn
    id: birthYear
    label: Birth year
  - type: GridColumn
    id: height
    label: Height (cm)
  - type: GridColumn
    id: mass
    label: Mass (kg)
  - type: GridColumn
    id: hairColor
    label: Hair
  - type: GridColumn
    id: eyeColor
    label: Eyes
# The Delete button acts on the CHECKED rows: forEachSelectedRow runs the per-id delete once per
# selection (server-side, since it carries a secret), then successRoute reloads the listing.
actions:
  - id: delete-selected
    rowsSelectedRequired: true
    confirmationRequired: true
    confirmationTexts:
      message: This deletes the selected characters. They come back on the next restart of the API.
    restAction:
      forEachSelectedRow: true
      source:
        ref: swapi-person-delete
      successMessage: Deleted
      successRoute: people
