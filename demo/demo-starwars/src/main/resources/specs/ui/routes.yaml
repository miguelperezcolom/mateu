# The route registry: each URL bound to a definition. The root is the app shell; each menu target is
# a Listing page that reads live rows from a named REST source (see sources.yaml). No viewModel on
# any route — there is no Java behind these screens.
$schema: https://raw.githubusercontent.com/miguelperezcolom/mateu/master/backend/shared/uidl/routes-schema.json
type: Routes
routes:
  - route: ""          # the mount root → the app shell
    layout: app.yaml
  - route: welcome     # the home page (app.yaml homeRoute)
    layout: welcome.yaml
  - route: dashboard   # the saga in numbers (a Dashboard landing page)
    layout: dashboard.yaml
  - route: fleet       # the vehicles managed (a Data management page)
    layout: fleet.yaml
  - route: search      # search the galaxy (a Hero search page)
    layout: search.yaml
  - route: people
    layout: people.yaml

  # Create comes BEFORE the parameterised sibling so `people/new` is not read as an id.
  - route: people/new
    layout: person-new.yaml

  # One record, read-only. `data:` names the source that fetches it; the id comes from the path, and
  # the source's url interpolates it as ${state.id}.
  - route: people/:id
    layout: person.yaml
    data: swapi-person

  # The edit form for that record — same fetch, editable, Save/Delete.
  - route: people/:id/edit
    layout: person-edit.yaml
    data: swapi-person
  - route: planets
    layout: planets.yaml

  # Create comes BEFORE the parameterised sibling so `planets/new` is not read as an id.
  - route: planets/new
    layout: planet-new.yaml

  - route: planets/:id
    layout: planet.yaml
    data: swapi-planet
  - route: planets/:id/edit
    layout: planet-edit.yaml
    data: swapi-planet
  - route: films
    layout: films.yaml

  # Create comes BEFORE the parameterised sibling so `films/new` is not read as an id.
  - route: films/new
    layout: film-new.yaml

  - route: films/:id
    layout: film.yaml
    data: swapi-film
  - route: films/:id/edit
    layout: film-edit.yaml
    data: swapi-film
  - route: species
    layout: species.yaml

  # Create comes BEFORE the parameterised sibling so `species/new` is not read as an id.
  - route: species/new
    layout: species-new.yaml

  - route: species/:id
    layout: species-record.yaml
    data: swapi-species-record
  - route: species/:id/edit
    layout: species-record-edit.yaml
    data: swapi-species-record
  - route: vehicles
    layout: vehicles.yaml

  # Create comes BEFORE the parameterised sibling so `vehicles/new` is not read as an id.
  - route: vehicles/new
    layout: vehicle-new.yaml

  - route: vehicles/:id
    layout: vehicle.yaml
    data: swapi-vehicle
  - route: vehicles/:id/edit
    layout: vehicle-edit.yaml
    data: swapi-vehicle
  - route: starships
    layout: starships.yaml

  # Create comes BEFORE the parameterised sibling so `starships/new` is not read as an id.
  - route: starships/new
    layout: starship-new.yaml

  - route: starships/:id
    layout: starship.yaml
    data: swapi-starship
  - route: starships/:id/edit
    layout: starship-edit.yaml
    data: swapi-starship
