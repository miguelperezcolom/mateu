# Create a character. It fills Redwood's ADVANCED CREATE AND EDIT page template: the header is the
# form's — its title, Cancel and the primary action (Create) —, the content is the template's main
# slot: the character's attributes grouped in SECTIONS, with the vertical anchor navigator beside
# them. Nothing about it is a special "create mode": a form whose action happens to be a create.
$schema: https://raw.githubusercontent.com/miguelperezcolom/mateu/master/backend/shared/uidl/specs-schema.json
type: Form
title: New character
subtitle: Add someone to the saga
toolbar:
  - type: Button
    actionId: cancel-new
    label: Cancel
    actionable:
      type: RouteLink
      route: people
  - type: Button
    label: Create
    actionId: create
    buttonStyle: primary
template:
  type: AdvancedCreateEditPage
content:
  - type: VerticalLayout
    horizontalAlignment: STRETCH
    content:
      - type: Card
        cssClasses: mateu-section
        title: {type: Text, container: h3, text: Identity}
        content:
          type: FormLayout
          maxColumns: 3
          content:
            - {type: FormField, id: name, label: Name, required: true, autofocus: true}
            - {type: FormField, id: gender, label: Gender}
            - {type: FormField, id: birthYear, label: Birth year}
            # a combo referencing another entity: its choices come from the swapi-planet-options
            # source (value = the planet's id, label = its name); the create body sends the id
            - {type: FormField, id: homeworldId, label: Homeworld, stereotype: select, optionsSource: {ref: swapi-planet-options}}
      - type: Card
        cssClasses: mateu-section
        title: {type: Text, container: h3, text: Physique}
        content:
          type: FormLayout
          maxColumns: 3
          content:
            - {type: FormField, id: height, label: Height (cm), dataType: integer}
            - {type: FormField, id: mass, label: Mass (kg), dataType: number}
      - type: Card
        cssClasses: mateu-section
        title: {type: Text, container: h3, text: Appearance}
        content:
          type: FormLayout
          maxColumns: 3
          content:
            - {type: FormField, id: hairColor, label: Hair}
            - {type: FormField, id: eyeColor, label: Eyes}
            - {type: FormField, id: skinColor, label: Skin}
actions:
  - id: create
    validationRequired: true
    restAction:
      source:
        ref: swapi-person-create
      successMessage: Created
      # The response is the created record, id included, so merging it into the state lets the
      # client navigate straight to the new record's own read-only view.
      resultPath: ""
      successRoute: people/${state.id}
