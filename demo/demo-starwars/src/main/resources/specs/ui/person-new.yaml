# The same shape as the record page, minus the id and pointing at the POST source. Nothing about it
# is a special "create mode": it is a form whose action happens to be a create.
$schema: https://raw.githubusercontent.com/miguelperezcolom/mateu/master/backend/shared/uidl/specs-schema.json
type: Form
title: New character
toolbar:
  - type: Button
    actionId: backToList        # a back id renders as a < chevron before the title
    label: Back to People
    actionable:
      type: RouteLink
      route: people
content:
  - type: FormLayout
    content:
      - type: FormField
        id: name
        label: Name
        required: true
        autofocus: true
      - type: FormField
        id: gender
        label: Gender
      # A combo referencing another entity: its choices come from the swapi-planet-options source,
      # which maps each planet to a choice (value = its id, label = its name). Picking one stores the
      # planet's id in `homeworldId`, and the create body sends exactly that.
      - type: FormField
        id: homeworldId
        label: Homeworld
        stereotype: select
        optionsSource:
          ref: swapi-planet-options
      - type: FormField
        id: birthYear
        label: Birth year
      - type: FormField
        id: height
        label: Height (cm)
        dataType: integer
      - type: FormField
        id: mass
        label: Mass (kg)
        dataType: number
      - type: FormField
        id: hairColor
        label: Hair
      - type: FormField
        id: eyeColor
        label: Eyes
buttons:
  - type: Button
    label: Create
    actionId: create
    buttonStyle: primary
actions:
  - id: create
    validationRequired: true
    restAction:
      source:
        ref: swapi-person-create
      successMessage: Created
      # The response is the created record, id included, so merging it into the state lets the
      # client navigate straight to the new record's own read-only view.
      resultPath: ""
      successRoute: people/${state.id}
