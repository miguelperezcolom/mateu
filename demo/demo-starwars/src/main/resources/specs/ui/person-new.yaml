# The same shape as the record page, minus the id and pointing at the POST source. Nothing about it
# is a special "create mode": it is a form whose action happens to be a create.
$schema: https://raw.githubusercontent.com/miguelperezcolom/mateu/master/backend/shared/uidl/specs-schema.json
type: Form
title: New character
content:
  - type: FormLayout
    content:
      - type: FormField
        id: name
        label: Name
        required: true
        autofocus: true
      - type: FormField
        id: gender
        label: Gender
      - type: FormField
        id: birthYear
        label: Birth year
      - type: FormField
        id: height
        label: Height (cm)
        dataType: integer
      - type: FormField
        id: mass
        label: Mass (kg)
        dataType: number
      - type: FormField
        id: hairColor
        label: Hair
      - type: FormField
        id: eyeColor
        label: Eyes
buttons:
  - type: Button
    label: Create
    actionId: create
    buttonStyle: primary
  - type: Button
    label: Back to the list
    actionable:
      type: RouteLink
      route: people
actions:
  - id: create
    validationRequired: true
    restAction:
      source:
        ref: swapi-person-create
      successMessage: Created
      # The response is the created record, id included, so merging it into the state turns this
      # form into the record's own page without a second request.
      resultPath: ""
