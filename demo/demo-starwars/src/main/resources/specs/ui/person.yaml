# A record page with NO Java class behind it: the route's `data:` fetches the record into the page
# state, the fields bind to that state by id, and the buttons name actions this file declares — each
# carrying the REST call the client makes itself.
#
# Detail and edit are the same screen on purpose. Splitting them would need a third route and a way
# to carry the id into a link; one editable page is the smaller thing that actually works, and it is
# what a record page usually is.
$schema: https://raw.githubusercontent.com/miguelperezcolom/mateu/master/backend/shared/uidl/specs-schema.json
type: Form
title: ${state.name}
subtitle: Character
content:
  - type: FormLayout
    content:
      - type: FormField
        id: name
        label: Name
        required: true
      - type: FormField
        id: gender
        label: Gender
      - type: FormField
        id: birthYear
        label: Birth year
      - type: FormField
        id: height
        label: Height (cm)
        dataType: integer
      - type: FormField
        id: mass
        label: Mass (kg)
        dataType: number
      - type: FormField
        id: hairColor
        label: Hair
      - type: FormField
        id: eyeColor
        label: Eyes
      - type: FormField
        id: homeworldName
        label: Homeworld
        readOnly: true
buttons:
  - type: Button
    label: Save
    actionId: save
    buttonStyle: primary
  - type: Button
    label: Delete
    actionId: delete
  - type: Button
    label: Back to the list
    actionable:
      type: RouteLink
      route: people
actions:
  - id: save
    validationRequired: true
    restAction:
      source:
        ref: swapi-person-update
      successMessage: Saved
  - id: delete
    confirmationRequired: true
    confirmationTexts:
      message: This deletes the character. It comes back on the next restart of the API.
    restAction:
      source:
        ref: swapi-person-delete
      successMessage: Deleted
