# The READ-ONLY view of one character (route people/:id). The route's `data:` fetches the record
# into the page state; the fields show it, read-only. The header carries the way back (a < chevron
# before the title) and the way in to editing (Edit → people/:id/edit) — buttons that NAVIGATE
# because their actionable is a RouteLink, no view model behind the screen.
$schema: https://raw.githubusercontent.com/miguelperezcolom/mateu/master/backend/shared/uidl/specs-schema.json
type: Form
# Redwood's Item overview page template (Spectra oj-sp-item-overview-page): the record's image
# and key facts in its overview panel, the rest in tabs in its main slot. The page only FILLS the
# template — the look (sizes, surfaces, spacing) is the template's, in every renderer.
title: ${state.name}
subtitle: Character
toolbar:
  - type: Button
    actionId: backToList        # a back id renders as a < chevron before the title
    label: Back to People
    actionable:
      type: RouteLink
      route: people
  - type: Button
    label: Edit
    buttonStyle: primary
    actionable:
      type: RouteLink
      route: people/${state.id}/edit
template:
  type: ItemOverviewPage
  avatar: {src: "${state.image}"}
  body:
    - {type: FormField, id: gender, label: Gender, readOnly: true, propertyRow: true}
    - {type: FormField, id: birthYear, label: Birth year, readOnly: true, propertyRow: true}
    - {type: FormField, id: homeworldName, label: Homeworld, readOnly: true, propertyRow: true}
content:
  - type: TabLayout
    tabs:
      - type: Tab
        label: Physique
        content:
          type: FormLayout
          content:
            - {type: FormField, id: height, label: Height (cm), dataType: integer, readOnly: true, propertyRow: true}
            - {type: FormField, id: mass, label: Mass (kg), dataType: number, readOnly: true, propertyRow: true}
      - type: Tab
        label: Appearance
        content:
          type: FormLayout
          content:
            - {type: FormField, id: hairColor, label: Hair, readOnly: true, propertyRow: true}
            - {type: FormField, id: skinColor, label: Skin, readOnly: true, propertyRow: true}
            - {type: FormField, id: eyeColor, label: Eyes, readOnly: true, propertyRow: true}
