# The READ-ONLY view of one character (route people/:id). The route's `data:` fetches the record
# into the page state; the fields show it, read-only. The header carries the way back (a < chevron
# before the title) and the way in to editing (Edit → people/:id/edit) — buttons that NAVIGATE
# because their actionable is a RouteLink, no view model behind the screen.
$schema: https://raw.githubusercontent.com/miguelperezcolom/mateu/master/backend/shared/uidl/specs-schema.json
type: Form
title: ${state.name}
subtitle: Character
toolbar:
  - type: Button
    actionId: backToList        # a back id renders as a < chevron before the title
    label: Back to People
    actionable:
      type: RouteLink
      route: people
  - type: Button
    label: Edit
    buttonStyle: primary
    actionable:
      type: RouteLink
      route: people/${state.id}/edit
content:
  - type: FormLayout
    content:
      - {type: FormField, id: name, label: Name, readOnly: true}
      - {type: FormField, id: gender, label: Gender, readOnly: true}
      - {type: FormField, id: birthYear, label: Birth year, readOnly: true}
      - {type: FormField, id: height, label: Height (cm), dataType: integer, readOnly: true}
      - {type: FormField, id: mass, label: Mass (kg), dataType: number, readOnly: true}
      - {type: FormField, id: hairColor, label: Hair, readOnly: true}
      - {type: FormField, id: eyeColor, label: Eyes, readOnly: true}
      - {type: FormField, id: homeworldName, label: Homeworld, readOnly: true}
