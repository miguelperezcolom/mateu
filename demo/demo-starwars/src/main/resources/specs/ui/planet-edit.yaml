# EDIT form for one record (route planets/:id/edit) — editable + Save/Delete, < back to the view.
$schema: https://raw.githubusercontent.com/miguelperezcolom/mateu/master/backend/shared/uidl/specs-schema.json
type: Form
title: Edit ${state.name}
subtitle: Planet
toolbar:
- type: Button
  actionId: backToList
  label: Back
  actionable:
    type: RouteLink
    route: planets/${state.id}
content:
- type: FormLayout
  content:
  - type: FormField
    id: name
    label: Name
    required: true
  - type: FormField
    id: climate
    label: Climate
  - type: FormField
    id: terrain
    label: Terrain
  - type: FormField
    id: gravity
    label: Gravity
  - type: FormField
    id: diameter
    label: Diameter (km)
    dataType: integer
  - type: FormField
    id: population
    label: Population
    dataType: number
  - type: FormField
    id: rotationPeriod
    label: Rotation period (h)
    dataType: integer
  - type: FormField
    id: orbitalPeriod
    label: Orbital period (d)
    dataType: integer
  - type: FormField
    id: surfaceWater
    label: Surface water (%)
    dataType: number
buttons:
- type: Button
  label: Save
  actionId: save
  buttonStyle: primary
- type: Button
  label: Delete
  actionId: delete
  color: error
actions:
- id: save
  validationRequired: true
  restAction:
    source:
      ref: swapi-planet-update
    successMessage: Saved
    successRoute: planets/${state.id}
- id: delete
  confirmationRequired: true
  confirmationTexts:
    message: This deletes the record. It comes back on the next restart of the API.
  restAction:
    source:
      ref: swapi-planet-delete
    successMessage: Deleted
