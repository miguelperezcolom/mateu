# READ-ONLY view of one record (route vehicles/:id). Header: < back + Edit; fields read-only.
# No Java — the buttons NAVIGATE via their RouteLink actionable.
$schema: https://raw.githubusercontent.com/miguelperezcolom/mateu/master/backend/shared/uidl/specs-schema.json
type: Form
# Redwood's Item overview page template (Spectra oj-sp-item-overview-page): the record's image
# and key facts in its overview panel, the rest in tabs in its main slot. The page only FILLS the
# template — the look (sizes, surfaces, spacing) is the template's, in every renderer.
title: ${state.name}
subtitle: Vehicle
toolbar:
- type: Button
  actionId: backToList
  label: Back
  actionable:
    type: RouteLink
    route: vehicles
- type: Button
  label: Edit
  buttonStyle: primary
  actionable:
    type: RouteLink
    route: vehicles/${state.id}/edit
template:
  type: ItemOverviewPage
  photo: {src: "${state.image}"}
  body:
    - {type: FormField, id: model, label: Model, readOnly: true, propertyRow: true}
    - {type: FormField, id: manufacturer, label: Manufacturer, readOnly: true, propertyRow: true}
    - {type: FormField, id: vehicleClass, label: Class, readOnly: true, propertyRow: true}
# the main slot: Redwood's examples put the record's details in SECTIONS (oj-sp-section)
content:
  - type: TabLayout
    tabs:
      - type: Tab
        label: Details
        content:
          type: VerticalLayout
          horizontalAlignment: STRETCH   # the sections fill the main slot
          content:
            - type: Card
              cssClasses: mateu-section
              title: {type: Text, container: h3, text: Specifications}
              content:
                type: FormLayout
                content:
                  - {type: FormField, id: length, label: Length (m), dataType: number, readOnly: true, propertyRow: true}
                  - {type: FormField, id: maxAtmospheringSpeed, label: Max speed, dataType: integer, readOnly: true, propertyRow: true}
                  - {type: FormField, id: crew, label: Crew, readOnly: true, propertyRow: true}
                  - {type: FormField, id: passengers, label: Passengers, dataType: integer, readOnly: true, propertyRow: true}
            - type: Card
              cssClasses: mateu-section
              title: {type: Text, container: h3, text: Logistics}
              content:
                type: FormLayout
                content:
                  - {type: FormField, id: cargoCapacity, label: Cargo capacity, dataType: number, readOnly: true, propertyRow: true}
                  - {type: FormField, id: consumables, label: Consumables, readOnly: true, propertyRow: true}
                  - {type: FormField, id: costInCredits, label: Cost (credits), dataType: number, readOnly: true, propertyRow: true}
