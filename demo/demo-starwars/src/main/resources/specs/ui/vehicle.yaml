# READ-ONLY view of one record (route vehicles/:id). Header: < back + Edit; fields read-only.
# No Java — the buttons NAVIGATE via their RouteLink actionable.
$schema: https://raw.githubusercontent.com/miguelperezcolom/mateu/master/backend/shared/uidl/specs-schema.json
type: Form
title: ${state.name}
subtitle: Vehicle
toolbar:
- type: Button
  actionId: backToList
  label: Back
  actionable:
    type: RouteLink
    route: vehicles
- type: Button
  label: Edit
  buttonStyle: primary
  actionable:
    type: RouteLink
    route: vehicles/${state.id}/edit
content:
- type: FormLayout
  content:
  - type: FormField
    id: name
    label: Name
    required: true
    readOnly: true
  - type: FormField
    id: model
    label: Model
    readOnly: true
  - type: FormField
    id: manufacturer
    label: Manufacturer
    readOnly: true
  - type: FormField
    id: vehicleClass
    label: Class
    readOnly: true
  - type: FormField
    id: crew
    label: Crew
    readOnly: true
  - type: FormField
    id: passengers
    label: Passengers
    dataType: integer
    readOnly: true
  - type: FormField
    id: costInCredits
    label: Cost (credits)
    dataType: number
    readOnly: true
  - type: FormField
    id: length
    label: Length (m)
    dataType: number
    readOnly: true
  - type: FormField
    id: cargoCapacity
    label: Cargo capacity
    dataType: number
    readOnly: true
  - type: FormField
    id: consumables
    label: Consumables
    readOnly: true
  - type: FormField
    id: maxAtmospheringSpeed
    label: Max speed
    dataType: integer
    readOnly: true
