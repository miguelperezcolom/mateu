# CREATE form (starships/new) — the edit form minus the id, pointing at the POST source. Nothing
# about it is a special "create mode": it is a form whose action happens to be a create.
$schema: https://raw.githubusercontent.com/miguelperezcolom/mateu/master/backend/shared/uidl/specs-schema.json
type: Form
title: New starship
toolbar:
- type: Button
  actionId: backToList
  label: Back
  actionable:
    type: RouteLink
    route: starships
content:
- type: FormLayout
  content:
  - type: FormField
    autofocus: true
    id: name
    label: Name
    required: true
  - type: FormField
    id: model
    label: Model
  - type: FormField
    id: manufacturer
    label: Manufacturer
  - type: FormField
    id: starshipClass
    label: Class
  - type: FormField
    id: crew
    label: Crew
  - type: FormField
    id: passengers
    label: Passengers
    dataType: integer
  - type: FormField
    id: costInCredits
    label: Cost (credits)
    dataType: number
  - type: FormField
    id: length
    label: Length (m)
    dataType: number
  - type: FormField
    id: cargoCapacity
    label: Cargo capacity
    dataType: number
  - type: FormField
    id: consumables
    label: Consumables
  - type: FormField
    id: hyperdriveRating
    label: Hyperdrive rating
    dataType: number
  - type: FormField
    id: mglt
    label: MGLT
    dataType: integer
  - type: FormField
    id: maxAtmospheringSpeed
    label: Max speed
    dataType: integer
buttons:
- type: Button
  label: Create
  actionId: create
  buttonStyle: primary
actions:
- id: create
  validationRequired: true
  restAction:
    source:
      ref: swapi-starship-create
    successMessage: Created
    # The response carries the created record, id included, so merging it lets the client land on
    # the new record's own read-only view.
    resultPath: ""
    successRoute: starships/${state.id}
