# READ-ONLY view of one record (route planets/:id). Header: < back + Edit; fields read-only.
# No Java — the buttons NAVIGATE via their RouteLink actionable.
$schema: https://raw.githubusercontent.com/miguelperezcolom/mateu/master/backend/shared/uidl/specs-schema.json
type: Form
# Redwood's Item overview page template (Spectra oj-sp-item-overview-page): the record's image
# and key facts in its overview panel, the rest in tabs in its main slot. The page only FILLS the
# template — the look (sizes, surfaces, spacing) is the template's, in every renderer.
title: ${state.name}
subtitle: Planet
toolbar:
- type: Button
  actionId: backToList
  label: Back
  actionable:
    type: RouteLink
    route: planets
- type: Button
  label: Edit
  buttonStyle: primary
  actionable:
    type: RouteLink
    route: planets/${state.id}/edit
template:
  type: ItemOverviewPage
  photo: {src: "${state.image}"}
  body:
    - {type: FormField, id: climate, label: Climate, readOnly: true, propertyRow: true}
    - {type: FormField, id: terrain, label: Terrain, readOnly: true, propertyRow: true}
    - {type: FormField, id: population, label: Population, dataType: number, readOnly: true, propertyRow: true}
content:
  - type: TabLayout
    tabs:
      - type: Tab
        label: Physical
        content:
          type: FormLayout
          content:
            - {type: FormField, id: diameter, label: Diameter (km), dataType: integer, readOnly: true, propertyRow: true}
            - {type: FormField, id: gravity, label: Gravity, readOnly: true, propertyRow: true}
            - {type: FormField, id: surfaceWater, label: Surface water (%), dataType: number, readOnly: true, propertyRow: true}
      - type: Tab
        label: Orbit
        content:
          type: FormLayout
          content:
            - {type: FormField, id: rotationPeriod, label: Rotation period (h), dataType: integer, readOnly: true, propertyRow: true}
            - {type: FormField, id: orbitalPeriod, label: Orbital period (d), dataType: integer, readOnly: true, propertyRow: true}
