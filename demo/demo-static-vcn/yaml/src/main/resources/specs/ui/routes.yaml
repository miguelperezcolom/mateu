# The route registry. NO viewModel anywhere: every screen is a definition the BROWSER expands (specs
# mode), and every byte of data comes straight from the external API (sources.yaml). There is no
# Java behind any of these routes — the bundle ships them as raw definitions.
$schema: https://raw.githubusercontent.com/miguelperezcolom/mateu/master/backend/shared/uidl/routes-schema.json
type: Routes
routes:
  - route: ""
    definition: app.yaml
  - route: vcns
    definition: vcns.yaml
  # One VCN. `data:` names the source that loads it on entry; its url interpolates ${state.id}, which
  # the path parameter seeds.
  - route: vcns/:id
    definition: vcn.yaml
    data: vcn
  # The child listing, scoped by the parent id. A LINKED route, not a routed tab: routed tabs are P1
  # of design/maui-parity-plan.md and are not in master yet.
  - route: vcns/:id/subnets
    definition: subnets.yaml
