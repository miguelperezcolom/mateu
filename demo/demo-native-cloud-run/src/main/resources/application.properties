quarkus.http.port=8080
quarkus.analytics.disabled=true

# Google Cloud: the project whose Firestore keeps the products. On Cloud Run the credentials come
# from the service's identity; in dev and tests Dev Services starts the Firestore emulator.
quarkus.google.cloud.project-id=mateu-native-demo

# The daily reset (ResetResource): the token Cloud Scheduler sends, from the env var
# DEMO_RESET_TOKEN on Cloud Run. Unset = the endpoint refuses every call.
demo.reset-token=${DEMO_RESET_TOKEN:}
