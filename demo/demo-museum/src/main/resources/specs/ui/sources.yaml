# The REST source catalogue: every endpoint of museum-service, named ONCE and referenced by the pages.
#
# THE BASE URL lives here as http://localhost:8121 — museum-service run locally. To point the whole
# app at another deployment, do not edit this file: activate an environment instead (one file, one
# line to change — see environments/public.yaml):
#
#   MATEU_ENVIRONMENT=public mvn spring-boot:run
#
# Like demo-starwars: `itemsPath` + `totalPath` read the paged envelope ({content, totalElements}),
# and declaring the total tells the renderer the SERVER searched, filtered and paged. The listing
# urls carry the free text, each declared filter, the range bounds, the page and the sort through
# ${state.…}; a blank parameter is ignored by the API. Values are NOT wrapped in encodeURIComponent:
# Mateu percent-encodes every value it substitutes into a query string, so wrapping it again sends
# `Painting%252CPhotograph` and the multi-select finds nothing. Reads go straight from the browser (the API
# sends CORS *); writes are proxy sources, so the write key (${secret.MUSEUM_WRITE_KEY}, from the
# server's MATEU_SECRET_MUSEUM_WRITE_KEY) never reaches a browser.
$schema: https://raw.githubusercontent.com/miguelperezcolom/mateu/master/backend/shared/uidl/sources-schema.json
sources:
  # ── listings: searched, filtered, sorted and paged by the server ─────────────────────────
  - name: museum-museums
    description: The museums
    source:
      url: >-
        http://localhost:8121/api/museums?page=${state.page ?? 0}&size=${state.size ?? 20}&sort=${state.sort?.[0]?.fieldId ?? ''}${state.sort?.[0]?.direction === 'descending' ? ',desc' : ''}&search=${state.searchText ?? ''}&name=${state.name ?? ''}&country=${state.country ?? ''}
      itemsPath: content
    totalPath: totalElements

  - name: museum-departments
    description: Curatorial departments
    source:
      url: >-
        http://localhost:8121/api/departments?page=${state.page ?? 0}&size=${state.size ?? 20}&sort=${state.sort?.[0]?.fieldId ?? ''}${state.sort?.[0]?.direction === 'descending' ? ',desc' : ''}&search=${state.searchText ?? ''}&name=${state.name ?? ''}&museumId=${state.museumId ?? ''}
      itemsPath: content
    totalPath: totalElements

  - name: museum-artists
    description: Artists, one row across all museums
    source:
      url: >-
        http://localhost:8121/api/artists?page=${state.page ?? 0}&size=${state.size ?? 20}&sort=${state.sort?.[0]?.fieldId ?? ''}${state.sort?.[0]?.direction === 'descending' ? ',desc' : ''}&search=${state.searchText ?? ''}&name=${state.name ?? ''}&nationality=${state.nationality ?? ''}&birthYear_from=${state.birthYear_from ?? ''}&birthYear_to=${state.birthYear_to ?? ''}
      itemsPath: content
    totalPath: totalElements

  - name: museum-artworks
    description: Public-domain artworks
    source:
      url: >-
        http://localhost:8121/api/artworks?page=${state.page ?? 0}&size=${state.size ?? 20}&sort=${state.sort?.[0]?.fieldId ?? ''}${state.sort?.[0]?.direction === 'descending' ? ',desc' : ''}&search=${state.searchText ?? ''}&title=${state.title ?? ''}&classification=${state.classification ?? ''}&museumId=${state.museumId ?? ''}&onView=${state.onView ?? ''}&estimatedValue_from=${state.estimatedValue_from ?? ''}&estimatedValue_to=${state.estimatedValue_to ?? ''}&beginYear_from=${state.beginYear_from ?? ''}&beginYear_to=${state.beginYear_to ?? ''}
      itemsPath: content
    totalPath: totalElements

  - name: museum-exhibitions
    description: Exhibitions
    source:
      url: >-
        http://localhost:8121/api/exhibitions?page=${state.page ?? 0}&size=${state.size ?? 20}&sort=${state.sort?.[0]?.fieldId ?? ''}${state.sort?.[0]?.direction === 'descending' ? ',desc' : ''}&search=${state.searchText ?? ''}&title=${state.title ?? ''}&status=${state.status ?? ''}&museumId=${state.museumId ?? ''}&startDate_from=${state.startDate_from ?? ''}&startDate_to=${state.startDate_to ?? ''}&budget_from=${state.budget_from ?? ''}&budget_to=${state.budget_to ?? ''}
      itemsPath: content
    totalPath: totalElements

  - name: museum-loans
    description: Loans between museums
    source:
      url: >-
        http://localhost:8121/api/loans?page=${state.page ?? 0}&size=${state.size ?? 20}&sort=${state.sort?.[0]?.fieldId ?? ''}${state.sort?.[0]?.direction === 'descending' ? ',desc' : ''}&search=${state.searchText ?? ''}&status=${state.status ?? ''}&toMuseumId=${state.toMuseumId ?? ''}&startDate_from=${state.startDate_from ?? ''}&startDate_to=${state.startDate_to ?? ''}&insuranceValue_from=${state.insuranceValue_from ?? ''}&insuranceValue_to=${state.insuranceValue_to ?? ''}
      itemsPath: content
    totalPath: totalElements

  - name: museum-conservation-tasks
    description: Conservation tasks
    source:
      url: >-
        http://localhost:8121/api/conservation-tasks?page=${state.page ?? 0}&size=${state.size ?? 20}&sort=${state.sort?.[0]?.fieldId ?? ''}${state.sort?.[0]?.direction === 'descending' ? ',desc' : ''}&search=${state.searchText ?? ''}&status=${state.status ?? ''}&priority=${state.priority ?? ''}&museumId=${state.museumId ?? ''}&assignee=${state.assignee ?? ''}&dueDate_from=${state.dueDate_from ?? ''}&dueDate_to=${state.dueDate_to ?? ''}
      itemsPath: content
    totalPath: totalElements

  - name: museum-visits
    description: Visitors per museum per day
    source:
      url: >-
        http://localhost:8121/api/visits?page=${state.page ?? 0}&size=${state.size ?? 20}&sort=${state.sort?.[0]?.fieldId ?? ''}${state.sort?.[0]?.direction === 'descending' ? ',desc' : ''}&search=${state.searchText ?? ''}&museumId=${state.museumId ?? ''}&date_from=${state.date_from ?? ''}&date_to=${state.date_to ?? ''}&visitors_from=${state.visitors_from ?? ''}&visitors_to=${state.visitors_to ?? ''}
      itemsPath: content
    totalPath: totalElements

  # Search across every collection (museums, artists, exhibitions, artworks): each hit carries its
  # category and the route that opens it. Feeds the hero search page and the shell's global search.
  - name: museum-search
    description: Search everything
    source:
      url: >-
        http://localhost:8121/api/search?page=${state.page ?? 0}&size=${state.size ?? 12}&search=${state.searchText ?? ''}
      itemsPath: content
    totalPath: totalElements
    fields:
      label: label
      description: description
      route: route
      category: category

  # The collection as a tree (museum → department → gallery): rows with `children`.
  - name: museum-collection-tree
    description: Museum → department → gallery
    source:
      url: http://localhost:8121/api/collection-tree
      itemsPath: content
    totalPath: totalElements

  # The dashboard's figures, loaded into a page's state by its route (`data:`).
  - name: museum-stats
    description: Dashboard figures computed from the live tables
    source:
      url: http://localhost:8121/api/stats

  # ── options: a whole small collection, fetched once, for selects and combos ──────────────
  - name: museum-museum-options
    description: Every museum as a choice
    source:
      url: http://localhost:8121/api/museums?size=50&sort=name
      itemsPath: content
      valuePath: id
      labelPath: name

  - name: museum-department-options
    description: Every department as a choice
    source:
      url: http://localhost:8121/api/departments?size=200&sort=name
      itemsPath: content
      valuePath: id
      labelPath: name

  - name: museum-artist-options
    description: Every artist as a choice
    source:
      url: http://localhost:8121/api/artists?size=500&sort=name
      itemsPath: content
      valuePath: id
      labelPath: name

  - name: museum-artwork-options
    description: Every artwork as a choice
    source:
      url: http://localhost:8121/api/artworks?size=500&sort=title
      itemsPath: content
      valuePath: id
      labelPath: title

  - name: museum-exhibition-options
    description: Open and planned exhibitions as choices
    source:
      url: http://localhost:8121/api/exhibitions?size=200&sort=startDate&status=open,planned
      itemsPath: content
      valuePath: id
      labelPath: title

  # ── one record, and its writes (proxied: the key stays on the server) ──────────────────
  - name: museum-museum
    description: One museum by id
    source:
      url: http://localhost:8121/api/museums/${state.id}

  - name: museum-museum-create
    description: Create a museum
    source:
      url: http://localhost:8121/api/museums
      method: POST
      proxy: true
      headers:
        Content-Type: application/json
        X-Api-Key: ${secret.MUSEUM_WRITE_KEY}
      body: '{"code":"${state.code}","name":"${state.name}","shortName":"${state.shortName}","city":"${state.city}","country":"${state.country}","latitude":"${state.latitude}","longitude":"${state.longitude}","founded":"${state.founded}","website":"${state.website}","description":"${state.description}"}'

  - name: museum-museum-update
    description: Update a museum
    source:
      url: http://localhost:8121/api/museums/${state.id}
      method: PUT
      proxy: true
      headers:
        Content-Type: application/json
        X-Api-Key: ${secret.MUSEUM_WRITE_KEY}
      body: '{"code":"${state.code}","name":"${state.name}","shortName":"${state.shortName}","city":"${state.city}","country":"${state.country}","latitude":"${state.latitude}","longitude":"${state.longitude}","founded":"${state.founded}","website":"${state.website}","description":"${state.description}"}'

  - name: museum-museum-delete
    description: Delete a museum
    source:
      url: http://localhost:8121/api/museums/${state.id}
      method: DELETE
      proxy: true
      headers:
        X-Api-Key: ${secret.MUSEUM_WRITE_KEY}

  - name: museum-artist
    description: One artist by id
    source:
      url: http://localhost:8121/api/artists/${state.id}

  - name: museum-artist-create
    description: Create a artist
    source:
      url: http://localhost:8121/api/artists
      method: POST
      proxy: true
      headers:
        Content-Type: application/json
        X-Api-Key: ${secret.MUSEUM_WRITE_KEY}
      body: '{"name":"${state.name}","nationality":"${state.nationality}","birthYear":"${state.birthYear}","deathYear":"${state.deathYear}","bio":"${state.bio}"}'

  - name: museum-artist-update
    description: Update a artist
    source:
      url: http://localhost:8121/api/artists/${state.id}
      method: PUT
      proxy: true
      headers:
        Content-Type: application/json
        X-Api-Key: ${secret.MUSEUM_WRITE_KEY}
      body: '{"name":"${state.name}","nationality":"${state.nationality}","birthYear":"${state.birthYear}","deathYear":"${state.deathYear}","bio":"${state.bio}"}'

  - name: museum-artist-delete
    description: Delete a artist
    source:
      url: http://localhost:8121/api/artists/${state.id}
      method: DELETE
      proxy: true
      headers:
        X-Api-Key: ${secret.MUSEUM_WRITE_KEY}

  - name: museum-artwork
    description: One artwork by id
    source:
      url: http://localhost:8121/api/artworks/${state.id}

  - name: museum-artwork-create
    description: Create a artwork
    source:
      url: http://localhost:8121/api/artworks
      method: POST
      proxy: true
      headers:
        Content-Type: application/json
        X-Api-Key: ${secret.MUSEUM_WRITE_KEY}
      body: '{"title":"${state.title}","artistId":"${state.artistId}","artistDisplay":"${state.artistDisplay}","museumId":"${state.museumId}","departmentId":"${state.departmentId}","classification":"${state.classification}","objectType":"${state.objectType}","medium":"${state.medium}","objectDate":"${state.objectDate}","beginYear":"${state.beginYear}","endYear":"${state.endYear}","dimensions":"${state.dimensions}","heightCm":"${state.heightCm}","widthCm":"${state.widthCm}","depthCm":"${state.depthCm}","culture":"${state.culture}","onView":"${state.onView}","gallery":"${state.gallery}","acquisitionYear":"${state.acquisitionYear}","accessionNumber":"${state.accessionNumber}","creditLine":"${state.creditLine}","estimatedValue":"${state.estimatedValue}","tags":"${state.tags}","description":"${state.description}","highlight":"${state.highlight}","imageSmall":"${state.imageSmall}","imageLarge":"${state.imageLarge}","imageCredit":"${state.imageCredit}","sourceUrl":"${state.sourceUrl}"}'

  - name: museum-artwork-update
    description: Update a artwork
    source:
      url: http://localhost:8121/api/artworks/${state.id}
      method: PUT
      proxy: true
      headers:
        Content-Type: application/json
        X-Api-Key: ${secret.MUSEUM_WRITE_KEY}
      body: '{"title":"${state.title}","artistId":"${state.artistId}","artistDisplay":"${state.artistDisplay}","museumId":"${state.museumId}","departmentId":"${state.departmentId}","classification":"${state.classification}","objectType":"${state.objectType}","medium":"${state.medium}","objectDate":"${state.objectDate}","beginYear":"${state.beginYear}","endYear":"${state.endYear}","dimensions":"${state.dimensions}","heightCm":"${state.heightCm}","widthCm":"${state.widthCm}","depthCm":"${state.depthCm}","culture":"${state.culture}","onView":"${state.onView}","gallery":"${state.gallery}","acquisitionYear":"${state.acquisitionYear}","accessionNumber":"${state.accessionNumber}","creditLine":"${state.creditLine}","estimatedValue":"${state.estimatedValue}","tags":"${state.tags}","description":"${state.description}","highlight":"${state.highlight}","imageSmall":"${state.imageSmall}","imageLarge":"${state.imageLarge}","imageCredit":"${state.imageCredit}","sourceUrl":"${state.sourceUrl}"}'

  - name: museum-artwork-delete
    description: Delete a artwork
    source:
      url: http://localhost:8121/api/artworks/${state.id}
      method: DELETE
      proxy: true
      headers:
        X-Api-Key: ${secret.MUSEUM_WRITE_KEY}

  - name: museum-exhibition
    description: One exhibition by id
    source:
      url: http://localhost:8121/api/exhibitions/${state.id}

  - name: museum-exhibition-create
    description: Create a exhibition
    source:
      url: http://localhost:8121/api/exhibitions
      method: POST
      proxy: true
      headers:
        Content-Type: application/json
        X-Api-Key: ${secret.MUSEUM_WRITE_KEY}
      body: '{"title":"${state.title}","museumId":"${state.museumId}","startDate":"${state.startDate}","endDate":"${state.endDate}","status":"${state.status}","curator":"${state.curator}","description":"${state.description}","budget":"${state.budget}","visitors":"${state.visitors}"}'

  - name: museum-exhibition-update
    description: Update a exhibition
    source:
      url: http://localhost:8121/api/exhibitions/${state.id}
      method: PUT
      proxy: true
      headers:
        Content-Type: application/json
        X-Api-Key: ${secret.MUSEUM_WRITE_KEY}
      body: '{"title":"${state.title}","museumId":"${state.museumId}","startDate":"${state.startDate}","endDate":"${state.endDate}","status":"${state.status}","curator":"${state.curator}","description":"${state.description}","budget":"${state.budget}","visitors":"${state.visitors}"}'

  - name: museum-exhibition-delete
    description: Delete a exhibition
    source:
      url: http://localhost:8121/api/exhibitions/${state.id}
      method: DELETE
      proxy: true
      headers:
        X-Api-Key: ${secret.MUSEUM_WRITE_KEY}

  - name: museum-loan
    description: One loan by id
    source:
      url: http://localhost:8121/api/loans/${state.id}

  - name: museum-loan-create
    description: Create a loan
    source:
      url: http://localhost:8121/api/loans
      method: POST
      proxy: true
      headers:
        Content-Type: application/json
        X-Api-Key: ${secret.MUSEUM_WRITE_KEY}
      body: '{"artworkId":"${state.artworkId}","fromMuseumId":"${state.fromMuseumId}","toMuseumId":"${state.toMuseumId}","exhibitionId":"${state.exhibitionId}","startDate":"${state.startDate}","endDate":"${state.endDate}","status":"${state.status}","insuranceValue":"${state.insuranceValue}","courier":"${state.courier}","notes":"${state.notes}"}'

  - name: museum-loan-update
    description: Update a loan
    source:
      url: http://localhost:8121/api/loans/${state.id}
      method: PUT
      proxy: true
      headers:
        Content-Type: application/json
        X-Api-Key: ${secret.MUSEUM_WRITE_KEY}
      body: '{"artworkId":"${state.artworkId}","fromMuseumId":"${state.fromMuseumId}","toMuseumId":"${state.toMuseumId}","exhibitionId":"${state.exhibitionId}","startDate":"${state.startDate}","endDate":"${state.endDate}","status":"${state.status}","insuranceValue":"${state.insuranceValue}","courier":"${state.courier}","notes":"${state.notes}"}'

  - name: museum-loan-delete
    description: Delete a loan
    source:
      url: http://localhost:8121/api/loans/${state.id}
      method: DELETE
      proxy: true
      headers:
        X-Api-Key: ${secret.MUSEUM_WRITE_KEY}

  - name: museum-task
    description: One conservation task by id
    source:
      url: http://localhost:8121/api/conservation-tasks/${state.id}

  - name: museum-task-create
    description: Create a conservation task
    source:
      url: http://localhost:8121/api/conservation-tasks
      method: POST
      proxy: true
      headers:
        Content-Type: application/json
        X-Api-Key: ${secret.MUSEUM_WRITE_KEY}
      body: '{"title":"${state.title}","artworkId":"${state.artworkId}","type":"${state.type}","priority":"${state.priority}","status":"${state.status}","assignee":"${state.assignee}","dueDate":"${state.dueDate}","estimatedHours":"${state.estimatedHours}","notes":"${state.notes}"}'

  - name: museum-task-update
    description: Update a conservation task
    source:
      url: http://localhost:8121/api/conservation-tasks/${state.id}
      method: PUT
      proxy: true
      headers:
        Content-Type: application/json
        X-Api-Key: ${secret.MUSEUM_WRITE_KEY}
      body: '{"title":"${state.title}","artworkId":"${state.artworkId}","type":"${state.type}","priority":"${state.priority}","status":"${state.status}","assignee":"${state.assignee}","dueDate":"${state.dueDate}","estimatedHours":"${state.estimatedHours}","notes":"${state.notes}"}'

  - name: museum-task-delete
    description: Delete a conservation task
    source:
      url: http://localhost:8121/api/conservation-tasks/${state.id}
      method: DELETE
      proxy: true
      headers:
        X-Api-Key: ${secret.MUSEUM_WRITE_KEY}

