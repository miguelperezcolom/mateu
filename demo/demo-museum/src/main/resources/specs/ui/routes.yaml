# The route registry: each URL bound to a definition. No viewModel anywhere — no Java behind any
# screen. A record route names the source that fetches it (`data:`); the id comes from the path and the
# source's url interpolates it as ${state.id}. A `new` route comes BEFORE its parameterised sibling so
# `artworks/new` is not read as an id.
$schema: https://raw.githubusercontent.com/miguelperezcolom/mateu/master/backend/shared/uidl/routes-schema.json
type: Routes
routes:
  - {route: "", layout: app.yaml}                       # the app shell
  - {route: welcome, layout: welcome.yaml}              # WelcomePage
  - {route: dashboard, layout: dashboard.yaml, data: museum-stats}   # DashboardLandingPage, live KPIs
  - {route: search, layout: search.yaml}                # HeroSearchPage over every collection

  # artworks: listing → item overview → gallery → edit; create
  - {route: artworks, layout: artworks.yaml}
  - {route: artworks/new, layout: artwork-new.yaml}     # AdvancedCreateEditPage, every field type
  - {route: artworks/:id, layout: artwork.yaml, data: museum-artwork}                # ItemOverviewPage
  - {route: artworks/:id/gallery, layout: artwork-gallery.yaml, data: museum-artwork} # MultimediaContentPage
  - {route: artworks/:id/edit, layout: artwork-edit.yaml, data: museum-artwork}

  # artists: CollectionDetailPage — the selection is in the URL
  - {route: artists, layout: artists.yaml}
  - {route: artists/:id, layout: artist.yaml, data: museum-artist}

  # museums: master-detail listing → GeneralOverviewPage with a record switcher
  - {route: museums, layout: museums.yaml}
  - {route: museums/:id, layout: museum.yaml, data: museum-museum}
  - {route: map, layout: map.yaml}                      # Map
  - {route: collection, layout: collection.yaml}        # tree listing
  - {route: departments, layout: departments.yaml}

  # exhibitions: listing, calendar, FoldoutPage, edit, create
  - {route: exhibitions, layout: exhibitions.yaml}
  - {route: exhibitions/new, layout: exhibition-new.yaml}
  - {route: exhibitions/:id, layout: exhibition.yaml, data: museum-exhibition}
  - {route: exhibitions/:id/edit, layout: exhibition-edit.yaml, data: museum-exhibition}
  - {route: calendar, layout: calendar.yaml}            # Calendar

  # loans: DataManagementPage, the request wizard (GuidedProcessPage), one loan
  - {route: loans, layout: loans.yaml}
  - {route: loans/new, layout: loan-new.yaml}
  - {route: loans/:id, layout: loan.yaml, data: museum-loan}

  # conservation: the kanban, the grouped list, one task, create
  - {route: conservation, layout: conservation.yaml}    # Kanban
  - {route: conservation/tasks, layout: conservation-tasks.yaml}
  - {route: conservation/tasks/new, layout: task-new.yaml}
  - {route: conservation/tasks/:id, layout: task-edit.yaml, data: museum-task}

  - {route: visits, layout: visits.yaml}

  # message pages: one card over the illustrated background, no app chrome (MessagePage)
  - {route: sign-in, layout: sign-in.yaml}
  - {route: visit-booked, layout: visit-booked.yaml}
