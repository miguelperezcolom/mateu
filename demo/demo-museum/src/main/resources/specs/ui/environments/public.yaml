# The PUBLIC deployment of museum-service. sources.yaml points at http://localhost:8121; activating
# this environment re-points EVERY source at the URL below — the one place to change it:
#
#   MATEU_ENVIRONMENT=public mvn spring-boot:run        (or -Dmateu.environment=public)
#   mvn package -Predwood-bundle -Dmateu.bundle.environment=public   (a static bundle)
#
# An environment names each source it re-points (Mateu has no "every source" wildcard), so every
# entry spells the base out: YAML anchors/aliases are not resolved in specs files (a Mateu bug noted
# in the README), so one anchor aliased by the rest re-pointed nothing.
sources:
  museum-museums: {baseUrl: "https://museum-api.ec1.mateu.io"}
  museum-departments: {baseUrl: "https://museum-api.ec1.mateu.io"}
