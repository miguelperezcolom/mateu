# One loan — a simple create-and-edit form whose status select walks the workflow, with the header's
# badge, contextual facts (kpis) and a progress strip of where the loan is.
$schema: https://raw.githubusercontent.com/miguelperezcolom/mateu/master/backend/shared/uidl/specs-schema.json
type: Form
title: ${state.artworkTitle}
subtitle: ${state.fromMuseumName} → ${state.toMuseumName}
overline: Loan ${state.id}
badges:
  - {label: "${state.status}", color: info}
kpis:
  - {label: Exhibition, value: "${state.exhibitionTitle}"}
  - {label: Insured for, value: "${state.insuranceValue}"}
# a create-and-edit page: Redwood's Advanced create and edit template (the header's Save; the
# documents list below is the page's CONTENT, not the page's own listing)
template: {type: AdvancedCreateEditPage}
toolbar:
  - type: Button
    actionId: backToList
    label: Back to Loans
    actionable: {type: RouteLink, route: loans}
  - {type: Button, label: Delete, actionId: delete, color: error}
  - {type: Button, label: Save, actionId: save, buttonStyle: primary}
content:
  - type: HorizontalLayout
    content:
      - {type: Image, src: "${state.artworkImage}", alt: "${state.artworkTitle}", style: "width: 180px; border-radius: 8px;"}
      - type: FormLayout
        maxColumns: 2
        content:
          - type: FormField
            id: status
            label: Status
            stereotype: select
            required: true
            options:
              - {value: requested, label: Requested}
              - {value: approved, label: Approved}
              - {value: in_transit, label: In transit}
              - {value: on_display, label: On display}
              - {value: returned, label: Returned}
          - {type: FormField, id: courier, label: Courier}
          - {type: FormField, id: startDate, label: Leaves the lender, dataType: date}
          - {type: FormField, id: endDate, label: Back home by, dataType: date}
          - {type: FormField, id: insuranceValue, label: Insured for (USD), dataType: number}
          - {type: FormField, id: exhibitionId, label: Exhibition, stereotype: select, optionsSource: {ref: museum-exhibition-options}}
          - {type: FormField, id: notes, label: Conditions, stereotype: textarea, colspan: 2}
  # the loan's documents — its agreement, condition reports, receipts: listed from museum-service,
  # a row opens the file in a new tab (rowRoute: a whole URL), selected ones can be deleted, and a
  # file picked below is uploaded as a data URI (the field's value) with Upload
  - type: Card
    cssClasses: mateu-section
    title: {type: Text, container: h3, text: Documents}
    content:
      type: VerticalLayout
      horizontalAlignment: STRETCH
      content:
        - type: Listing
          pageSize: 20
          rowsSelectionEnabled: true
          rowRoute: ${row.url}
          rowsSource: {ref: museum-loan-documents}
          toolbar:
            - {type: Button, label: Delete selected, color: error, actionId: delete-documents}
          columns:
            - {type: GridColumn, id: id, label: "#", dataType: integer}
            - {type: GridColumn, id: name, label: Document, identifier: true}
            - {type: GridColumn, id: contentType, label: Type}
            - {type: GridColumn, id: size, label: Bytes, dataType: integer}
            - {type: GridColumn, id: uploadedAt, label: Uploaded, dataType: dateTime}
        - type: FormLayout
          maxColumns: 2
          content:
            - {type: FormField, id: document, label: "Add a document (PDF, image, text, Office — 5 MB at most)", stereotype: fileUpload}
            - {type: FormField, id: documentName, label: "Name (optional — else the file's own)"}
        - type: HorizontalLayout
          content:
            - {type: Button, label: Upload, actionId: upload-document}
actions:
  - id: save
    validationRequired: true
    restAction:
      source: {ref: museum-loan-update}
      successMessage: Saved
      successRoute: loans
  - id: delete
    confirmationRequired: true
    confirmationTexts:
      message: Cancel and delete this loan?
    restAction:
      source: {ref: museum-loan-delete}
      successMessage: Deleted
      successRoute: loans
  - id: upload-document
    restAction:
      source: {ref: museum-loan-document-upload}
      successMessage: Uploaded
      successRoute: loans/${state.id}
  - id: delete-documents
    rowsSelectedRequired: true
    confirmationRequired: true
    confirmationTexts:
      message: Delete the selected documents?
    restAction:
      forEachSelectedRow: true
      source: {ref: museum-loan-document-delete}
      successMessage: Deleted
      successRoute: loans/${state.id}
