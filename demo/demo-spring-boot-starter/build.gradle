// The same application as pom.xml, built the way a start.spring.io Gradle project is: the Spring
// Boot plugin + Spring's dependency-management plugin version everything Spring; Mateu adds one
// dependency and one annotation processor.
//
//   gradle build                          (against mavenLocal: build the backend first)
//   gradle build -PmateuVersion=<release>
plugins {
    id 'java'
    id 'org.springframework.boot' version '4.1.2'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.example'
version = '0.0.1-SNAPSHOT'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenLocal()
    mavenCentral()
}

def mateuVersion = findProperty('mateuVersion') ?: '0.0.1-MATEU'

dependencies {
    implementation "io.mateu:mateu-spring-boot-starter:${mateuVersion}"
    annotationProcessor "io.mateu:mateu-annotation-processor-mvc:${mateuVersion}"
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
    useJUnitPlatform()
}
