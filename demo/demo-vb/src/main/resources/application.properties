spring.application.name=demo-vb
# 9005: sin conflicto con las otras instancias del proceso VB (opus y k3 en otros clones)
server.port=9005
mateu.debug=false
# The VB renderer runs on another origin (vb-serve on :9006, VB Studio preview, Oracle-hosted) and
# calls this backend's /mateu API from there: open Mateu's CORS allow-list to any origin. A real
# deployment lists its origins instead (comma separated).
mateu.cors.allowed-origins=*
