# The task board: a LIVE KANBAN of the work left on the missions in preparation (SYNTHETIC tasks), one
# column per status, one card per task (read from space-service), its colour the priority. Drag a
# card to another column or to another place in its column — or use its ⋯ Move menu — and the move is
# saved (space-task-move, the API's own move: the new status, the progress it implies and the new
# boardOrder); the board then reads the tasks again. The order is the task's `boardOrder` (orderField):
# a dropped card gets the midpoint of its new neighbours, so a reload shows it exactly where it was
# dropped. A card opens its task (tasks/:id). The filterable list is the Tasks listing. Needs a
# space-service with boardOrder.
$schema: https://raw.githubusercontent.com/miguelperezcolom/mateu/master/backend/shared/uidl/specs-schema.json
type: Form
title: Task board
subtitle: Artemis III, Dragonfly, Roman, Artemis II and Europa Clipper — drag a card to move it along (synthetic tasks)
toolbar:
  - {type: Button, label: New task, buttonStyle: primary, actionable: {type: RouteLink, route: tasks/new}}
  - {type: Button, label: Tasks as a list, actionable: {type: RouteLink, route: tasks}}
actions:
  - id: moveTask
    restAction:
      source: {ref: space-task-move}
content:
  - type: Kanban
    id: board
    rowsSource: {ref: space-task-board}
    columnField: status
    orderField: boardOrder
    card:
      title: "${row.title}"
      description: "${row.missionName} · ${row.owner} · due ${row.dueDate}"
      badge: "${row.priority}"
      color: "${row.priority}"
    cardColors: {CRITICAL: "#d93025", HIGH: "#e8a33d", MEDIUM: "#1676f3", LOW: "#8a8f98"}
    cardRoute: tasks/${row.id}
    moveActionId: moveTask
    columns:
      - {id: BACKLOG, title: Backlog, color: "#8a8f98"}
      - {id: IN_PROGRESS, title: In progress, color: "#1676f3"}
      - {id: TESTING, title: Testing, color: "#e8a33d"}
      - {id: DONE, title: Done, color: "#2e9e5b"}
