            - {type: FormField, id: featured, label: Feature it on the home page, dataType: bool, stereotype: checkbox}
    - id: objectives
      title: Objectives
      description: What it sets out to do
      content:
        - type: FormLayout
          maxColumns: 1
          content:
            - {type: FormField, id: summary, label: One-line summary}
            - {type: FormField, id: objectives, label: Objectives, stereotype: richText}
actions:
  - id: create
    validationRequired: true
    restAction:
      source: {ref: space-mission-create}
      successMessage: Mission planned
      resultPath: ""
      successRoute: missions/${state.id}
