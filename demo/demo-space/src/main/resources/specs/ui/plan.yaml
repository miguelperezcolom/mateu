# Plan a mission: a WIZARD. It fills Redwood's GUIDED PROCESS template — the mission's attributes in
# STEPS the user goes through one at a time, all of them ONE form, so moving between steps keeps what
# was typed with no round trip. The process's primary action (Create mission) and its cancel are the
# form's toolbar; Create runs on the last step and lands on the new mission.
$schema: https://raw.githubusercontent.com/miguelperezcolom/mateu/master/backend/shared/uidl/specs-schema.json
type: Form
title: Plan a mission
subtitle: Five steps from an idea to a mission on the books
toolbar:
  - type: Button
    actionId: cancel-new
    label: Cancel
    actionable: {type: RouteLink, route: missions}
  - {type: Button, label: Create mission, actionId: create, buttonStyle: primary}
template:
  type: GuidedProcessPage
  steps:
    - id: identity
      title: Identity
      description: What it is called, who runs it and what kind of mission it is
      content:
        - type: FormLayout
          maxColumns: 2
          content:
            - {type: FormField, id: name, label: Mission name, required: true, autofocus: true, placeholder: "e.g. Mars Sample Return"}
            - {type: FormField, id: program, label: Program, placeholder: "e.g. Mars Exploration Program"}
            - {type: FormField, id: agency, label: Agency, initialValue: NASA}
            - type: FormField
              id: type
              label: Type
              stereotype: radio
              required: true
              options:
                - {value: CREWED, label: Crewed}
                - {value: ORBITER, label: Orbiter}
                - {value: LANDER, label: Lander}
                - {value: ROVER, label: Rover}
                - {value: SAMPLE_RETURN, label: Sample return}
                - {value: TELESCOPE, label: Telescope}
    - id: destination
      title: Destination and hardware
      description: Where it goes, from which pad, on which spacecraft
      content:
        - type: FormLayout
          maxColumns: 2
          content:
            - {type: FormField, id: destinationId, label: Destination, required: true, stereotype: select, optionsSource: {ref: space-body-options}}
            - {type: FormField, id: launchSiteId, label: Launch site, stereotype: select, optionsSource: {ref: space-site-options}}
            - {type: FormField, id: spacecraftId, label: Spacecraft, stereotype: select, optionsSource: {ref: space-spacecraft-options}}
    - id: schedule
      title: Schedule
      description: The window it aims for
      content:
        - type: FormLayout
          maxColumns: 2
          content:
            - {type: FormField, id: launchWindow, label: Launch window, dataType: dateRange, stereotype: dateRange, required: true}
            - {type: FormField, id: launchDate, label: Target launch date, dataType: date}
    - id: crew
      title: Crew and budget
      description: Who flies it (crewed missions) and what it costs
      content:
        - type: FormLayout
          maxColumns: 2
