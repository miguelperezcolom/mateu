# The `public` environment: where space-service lives once it is published. THE one place to
# change the API's address — every source of the catalogue below is rebased on the anchor's base
# url (the path and query of each stay as authored). Activate it with MATEU_ENVIRONMENT=public
# (or -Dmateu.environment=public); without it the catalogue keeps http://localhost:8122.
#
# The list repeats every source by name because an environment overrides sources by name, one by
# one (doc: deploy/environments). The address is written out on every line — a YAML anchor/alias
# (`api: &api {…}` … `space-missions: *api`) would be the natural way to say it once, but Mateu's
# reader does not resolve aliases (the sources stay as authored), so: one file, one search & replace.
$schema: https://raw.githubusercontent.com/miguelperezcolom/mateu/master/backend/shared/uidl/specs-schema.json
type: Environment
name: public
sources:
  space-missions: {baseUrl: "https://space-api.ec1.mateu.io"}
  space-featured-missions: {baseUrl: "https://space-api.ec1.mateu.io"}
  space-mission: {baseUrl: "https://space-api.ec1.mateu.io"}
