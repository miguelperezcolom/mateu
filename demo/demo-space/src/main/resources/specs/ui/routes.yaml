# The route registry: each URL bound to a definition. No viewModel on any route — there is no Java
# behind these screens. A record route names, with `data:`, the source that fetches the record; the
# id comes from the path and the source interpolates it as ${state.id}. A `…/new` route comes BEFORE
# its parameterised sibling, so `missions/new` is not read as an id.
$schema: https://raw.githubusercontent.com/miguelperezcolom/mateu/master/backend/shared/uidl/routes-schema.json
type: Routes
routes:
  - {route: "", layout: app.yaml}                 # the mount root → the app shell

  # overview and search
  - {route: welcome, layout: welcome.yaml}         # WelcomePage
  - {route: dashboard, layout: dashboard.yaml}     # DashboardLandingPage: KPIs + charts
  - {route: search, layout: search.yaml}           # HeroSearchPage over every collection
  - {route: budget, layout: budget.yaml}           # charts + a listing
  - {route: credits, layout: credits.yaml}         # every photograph and its credit

  # missions
  - {route: missions, layout: missions.yaml}                                   # smart filter & search
  - {route: missions/new, layout: mission-new.yaml}                            # AdvancedCreateEditPage (create)
  - {route: missions/:id, layout: mission.yaml, data: space-mission}           # MultimediaContentPage
  - {route: missions/:id/edit, layout: mission-edit.yaml, data: space-mission} # AdvancedCreateEditPage (edit)
  - {route: mission-control, layout: mission-control.yaml}                     # DataManagementPage
  - {route: plan, layout: plan.yaml}                                           # GuidedProcessPage (wizard)
  - {route: timeline, layout: timeline.yaml}                                   # Gantt + Timeline

  # mission tasks
  - {route: board, layout: board.yaml}                                         # Kanban
  - {route: tasks, layout: tasks.yaml}                                         # listing, grouped
  - {route: tasks/new, layout: task-new.yaml}
  - {route: tasks/:id, layout: task-edit.yaml, data: space-task}

  # launches
  - {route: calendar, layout: calendar.yaml}                                   # Calendar
  - {route: launches, layout: launches.yaml}                                   # master-detail listing
  - {route: sites-map, layout: sites-map.yaml}                                 # Map
  - {route: launch-sites, layout: launch-sites.yaml}
  - {route: launch-sites/:id, layout: launch-site.yaml, data: space-launch-site}            # GeneralOverviewPage
  - {route: launch-sites/:id/edit, layout: launch-site-edit.yaml, data: space-launch-site}

  # astronauts
  - {route: astronauts, layout: astronauts.yaml}
  - {route: astronauts/:id, layout: astronaut.yaml, data: space-astronaut}                  # ItemOverviewPage
  - {route: astronauts/:id/edit, layout: astronaut-edit.yaml, data: space-astronaut}

  # hardware
  - {route: spacecraft, layout: spacecraft.yaml}
  - {route: spacecraft/:id, layout: spacecraft-record.yaml, data: space-spacecraft-one}      # FoldoutPage
  - {route: components, layout: components.yaml}                                            # tree

  # the solar system
  - {route: bodies, layout: bodies.yaml}                                       # CollectionDetailPage, nothing selected
  - {route: bodies/:id, layout: body.yaml, data: space-body}                   # CollectionDetailPage, one selected
  - {route: solar-system, layout: solar-system.yaml}                           # tree
