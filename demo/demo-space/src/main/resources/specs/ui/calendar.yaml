# The launch CALENDAR: every launch on its day, coloured by outcome (green success, red failure),
# with its UTC time where Wikidata knows it, one tab per memorable month (July 1969, the Voyagers'
# summer of 1977, July 2020, April 2026), each switching between month, week, day and list views in
# place. A Calendar carries its events — it does not read a REST
# source — so they are a snapshot of /api/launches written by scripts/snapshot.py; an event opens its
# mission. The live, server-filtered list is the Launches page.
$schema: https://raw.githubusercontent.com/miguelperezcolom/mateu/master/backend/shared/uidl/specs-schema.json
type: Form
title: Launch calendar
subtitle: Fifty launches, 1961–2026 — green went well, red did not
toolbar:
  - {type: Button, label: All launches, actionable: {type: RouteLink, route: launches}}
content:
  # A YAML Calendar shows one period: it has no ‹ › of its own (that toolbar is the Java CalendarPage
  # archetype's), so the months worth a look are tabs, each the same events anchored on another month.
  # >>> generated: calendars (scripts/snapshot.py — do not edit by hand)
  - type: TabLayout
    tabs:
