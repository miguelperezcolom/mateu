# The launch sites on a MAP: one marker per pad, green when it launched a mission of the dataset in
# the last ten years. The map fits its markers. A Map carries its markers — it does not read a REST
# source — so they are a snapshot of /api/launch-sites (scripts/snapshot.py). A marker click cannot
# open its site from YAML (the action gets the marker id, and a YAML step has no way to read it), so
# the sites are also listed under the map, where a row opens its page.
$schema: https://raw.githubusercontent.com/miguelperezcolom/mateu/master/backend/shared/uidl/specs-schema.json
type: Form
title: Launch sites
subtitle: Where the missions left from — Florida, California, Kazakhstan and French Guiana
content:
  - type: Map
    style: "height: 28rem; width: 100%"
    # >>> generated: markers (scripts/snapshot.py — do not edit by hand)
    markers:
      - {"id": "3", "latitude": 28.50669, "longitude": -80.55419, "label": "Cape Canaveral Launch Complex 19", "description": "2 launch(es) in the dataset · United States", "color": "#8a8f98"}
