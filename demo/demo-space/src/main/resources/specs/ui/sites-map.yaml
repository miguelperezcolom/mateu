  - type: Listing
    pageSize: 15
    rowRoute: launch-sites/${row.id}
    rowsSource: {ref: space-launch-sites}
    columns:
      - {type: GridColumn, id: name, label: Site, identifier: true, stereotype: primary, leadingPath: thumbnail, captionPath: region}
      - {type: GridColumn, id: country, label: Country}
      - {type: GridColumn, id: launchCount, label: Launches, dataType: integer}
      - {type: GridColumn, id: latitude, label: Latitude, dataType: number}
      - {type: GridColumn, id: longitude, label: Longitude, dataType: number}
