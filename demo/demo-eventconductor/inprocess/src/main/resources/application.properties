spring.application.name=demo-eventconductor-inprocess
server.port=8620

# EventConductor's Mateu UI module, mounted in-process: its generated controllers (/_workflow,
# /_workflow-admin), route resolvers and screens' beans live in this package. Mateu registers only
# its own beans; a third-party UI module is mounted by naming it (or @EnableMateuUiModules).
mateu.ui.modules=io.mateu.workflow.infra.in.ui

# This app is also the "EventConductor service" the federated shells (../shell :8621,
# ../shell-yaml :8622) compose over HTTP: the browser calls /_workflow/mateu/** cross-origin.
mateu.cors.allowed-origins=http://localhost:8621,http://localhost:8622

workflow.mode=embedded
workflow.persistence=jpa
spring.datasource.url=jdbc:h2:mem:workflow;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
# H2 + ddl-auto: nothing to migrate, say so (else the engine warns at every start)
workflow.schema.enabled=false

# workflows/slow-saga.yaml starts every 2 minutes (and rolls back), so the lists are never empty.
workflow.cron-enabled=true
workflow.cron-scan-interval-ms=5000
