# Mateu offers GitHub as the way in: the `github` preset = a redirect to Spring's
# /oauth2/authorization/github. One provider, so the client goes straight there at boot.
mateu.auth.providers=github
mateu.auth.logout-url=/logout

# Spring Security's GitHub registration. The id and secret come from YOUR GitHub OAuth app
# (callback http://localhost:8080/login/oauth2/code/github), never from this file: put them in
# secrets.properties next to the pom (git-ignored) or in GITHUB_CLIENT_ID / GITHUB_CLIENT_SECRET.
spring.config.import=optional:file:./secrets.properties
spring.security.oauth2.client.registration.github.client-id=${GITHUB_CLIENT_ID}
spring.security.oauth2.client.registration.github.client-secret=${GITHUB_CLIENT_SECRET}
# The principal's name is the GitHub login, not the numeric id.
spring.security.oauth2.client.provider.github.user-name-attribute=login
