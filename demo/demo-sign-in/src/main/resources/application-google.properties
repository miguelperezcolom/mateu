# Google on the WEB is a `redirect` provider: Google's web clients always need a client secret, so
# Spring Security's oauth2Login owns the login (and holds the secret), exactly like GitHub.
# Google client of type "Web application", redirect URI http://localhost:8080/login/oauth2/code/google.
mateu.auth.providers=google
mateu.auth.providers.google.type=redirect
mateu.auth.logout-url=/logout

spring.config.import=optional:file:./secrets.properties
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET}
spring.security.oauth2.client.registration.google.scope=openid,profile,email
