# An `oidc` provider: the Mateu client signs in against Keycloak itself (PKCE, public client
# `mateu-ui` — no secret anywhere) and Spring validates the access token as a resource server.
# Keycloak: docker compose up (keycloak/compose.yaml, realm imported from keycloak/realm-mateu.json).
server.port=8081
mateu.auth.providers=keycloak
mateu.auth.providers.keycloak.issuer=http://localhost:8180/realms/mateu
mateu.auth.providers.keycloak.client-id=mateu-ui
mateu.auth.providers.keycloak.scopes=openid profile email

spring.security.oauth2.resourceserver.jwt.issuer-uri=http://localhost:8180/realms/mateu
spring.security.oauth2.resourceserver.jwt.principal-claim-name=preferred_username
