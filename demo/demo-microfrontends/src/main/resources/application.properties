server.port=8623
spring.application.name=demo-microfrontends

# The remotes the host may call on the user's behalf (resolve = SERVER only asks urls under these).
# Here they are mounts of this same app: paths, called at this server's own base url.
mateu.remotes=fast,slow,down,content
mateu.remotes.fast.base-url=/remote-fast
mateu.remotes.slow.base-url=/remote-slow
mateu.remotes.slow.timeout-ms=300
# nothing listens on port 9: a remote that is down
mateu.remotes.down.base-url=http://127.0.0.1:9/remote-down
mateu.remotes.content.base-url=/content-hub
mateu.self-base-url=http://localhost:8623

# the slot descriptor, for the content service to register the slots
mateu.content-slots.descriptor.enabled=true

logging.level.io.mateu.microfrontends=INFO
