spring.application.name=explorer-java-remote
# Every port is an env var, so several copies (and the parallel e2e runs) never collide.
server.port=${JAVA_REMOTE_PORT:8641}

# The Explorer (another origin) calls this app FROM THE BROWSER: the remote menu, the screens after
# the first paint, the client-resolved micro frontends. Mateu's CORS is off unless origins are named,
# and it covers only Mateu's own endpoints (/mateu/**) — the custom element's module under
# /inventory-assets/** is opened by ElementAssetsCors.
mateu.cors.allowed-origins=${EXPLORER_ORIGIN:http://localhost:8640}

# A third-party UI module (explorer-helpdesk-ui.jar), mounted IN-PROCESS by naming its package:
# its generated controllers live in com.acme.helpdesk.ui, outside this app's component scan.
mateu.ui.modules=com.acme.helpdesk.ui

# How slow the "slow" micro frontend answers: env SLOW_REMOTE_DELAY_MS (default 2000; the
# Explorer's budget for it is 300 ms) — read by SlowFragment.

# Version skew: every /mateu/ response carries X-Mateu-Build. Restart this app with another build id
# (MATEU_BUILD_ID=v2) while one of its screens is open in the Explorer's federated console, then act
# on it: the renderer notices the new build and offers to reload.
# mateu.build-id is read from the env var MATEU_BUILD_ID when set; otherwise it is derived from the
# Mateu version, the wire types and the specs.

logging.level.io.mateu.microfrontends=INFO
