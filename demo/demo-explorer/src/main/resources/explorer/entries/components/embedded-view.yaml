id: embedded-view
area: components
group: composition
title: EmbeddedView & FutureComponent (islands)
covers: [component:EmbeddedView, component:FutureComponent]
description: |
  Put a whole VIEW inside a component tree as an **island**: its own state, its own actions, its
  own round trips — pressing a button of one island re-renders that island only. Every Java example
  of this Explorer runs that way: the entry page embeds it with an `EmbeddedView`.

  - **EmbeddedView** — any view object: a reflected form, a component tree, an archetype.
  - **FutureComponent** — the same wrapping, as a placeholder the server resolves while rendering.

  Java only (they wrap a Java object). For a view served by ANOTHER app, use a MicroFrontend.
  Try: press *Arrive* and *Sell one*.

  > **Known issues (3.0-beta.51):** a `FutureComponent` draws its instance's fields as an empty
  > form — no values, no actions, and a component tree's `component()` is not called; an
  > `EmbeddedView` of a reflected form repeats the HOST page's breadcrumb trail in its header.
knownIssue: >-
  3.0-beta.51: FutureComponent(instance) renders the instance reflectively with no state (fields
  show "—") and without its actions, even for a ComponentTreeSupplier (component() is ignored);
  EmbeddedView of a reflected form shows the host route's breadcrumbs inside the island.
examples:
  - title: In Java — views embedded as islands
    java: io.mateu.explorer.examples.components.embeddedview.TwoGalleries
    embed: inline
