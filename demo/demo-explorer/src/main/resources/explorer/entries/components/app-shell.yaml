id: app-shell
area: components
group: composition
title: AppShell
covers: [component:AppShell]
description: |
  The chrome around a mount — title, subtitle, logo, menu, the shell `variant` (`MENU_ON_TOP`,
  `HAMBURGER_MENU`, `TABS`, `TILES`…), accent colour, header widgets and switches — as a component.
  In YAML it is a `type: AppShell` file bound to the **root** (`""`) of a mount's routes; in code it
  is the fluent `AppShell` an `AppSupplier` bean returns, or simply a `@UI` class with `@App` and
  `@Menu` fields. Also in the C# and Python ports. **The live example is the Explorer itself**: its
  shell (`ExplorerShell`, a `@UI("")` class whose menu a `MenuSupplier` derives) is what you are
  navigating.
notDemonstrable: >-
  an AppShell is the chrome of a whole mount, and its menu routes are relative to that mount: drawn
  inside this Explorer, its Collection / Visitors entries would point at the Explorer's own routes.
  The Explorer's own shell is the running example; the YAML and Java definitions of a shell are in
  the Code tabs.
code:
  - {label: "YAML · a shell", path: src/main/resources/specs/ui/explorer/components/app-shell/shell.yaml}
  - {label: "Java · the same shell, fluent", path: src/main/java/io/mateu/explorer/examples/components/appshell/MuseumShell.java}
doc: https://mateu.io/define/yaml/app-shell/
