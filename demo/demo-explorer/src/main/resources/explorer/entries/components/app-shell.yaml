id: app-shell
area: components
group: composition
title: AppShell
covers: [component:AppShell]
description: |
  The chrome around a mount — title, subtitle, logo, menu, the shell `variant` (`MENU_ON_TOP`,
  `HAMBURGER_MENU`, `TABS`, `TILES`…), accent colour, header widgets and switches — as a component.
  In YAML it is a `type: AppShell` file bound to the **root** (`""`) of a mount's routes; in code it
  is the fluent `AppShell` an `AppSupplier` bean returns, or simply a `@UI` class with `@App` and
  `@Menu` fields. Also in the C# and Python ports. **The live example is the Explorer itself**: its
  shell (`ExplorerShell`, a `@UI("")` class whose menu a `MenuSupplier` derives) is what you are
  navigating.

  > **Known issue (3.0-beta.51):** a shell cannot be shown below a mount root. Bound to another
  > route the YAML shell answers "Page not found"; a fluent `AppShell` returned by a view at another
  > route draws its chrome but every content load answers "Not found" and the request-loop guard
  > trips. A second mount (`type: UI`) would show it properly, but declaring one switches off the
  > app's conventional `specs/ui/routes.yaml` (RouteRegistry.authoredFrom reads it only when no
  > mount is declared) — see distributed › Several mounts.
notDemonstrable: >-
  an AppShell is the chrome of a whole mount and cannot be nested inside the Explorer's own mount
  (see the known issue) — the Explorer's own shell is the running example; the YAML and Java
  definitions of a shell are in the Code tabs.
knownIssue: >-
  3.0-beta.51: a `type: AppShell` definition bound to a non-root route renders "Page not found"; a
  ComponentTreeSupplier returning a fluent AppShell at a non-root route draws the chrome but every
  content load answers "Not found" and loops (request-loop guard). Adding a `type: UI` mount
  disables the conventional specs/ui/routes.yaml (RouteRegistry.authoredFrom step 3), so a demo
  mount cannot be added without side effects.
code:
