id: listing
area: components
group: listings-and-data
title: Listing
covers: [component:Listing]
description: |
  A full listing — search box, smart filter bar, sortable columns, paging, an empty state, a
  toolbar — as one component. Here its rows come from a REST endpoint through `rowsSource`, fetched
  in the browser: with no `totalPath` on the source the listing searches, filters, sorts and pages
  them itself; with one, the API does it and the listing renders the page it is given. A `rowRoute`
  (`artworks/${row.id}`) makes each row open its record.

  Try: search "gogh", filter by artist, sort by year.
examples:
  - title: In YAML — no view model at all
    yaml: specs/ui/explorer/components/listing/artworks.yaml
  - title: In Java — the fluent component
    java: io.mateu.explorer.examples.components.listing.ArtworksListing
    embed: inline
code:
  - {label: "The endpoint (any JSON API)", path: src/main/java/io/mateu/explorer/examples/components/listing/ArtworksApi.java}
