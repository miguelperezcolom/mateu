id: content-layout
area: components
group: layout
title: ContentLayout (removed)
covers: [component:ContentLayout]
description: |
  `ContentLayout` (main + aside + footer slots) was deprecated during the alphas and is **removed in
  3.0.0**: the same page body is a `ResponsiveGrid` with named areas filled by `Slotted` children —
  see *Responsive grid & named areas* (`@Aside` composes one for you). The wire type
  `ContentLayoutDto` stays, so an older server still renders.
notDemonstrable: >-
  removed from the API in 3.0.0 — the Responsive grid entry shows its replacement. Delete this entry
  and its checklist id once mateu.version is a release without it (the guard then reports the id
  as no longer in the catalogue).
