id: org-chart
area: components
group: visualisation
title: OrgChart
covers: [component:OrgChart]
description: |
  A hierarchy of people (or units): one `root` whose `children` nest. Each node has a title, a
  subtitle, an optional avatar and accent colour, and an optional `actionId` that makes it
  clickable. `display: focus` (with `focus: <node id>`) shows one node at a time — its chain of
  managers above, its reports below — for organisations too big to read as one tree.

  Try: pick a manager or a report in the focused chart; click a person in the Java example.
examples:
  - title: In YAML — the whole tree, then in focus
    yaml: specs/ui/explorer/components/org-chart/tree.yaml
  - title: In Java — clickable nodes
    java: io.mateu.explorer.examples.components.orgchart.StaffChart
