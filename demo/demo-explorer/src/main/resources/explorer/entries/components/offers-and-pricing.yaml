# KNOWN ISSUES (beta.51) are shown on the page, in the YAML example's description.
knownIssue: >-
  Vaadin, 3.0-beta.51: an OfferCard without an actionId draws neither its price nor its CTA, and `added` shows nothing.
examples:
  - title: In YAML
    description: "Known issues (3.0-beta.51, Vaadin): Without an `actionId` an OfferCard draws neither its price nor its CTA, and `added` shows nothing — the Java example has them."
    yaml: specs/ui/explorer/components/offers-and-pricing/offers.yaml
  - title: "With their CTAs wired — in Java"
    description: "Press **Upgrade** or a plan's **Choose**."
    java: io.mateu.explorer.examples.components.offers.UpgradeOffers
