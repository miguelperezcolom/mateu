# TEMPLATE ENTRY — a component authorable in YAML, with its Java fluent twin, and a whole page.
id: button
area: components
group: actions-and-navigation
title: Button, ButtonGroup & split buttons
covers: [component:Button, component:ButtonGroup]
examples:
  - title: Styles, colours, sizes, icons — in YAML
    yaml: specs/ui/explorer/components/button/buttons.yaml
  - title: In Java, with handlers that run
    description: Press them — each fluent button runs its own lambda on the server.
    java: io.mateu.explorer.examples.components.button.FluentButtons
  - title: Button groups — a dropdown and a split button — in YAML
    description: A `ButtonGroup` with no `primary:` is a dropdown; with one it is a split button — the primary runs from the button, the rest is behind its ▾ (named "More actions" for assistive technology).
    yaml: specs/ui/explorer/components/button/button-groups.yaml
  - title: Button groups in Java, with handlers that run
    java: io.mateu.explorer.examples.components.button.FluentButtonGroups
  - title: Declared — @Toolbar(group, groupPrimary) on a page
    description: Toolbar methods sharing a `group` collapse into one dropdown; the member marked `groupPrimary` turns it into a split button.
    route: x/components/button/declared-groups
  - title: A dropdown and a split button in a page toolbar
    route: x/components/button/toolbar
pages:
  - {route: x/components/button/toolbar, layout: explorer/components/button/toolbar-page.yaml}
  - {route: x/components/button/declared-groups, viewModel: io.mateu.explorer.examples.components.button.DeclaredButtonGroups}
