id: proxy-secrets
area: behaviour
group: data
title: "Proxied sources and ${secret.X}"
covers: [behaviour:proxy-secrets]
description: |
  `proxy: true` makes the browser ask the **Mateu server**, which calls the endpoint itself — no CORS,
  and `${secret.X}` is resolved there (from a `SecretsProvider` bean, else only the environment
  variable `MATEU_SECRET_X`). What the client receives of a proxied source is only its name, the
  `proxy` flag and its reading rules: **its headers and body template never leave the server**, so the
  key never reaches the browser. A direct source has no `secret` scope at all.

  Here `${secret.DEMO}` comes from `DemoSecrets`, which reads `MATEU_SECRET_DEMO` and falls back to a
  demo value. The endpoint answers 401 without the right `X-Api-Key`.

  **Try it:** the first listing (proxied) shows "The vault opened: the key matched". Open the
  browser's network tab and reload: for it the browser only sends a `__restfetch__` to the Mateu
  server, and the key appears in no request or response. The second listing calls the same endpoint
  directly from the browser: the browser cannot present the key, so that request answers **401** and
  the listing stays empty.

  > **Known issue (3.0-beta.51):** a listing whose first load fails (the 401 here) shows no error.
  > Reported.
examples:
  - title: "One endpoint, proxied vs direct"
    route: x/behaviour/proxy-secrets/vault
pages:
  - {route: x/behaviour/proxy-secrets/vault, layout: explorer/behaviour/proxy-secrets/vault.yaml}
code:
  - {label: "YAML · sources.yaml (the catalogue)", path: src/main/resources/specs/ui/sources.yaml}
  - {label: "Java · DemoSecrets (SecretsProvider)", path: src/main/java/io/mateu/explorer/examples/behaviour/restsources/DemoSecrets.java}
  - {label: "Java · ExplorerDemoApi (the local endpoint)", path: src/main/java/io/mateu/explorer/examples/behaviour/restsources/ExplorerDemoApi.java}
