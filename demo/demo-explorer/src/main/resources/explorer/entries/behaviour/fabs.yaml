id: fabs
area: behaviour
group: actions
title: Floating action buttons
covers: [behaviour:fabs]
description: |
  `@Fab(icon, label, order)` turns a method into a floating action button. On the **app** class it
  is present on every screen; on a **page** class only while that page shows. They stack
  bottom-right (page FABs beside the app ones) and dispatch like any action.

  Try it: in the framed app press the ✓ (*Mark clean*, a page FAB) — the toast confirms.
examples:
  - title: A housekeeping app
    java: io.mateu.explorer.examples.behaviour.fabs.HousekeepingPreview
code:
  - {path: src/main/java/io/mateu/explorer/examples/behaviour/fabs/HousekeepingApp.java}
  - {path: src/main/java/io/mateu/explorer/examples/behaviour/fabs/RoomBoard.java}
  - {label: "C#", path: src/main/ports/behaviour/fabs/RoomBoard.cs}
  - {label: Python, path: src/main/ports/behaviour/fabs/room_board.py}
