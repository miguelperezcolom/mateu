id: credential-scope
area: distributed
group: operations
title: Credential scope
covers: [distributed:credential-scope]
description: |
  The **browser** sends the user's credentials (the Bearer token, `X-Session-Id`, the `@AppContext`
  values) only to origins the app trusts:

  - ROOT — the page's own origin, the top-level `<mateu-ui>` base url, and what the host page lists
    (`<meta name="mateu-credential-origins" content="https://a.example">` / `configureCredentialOrigins`);
  - DECLARED — the remotes an app served from a ROOT origin names in a `RemoteMenu`. A declared
    remote cannot extend the trust to remotes IT names.

  Everything else is called **anonymously** (a public remote still works).

  **Try it:** set a token — `localStorage.__mateu_auth_token = 'demo-token'` in the browser console —
  and reload. Below, the echo is a CLIENT micro frontend of a remote the Explorer's app does not
  name: *Authorization (none)*. Open *Who am I?* in the console, whose app names Inventory in a
  RemoteMenu: *Bearer …oken (received)*.
examples:
  - title: The same browser, two answers
    java: io.mateu.explorer.examples.distributed.credentialscope.CredentialScope
code:
  - {label: "Java · the console naming Inventory", path: src/main/java/io/mateu/explorer/examples/distributed/console/FederatedConsole.java}
  - {label: "Java · Who am I?", path: remotes/java-remote/src/main/java/io/mateu/explorer/remote/inventory/WhoAmIPage.java}
  - {label: "Java · the echo", path: remotes/java-remote/src/main/java/io/mateu/explorer/remote/identity/IdentityEcho.java}
