# THE EXPLORER CHECKLIST — every id the Explorer must cover, grouped as its menu is.
# Read by ExplorerCatalog (menu areas + groups, in this order) and by ExplorerCoverageTest.
# Component ids are ALSO cross-checked against uidl-catalog.json (META-INF/mateu/schema in the
# mateu-uidl jar): a catalogue type missing here fails the build.
# Do NOT edit this file to add an entry — an entry is ONE file under explorer/entries/ that
# `covers:` ids from here (see README.md). Edit it only to add/rename a checklist id.
areas:
  - id: components
    title: "Components"
    groups:
      - {id: fields, title: "Fields & forms"}
      - {id: layout, title: "Layout"}
      - {id: display, title: "Display"}
      - {id: status-and-kpis, title: "Status, KPIs & cards"}
      - {id: visualisation, title: "Charts & visualisation"}
      - {id: actions-and-navigation, title: "Actions & navigation"}
      - {id: overlays, title: "Overlays"}
      - {id: listings-and-data, title: "Listings & data"}
      - {id: interactive-widgets, title: "Interactive widgets"}
      - {id: composition, title: "Composition & plumbing"}
  - id: page-templates
    title: "Page templates"
    groups:
      - {id: templates, title: "Page templates (YAML template:)"}
  - id: archetypes
    title: "Archetypes"
    groups:
      - {id: overview, title: "Overview & landing"}
      - {id: collections, title: "Collections"}
      - {id: records, title: "Records"}
      - {id: processes, title: "Processes"}
  - id: behaviour
    title: "Behaviour"
    groups:
      - {id: forms, title: "Forms"}
      - {id: form-layout, title: "Form layout & inference"}
      - {id: actions, title: "Actions & commands"}
      - {id: navigation, title: "Navigation & routing"}
      - {id: listings, title: "Listings & CRUD"}
      - {id: overlays, title: "Overlays"}
      - {id: communication, title: "Inter-component communication"}
      - {id: app, title: "App-level"}
      - {id: data, title: "Data & sources"}
      - {id: wizards, title: "Wizards"}
      - {id: resilience-a11y, title: "Resilience & accessibility"}
  - id: distributed
    title: "Distributed UIs"
    groups:
      - {id: mounts, title: "Mounts & modules"}
      - {id: federation, title: "Runtime federation"}
      - {id: microfrontends, title: "Micro frontends"}
      - {id: operations, title: "Identity & versions"}

# group id -> the ids it must cover. A group id is unique across areas when prefixed by its area
# ("components/layout"), which is how entries name it in `group:`.
