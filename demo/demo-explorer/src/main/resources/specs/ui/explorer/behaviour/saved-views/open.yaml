# A CRUD is a page with routes of its own (/new, /:id, /:id/edit), so it runs at its own
# route (x/behaviour/saved-views) rather than inside this page: this button takes you there.
content:
  - type: Button
    label: "Open “Orders — views and columns” ↗"
    buttonStyle: primary
    actionable: {type: RouteLink, route: x/behaviour/saved-views}
