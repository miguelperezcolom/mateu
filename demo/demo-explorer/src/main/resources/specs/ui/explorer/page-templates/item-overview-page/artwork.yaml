# ItemOverviewPage: the form's title/subtitle/first badge are the item's; `photo` (4:3) or `avatar`
# (round) is its image; the `body` and `footer` slots fill the overview panel and the form's content is
# the `main` slot (one TabLayout = the template's tabs). The values come from the route's view model
# (WaterLilies.java) — this file is layout only.
type: Form
title: ${state.title}
subtitle: ${state.artist} · ${state.date}
badges:
  - {label: "${state.classification}", color: info}
toolbar:
  - {type: Button, label: Edit, buttonStyle: primary, actionable: {type: RouteLink, route: x/page-templates/advanced-create-edit-page}}
template:
  type: ItemOverviewPage
  photo: {src: "${state.image}"}
  body:
    - {type: FormField, id: artist, label: Artist, readOnly: true, propertyRow: true}
    - {type: FormField, id: date, label: Date, readOnly: true, propertyRow: true}
    - {type: FormField, id: museum, label: Museum, readOnly: true, propertyRow: true}
    - {type: FormField, id: gallery, label: Where, readOnly: true, propertyRow: true}
  footer:
    - {type: Text, text: "Image: The Metropolitan Museum of Art, public domain", size: s}
content:
  - type: TabLayout
    tabs:
      - type: Tab
        label: Object
        content:
          type: VerticalLayout
          content:
            - {type: FormField, id: medium, label: Medium, readOnly: true, propertyRow: true}
            - {type: FormField, id: dimensions, label: Dimensions, readOnly: true, propertyRow: true}
            - {type: FormField, id: creditLine, label: Credit line, readOnly: true, propertyRow: true}
      - type: Tab
        label: About
        content: {type: Text, text: "${state.description}"}
