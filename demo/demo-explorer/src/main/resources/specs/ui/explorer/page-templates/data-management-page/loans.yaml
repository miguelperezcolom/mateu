# DataManagementPage: the form's content is the data view (a Listing here), its toolbar sits over the
# data and its title heads the page. `end` and `bottom` are DockedPanels (id, title, content, size,
# open) — shown while open; a YAML page has no server to toggle them. Rows from MuseumApi.
type: Form
title: Artworks
subtitle: Every work across the three museums
toolbar:
  - {type: Button, label: Request a loan, buttonStyle: primary, actionable: {type: RouteLink, route: x/page-templates/guided-process-page}}
template:
  type: DataManagementPage
  end:
    id: artworks-summary
    title: Summary
    open: true
    size: 16rem
    content:
      type: BulletedList
      items: [7 works, 3 on view, 1 in conservation, 1 on loan]
  bottom:
    id: artworks-notes
    title: About this data
    open: true
    size: 5rem
    content: {type: Text, text: "Served by MuseumApi (/explorer-api/artworks) — search the listing to filter it on the server."}
content:
  - type: Listing
    searchable: true
    pageSize: 20
    rowsSource:
      url: /explorer-api/artworks?search=${state.searchText ?? ''}
      itemsPath: content
    columns:
      - {type: GridColumn, id: title, label: Title, identifier: true}
      - {type: GridColumn, id: artist, label: Artist}
      - {type: GridColumn, id: year, label: Year, dataType: integer}
      - {type: GridColumn, id: classification, label: Kind}
      - {type: GridColumn, id: museum, label: Museum}
      - {type: GridColumn, id: status, label: Status, dataType: status}
