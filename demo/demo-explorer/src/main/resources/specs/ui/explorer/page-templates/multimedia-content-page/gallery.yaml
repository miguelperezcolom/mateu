# MultimediaContentPage: a welcome-style banner (the form's title, subtitle, overline and toolbar) over
# the content sections — Cards marked `mateu-section`, indexed by the anchor navigator.
type: Form
title: In the gallery
overline: Public domain
subtitle: Water Lilies at full size, with its story and where it comes from
toolbar:
  - {type: Button, label: The record, buttonStyle: primary, actionable: {type: RouteLink, route: x/page-templates/item-overview-page}}
template:
  type: MultimediaContentPage
  backgroundColor: dark-ocean
content:
  - type: VerticalLayout
    horizontalAlignment: STRETCH
    content:
      - type: Card
        cssClasses: mateu-section
        title: {type: Text, container: h3, text: The work}
        content:
          type: VerticalLayout
          horizontalAlignment: CENTER
          content:
            - {type: Image, src: "https://images.metmuseum.org/CRDImages/ep/mobile-large/DT47.jpg", alt: "Water Lilies, Claude Monet", style: "max-width: 100%; max-height: 60vh; object-fit: contain;"}
            - {type: Text, text: "Claude Monet · 1906 · oil on canvas", size: s}
      - type: Card
        cssClasses: mateu-section
        title: {type: Text, container: h3, text: About the work}
        content: {type: Text, text: "One of some 250 paintings of the lily pond at Giverny. The horizon has gone: only water, reflected sky and the flowers remain."}
      - type: Card
        cssClasses: mateu-section
        title: {type: Text, container: h3, text: Provenance}
        content:
          type: BulletedList
          items: [1906 — the artist, 1926 — Durand-Ruel Paris, 1929 — bequest of Mrs. H. O. Havemeyer]
