# GraalVM native image on Micronaut: Netty (Micronaut's HTTP server) writes some responses through
# shared memory arenas on Linux. Without this option every such response logs
# "UnsupportedFeatureError: Support for Arena.ofShared is not active" and a browser never finishes
# loading the renderer (curl does not notice). Found deploying a native Micronaut app on Linux.
Args = -H:+UnlockExperimentalVMOptions -H:+SharedArenaSupport -H:-UnlockExperimentalVMOptions
