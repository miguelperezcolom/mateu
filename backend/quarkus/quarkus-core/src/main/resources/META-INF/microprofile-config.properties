# Defaults mateu-quarkus brings to the application (ordinal 100: the app's application.properties
# overrides any of them).
#
# Mateu reaches the application's view models, cruds, lookup suppliers... by reflection, so ArC sees
# no injection point for them and, by default, removes them as unused beans at build time - and,
# with them, the services only they inject. Mateu then creates the view with `new` and its @Inject
# fields stay null. `fwk` keeps every bean declared in the application's own code and still removes
# unused framework beans.
quarkus.arc.remove-unused-beans=fwk

# Live reload in `quarkus:dev`: the dev profile turns Mateu's development mode on (specs read from
# the source tree and watched, /mateu/dev/** served, the browser re-rendered when the code is
# recompiled). Only the %dev profile: a packaged application (prod) and the tests never get it. Set
# %dev.mateu.dev=false in application.properties to opt out.
%dev.mateu.dev=true
