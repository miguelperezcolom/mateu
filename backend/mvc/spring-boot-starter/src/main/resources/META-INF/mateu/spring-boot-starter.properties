# io.mateu:mateu-spring-boot-starter carries no code: its pom brings Spring MVC
# (spring-boot-starter-webmvc), Mateu's auto-configured Spring MVC runtime (mateu-mvc) and the
# Vaadin web renderer (mateu-vaadin). The controllers of the @UI classes are generated at compile
# time by io.mateu:mateu-annotation-processor-mvc, which goes on the annotation processor path.
# (This file also gives the jar a sources jar, like the renderer's, for Maven Central.)
runtime=mateu-mvc
renderer=mateu-vaadin
processor=mateu-annotation-processor-mvc
