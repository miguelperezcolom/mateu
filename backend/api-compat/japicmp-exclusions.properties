# Reviewed exclusions of the public-API compatibility check (japicmp).
#
# Every entry here is a DELIBERATE breaking change to the public API (uidl, core's archetypes) that was reviewed and accepted — typically a removal at the end of its deprecation
# period, or a change shipped in a major release. Anything marked @Experimental is excluded
# automatically and does not belong here — EXCEPT a mark that is new on API the baseline already
# has: japicmp drops the annotated element on the new side only and reports it as removed, so
# those go here until the baseline moves past the mark.
#
# Format: one property, japicmp.reviewedExcludes, a ';'-separated list of japicmp exclude patterns
# (fully-qualified class, `pkg.Class#member(args)`, or `pkg.*`). Keep one entry per line with a
# trailing backslash, and a comment above it naming the PR/release that accepted it.
#
# The baseline is <mateu.japicmp.baseline> in backend/pom.xml. Reset this list whenever the
# baseline moves (e.g. at the beta tag): entries only describe the diff against that baseline.
#
# `io.mateu.__none__` is a sentinel so the list is never empty.
#
# The wire DTOs (io.mateu.dtos, the mateu-dtos module) never need an entry: they are outside the
# Java binary-compatibility promise (their contract is the JSON wire, versioned by wireVersion), so
# that module's check is report-only even with mateu.api.enforce=true.
#
# Baseline 3.0-beta.1 (API freeze, from the first beta on the check is ENFORCING by default): the
# list was reset — every previous entry described the diff against 3.0-alpha.425, which the beta
# already carries.
#
# Entries below, in order:
#
# 3.0.0 GA (api/ga-freeze): the alpha-era @Deprecated(forRemoval = true) API is removed — every
# element deprecated in a 3.0-alpha release (the beta-era deprecations stay until 4.0). Listed in
# CHANGELOG.md ("Removed") and on the stability page with their replacements.
#
# 3.0.0 GA (cleanup/pre-ga-compat): the GA keeps no compatibility with the 3.0 pre-releases, so
# the beta-era deprecations go too — @App(accentStrip, accentStripSeed) (no effect since beta.15) and
# AppShell's pre-`ai` constructor, and ProgressReporter's (taskId, progressBar) constructor (a
# reporter comes from LongTask#run). When 3.0.0 is on Maven Central it becomes the baseline and this
# whole list is reset to the sentinel: the post-GA promise is measured from 3.0.0.
#
# 3.0.0 GA (api/ga-freeze): API added after the freeze (3.0-beta.1) and already released in the
# baseline is newly marked @Experimental (Image#alt, ProgressSteps#resultTitle, …): japicmp sees the
# marked element as removed, so it is listed until the baseline moves past the mark.
japicmp.reviewedExcludes=\
  io.mateu.__none__;\
  io.mateu.uidl.annotations.ActionType;\
  io.mateu.uidl.annotations.GenericClass;\
  io.mateu.uidl.annotations.KeycloakSecured;\
  io.mateu.uidl.annotations.List;\
  io.mateu.uidl.data.Binding;\
  io.mateu.uidl.data.BindingSource;\
  io.mateu.uidl.data.Button#getActionId();\
  io.mateu.uidl.data.ClientSideEvent;\
  io.mateu.uidl.data.ContentLayout;\
