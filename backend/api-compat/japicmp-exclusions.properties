# Reviewed exclusions of the public-API compatibility check (japicmp).
#
# Every entry here is a DELIBERATE breaking change to the public API (uidl, core's archetypes)
# against the baseline, reviewed and accepted. Anything marked @Experimental or @Internal is
# excluded automatically and does not belong here — EXCEPT a mark that is new on API the baseline
# already has: japicmp drops the annotated element on the new side only and reports it as removed,
# so those go here until the baseline moves past the mark.
#
# Format: one property, japicmp.reviewedExcludes, a ';'-separated list of japicmp exclude patterns
# (fully-qualified class, `pkg.Class#member(args)`, or `pkg.*`). Keep one entry per line with a
# trailing backslash, and a comment above it naming the PR/release that accepted it.
#
# The baseline is <mateu.japicmp.baseline> in backend/pom.xml. Entries only describe the diff
# against that baseline, so this list goes back to the sentinel whenever the baseline moves
# (scripts/bump-example-version.sh does it).
#
# `io.mateu.__none__` is a sentinel so the list is never empty.
#
# The wire DTOs (io.mateu.dtos, the mateu-dtos module) never need an entry: they are outside the
# Java binary-compatibility promise (their contract is the JSON wire, versioned by wireVersion), so
# that module's check is report-only even with mateu.api.enforce=true.
japicmp.reviewedExcludes=\
  io.mateu.__none__
