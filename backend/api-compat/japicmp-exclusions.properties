  io.mateu.uidl.data.Destination;\
  io.mateu.uidl.fluent.ActionPosition;\
  io.mateu.uidl.fluent.ActionStereotype;\
  io.mateu.uidl.fluent.ActionThemeVariant;\
  io.mateu.uidl.fluent.AppVariant#HAMBURGUER_MENU;\
  io.mateu.uidl.interfaces.BadgeSupplier;\
  io.mateu.uidl.interfaces.ListAdapter;\
  io.mateu.uidl.annotations.App#accentStrip();\
