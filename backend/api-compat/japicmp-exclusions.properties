# Reviewed exclusions of the public-API compatibility check (japicmp).
#
# Every entry here is a DELIBERATE breaking change to the public API (uidl, dtos, core's
# archetypes) that was reviewed and accepted — typically a removal at the end of its deprecation
# period, or a change shipped in a major release. Anything marked @Experimental is excluded
# automatically and does not belong here — EXCEPT a mark that is new on API the baseline already
# has: japicmp drops the annotated element on the new side only and reports it as removed, so
# those go here until the baseline moves past the mark.
#
# Format: one property, japicmp.reviewedExcludes, a ';'-separated list of japicmp exclude patterns
# (fully-qualified class, `pkg.Class#member(args)`, or `pkg.*`). Keep one entry per line with a
# trailing backslash, and a comment above it naming the PR/release that accepted it.
#
# The baseline is <mateu.japicmp.baseline> in backend/pom.xml. Reset this list whenever the
# baseline moves (e.g. at the beta tag): entries only describe the diff against that baseline.
#
# `io.mateu.__none__` is a sentinel so the list is never empty.
#
# Entries below, in order:
# API freeze review (3.0-alpha.410): API released in 3.0-alpha.408/.409 and now marked
# @Experimental. japicmp excludes an annotated element on the NEW side only, so marking an API
# that exists in the baseline reads as its removal. Accepted on purpose: these are the
# pattern-gap features listed as experimental on the stability page. Drop these lines when the
# baseline moves to a release that already carries the marks (3.0-alpha.410 or the beta).
# Released in 3.0-alpha.409: wire DTO records gained components (new optional wire fields), which
# replaces their canonical constructor. The wire stays additive; see the API freeze review
# (design/api-freeze-review.md, "DTO constructors") for the policy decision this needs.
# Released in 3.0-alpha.409: the fluent Listing / PageView records gained components. Listing is
# built through its builder (unchanged); PageView is produced by core, not by user code.
