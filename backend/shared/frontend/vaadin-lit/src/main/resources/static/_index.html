  <!-- HASTAAQUIUI -->
  <!-- Pre-boot loader: until the renderer's bundle has run, nothing else on this page paints (on a
       phone on 3G that is seconds of a blank screen). Static markup + CSS only — no script, so the
       page keeps running under script-src 'self' — after the root element so the server's
       <mateu-ui> keeps it, and gone the moment <mateu-ui> is defined (the app's own loading
       indicators take over). It shows after 300 ms, so a fast load never sees it. -->
  <style>:root[theme~=dark]{background-color:#233348}.mateu-preboot{z-index:2147483000;pointer-events:none;color:#006af5;opacity:0;justify-content:center;align-items:center;animation:.2s ease-out .3s forwards mateu-preboot-in;display:flex;position:fixed;inset:0}:root[theme~=dark] .mateu-preboot{color:#66a8ff}.mateu-preboot svg{width:3rem;height:3rem;animation:.9s linear infinite mateu-preboot-spin}.mateu-preboot-label{clip:rect(0 0 0 0);clip-path:inset(50%);white-space:nowrap;width:1px;height:1px;position:absolute;overflow:hidden}mateu-ui:defined~.mateu-preboot{display:none}@keyframes mateu-preboot-in{to{opacity:1}}@keyframes mateu-preboot-spin{to{transform:rotate(360deg)}}@media (prefers-reduced-motion:reduce){.mateu-preboot{animation-duration:0s}.mateu-preboot svg{animation:none}}</style>
  <div class="mateu-preboot" role="status">
    <svg viewBox="0 0 48 48" aria-hidden="true" focusable="false">
      <circle cx="24" cy="24" r="20" fill="none" stroke="currentColor" stroke-opacity="0.2" stroke-width="4"/>
      <path d="M24 4a20 20 0 0 1 20 20" fill="none" stroke="currentColor" stroke-width="4" stroke-linecap="round"/>
    </svg>
    <span class="mateu-preboot-label">Loading&hellip;</span>
  </div>
