# The IDE "Foldout" page template — golden source for the client-side expander: FoldoutLayoutMapper
# turns `overview` into a child in slot "overview", each panel into a header info in metadata.panels
# plus a child in slot "panel-<i>", and badges into their texts (TemplateComponentsDefinitionSyncTest).
type: FoldoutLayout
headerTitle: Booking 1234
badges:
  - {type: Badge, text: Confirmed}
overview:
  type: VerticalLayout
  content:
    - {type: Text, text: Overview, container: h3}
    - {type: Text, text: The always-visible summary of the record.}
panels:
  - {type: FoldoutPanel, title: Operations, open: true, width: 30rem, content: {type: Text, text: Operations go here}}
  - {type: FoldoutPanel, title: Notes}
  - {type: FoldoutPanel, title: Profile, open: false, content: {type: Text, text: Profile goes here}}
