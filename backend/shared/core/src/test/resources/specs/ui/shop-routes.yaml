# yaml-language-server: $schema=https://raw.githubusercontent.com/miguelperezcolom/mateu/refs/heads/master/backend/shared/uidl/routes-schema.json
# A standalone route file that tags itself with the mount it belongs to. This is how a
# class-declared @UI("/shop") mount authors its inner routes: no `type: UI` descriptor, just the
# relative routes and the base path they hang off. Routes are prefixed with `shop/` on load.
type: Routes
basePath: /shop
routes:

  - route: products
    viewModel: com.acme.Products

  - route: products/:id
    viewModel: com.acme.ProductDetail

  # A shell screen (master-detail with tabs) whose sub-routes fill its slot. Children are authored
  # RELATIVE to it, so `sales` answers /shop/dashboard/sales and renders into the dashboard's slot.
  - route: dashboard
    viewModel: com.acme.ShopDashboard
    children:
      - route: sales
        viewModel: com.acme.SalesPanel
