# Every DISPLAY component of the authoring catalogue on one definition-only page (no view model):
# the YAML twin of the fluent display gallery. YamlDisplayGallerySyncTest renders it on the server
# and writes the Java golden the browser expander (expandDisplayGallery.test.ts — the specsOnly
# static bundle path) has to reproduce. A component that parses but maps wrong, or that the
# expander leaves raw, fails one of the two.
layout:
  type: VerticalLayout
  content:
    - type: EntityHeader
      title: Ada Lovelace
      subtitle: Analyst
      badges: [{label: VIP}]
      facts: [{label: Since, value: "2019"}]
      metricLabel: Balance
      metricValue: "1,240 €"
    - type: Text
      text: A large heading
      container: h2
      size: xl
    - type: Text
      text: A small caption
      size: xs
      noMargins: true
    - type: Markdown
      markdown: "**Bold** and a [link](https://example.com)"
    - type: Image
      src: /images/logo.png
    - type: Badge
      text: Active
      color: success
      pill: true
    - type: Avatar
      name: Ada Lovelace
    - type: AvatarGroup
      maxItemsVisible: 2
      avatars:
        - {type: Avatar, name: Ada Lovelace}
        - {type: Avatar, name: Grace Hopper}
        - {type: Avatar, name: Alan Turing}
    - type: Card
      variants: [outlined]
      title: {type: Text, text: A card}
      content: {type: Text, text: Card body}
    - type: Chart
      chartType: bar
      chartData:
        labels: [Q1, Q2]
        datasets: [{label: Sales, data: [10, 20]}]
    - type: TrendChart
      title: Revenue
      values: [1, 3, 2, 5]
      labels: [Jan, Feb, Mar, Apr]
    - type: Funnel
      stages: [{label: Visits, value: 1000}, {label: Leads, value: 120}]
    - type: Heatmap
      cells: [{date: "2026-10-01", value: 3}, {date: "2026-10-02", value: 7}]
    - type: Gantt
      onTaskSelectionActionId: pickTask
      tasks:
        - {id: t1, title: Design, start: "2026-10-01", end: "2026-10-10", progress: 50}
    - type: Kanban
      columns:
        - id: todo
          title: To do
          cards: [{id: k1, title: Write docs, actionId: openCard}]
    - type: PlanningBoard
      from: "2026-10-01"
      to: "2026-10-07"
      moveActionId: moveBlock
      selectActionId: pickBlock
      resources: [{id: r101, label: Room 101}]
      blocks: [{id: b1, resourceId: r101, start: "2026-10-02", end: "2026-10-04", label: Smith}]
    - type: MatrixGrid
      rowHeaderLabel: Type
      cellActionId: openCell
      editActionId: editCell
      columns: [{id: d1, label: "1", group: October}, {id: d2, label: "2", group: October}]
      sections:
        - title: Rooms
          rows:
            - id: dbl
              label: Double
              editable: true
              cells: [{value: "4"}, {value: "2", link: true}]
    - type: ActionPanel
      label: I want to…
      categories:
        - title: Booking
          actions: [{label: Cancel booking, actionId: cancelBooking, populated: true}]
    - type: Map
      markerActionId: openMarker
      markers: [{id: m1, latitude: 39.57, longitude: 2.65, label: Palma}]
    - type: Timeline
      items: [{id: e1, title: Created, timestamp: "2026-10-01 10:00"}]
    - type: OrgChart
      root:
        id: ceo
        title: CEO
        children: [{id: cto, title: CTO}]
    - type: Bpmn
      xml: "<?xml version=\"1.0\" encoding=\"UTF-8\"?><bpmn:definitions xmlns:bpmn=\"http://www.omg.org/spec/BPMN/20100524/MODEL\" id=\"d\"><bpmn:process id=\"p\"><bpmn:startEvent id=\"s\"/></bpmn:process></bpmn:definitions>"
    - type: StatusList
      items: [{id: s1, title: Payment, status: Done, statusColor: success}]
    - type: BulletedList
      items: [Sea view, Late check-out]
    - type: Faq
      items: [{question: "Can I cancel?", answer: "Yes, until 24h before."}]
    - type: PricingTable
      plans: [{id: basic, name: Basic, price: "9 €", period: month, features: [One user], ctaLabel: Choose, actionId: choosePlan}]
    - type: OfferCard
      title: Breakfast
      priceLabel: "12 €"
      actionLabel: Add
      actionId: addOffer
    - type: Testimonials
      items: [{quote: Great stay, author: Ada, rating: 5}]
    - type: FeatureGrid
      columns: 2
      features: [{icon: "⚡", title: Fast, description: Very fast}]
    - type: ProgressBar
      value: 0.4
      text: 40 %
    - type: ProgressSteps
      steps: [{title: Order, status: done}, {title: Pay, status: current}, {title: Ship}]
    - type: Meter
      label: Occupancy
      value: 72
      max: 100
      unit: "%"
    - type: EmptyState
      icon: "📭"
      title: Nothing here
      description: No bookings yet
      actionId: newBooking
      actionLabel: New booking
    - type: Skeleton
      variant: card
      count: 2
    - type: Notice
      text: Two complaints pending
      theme: warning
      actionLabel: Review
      actionId: reviewComplaints
      content: [{type: Text, text: Inside the notice}]
    - type: CalloutCard
      title: Upgrade
      description: Get more rooms
      ctaLabel: Upgrade now
      actionId: upgrade
    - type: Separator
    - type: HeroSection
      title: Welcome
      subtitle: Find your stay
      centered: true
      content: [{type: Text, text: Inside the hero}]
    - type: Stat
      label: Arrivals
      value: "12"
      delta: "+3"
      trend: up
    - type: ComparisonCard
      title: Revenue
      leftLabel: This year
      leftValue: "1.2M"
      rightLabel: Last year
      rightValue: "1.0M"
    - type: Scoreboard
      metrics:
        - {type: MetricCard, title: Revenue, value: "1.2M", trend: up, actionId: drillRevenue}
    - type: DashboardLayout
      columns: 2
      items:
        - type: DashboardPanel
          title: Panel
          colSpan: 1
          content: {type: Text, text: Inside the panel}
    - type: Calendar
      month: "2026-10-01"
      view: month
      views: [month, week, day, list]
      dayActionId: openDay
      events: [{id: ev1, title: Meeting, date: "2026-10-05", startTime: "10:00"}]
      days: [{date: "2026-10-12", label: Holiday, tone: warning}]
    - type: TaskQueue
      actionId: openItem
      groups: [{label: Today, items: [{id: q1, title: Call Ada, caption: "10:00"}]}]
    - type: CustomComponent
      name: x-gallery-widget
      props: {greeting: hello}
      content: [{type: Text, text: Inside the custom component}]
actions:
  - {id: pickTask, steps: [{type: Emit, event: gallery-picked}]}
  - {id: openCard, steps: [{type: Emit, event: gallery-picked}]}
  - {id: moveBlock, steps: [{type: Emit, event: gallery-picked}]}
  - {id: pickBlock, steps: [{type: Emit, event: gallery-picked}]}
  - {id: openCell, steps: [{type: Emit, event: gallery-picked}]}
  - {id: editCell, steps: [{type: Emit, event: gallery-picked}]}
  - {id: cancelBooking, steps: [{type: Emit, event: gallery-picked}]}
  - {id: openMarker, steps: [{type: Emit, event: gallery-picked}]}
  - {id: choosePlan, steps: [{type: Emit, event: gallery-picked}]}
  - {id: addOffer, steps: [{type: Emit, event: gallery-picked}]}
  - {id: newBooking, steps: [{type: Emit, event: gallery-picked}]}
  - {id: reviewComplaints, steps: [{type: Emit, event: gallery-picked}]}
  - {id: upgrade, steps: [{type: Emit, event: gallery-picked}]}
  - {id: drillRevenue, steps: [{type: Emit, event: gallery-picked}]}
  - {id: openDay, steps: [{type: Emit, event: gallery-picked}]}
  - {id: openItem, steps: [{type: Emit, event: gallery-picked}]}
