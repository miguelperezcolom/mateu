# Fixture for PageTemplateSyncTest (and golden source for the client-side expander,
# expandPageTemplate.test.ts): a page that fills Redwood's Welcome page template — the banner from
# the form's title/subtitle/overline/toolbar, its tone in `template:`, the content as the tiles.
type: Form
title: Star Wars
subtitle: Every screen is YAML.
overline: A Mateu demo
toolbar:
  - type: Button
    label: Browse the characters
    buttonStyle: primary
    actionable: {type: RouteLink, route: people}
  - type: Button
    label: Explore the planets
    actionable: {type: RouteLink, route: planets}
template:
  type: WelcomePage
  backgroundColor: dark-slate
content:
  - type: DashboardLayout
    columns: 3
    items:
      - type: DashboardPanel
        title: Characters
        content: {type: Text, text: Who is who.}
