# yaml-language-server: $schema=https://raw.githubusercontent.com/miguelperezcolom/mateu/refs/heads/master/backend/shared/uidl/routes-schema.json
# The mount's route registry, next to the definitions it routes to.
#
# Routes are RELATIVE to the mount's base path (the one declared by @UI): an entry `orders/:id`
# under a mount at /back-office answers /back-office/orders/42.
#
# Entries merge OVER the ones the annotation processors derive from @UI/@Route, keyed by route:
# an authored entry replaces the derived one outright.
routes:

  # Two routes over ONE screen, told apart by a pinned parameter. This is the case an annotation
  # cannot express: it can only ever say "this class is at this path".
  - route: orders/pending
    viewModel: com.acme.Orders
    fixedParams:
      status: pending

  - route: orders/archived
    viewModel: com.acme.Orders
    fixedParams:
      status: archived

  # Seeded, not pinned: the request may override these.
  - route: orders
    viewModel: com.acme.Orders
    defaultParams:
      status: open
      page: 1

  # A route with NO view model: a definition plus client-side data. This is what a fully static
  # deployment looks like — there is no server to ask.
  - route: about
    layout: about.yaml

  # Vocabulary (coherence-plan #5): `layout:` is the CANONICAL key for the layout file — the same as
  # the deprecated alias `definition:`. Both bind the RouteEntry's definition.
  - route: help
    layout: about.yaml

  # A definition-only page that declares its own actions: the write half of the DSL.
  - route: yaml-guarded
    layout: yaml-guarded.yaml
  - route: yaml-write
    layout: yaml-write.yaml
    state:
      name: Leia
  # A definition-only RECORD page: read-only fields whose values arrive raw (249, AVAILABLE).
  - route: yaml-readonly-record
    layout: yaml-readonly-record.yaml
    state:
      id: P-001
      price: 249
      status: AVAILABLE

  # A definition-only Listing whose Delete acts on the SELECTED rows (bulk restAction).
  - route: bulk-list
    layout: bulk-list.yaml

  # A definition-only page that declares its own triggers: the flow-effect half of the DSL.
  - route: yaml-triggers
    layout: yaml-triggers.yaml

  # A parameterised route, and a static sibling that must not be swallowed by it.
  - route: orders/:id
    viewModel: com.acme.OrderDetail

  - route: orders/new
    viewModel: com.acme.NewOrder

  # ── Entries pointing at REAL classes, used by RoutedClassResolverRegistryTest ────────────────
  # Two routes over one view model, told apart by a pinned parameter.
  - route: tickets/open
    viewModel: io.mateu.core.application.RegistryRoutedViews$Tickets
    fixedParams:
      status: open

  - route: tickets/closed
    viewModel: io.mateu.core.application.RegistryRoutedViews$Tickets
    fixedParams:
      status: closed

  # Points at a class that is not on the classpath: must fall through, not blow up.
  - route: broken
    viewModel: com.acme.NotOnTheClasspath

  # ── ONE definition serving TWO routes, each binding its own view model ───────────────────────
  # The definition names no modelView: it is layout only, and the binding lives in the entry. This
  # is what the specs/ui/<route>.yaml convention cannot express — there, layout follows the URL.
  - route: catalog/books
    layout: shared-list.yaml
    viewModel: com.acme.Books

  - route: catalog/films
    layout: shared-list.yaml
    viewModel: com.acme.Films

  # A route that SEEDS the app state on entry (merged under the client's persisted @AppContext),
  # and SOURCES its component data from a named source by ref (reuses the @RestData load path).
  - route: seeded-yaml-detail   # definition-only (no viewModel) route that SEEDS state + a data source
    layout: seeded-yaml-detail.yaml
    data: reportData
    state:
      tab: summary

  - route: appstate-seed
    viewModel: io.mateu.core.application.AppStateSeedView
    appState:
      tenant: acme
    data: reportData

  # An app whose route declares an APP-SCOPE data source: emitted on the AppDto, fetched once by the
  # shell into the app-data store.
  - route: appdata-app
    viewModel: io.mateu.core.application.AppDataApp
    appData: appMetrics

  # A definition-only page whose action runs a declared client FLOW (steps).
  - route: yaml-flow
    layout: yaml-flow.yaml

  # Bare-layout definition with a Card — Phase 6 expander golden source.
  - route: card-def
    layout: card.yaml

  # Simple read-only listing (no viewModel) — Phase 6 expander golden source.
  - route: read-listing
    layout: read-listing.yaml
  - route: read-listing-filters
    layout: read-listing-filters.yaml

  # The component shapes of the IDE page templates — Phase 6 expander golden sources
  # (TemplateComponentsDefinitionSyncTest).
  - route: template-scoreboard
    layout: template-scoreboard.yaml

  - route: template-tabs
    layout: template-tabs.yaml

  - route: template-foldout
    layout: template-foldout.yaml

  - route: template-card-title
    layout: template-card-title.yaml

  # Every display component on one definition-only page (YamlDisplayGallerySyncTest + the
  # expander golden, expandDisplayGallery.test.ts).
  - route: display-gallery
    layout: display-gallery.yaml

  - route: template-form-header
    layout: template-form-header.yaml

  # A collection detail page with one record open (a route that seeds state, like `data:`): it is
  # the template's kind of page — collection — not a form. Used by YamlPageTypeSyncTest.
  - route: page-type-template/:id
    layout: page-type-template.yaml
    state:
      name: Mars

  # A listing page whose route seeds state: served wrapped, it is a collection, not a form.
  # Used by YamlPageTypeSyncTest.
  - route: page-type-listing
    layout: page-type-listing.yaml
    state:
      status: open
